name: Build Dice Game Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'dice_game/**'
      - '.github/workflows/build-dice-game.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller==6.11.1

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name DiceGame dice_game/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiceGame-Windows
          path: dist/DiceGame.exe
          if-no-files-found: error

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DiceGame.exe
