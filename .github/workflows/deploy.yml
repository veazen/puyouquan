name: 部署到轻量云服务器
# 触发：推送到开发分支（仅产品文件变更时）或手动触发（可选执行首次初始化）
on:
  push:
    branches: [ claude/guitar-tab-software-analysis-zqm0ua ]
    paths: [ 'muse-tab/**', 'deploy/**' ]
  workflow_dispatch:
    inputs:
      setup:
        description: '首次初始化服务器（安装 nginx/建目录/拉音色包）'
        type: boolean
        default: false

concurrency: { group: deploy, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装载 SSH 密钥
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          umask 077
          # Secrets 粘贴常见损伤：CRLF、字面 \n、base64 正文换行丢失（整体或仅正文单行）。
          # 统一做法：还原字面 \n → 提取头尾标记 → 正文去空白按 64 列重折行（对正常密钥无损），
          # 最后 ssh-keygen -y 预校验（只导出公钥，不回显私钥）。
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy.raw
          if grep -q '\\n' ~/.ssh/id_deploy.raw && [ "$(wc -l < ~/.ssh/id_deploy.raw)" -lt 3 ]; then
            printf '%b\n' "$(cat ~/.ssh/id_deploy.raw)" > ~/.ssh/id_deploy.tmp && mv ~/.ssh/id_deploy.tmp ~/.ssh/id_deploy.raw
          fi
          hdr=$(grep -oE -- '-----BEGIN [A-Z0-9 ]+-----' ~/.ssh/id_deploy.raw | head -1)
          ftr=$(grep -oE -- '-----END [A-Z0-9 ]+-----' ~/.ssh/id_deploy.raw | head -1)
          if [ -z "$hdr" ] || [ -z "$ftr" ]; then
            echo "::error::DEPLOY_SSH_KEY 缺少 PEM BEGIN/END 标记，请粘贴完整私钥"
            exit 1
          fi
          sed -E 's/-----(BEGIN|END) [A-Z0-9 ]+-----//g' ~/.ssh/id_deploy.raw | tr -d ' \t\n' > ~/.ssh/id_deploy.b64
          { echo "$hdr"; fold -w 64 ~/.ssh/id_deploy.b64; echo; echo "$ftr"; } > ~/.ssh/id_deploy
          rm -f ~/.ssh/id_deploy.raw ~/.ssh/id_deploy.b64
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null; then
            echo "::error::DEPLOY_SSH_KEY 规范化后仍无法解析（行数=$(wc -l < ~/.ssh/id_deploy)），请重新粘贴完整 PEM"
            exit 1
          fi
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo -e "Host pyq\n  HostName ${{ secrets.DEPLOY_HOST }}\n  User ${{ secrets.DEPLOY_USER }}\n  IdentityFile ~/.ssh/id_deploy" >> ~/.ssh/config

      - name: 首次初始化（仅手动勾选时）
        if: ${{ inputs.setup }}
        run: |
          scp deploy/server-setup.sh deploy/nginx-puyouquan.conf deploy/fetch-soundfonts.sh pyq:/tmp/
          ssh pyq 'bash /tmp/server-setup.sh && bash /tmp/fetch-soundfonts.sh || true'

      - name: 发布产品文件
        run: |
          ssh pyq 'mkdir -p /var/www/puyouquan/site /var/www/puyouquan/docs'
          scp muse-tab/index.html pyq:/var/www/puyouquan/index.html
          scp -r muse-tab/site/. pyq:/var/www/puyouquan/site/
          scp muse-tab/PYQ-FORMAT.md pyq:/var/www/puyouquan/PYQ-FORMAT.md || true

      - name: 冒烟验收
        run: bash deploy/smoke.sh "${{ secrets.DEPLOY_HOST }}"
