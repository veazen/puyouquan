name: 部署到轻量云服务器
# 触发：推送到开发分支（仅产品文件变更时）或手动触发（可选执行首次初始化）
on:
  push:
    branches: [ claude/guitar-tab-software-analysis-zqm0ua ]
    paths: [ 'muse-tab/**', 'deploy/**', 'api/**' ]
  workflow_dispatch:
    inputs:
      setup:
        description: '首次初始化服务器（安装 nginx/建目录/拉音色包）'
        type: boolean
        default: false
      debug:
        description: '输出服务器 nginx 配置诊断（不改动服务器）'
        type: boolean
        default: false

concurrency: { group: deploy, cancel-in-progress: true }

jobs:
  # 回归门禁：任一环节失败即不部署（v43.8 补——此前 CI 只跑语法闸，41 套件+api 测试全靠人工，
  # 是 v43.6 白屏与 tv_matrix 假绿溜上线的组织性根因）。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 语法闸（内联脚本解析，阻止白屏版本上线）
        run: node deploy/check-syntax.js muse-tab/index.html
      - name: API 单测 + 端到端（零依赖 node:sqlite）
        env:
          NODE_OPTIONS: --experimental-sqlite   # 兼容 CI 上需显式开启 node:sqlite 的 node 版本（含 test.sh 内 node server.js）
        run: |
          node api/wx.test.js
          node api/wxpay.test.js
          node api/db.test.js
          node api/s3.test.js        # v62.7 A6 异地备份：SigV4 官方向量 + 本地模拟对象存储端到端
          bash api/test.sh
      - name: 安装测试依赖（Playwright chromium + xmllint）
        working-directory: muse-tab/tests
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils   # tv_mxl 用 xmllint 校验导出的 MusicXML
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 浏览器回归套件（run_all.js 关键集）
        working-directory: muse-tab/tests
        run: |
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node run_all.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装载 SSH 密钥
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          mkdir -p ~/.ssh
          umask 077
          # Secrets 粘贴常见损伤：CRLF、字面 \n、正文换行丢失、BEGIN/END 外壳损坏或整段丢失、
          # 只存 base64 正文、PPK 格式，甚至私钥配在了别的 Secret 名下（DEPLOY_SSH_KEY 误存公钥）。
          # 做法：规范化重建 PEM 后用 ssh-keygen -y 校验；DEPLOY_SSH_KEY 不行就扫描其余 Secrets，
          # 用第一个能解析成私钥的。日志只输出 Secret 名与公钥指纹，绝不回显私钥内容。
          KEYF=~/.ssh/id_deploy
          try_key() { # try_key <类型名>：用重折行正文 + 标准外壳组装并校验
            { echo "-----BEGIN $1-----"; fold -w 64 "$KEYF.b64"; echo; echo "-----END $1-----"; } > "$KEYF"
            chmod 600 "$KEYF"
            ssh-keygen -y -f "$KEYF" > /dev/null 2>&1
          }
          load_val() { # load_val <候选值>：规范化并校验，成功则 $KEYF 就绪
            printf '%s\n' "$1" | tr -d '\r' > "$KEYF.raw"
            if grep -q '\\n' "$KEYF.raw" && [ "$(wc -l < "$KEYF.raw")" -lt 3 ]; then
              printf '%b\n' "$(cat "$KEYF.raw")" > "$KEYF.tmp" && mv "$KEYF.tmp" "$KEYF.raw"
            fi
            if grep -q 'PuTTY-User-Key-File' "$KEYF.raw"; then
              sudo apt-get -yq install putty-tools > /dev/null 2>&1
              puttygen "$KEYF.raw" -O private-openssh -o "$KEYF" 2>/dev/null && chmod 600 "$KEYF" \
                && ssh-keygen -y -f "$KEYF" > /dev/null 2>&1 && return 0
              return 1
            fi
            # 去掉任何形态的 BEGIN/END 外壳（横线数量不限），剩余视为 base64 正文
            sed -E 's/-+ *(BEGIN|END) *([A-Z0-9 ]*KEY)? *-+//g' "$KEYF.raw" | tr -d ' \t\n' > "$KEYF.b64"
            keytype=$(sed -nE 's/.*-+ *BEGIN *([A-Z0-9 ]*KEY) *-+.*/\1/p' "$KEYF.raw" | head -1)
            if [ -n "$keytype" ]; then try_key "$keytype" && return 0; fi
            for t in 'OPENSSH PRIVATE KEY' 'RSA PRIVATE KEY' 'PRIVATE KEY' 'EC PRIVATE KEY'; do
              try_key "$t" && return 0
            done
            return 1
          }
          used=""
          if [ -n "$DEPLOY_SSH_KEY" ] && load_val "$DEPLOY_SSH_KEY"; then
            used="DEPLOY_SSH_KEY"
          else
            echo "DEPLOY_SSH_KEY 不是可解析的私钥（诊断：行数=$(wc -l < "$KEYF.raw")，字符=$(wc -c < "$KEYF.raw")，疑似公钥行数=$(grep -cE '(^|[[:space:]])(ssh-(rsa|ed25519|dss)|ecdsa-sha2)' "$KEYF.raw" || true)），扫描其余 Secrets…"
            for name in $(printf '%s' "$SECRETS_JSON" | jq -r 'keys[]' | grep -viE '^(github_token|actions_)' | grep -vx 'DEPLOY_SSH_KEY'); do
              val=$(printf '%s' "$SECRETS_JSON" | jq -r --arg k "$name" '.[$k] // empty')
              [ -n "$val" ] || continue
              if load_val "$val"; then used="$name"; break; fi
            done
          fi
          if [ -z "$used" ]; then
            echo "::error::所有 Actions Secrets 中均未找到可解析的 SSH 私钥。已检查：$(printf '%s' "$SECRETS_JSON" | jq -r 'keys | join(", ")')。请把服务器私钥完整内容存入 DEPLOY_SSH_KEY"
            exit 1
          fi
          rm -f "$KEYF.raw" "$KEYF.b64" "$KEYF.tmp"
          echo "使用 Secret「$used」作为部署私钥，指纹：$(ssh-keygen -lf "$KEYF" | awk '{print $1, $2}')"
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo -e "Host pyq\n  HostName ${{ secrets.DEPLOY_HOST }}\n  User ${{ secrets.DEPLOY_USER }}\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n  ServerAliveCountMax 10" >> ~/.ssh/config

      - name: 校验 SSH 连通并选定账号
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # 私钥有效但登录被拒时，常见原因是公钥加到了别的账号：依次探测常见账号，
          # 找到能登录的就改写 Host pyq 的 User。日志中 DEPLOY_USER 的值会被自动打码。
          ok=""
          for u in "$DEPLOY_USER" root ubuntu lighthouse admin debian; do
            u=$(printf '%s' "$u" | tr -d '[:space:]'); [ -n "$u" ] || continue
            if ssh -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
                   -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "$u@$DEPLOY_HOST" true 2>/dev/null; then
              ok="$u"; break
            fi
          done
          if [ -z "$ok" ]; then
            echo "::error::当前私钥无法以任何常见账号（DEPLOY_USER/root/ubuntu/lighthouse/admin/debian）登录服务器。请确认对应公钥已追加到 DEPLOY_USER 账号的 ~/.ssh/authorized_keys（权限 700/.ssh、600/authorized_keys）"
            exit 1
          fi
          sed -i "s/^  User .*/  User $ok/" ~/.ssh/config
          echo "SSH 连通成功，登录账号：$ok"
          if [ "$ok" != root ]; then
            ssh pyq 'sudo -n true' 2>/dev/null || echo "::warning::该账号无免密 sudo，初始化/发布步骤可能失败"
          fi

      - name: 服务器 nginx 诊断（仅 debug 勾选时）
        if: ${{ inputs.debug }}
        run: |
          ssh pyq 'S=""; [ "$(id -u)" = 0 ] || S="sudo -n"; \
            echo "== conf.d 目录 =="; $S ls -la /etc/nginx/conf.d/; \
            echo "== sites-enabled 目录 =="; $S ls -la /etc/nginx/sites-enabled/ 2>/dev/null || echo 无; \
            echo "== conf.d/pu8.conf 前 20 行 =="; $S head -20 /etc/nginx/conf.d/pu8.conf; \
            echo "== nginx 实际加载的 server 块 =="; $S nginx -T 2>/dev/null | grep -nE "^# configuration file|server_name|listen|root " | head -50; \
            echo "== /tmp 中的待部署配置 =="; ls -la /tmp/nginx-puyouquan.conf 2>/dev/null; head -12 /tmp/nginx-puyouquan.conf 2>/dev/null; \
            echo "== nginx 进程与 reload 时间 =="; $S systemctl status nginx --no-pager | head -8'

      - name: 首次初始化（仅手动勾选时）
        if: ${{ inputs.setup }}
        run: |
          scp deploy/server-setup.sh deploy/nginx-puyouquan.conf deploy/fetch-soundfonts.sh deploy/api-setup.sh deploy/pyq-api.conf deploy/pyq-headers.conf deploy/pyq-ratelimit.conf pyq:/tmp/
          # 音色包下载依赖境外源，失败或超时不阻塞部署（编辑器会回落内置合成音色，可日后重跑续传）
          ssh pyq 'S=""; [ "$(id -u)" = 0 ] || S="sudo -n"; $S bash /tmp/server-setup.sh && $S bash /tmp/api-setup.sh && { $S timeout 600 bash /tmp/fetch-soundfonts.sh || echo "音色包下载未全部完成（不阻塞部署）"; }'

      - name: 发布产品文件（原子落位 + 缓存刷新 + 保留回滚版）
        run: |
          # 先传到 /tmp，再由 publish.sh 在服务器侧原子落位（index.html 用 mv -T + 留 .prev，
          # site 用 rsync --delete 清孤儿，静态引用追加 ?v=<短sha> 破缓存）。兼容非 root 部署账号。
          ssh pyq 'rm -rf /tmp/pyq_pub_site /tmp/pyq_pub_index.html /tmp/pyq_pub_fmt.md'
          scp muse-tab/index.html pyq:/tmp/pyq_pub_index.html
          scp -r muse-tab/site pyq:/tmp/pyq_pub_site
          scp muse-tab/PYQ-FORMAT.md pyq:/tmp/pyq_pub_fmt.md || true
          scp deploy/publish.sh pyq:/tmp/pyq_publish.sh
          ssh pyq 'S=""; [ "$(id -u)" = 0 ] || S="sudo -n"; $S bash /tmp/pyq_publish.sh "'"${GITHUB_SHA::8}"'"'

      - name: 音色包供给（双库并存，幂等）
        run: |
          # 音质升级·阶段0：FluidR3_GM 与 MusyngKite 双库并存（评审硬门槛 C1/C2）。
          # 在 runner 侧下载（境外源快而稳），rsync 补齐服务器缺失/残缺文件；两库均不删除。
          # 全部齐备时本步骤只做一次 ssh 清点，秒级返回。
          FONTS="acoustic_guitar_steel acoustic_guitar_nylon electric_guitar_clean overdriven_guitar distortion_guitar acoustic_bass acoustic_grand_piano electric_piano_1 music_box string_ensemble_1 flute choir_aahs"
          MIN=300000   # 单文件下限 300KB（防半截文件当完整）
          for LIB in MusyngKite FluidR3_GM; do
            missing=""
            for f in $FONTS; do
              sz=$(ssh pyq "stat -c%s /var/www/puyouquan/sounds/$LIB/${f}-mp3.js 2>/dev/null || echo 0")
              [ "$sz" -ge "$MIN" ] || missing="$missing $f"
            done
            if [ -z "$missing" ]; then echo "✓ $LIB 10/10 齐备"; continue; fi
            echo "→ $LIB 缺失:$missing"
            mkdir -p /tmp/sf/$LIB
            for f in $missing; do
              curl -fsSL --connect-timeout 10 --max-time 120 --retry 2 \
                -o /tmp/sf/$LIB/${f}-mp3.js \
                "https://raw.githubusercontent.com/gleitz/midi-js-soundfonts/gh-pages/$LIB/${f}-mp3.js" \
              || curl -fsSL --connect-timeout 10 --max-time 120 --retry 2 \
                -o /tmp/sf/$LIB/${f}-mp3.js \
                "https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@gh-pages/$LIB/${f}-mp3.js"
              sz=$(stat -c%s /tmp/sf/$LIB/${f}-mp3.js 2>/dev/null || echo 0)
              [ "$sz" -ge "$MIN" ] || { echo "✗ $LIB/$f 下载不完整($sz)"; exit 1; }
            done
            ssh pyq 'rm -rf /tmp/pyq_sf && mkdir -p /tmp/pyq_sf'
            scp -r /tmp/sf/$LIB pyq:/tmp/pyq_sf/
            ssh pyq 'S=""; [ "$(id -u)" = 0 ] || S="sudo -n"; \
              $S mkdir -p /var/www/puyouquan/sounds/'"$LIB"' && \
              $S cp /tmp/pyq_sf/'"$LIB"'/*.js /var/www/puyouquan/sounds/'"$LIB"'/ && rm -rf /tmp/pyq_sf'
            echo "✓ $LIB 已补齐:$missing"
          done
          # 清点 manifest（进部署日志备查）
          ssh pyq 'for L in MusyngKite FluidR3_GM; do echo "== $L =="; ls -la /var/www/puyouquan/sounds/$L/ 2>/dev/null | awk "{print \$5, \$9}" | tail -n +2; done'

      - name: 发布 API 服务（已初始化时）
        run: |
          if ssh pyq 'test -f /etc/systemd/system/pyq-api.service'; then
            ssh pyq 'rm -rf /tmp/pyq_api'
            scp -r api pyq:/tmp/pyq_api
            ssh pyq 'S=""; [ "$(id -u)" = 0 ] || S="sudo -n"; \
              $S rsync -a --delete /tmp/pyq_api/ /opt/puyouquan/api/ && rm -rf /tmp/pyq_api && \
              $S systemctl restart pyq-api && sleep 1 && $S systemctl is-active pyq-api'
            # DB 每日备份 timer（幂等安装/刷新；api 已 rsync，db-backup.js 就位）
            scp deploy/db-backup.sh pyq:/tmp/db-backup.sh
            ssh pyq 'S=""; [ "$(id -u)" = 0 ] || S="sudo -n"; $S bash /tmp/db-backup.sh'
          else
            echo "pyq-api 未初始化（先跑一次勾选 setup 的部署），跳过 API 发布"
          fi

      - name: 刷新 nginx 安全响应头 snippet + 校验生产配置
        run: |
          # snippet 已被各 server 块 include，只刷新其内容（加安全响应头）+ nginx -t 通过才 reload；失败不阻断
          # v62.6 A1d：三份文件（api snippet / 安全头 snippet / http 层限流区）+ 给 zhipu 的 location = /index.html 补 include
          # （该 location 自带 Cache-Control 的 add_header，不再继承 server 级安全头）。先整体备份，nginx -t 失败即全部还原，
          # 绝不把一份 -t 不过的配置留在磁盘上（下次任何 reload/重启都会挂）。
          scp deploy/pyq-api.conf deploy/pyq-headers.conf deploy/pyq-ratelimit.conf pyq:/tmp/
          ssh pyq 'S=""; [ "$(id -u)" = 0 ] || S="sudo -n"; \
            if [ -f /etc/nginx/snippets/pyq-api.conf ]; then \
              B=/tmp/pyq_nginx_bak; $S rm -rf $B; $S mkdir -p $B; \
              $S cp -a /etc/nginx/snippets/pyq-api.conf /etc/nginx/conf.d/pu8.conf $B/ ; \
              [ -f /etc/nginx/snippets/pyq-headers.conf ] && $S cp -a /etc/nginx/snippets/pyq-headers.conf $B/ ; \
              [ -f /etc/nginx/conf.d/00-pyq-ratelimit.conf ] && $S cp -a /etc/nginx/conf.d/00-pyq-ratelimit.conf $B/ ; \
              $S cp /tmp/pyq-headers.conf /etc/nginx/snippets/pyq-headers.conf; \
              $S cp /tmp/pyq-ratelimit.conf /etc/nginx/conf.d/00-pyq-ratelimit.conf; \
              $S cp /tmp/pyq-api.conf /etc/nginx/snippets/pyq-api.conf; \
              if ! $S grep -q "snippets/pyq-headers.conf" /etc/nginx/conf.d/pu8.conf; then \
                $S sed -i "s|^\(\s*\)add_header Cache-Control \"no-cache\";.*|&\n\1include snippets/pyq-headers.conf;|" /etc/nginx/conf.d/pu8.conf; fi; \
              if $S nginx -t 2>/dev/null; then $S systemctl reload nginx && echo "nginx 安全响应头 + 限流已刷新"; \
              else echo "::warning::nginx -t 失败，已还原全部 nginx 改动（请手工核查）"; \
                $S cp -a $B/pyq-api.conf /etc/nginx/snippets/pyq-api.conf; $S cp -a $B/pu8.conf /etc/nginx/conf.d/pu8.conf; \
                if [ -f $B/pyq-headers.conf ]; then $S cp -a $B/pyq-headers.conf /etc/nginx/snippets/; else $S rm -f /etc/nginx/snippets/pyq-headers.conf; fi; \
                if [ -f $B/00-pyq-ratelimit.conf ]; then $S cp -a $B/00-pyq-ratelimit.conf /etc/nginx/conf.d/; else $S rm -f /etc/nginx/conf.d/00-pyq-ratelimit.conf; fi; \
                $S nginx -t 2>/dev/null && echo "还原后 nginx -t 通过"; fi; \
            else echo "snippets/pyq-api.conf 不存在（先跑一次 setup 部署），跳过"; fi'
          # 生产环境不应残留 DEV_OTP=1（否则短信接口会回吐验证码）
          ssh pyq 'grep -qE "^DEV_OTP=1" /etc/puyouquan/api.env 2>/dev/null && echo "::warning::生产 api.env 含 DEV_OTP=1，请移除并重启 pyq-api" || echo "DEV_OTP 校验通过（未开启）"'

      - name: 冒烟验收
        run: bash deploy/smoke.sh "${{ secrets.DEPLOY_HOST }}"
