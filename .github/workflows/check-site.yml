name: 站点可用性检查
# 手动触发：从 GitHub Runner（境外网络）检查域名解析、HTTP 可达性与页面标记。
# smoke.sh 通过 Host 头逐一验收三个虚拟主机（官网/zhipu 制谱/puku 谱库）；
# IP 对照组用于区分「域名/DNS/备案问题」和「服务器/站点问题」。
on:
  workflow_dispatch:
    inputs:
      host:
        description: '要检查的主机'
        default: 'puyouquan.com'
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DNS 解析与 HTTPS 响应头
        run: |
          for H in puyouquan.com www.puyouquan.com zhipu.puyouquan.com puku.puyouquan.com; do
            echo "== DNS: $H =="
            getent hosts "$H" || echo "❌ DNS 解析失败：$H 无 A 记录或未生效"
          done
          echo "== HTTPS 响应头（${{ inputs.host }}）=="
          curl -sSI -m 20 "https://${{ inputs.host }}/" | head -6 || echo "❌ HTTPS 无响应"
          echo "== HTTP 跳转 =="
          curl -sI -m 20 "http://${{ inputs.host }}/" | head -3 || true

      - name: 各 vhost HTTPS 响应头与首屏预览（IP 直连）
        continue-on-error: true
        run: |
          for V in puyouquan.com zhipu.puyouquan.com puku.puyouquan.com; do
            echo "===== $V ====="
            curl -sSI -m 20 --connect-to "$V:443:${{ secrets.DEPLOY_HOST }}:443" "https://$V/" | head -8
            echo "--- 正文前 400 字节 ---"
            curl -sSL -m 20 --connect-to "$V:443:${{ secrets.DEPLOY_HOST }}:443" "https://$V/" | head -c 400; echo; echo
          done

      - name: 对照组：服务器 IP 直访（Host 头模拟各子域）
        continue-on-error: true
        run: bash deploy/smoke.sh "${{ secrets.DEPLOY_HOST }}"

      - name: 冒烟验收（域名）
        run: bash deploy/smoke.sh "${{ inputs.host }}"
