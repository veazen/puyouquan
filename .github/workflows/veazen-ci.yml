name: veazen-ci

on:
  push:
    branches: [main]
    paths: ['veazen/**', '.github/workflows/veazen-ci.yml']
  pull_request:
    paths: ['veazen/**', '.github/workflows/veazen-ci.yml']

defaults:
  run:
    working-directory: veazen

jobs:
  node:
    name: lint + typecheck + test (api / web / packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: veazen/package-lock.json
      - run: npm ci
      # wp-plugin is excluded here: its lint is PHPCS, owned by the php job
      # below (running it here would need a redundant composer install).
      - run: npx turbo run lint typecheck test --filter='!@veazen/wp-plugin'

  api-e2e:
    name: Phase 1 acceptance e2e (api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veazen
          POSTGRES_PASSWORD: veazen
          POSTGRES_DB: veazen
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U veazen" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: veazen/package-lock.json
      - run: npm ci
      - run: npm run build --workspace @veazen/crypto --workspace @veazen/shared
      - name: migrate (owner role)
        working-directory: veazen/apps/api
        run: npx prisma migrate deploy && npx prisma generate
        env:
          DATABASE_URL: postgres://veazen:veazen@localhost:5432/veazen
      - name: e2e (app role, RLS enforced)
        working-directory: veazen/apps/api
        run: npm run test:e2e
        env:
          DATABASE_URL: postgres://veazen_app:veazen_app@localhost:5432/veazen
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-secret
          MASTER_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  php:
    name: PHPCS (wp-plugin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veazen/apps/wp-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer lint

  audit:
    name: dependency audit (§9.7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: veazen/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: composer audit
        working-directory: veazen/apps/wp-plugin
        run: |
          composer install --no-interaction --no-progress
          composer audit
