# v62.6 A1d 安全响应头单独成片：server 级经 pyq-api.conf 引入；凡是自带 add_header 的 location
# （如 zhipu 的 location = /index.html 加了 Cache-Control）必须再 include 一次——nginx 的 add_header
# 只要 location 里出现过一条，就不再继承上层的任何 add_header，编辑器主页会因此丢掉防点击劫持头。
add_header X-Frame-Options "SAMEORIGIN" always;                       # 防点击劫持（编辑器不被跨源 iframe 套）
add_header X-Content-Type-Options "nosniff" always;                  # 禁 MIME 嗅探
add_header Referrer-Policy "strict-origin-when-cross-origin" always; # 跨站不泄露完整路径
