# v62.6 A1d 限流区（http 层，装到 /etc/nginx/conf.d/00-pyq-ratelimit.conf；limit_req_zone 不能写在 server 内）。
# 按 IP 计：学校机房多人共用出口 IP，所以 /api/ 放得较宽（编辑器每 6 秒自动保存一次 + 同步 + 埋点）；
# /pub/、/course/ 是公开可爬页，专防整库抓取。超限回 429，正常使用碰不到。
limit_req_zone $binary_remote_addr zone=pyq_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pyq_pub:10m rate=5r/s;
limit_req_status 429;
