# 谱友圈 nginx snippet：/api 反代 + 安全响应头。被各 vhost 的 server 块 include（api-setup.sh 幂等注入）。
# 安全响应头见 pyq-headers.conf（v62.6 抽出：自带 add_header 的 location 需各自再 include 一次）。
# 限流区定义在 http 层的 conf.d/00-pyq-ratelimit.conf（v62.6 A1d）。
include snippets/pyq-headers.conf;
location /api/ {
    limit_req zone=pyq_api burst=80 nodelay;
    proxy_pass http://127.0.0.1:3127;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
    client_max_body_size 4m;
}
# 已发布谱 SSR 落地页 + og 封面（/pub/:id、/pub/:id/cover.svg）——供搜索引擎/微信爬虫收录。
# 各 vhost 均 include（www/zhipu/puku 都可达），SSR 内 canonical 统一指向 puku 去重。
location /pub/ {
    limit_req zone=pyq_pub burst=30 nodelay;
    proxy_pass http://127.0.0.1:3127;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}
# v62.0 课程独立页（/course/ 目录、/course/:id 课程落地页、/course/sitemap.xml）——
# 每门课程一个真实可分享可收录的 URL；真人点 CTA 进 kecheng.html?c=<id> 学习。
location /course/ {
    limit_req zone=pyq_pub burst=30 nodelay;
    proxy_pass http://127.0.0.1:3127;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}
