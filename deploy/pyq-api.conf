# 谱友圈 nginx snippet：/api 反代 + 安全响应头。被各 vhost 的 server 块 include（api-setup.sh 幂等注入）。
# add_header 置于 server 级，各 location 无自有 add_header 故继承；always 保证错误响应也带头。
add_header X-Frame-Options "SAMEORIGIN" always;                       # 防点击劫持（编辑器不被跨源 iframe 套）
add_header X-Content-Type-Options "nosniff" always;                  # 禁 MIME 嗅探
add_header Referrer-Policy "strict-origin-when-cross-origin" always; # 跨站不泄露完整路径
location /api/ {
    proxy_pass http://127.0.0.1:3127;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
    client_max_body_size 4m;
}
