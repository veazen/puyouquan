# 谱友圈 PYQ · Nginx 站点配置（放到 /etc/nginx/conf.d/pu8.conf）
# 域名架构（2026-07-22 起）：
#   puyouquan.com / www  → 官网（/var/www/puyouquan/site）
#   zhipu.puyouquan.com  → 在线制谱（单文件应用 /var/www/puyouquan/index.html）
#   puku.puyouquan.com   → 谱库·创作者正式谱展示（site/view.html 作首页）
# 需配合 server-setup.sh 删除发行版默认站点；证书签发时四个域名一并纳入。
# conf.d/*.conf 被 include 进 http{}。注意：`gzip on` 已在发行版 nginx.conf 的 http{}
# 中声明，这里再写会因指令重复导致 nginx -t 失败（v 域名架构上线时踩过），只补充类型与阈值。
gzip_types text/css application/javascript application/json image/svg+xml;  # text/html 默认压缩，重复声明会告警
gzip_min_length 1024;

# ── 主域名：官网（default_server，备案前 IP 直访也命中此站点）──
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name puyouquan.com www.puyouquan.com _;

    root /var/www/puyouquan/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/pu8.access.log;
    error_log  /var/log/nginx/pu8.error.log;
}

# ── 在线制谱：单文件应用 ──
server {
    listen 80;
    listen [::]:80;
    server_name zhipu.puyouquan.com;

    root /var/www/puyouquan;
    index index.html;

    # 单文件应用：所有路径回落到 index.html（sounds/、site/ 等静态资源仍直出）
    location / {
        try_files $uri /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";   # 保证发版后用户拿到新版本
    }

    access_log /var/log/nginx/pu8-zhipu.access.log;
    error_log  /var/log/nginx/pu8-zhipu.error.log;
}

# ── 谱库：v58.7 起并入主站（www 首页即谱库）。puku 域保留两职：
#    ① kanpu.html 观看页（已散发的分享链接 puku.puyouquan.com/kanpu.html?pub=ID，不可断链）；
#    ② 根路径落位 view.html 跳转占位（可选优化：把下面 location = / 改成
#       return 301 https://www.puyouquan.com$request_uri; 更利于 SEO 权重集中）──
server {
    listen 80;
    listen [::]:80;
    server_name puku.puyouquan.com;

    root /var/www/puyouquan/site;

    location = / {
        try_files /view.html =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/pu8-puku.access.log;
    error_log  /var/log/nginx/pu8-puku.error.log;
}
