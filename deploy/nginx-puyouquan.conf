# 谱友圈 PYQ · Nginx 站点配置（放到 /etc/nginx/conf.d/pu8.conf 或 sites-available）
# 备案通过并签发 SSL 后，用 certbot 会自动补充 443 段与跳转
server {
    # default_server：备案前用服务器 IP 访问（含冒烟验收）也命中本站点，
    # 需配合删除发行版自带的 sites-enabled/default（见 server-setup.sh）
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name puyouquan.com www.puyouquan.com _;

    root /var/www/puyouquan;
    index index.html;

    # 单文件应用：所有路径回落到 index.html
    location / {
        try_files $uri /index.html;
    }

    # 静态资源缓存与压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;  # text/html 默认压缩，重复声明会告警
    gzip_min_length 1024;

    location = /index.html {
        add_header Cache-Control "no-cache";   # 保证发版后用户拿到新版本
    }

    access_log /var/log/nginx/pu8.access.log;
    error_log  /var/log/nginx/pu8.error.log;
}
