<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Veazen mark: letter V as a chiseled groove; left arm limestone, right arm jade.
       Each arm split lengthwise along its centerline into a lit facet and a shade facet. -->
  <defs>
    <clipPath id="v">
      <polygon points="13.91,34.44 45.73,90.75 88.96,20.67 77.04,13.33 46.26,63.25 26.09,27.56"/>
    </clipPath>
  </defs>
  <g clip-path="url(#v)">
    <!-- base: limestone shade facet -->
    <rect x="-10" y="-10" width="130" height="140" fill="#A9A498"/>
    <!-- lit facets (below/left of centerline), limestone bright -->
    <polygon points="-10,-22.1 20,31 46,77 83,17 110,-26.8 110,120 -10,120" fill="#E9E4D8"/>
    <!-- right arm: jade shade facet -->
    <polygon points="47.67,-10 110,-10 110,120 45.17,120" fill="#2C7A5C"/>
    <!-- right arm: jade lit facet -->
    <polygon points="45.17,120 45.9,77.2 83,17 110,-26.8 110,120" fill="#3FA37C"/>
  </g>
</svg>
