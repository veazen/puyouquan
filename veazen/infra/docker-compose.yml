# Local development stack (PROJECT_PLAN §3): postgres + redis + minio + mailhog
# Usage: docker compose -f infra/docker-compose.yml up -d
name: veazen-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veazen
      POSTGRES_PASSWORD: veazen
      POSTGRES_DB: veazen
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U veazen -d veazen']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: veazen
      MINIO_ROOT_PASSWORD: veazen-dev-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

volumes:
  postgres-data:
  redis-data:
  minio-data:
