<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人中心 · 谱友圈 — 智能曲谱平台</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="pyq.css">
</head>
<body data-page="me">
<div id="site-nav"></div>

<!-- 未登录：整页居中登录卡（默认隐藏，探测 /api/me 401 后显示） -->
<main id="me-auth" class="me-auth" hidden>
  <div class="auth-card">
    <div class="brand"><span class="mark" style="width:40px;height:40px;border-radius:12px"></span></div>
    <h2>登录谱友圈</h2>
    <p class="lg-sub">输入手机号即登录，新号自动注册，跨端同步。</p>
    <input id="lg-phone" inputmode="numeric" maxlength="11" placeholder="11 位手机号">
    <div class="lg-row"><input id="lg-code" inputmode="numeric" maxlength="6" placeholder="6 位验证码"><button id="lg-send">获取验证码</button></div>
    <div id="lg-msg" class="lg-msg"></div>
    <button id="lg-go" class="lg-go">登录</button>
    <div id="lg-wx-slot"></div>
  </div>
</main>

<!-- 已登录：个人中心主体 -->
<main id="me-body" class="me-wrap" hidden>
  <header class="me-head">
    <span class="acct-av me-av" id="me-av" title="更换头像">谱</span>
    <div class="me-id">
      <!-- v59.4 创作者徽章可点：与「创作者中心」按钮同一动作，直达创作者中心卡片（用户指示） -->
      <h1 class="me-nick"><span id="me-nick-t">…</span><span id="me-vip-badge" class="vip-badge free" hidden>免费版</span><button type="button" id="me-cr-badge" class="cr-badge" hidden title="进入创作者中心">创作者</button></h1>
      <p class="me-sub"><span id="me-phone"></span><span id="me-wx-slot"></span></p>
    </div>
    <!-- v59.4 头部按钮成组：手机端整组换行到第二行，身份区不被挤破（徽章竖排） -->
    <div class="me-hbtns">
      <button type="button" class="btn me-gocr" id="me-gocr" hidden title="进入创作者中心：已发布曲谱与发布入口">创作者中心</button>
      <a class="btn me-openzp" href="//zhipu.puyouquan.com/">打开编辑器</a>
    </div>
  </header>
  <p class="me-msg" id="me-msg"></p>

  <div class="me-grid">
    <!-- DOM 序 = 移动端单列序：会员卡 → 我的曲谱 → 我的收藏 → 账号操作；桌面右栏由 grid 归位 -->
    <div class="me-side">
      <div class="me-vipcard" id="me-vip">
        <b>会员状态</b><p>查询中…</p>
      </div>
      <section class="me-card" id="me-creator" hidden></section>
      <section class="me-card" id="me-ops">
        <h3 class="me-h">账号与安全</h3>
        <button class="me-op" id="op-nick">修改昵称</button>
        <button class="me-op" id="op-wx" hidden>绑定微信<small>绑定后可用微信扫码直接登录本账号</small></button>
        <button class="me-op" id="op-logout">退出登录</button>
        <button class="me-op" id="op-logout-all">退出所有设备<small>使所有已登录设备（含本机）下线，应对手机丢失</small></button>
      </section>
    </div>
    <div class="me-main">
      <section class="me-card" id="me-scores">
        <h3 class="me-h">我的云端曲谱<a class="pc-more" href="//zhipu.puyouquan.com/">在编辑器中管理全部 →</a></h3>
        <div class="pc-list" id="sc-list"><p class="pc-empty">加载中…</p></div>
      </section>
      <section class="me-card" id="me-favs">
        <h3 class="me-h">我的收藏<span class="lib-count" id="fav-count"></span></h3>
        <div class="grid g2" id="fav-grid"><p class="pc-empty">加载中…</p></div>
      </section>
    </div>
  </div>
</main>

<div id="site-foot"><div style="text-align:center;padding:20px 0;font-size:13px;opacity:.75">© 2026 谱友圈 puyouquan.com · 智能曲谱平台 · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">粤ICP备2026100396号-1</a></div></div>
<script src="pyq.js"></script>
<script>
/* 个人中心独立页：/api/me 探测登录态；已登录拉 会员/云端曲谱/收藏（收藏经 pub/scores 本地联查出卡片）。
   微信绑定/登录回跳（?wxlogin= / ?wxbind=）在本页就地处理。 */
(function(){
  var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  function api(path,opts){ opts=opts||{};
    return fetch('/api'+path,{method:opts.method||'GET',credentials:'include',
      headers:opts.body?{'Content-Type':'application/json'}:{},body:opts.body?JSON.stringify(opts.body):undefined})
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){
        if(!r.ok){ var e=new Error(j.error||('请求失败（'+r.status+'）')); e.status=r.status; throw e; } return j; }); }); }
  var inWx=/MicroMessenger/i.test(navigator.userAgent);
  var wxWeb=false, wxMp=false;
  var healthP=api('/health').then(function(j){ wxWeb=!!(j&&j.wx_web); wxMp=!!(j&&j.wx_mp); }).catch(function(){});
  function wxPath(){ return (inWx&&wxMp)?'/wx/mp/login-url':'/wx/web/login-url'; }
  function msg(t){ var el=document.getElementById('me-msg'); if(el) el.textContent=t||''; }

  /* 微信登录/绑定回跳提示 */
  var backMsg='';
  try{
    var sp=new URLSearchParams(location.search);
    var wl=sp.get('wxlogin'), wb=sp.get('wxbind');
    if(wl||wb){ history.replaceState(null,'',location.pathname);
      if(wl==='ok') backMsg='微信登录成功';
      else if(wl) backMsg='微信登录未完成，请重试';
      if(wb==='ok') backMsg='微信绑定成功，下次可扫码登录';
      else if(wb==='conflict') backMsg='该微信已绑定其他账号，请先在原账号解绑';
      else if(wb) backMsg='微信绑定未完成，请重试';
    }
  }catch(_){}

  var FMT=function(t){ if(!t) return '—'; var d=new Date(t*1000);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

  function showAuth(){
    document.getElementById('me-auth').hidden=false;
    document.getElementById('me-body').hidden=true;
    var timer=0;
    var m=function(t){ var el=document.getElementById('lg-msg'); if(el) el.textContent=t||''; };
    if(backMsg) m(backMsg);
    document.getElementById('lg-send').onclick=function(){
      var phone=document.getElementById('lg-phone').value.trim(), self=this;
      if(!/^1[3-9]\d{9}$/.test(phone)) return m('请输入正确的手机号');
      self.disabled=true;
      api('/auth/sms/send',{method:'POST',body:{phone:phone}}).then(function(r){
        m(r.dev_code?('测试环境验证码：'+r.dev_code):'验证码已发送，请查收短信');
        var s=60; self.textContent=s+'s';
        timer=setInterval(function(){ if(--s<=0){ clearInterval(timer); timer=0; self.disabled=false; self.textContent='获取验证码'; } else self.textContent=s+'s'; },1000);
      }).catch(function(e){ self.disabled=false; m(e.message); });
    };
    document.getElementById('lg-go').onclick=function(){
      var phone=document.getElementById('lg-phone').value.trim(), code=document.getElementById('lg-code').value.trim();
      if(!/^1[3-9]\d{9}$/.test(phone)) return m('请输入正确的手机号');
      if(!/^\d{6}$/.test(code)) return m('请输入 6 位验证码');
      api('/auth/sms/verify',{method:'POST',body:{phone:phone,code:code}})
        .then(function(){ location.reload(); }).catch(function(e){ m(e.message); });
    };
    healthP.then(function(){
      if(!(wxWeb||wxMp)) return;
      document.getElementById('lg-wx-slot').innerHTML =
        '<div class="lg-or">— 或 —</div><button class="lg-wx" id="lg-wx">'+((inWx&&wxMp)?'微信一键登录':'微信扫码登录')+'</button>'
        +((inWx&&!wxMp)?'<div class="lg-wxtip">微信内点击后，<b>长按页面上的二维码</b>即可识别登录</div>':'');
      document.getElementById('lg-wx').onclick=function(){ var self=this; self.disabled=true;
        api(wxPath()+'?return='+encodeURIComponent(location.origin+location.pathname)).then(function(r){
          if(r.url) location.href=r.url; else { self.disabled=false; m('微信登录暂不可用'); } })
        .catch(function(e){ self.disabled=false; m(e.status===503?'微信登录尚未开通':(e.message||'微信登录暂不可用')); }); };
    });
  }

  function showMe(u){
    document.getElementById('me-auth').hidden=true;
    document.getElementById('me-body').hidden=false;
    if(backMsg) msg(backMsg);
    /* 头像三态渲染（值只进 img src 属性；失败回退首字）+ 相机徽章 */
    var AV_EDIT='<span class="av-edit"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg></span>';
    var meAv=document.getElementById('me-av');
    function renderAv(){
      var av=u.avatar||'', ch=esc((u.nickname||'谱').charAt(0));
      if(av && (av.slice(0,11)==='data:image/'||av.slice(0,4)==='http')){
        meAv.classList.add('has-img');
        meAv.innerHTML='<img src="'+esc(av)+'" alt="">'+AV_EDIT;
        meAv.querySelector('img').onerror=function(){ meAv.classList.remove('has-img'); meAv.innerHTML=ch+AV_EDIT; };
      }else{ meAv.classList.remove('has-img'); meAv.innerHTML=ch+AV_EDIT; }
    }
    renderAv();
    /* 更换头像浮层：8 预设 + 本地上传（96×96 居中裁切 JPEG）+ 恢复默认；零确认步，选即生效 */
    function saveAv(val, m2){
      api('/me',{method:'PATCH',body:{avatar:val}}).then(function(j){
        u.avatar=(j.user&&j.user.avatar)||val; renderAv(); msg('头像已更新');
        try{ if(window.PYQ_ACCT&&PYQ_ACCT.refresh) PYQ_ACCT.refresh(); }catch(_){}
        var mk=document.getElementById('av-mask'); if(mk) mk.remove();
      }).catch(function(e){ if(m2) m2(e.message||'头像更新失败，请检查网络后重试'); });
    }
    meAv.onclick=function(){
      var mk=document.createElement('div'); mk.id='av-mask'; mk.className='pyq-mask';
      mk.innerHTML='<div class="pyq-modal av-modal"><h3>更换头像</h3>'
        +'<p class="lg-sub">选一个预设，或上传本地图片（自动裁成正方形）</p>'
        +'<div class="av-grid">'+PYQ_AV.PRESETS.map(function(pv,i){
          return '<button class="av-opt'+(u.avatar===pv?' on':'')+'" data-i="'+i+'"><img src="'+pv+'" alt=""></button>'; }).join('')+'</div>'
        +'<div class="lg-msg" id="av-msg"></div>'
        +'<div class="av-actions"><button class="btn ghost" id="av-up" style="padding:9px 16px;font-size:13px">上传图片</button>'
        +'<input type="file" id="av-file" accept="image/jpeg,image/png,image/webp" hidden>'
        +(u.avatar?'<button class="av-rm" id="av-rm">恢复默认头像</button>':'')
        +'<button class="av-rm" id="av-x" style="margin-left:'+(u.avatar?'0':'auto')+'">取消</button></div></div>';
      document.body.appendChild(mk);
      mk.addEventListener('click',function(e){ if(e.target===mk) mk.remove(); });
      var m2=function(t){ var el=document.getElementById('av-msg'); if(el) el.textContent=t||''; };
      mk.querySelectorAll('.av-opt').forEach(function(b2){ b2.onclick=function(){ saveAv(PYQ_AV.PRESETS[+b2.dataset.i], m2); }; });
      document.getElementById('av-x').onclick=function(){ mk.remove(); };
      var rm=document.getElementById('av-rm'); if(rm) rm.onclick=function(){ saveAv('', m2); };
      var fi=document.getElementById('av-file');
      document.getElementById('av-up').onclick=function(){ fi.click(); };
      fi.onchange=function(){
        var f=fi.files&&fi.files[0]; if(!f) return;
        if(f.size>2*1024*1024 || !/^image\//.test(f.type)) return m2('请选择 2MB 以内的图片');
        var draw=function(img,w,h){
          var cv=document.createElement('canvas'); cv.width=96; cv.height=96;
          var cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,96,96);
          var side=Math.min(w,h);
          cx.drawImage(img,(w-side)/2,(h-side)/2,side,side,0,0,96,96);
          var d=cv.toDataURL('image/jpeg',.85), qs=[.75,.6], k=0;
          while(d.length>28672 && k<qs.length) d=cv.toDataURL('image/jpeg',qs[k++]);
          if(d.length>28672) return m2('图片过于复杂，请换一张');
          saveAv(d, m2);
        };
        if(window.createImageBitmap){
          createImageBitmap(f,{imageOrientation:'from-image'}).then(function(bm){ draw(bm,bm.width,bm.height); })
            .catch(function(){ legacy(); });
        }else legacy();
        function legacy(){
          var url=URL.createObjectURL(f), im=new Image();
          im.onload=function(){ draw(im,im.naturalWidth,im.naturalHeight); URL.revokeObjectURL(url); };
          im.onerror=function(){ m2('请选择 2MB 以内的图片'); };
          im.src=url;
        }
      };
    };
    document.getElementById('me-nick-t').textContent=u.nickname||'谱友';
    document.getElementById('me-phone').textContent=u.phone||'';
    /* v59.4 创作者入口双通道：头部「创作者中心」按钮 + 可点徽章 → 同一 gotoCreator（定位并高亮卡片） */
    function gotoCreator(){
      var c=document.getElementById('me-creator');
      if(!c || c.hidden) return;
      try{ c.scrollIntoView({behavior:'smooth', block:'center'}); }catch(_){ c.scrollIntoView(); }
      c.classList.remove('cr-flash');
      void c.offsetWidth;            /* 重排以便连点两次也能重放高亮 */
      c.classList.add('cr-flash');
      setTimeout(function(){ c.classList.remove('cr-flash'); }, 1600);
    }
    function syncCreatorEntries(){
      var isCr = u.role==='creator';
      document.getElementById('me-cr-badge').hidden = !isCr;
      document.getElementById('me-gocr').hidden = !isCr;
    }
    syncCreatorEntries();
    document.getElementById('me-cr-badge').onclick = gotoCreator;
    document.getElementById('me-gocr').onclick = gotoCreator;
    /* 微信绑定状态（/api/me 的 user.wx 既有字段） */
    var wxSlot=document.getElementById('me-wx-slot'), opWx=document.getElementById('op-wx');
    if(u.wx){ wxSlot.innerHTML='<span class="wx-chip">微信已绑定</span>'; }
    else{
      healthP.then(function(){
        if(!(wxWeb||wxMp)) return;
        wxSlot.innerHTML='<button class="wx-chip" id="wx-bind">绑定微信</button>';
        opWx.hidden=false;
        var go=function(){ api(wxPath()+'?bind=1&return='+encodeURIComponent(location.origin+location.pathname))
          .then(function(r){ location.href=r.url; }).catch(function(e){ msg(e.message||'微信绑定发起失败'); }); };
        document.getElementById('wx-bind').onclick=go; opWx.onclick=go;
      });
    }
    /* 会员卡 */
    api('/me/entitlements').then(function(j){
      var el=document.getElementById('me-vip'), badge=document.getElementById('me-vip-badge');
      badge.hidden=false;
      if(j.vip){
        var e=(j.entitlements||[]).find(function(x){ return x.kind==='vip'; });
        var exp=e&&e.expires_at?('有效期至 '+FMT(e.expires_at)):'长期有效';
        badge.textContent='会员'; badge.classList.remove('free');
        el.innerHTML='<b>会员</b><p>'+esc(exp)+' · 云端曲谱 '+(j.quota|0)+' 首</p><a class="btn" href="//zhipu.puyouquan.com/">续费 →</a>';
      }else{
        el.innerHTML='<b>免费版</b><p>云端曲谱 '+(j.quota|0)+' 首<br>扩容云端曲谱，解锁专业功能</p><a class="btn ghost" style="padding:8px 16px;font-size:12.5px" href="//zhipu.puyouquan.com/">了解会员 →</a>';
      }
    }).catch(function(){ document.getElementById('me-vip').innerHTML='<b>会员状态</b><p>暂时无法获取</p>'; });
    /* 我的云端曲谱（共享 promise，创作者中心复用）+ 上次来过差异徽标（新键 pyq-me-seen） */
    var seen=0; try{ seen=+localStorage.getItem('pyq-me-seen')||0; }catch(_){}
    var scoresP=api('/scores');
    scoresP.then(function(j){
      var el=document.getElementById('sc-list'), list=(j.scores||[]).slice(0,8);
      el.innerHTML=list.length? list.map(function(s){
        return '<a class="pc-row" href="//zhipu.puyouquan.com/?mine='+encodeURIComponent(s.id)+'">'
          +'<span class="t">'+esc(s.title||'未命名曲谱')+(seen&&s.updated_at*1000>seen?'<span class="pc-new" title="上次来过之后有更新"></span>':'')+'</span>'
          +(s.status==='published'||s.status==='pub'?'<i class="k">已发布</i>':'')
          +'<span class="d">'+FMT(s.updated_at)+'</span></a>'; }).join('')
        : '<p class="pc-empty">还没有云端曲谱。</p><a class="btn" style="padding:9px 18px;font-size:13px" href="//zhipu.puyouquan.com/">去做第一份谱 →</a>';
      try{ localStorage.setItem('pyq-me-seen', String(Date.now())); }catch(_){}
    }).catch(function(){ document.getElementById('sc-list').innerHTML='<p class="pc-empty">列表暂时无法加载</p>'; });
    /* 创作者槽位：user=成为创作者卡；creator=创作者中心（已发布列表复用 scoresP，零新增请求） */
    function renderCreator(){
      var el=document.getElementById('me-creator'); el.hidden=false;
      if(u.role!=='creator'){
        el.innerHTML='<h3 class="me-h">创作者</h3>'
          +'<p class="cr-sub">发布曲谱到谱库，所有人都能弹到<br>免费开通，无需会员</p>'
          +'<button class="btn" id="cr-become" style="padding:9px 18px;font-size:13px">成为创作者</button>';
        document.getElementById('cr-become').onclick=function(){
          var self=this; self.disabled=true;
          api('/me/creator',{method:'POST'}).then(function(){
            u.role='creator'; syncCreatorEntries();   /* v59.4 开通即点亮徽章与头部按钮 */
            msg('创作者已开通，可去编辑器发布曲谱'); renderCreator();
          }).catch(function(e){ self.disabled=false; msg(e.message); });
        };
        return;
      }
      el.innerHTML='<h3 class="me-h">创作者中心<span class="lib-count" id="cr-count"></span><a class="pc-more" href="//zhipu.puyouquan.com/?pc=creator">去编辑器发布 →</a></h3>'
        +'<div class="pc-list" id="cr-list"><p class="pc-empty">加载中…</p></div>';
      scoresP.then(function(j){
        var pub=(j.scores||[]).filter(function(s){ return s.status==='published'||s.status==='pub'; });
        var c=document.getElementById('cr-count'); if(c) c.textContent=pub.length?('已发布 '+pub.length+' 首'):'';
        var l=document.getElementById('cr-list');
        l.innerHTML=pub.length? pub.slice(0,5).map(function(s){
          return '<a class="pc-row" href="//puku.puyouquan.com/kanpu.html?pub='+encodeURIComponent(s.id)+'">'
            +'<span class="t">'+esc(s.title||'未命名曲谱')+'</span><span class="pc-see">在谱库查看</span></a>'; }).join('')
          : '<p class="pc-empty"><b>还没发布过谱</b><br>在编辑器打开曲谱，点「发布」即可</p><a class="btn" style="padding:9px 18px;font-size:13px" href="//zhipu.puyouquan.com/?pc=creator">去发布第一份谱 →</a>';
      }).catch(function(){ document.getElementById('cr-list').innerHTML='<p class="pc-empty">列表暂时无法加载</p>'; });
    }
    renderCreator();
    /* 我的收藏：favorites 与 pub/scores 联查出完整卡片 */
    Promise.all([
      api('/favorites').catch(function(){ return {favorites:[]}; }),
      fetch('/api/pub/scores',{credentials:'include'}).then(function(r){ return r.ok? r.json():{scores:[]}; }).catch(function(){ return {scores:[]}; })
    ]).then(function(rs){
      var favIds={}; (rs[0].favorites||[]).forEach(function(f){ favIds[f.score_id||f.id||f]=1; });
      var cards=(rs[1].scores||[]).filter(function(s){ return favIds[s.id]; });
      var el=document.getElementById('fav-grid');
      el.dataset.ready='1'; el.innerHTML=cards.length? cards.map(PYQ_LIB.card).join('')
        : '<div class="lib-empty" style="padding:24px 0"><b>收藏夹还是空的</b>点 ♥ 收藏喜欢的谱，跨设备随时打开。<br><a class="btn ghost" href="index.html" style="margin-top:14px">去谱库逛逛 →</a></div>';
      var c=document.getElementById('fav-count'); if(c) c.textContent=cards.length? (cards.length+' 首'):'';
    });
    /* 账号操作 */
    document.getElementById('op-nick').onclick=function(){
      var nk=prompt('新昵称（1-24 个字符）', u.nickname||''); if(nk==null) return;
      nk=nk.trim(); if(!nk||nk.length>24) return msg('昵称需为 1-24 个字符');
      api('/me',{method:'PATCH',body:{nickname:nk}}).then(function(){ location.reload(); })
        .catch(function(e){ msg(e.message); });
    };
    document.getElementById('op-logout').onclick=function(){
      api('/auth/logout',{method:'POST'}).catch(function(){}).then(function(){ location.reload(); });
    };
    document.getElementById('op-logout-all').onclick=function(){
      if(!confirm('将退出所有已登录设备（包括本机），确定？')) return;
      api('/me/logout-all',{method:'POST'}).catch(function(){}).then(function(){ location.reload(); });
    };
  }

  api('/me').then(function(j){ showMe(j.user||{}); }).catch(function(){ showAuth(); });
})();
</script>
</body>
</html>
