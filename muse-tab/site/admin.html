<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>平台管理 · 谱友圈</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="pyq.css">
</head>
<body data-page="admin">
<div id="site-nav"></div>

<!-- 门卫：未登录/非管理员都停在这里；前端隐藏只是入口收敛，/api/admin/* 服务端逐条 requireAdmin 二次鉴权 -->
<main id="ad-gate" class="me-auth" hidden>
  <div class="auth-card">
    <div class="brand"><span class="mark" style="width:40px;height:40px;border-radius:12px"></span></div>
    <h2>平台管理</h2>
    <p class="lg-sub" id="gate-msg">正在确认身份…</p>
    <a class="lg-go" id="gate-go" href="me.html" style="display:block;text-align:center;text-decoration:none" hidden>去登录 →</a>
  </div>
</main>

<!-- v60.88 管理控制台（自 me.html 内嵌卡独立成页）：
     待审核/已上架/用户(详情)/兑换码/公告(历史+撤回)/订单/审计日志 七个页签 -->
<main id="ad-body" class="me-wrap" hidden>
  <header class="me-head">
    <div class="me-id">
      <h1 class="me-nick"><span>平台管理中心</span><span class="cr-badge ad-badge" style="display:inline-block">管理员</span></h1>
      <p class="me-sub" id="ad-sum"></p>
    </div>
    <div class="me-hbtns">
      <a class="btn me-gocr" href="me.html">← 个人中心</a>
      <a class="btn me-openzp" href="//zhipu.puyouquan.com/">打开编辑器</a>
    </div>
  </header>

  <section class="me-card ad-card">
    <div class="ad-stats" id="ad-stats"></div>
    <p class="ad-funnel" id="ad-funnel"></p>
    <div class="ad-tabs" id="ad-tabs">
      <button type="button" class="ad-tab on" data-ad="review">待审核<span class="ad-dot" id="ad-dot" hidden></span></button>
      <button type="button" class="ad-tab" data-ad="done">已上架</button>
      <button type="button" class="ad-tab" data-ad="users">用户</button>
      <button type="button" class="ad-tab" data-ad="courses">课程</button>
      <button type="button" class="ad-tab" data-ad="codes">兑换码</button>
      <button type="button" class="ad-tab" data-ad="bcast">公告</button>
      <button type="button" class="ad-tab" data-ad="orders">订单</button>
      <button type="button" class="ad-tab" data-ad="logs">审计日志</button>
    </div>
    <p class="ad-msg" id="ad-msg"></p>
    <div class="ad-pane" id="ad-pane"><p class="pc-empty">加载中…</p></div>
  </section>
</main>

<div id="site-foot"></div>
<script src="pyq.js"></script>
<script>
(function(){
  var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  function api(path,opts){ opts=opts||{};
    return fetch('/api'+path,{method:opts.method||'GET',credentials:'include',
      headers:opts.body?{'Content-Type':'application/json'}:{},body:opts.body?JSON.stringify(opts.body):undefined})
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){
        if(!r.ok){ var e=new Error(j.error||('请求失败（'+r.status+'）')); e.status=r.status; throw e; } return j; }); }); }
  var FMT=function(t){ if(!t) return '—'; var d=new Date(t*1000);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  var FMTS=function(t){ if(!t) return '—'; var d=new Date(t*1000);
    return FMT(t)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
  var adTab='review';
  function adMsg(t){ document.getElementById('ad-msg').textContent=t||''; }
  function adPane(html){ document.getElementById('ad-pane').innerHTML=html; }
  function adRole(r){ return r==='admin'?'管理员':(r==='creator'?'创作者':'普通用户'); }

  /* ---- 门卫 ---- */
  function gate(msgText, canLogin){
    document.getElementById('ad-gate').hidden=false;
    document.getElementById('ad-body').hidden=true;
    document.getElementById('gate-msg').textContent=msgText;
    document.getElementById('gate-go').hidden=!canLogin;
  }
  api('/me').then(function(j){
    var u=(j&&j.user)||{};
    if(u.role!=='admin') return gate('此页面仅平台管理员可用。', false);
    document.getElementById('ad-gate').hidden=true;
    document.getElementById('ad-body').hidden=false;
    boot();
  }).catch(function(){ gate('请先登录后再访问平台管理。', true); });

  /* ---- 概览 + 页签 ---- */
  function loadOverview(){
    api('/admin/overview').then(function(j){
      var r=j.roles||{}, o=j.orders||{};
      document.getElementById('ad-sum').textContent='待审 '+(j.pending|0)+' · 已上架 '+(j.published|0)+' · 用户 '+(j.users|0);
      document.getElementById('ad-stats').innerHTML=[
        ['用户', j.users|0, (r.creator|0)+' 创作者 · '+(r.admin|0)+' 管理员'],
        ['曲谱', j.scores|0, (j.published|0)+' 已上架'],
        ['待审核', j.pending|0, (j.pending?'需要处理':'队列已清空')],
        ['已支付订单', o.paid|0, '¥'+(((o.amount_fen|0)/100).toFixed(2))]
      ].map(function(t){ return '<div class="ad-stat"><b>'+t[1]+'</b><span>'+t[0]+'</span><i>'+esc(t[2])+'</i></div>'; }).join('');
      var d=document.getElementById('ad-dot');
      d.hidden=!(j.pending|0); d.textContent=j.pending|0;
      /* v60.88 近 7 日事件漏斗上墙（接口早就返回，此前从未展示） */
      var fn=(j.funnel||[]).slice(0,6).map(function(x){ return esc(x.name)+' '+x.n; }).join(' · ');
      document.getElementById('ad-funnel').textContent = fn? ('近 7 日事件：'+fn) : '';
    }).catch(function(e){ document.getElementById('ad-stats').innerHTML='<p class="pc-empty">概览暂时无法加载（'+esc(e.message||'')+'）</p>'; });
  }
  function boot(){
    loadOverview();
    Array.prototype.forEach.call(document.querySelectorAll('#ad-tabs .ad-tab'), function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(document.querySelectorAll('#ad-tabs .ad-tab'), function(x){ x.classList.toggle('on', x===b); });
        adTab=b.dataset.ad; adMsg('');
        crsLeave(adLoad);   /* v62.0 脏守卫：此前切页签直接覆写面板，编辑内容静默清空 */
      };
    });
    adLoad();
  }
  function adLoad(){
    adPane('<p class="pc-empty">加载中…</p>');
    if(adTab==='review') return adReviews('pending');
    if(adTab==='done')   return adReviews('published');
    if(adTab==='users')  return adUsers('');
    if(adTab==='courses')return adCourses();
    if(adTab==='codes')  return adCodes();
    if(adTab==='bcast')  return adBroadcast();
    if(adTab==='orders') return adOrders();
    return adLogs();
  }

  /* ---- 审核 / 已上架 ---- */
  function adReviews(status){
    api('/admin/reviews?status='+status).then(function(j){
      var rows=j.scores||[];
      if(!rows.length) return adPane('<p class="pc-empty">'+(status==='pending'?'待审核队列已清空 🎉':'还没有已上架的曲谱')+'</p>');
      adPane(rows.map(function(s){
        var acts=status==='pending'
          ? '<button class="ad-b ok" data-ok="'+esc(s.id)+'">通过</button><button class="ad-b no" data-no="'+esc(s.id)+'" data-t="'+esc(s.title||'')+'">驳回</button>'
          : '<button class="ad-b no" data-off="'+esc(s.id)+'">下架</button>';
        return '<div class="ad-row"><div class="ad-rmain">'
          +'<b>'+esc(s.title||'未命名曲谱')+'</b>'
          +'<small>'+esc(s.author||'佚名')+(s.phone?(' · '+esc(s.phone)):'')+' · '+FMTS(s.updated_at)
          +(s.review_note?(' · 上次驳回：'+esc(s.review_note)):'')+'</small></div>'
          +'<div class="ad-racts"><a class="ad-b" href="//zhipu.puyouquan.com/?review='+encodeURIComponent(s.id)+'" target="_blank" rel="noopener">预览谱面</a>'+acts+'</div></div>';
      }).join(''));
      var pane=document.getElementById('ad-pane');
      pane.querySelectorAll('[data-ok]').forEach(function(b){ b.onclick=function(){ adReview(b.dataset.ok,'approve',''); }; });
      pane.querySelectorAll('[data-no]').forEach(function(b){ b.onclick=function(){ rejectModal(b.dataset.no, b.dataset.t); }; });
      pane.querySelectorAll('[data-off]').forEach(function(b){ b.onclick=function(){
        if(!confirm('确定把这首谱从谱库下架？（回到创作者的私有状态，会站内信通知谱主）')) return;
        adReview(b.dataset.off,'unpublish',''); }; });
    }).catch(function(e){ adPane('<p class="pc-empty">'+esc(e.message||'列表加载失败')+'</p>'); });
  }
  /* v60.88 驳回弹窗替代 prompt：常用原因一键选 + 自由补充，原因会随站内信发给创作者 */
  var REJECTS=['谱面音符/节拍错误较多','歌词与旋律对位有误','曲谱信息不完整（标题/演唱者/调号）','与谱库已有曲谱重复','涉嫌侵权风险，请确认授权'];
  function rejectModal(id, title){
    var mk=document.createElement('div'); mk.className='pyq-mask'; mk.id='rj-mask';
    mk.innerHTML='<div class="pyq-modal"><h3>驳回《'+esc(title||'未命名曲谱')+'》</h3>'
      +'<p class="lg-sub">原因会通过站内信发给创作者（必填）</p>'
      +'<div class="ad-rjchips">'+REJECTS.map(function(t,i){ return '<button type="button" class="fchip" data-i="'+i+'">'+t+'</button>'; }).join('')+'</div>'
      +'<textarea id="rj-note" rows="3" maxlength="200" placeholder="驳回原因，可点上方常用原因快速填入后修改"></textarea>'
      +'<div class="btns"><button id="rj-x" class="btn ghost" style="padding:9px 16px;font-size:13px">取消</button>'
      +'<button id="rj-go" class="lg-go" style="margin:0;width:auto;padding:11px 22px">确认驳回</button></div></div>';
    document.body.appendChild(mk);
    mk.addEventListener('click',function(e){ if(e.target===mk) mk.remove(); });
    mk.querySelectorAll('.fchip').forEach(function(c){ c.onclick=function(){ document.getElementById('rj-note').value=REJECTS[+c.dataset.i]; }; });
    document.getElementById('rj-x').onclick=function(){ mk.remove(); };
    document.getElementById('rj-go').onclick=function(){
      var note=document.getElementById('rj-note').value.trim();
      if(!note) return adMsg('驳回必须填写原因');
      mk.remove(); adReview(id,'reject',note);
    };
  }
  function adReview(id, action, note){
    adMsg('处理中…');
    api('/admin/scores/'+encodeURIComponent(id)+'/review',{method:'POST',body:{action:action,note:note}})
      .then(function(){ adMsg(action==='approve'?'已通过并上架（已站内信通知谱主）':(action==='reject'?'已驳回，原因已站内信通知创作者':'已下架（已站内信通知谱主）')); loadOverview(); adLoad(); })
      .catch(function(e){ adMsg(e.message||'操作失败'); });
  }

  /* ---- 用户（v60.88 增详情展开：权益 / 订单 / 曲谱分状态计数）---- */
  function adUsers(kw){
    var head='<div class="ad-search"><input id="ad-q" placeholder="按手机号或昵称搜索" value="'+esc(kw)+'"><button class="ad-b" id="ad-qgo">搜索</button></div>';
    api('/admin/users'+(kw?('?q='+encodeURIComponent(kw)):'')).then(function(j){
      var rows=j.users||[];
      adPane(head+(rows.length? rows.map(function(x){
        return '<div class="ad-row" data-uid="'+esc(x.id)+'"><div class="ad-rmain"><b>'+esc(x.nickname||'谱友')+'</b>'
          +'<small>'+esc(x.phone||'（微信登录）')+' · 注册 '+FMT(x.created_at)+' · '+adRole(x.role)+'</small></div>'
          +'<div class="ad-racts">'
          +'<button class="ad-b" data-detail="'+esc(x.id)+'">详情</button>'
          +'<select class="ad-sel" data-role="'+esc(x.id)+'">'
          +['user','creator','admin'].map(function(r){ return '<option value="'+r+'"'+(x.role===r?' selected':'')+'>'+adRole(r)+'</option>'; }).join('')
          +'</select>'
          +'<button class="ad-b" data-grant="'+esc(x.id)+'">发权益</button>'
          +'<button class="ad-b no" data-revoke="'+esc(x.id)+'">撤权益</button></div></div>'
          +'<div class="ad-detail" id="dt-'+esc(x.id)+'" hidden></div>';
      }).join('') : '<p class="pc-empty">没有匹配的用户</p>'));
      var pane=document.getElementById('ad-pane');
      document.getElementById('ad-qgo').onclick=function(){ adUsers(document.getElementById('ad-q').value.trim()); };
      document.getElementById('ad-q').onkeydown=function(e){ if(e.key==='Enter') document.getElementById('ad-qgo').click(); };
      pane.querySelectorAll('[data-detail]').forEach(function(b){ b.onclick=function(){
        var box=document.getElementById('dt-'+b.dataset.detail);
        if(!box.hidden){ box.hidden=true; return; }
        box.hidden=false; box.innerHTML='<p class="pc-empty">加载中…</p>';
        api('/admin/users/'+encodeURIComponent(b.dataset.detail)+'/detail').then(function(d){
          var st=d.scores&&d.scores.byStatus||{};
          var ents=(d.entitlements||[]).map(function(e2){ return esc(e2.kind)+'（'+(e2.expires_at?('至 '+FMT(e2.expires_at)):'永久')+'）'; }).join('、')||'无';
          var ords=(d.orders||[]).map(function(o){ return FMT(o.created_at)+' '+esc(o.kind)+' ¥'+((o.amount_fen|0)/100).toFixed(2)+' '+esc(o.status); }).join('<br>')||'无';
          box.innerHTML='<div><b>曲谱</b> 共 '+(d.scores?d.scores.total:0)+' 首：已上架 '+(st.published|0)+' · 待审 '+(st.pending|0)+' · 驳回 '+(st.rejected|0)+' · 私有 '+(st.private|0)+'</div>'
            +'<div><b>权益</b> '+ents+'</div><div><b>订单</b> '+ords+'</div>';
        }).catch(function(e){ box.innerHTML='<p class="pc-empty">'+esc(e.message||'详情加载失败')+'</p>'; });
      }; });
      pane.querySelectorAll('[data-role]').forEach(function(s){ s.onchange=function(){
        var id=s.dataset.role, r=s.value;
        if(!confirm('确定把该用户的角色改为「'+adRole(r)+'」？')) return adUsers(kw);
        adMsg('处理中…');
        api('/admin/users/'+encodeURIComponent(id)+'/role',{method:'POST',body:{role:r}})
          .then(function(){ adMsg('角色已更新为 '+adRole(r)); adUsers(kw); })
          .catch(function(e){ adMsg(e.message||'角色修改失败'); adUsers(kw); });
      }; });
      pane.querySelectorAll('[data-grant]').forEach(function(b){ b.onclick=function(){
        var kind=prompt('权益类型（vip = 会员；pack_kaobian = 考编内容包）','vip'); if(kind==null) return;
        kind=kind.trim(); if(!kind) return;
        var days=prompt('有效天数（留空 = 永久）','365'); if(days==null) return;
        adMsg('处理中…');
        api('/admin/users/'+encodeURIComponent(b.dataset.grant)+'/grant',{method:'POST',body:{kind:kind,days:+days||0}})
          .then(function(j2){ adMsg('已发放 '+kind+'（'+(j2.expires_at?('到期 '+FMT(j2.expires_at)):'永久')+'）'); })
          .catch(function(e){ adMsg(e.message||'发放失败'); });
      }; });
      pane.querySelectorAll('[data-revoke]').forEach(function(b){ b.onclick=function(){
        var kind=prompt('要撤销的权益类型','vip'); if(kind==null) return;
        kind=kind.trim(); if(!kind) return;
        adMsg('处理中…');
        api('/admin/users/'+encodeURIComponent(b.dataset.revoke)+'/revoke',{method:'POST',body:{kind:kind}})
          .then(function(){ adMsg('已撤销 '+kind); }).catch(function(e){ adMsg(e.message||'撤销失败'); });
      }; });
    }).catch(function(e){ adPane(head+'<p class="pc-empty">'+esc(e.message||'加载失败')+'</p>'); });
  }

  /* ---- v60.90 课程发布工作台：列表 + 编辑器（章节=谱面+图文+练习任务）+ 发布/下架/删除 ----
     数据模型见 api/db.js courses 表；学习页（kecheng.html）以 /api/courses 为准即时生效。 */
  var CRS_INST={guitar:'吉他',piano:'钢琴',uku:'尤克里里',vocal:'唱歌/视唱',theory:'乐理/识谱',kids:'幼儿启蒙',other:'其他'};
  /* v62.1 章节主题插画：前台章头用矢量插画取代表情，作者在这里挑一张 */
  var CRS_ART={ scale:'音阶阶梯',key:'调号牌 1=C',octave:'八度点',beat:'拍子网格',dur:'增/减时线',
    rest:'休止与小节线',tie:'连线与反复',sing:'唱歌/话筒',hand:'手型/指法',guitar:'吉他',
    chord:'和弦图',strum:'扫弦',ear:'听辨',drum:'打击乐' };
  function adCourses(){
    api('/admin/courses').then(function(j){
      var rows=j.courses||[];
      adPane('<div class="ad-racts" style="justify-content:flex-end;margin-bottom:8px"><button class="ad-b ok" id="crs-new">＋ 新建课程</button></div>'
        +(rows.length? rows.map(function(c){
          /* v61.8 列表补内容体量：章节数与闯关题数一眼可见 */
          var st2={chs:0,qs:0};
          try{ var dd=JSON.parse(c.data||'{}'); st2.chs=(dd.chapters||[]).length;
            (dd.chapters||[]).forEach(function(ch){ st2.qs+=(ch.quiz||[]).length; }); }catch(_){}
          return '<div class="ad-row"><div class="ad-rmain"><b>'+esc(c.title)+'</b>'
            +'<small>'+esc(CRS_INST[c.instrument]||c.instrument||'—')+' · '+esc(c.level||'—')+' · '+(c.weeks|0)+' 周 · '
            +st2.chs+' 章'+(st2.qs?(' · '+st2.qs+' 题'):'')+' · 改于 '+FMT(c.updated_at)+'</small></div>'
            +'<div class="ad-racts">'+(c.status==='published'?'<i class="k k-ok">已发布</i>':'<i class="k k-wait">草稿</i>')
            +'<button class="ad-b" data-edit="'+esc(c.id)+'">编辑</button>'
            +(c.status==='published'
              ?'<button class="ad-b no" data-off="'+esc(c.id)+'">下架</button>'
              :'<button class="ad-b ok" data-pub="'+esc(c.id)+'">发布</button><button class="ad-b no" data-del="'+esc(c.id)+'">删除</button>')
            +'</div></div>'; }).join('')
          : '<p class="pc-empty">还没有课程，点「新建课程」开始。</p>'));
      var pane=document.getElementById('ad-pane');
      document.getElementById('crs-new').onclick=function(){ crsEdit(null); };
      pane.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick=function(){
        api('/admin/courses/'+encodeURIComponent(b.dataset.edit)).then(function(j2){ crsEdit(j2.course); })
          .catch(function(e){ adMsg(e.message||'读取失败'); }); }; });
      pane.querySelectorAll('[data-pub]').forEach(function(b){ b.onclick=function(){
        adMsg('发布中…');
        api('/admin/courses/'+encodeURIComponent(b.dataset.pub)+'/publish',{method:'POST'})
          .then(function(){ adMsg('已发布，学习页即时可见'); adCourses(); }).catch(function(e){ adMsg(e.message||'发布失败'); }); }; });
      pane.querySelectorAll('[data-off]').forEach(function(b){ b.onclick=function(){
        if(!confirm('下架这门课程？学习页将不再显示（内容保留为草稿）。')) return;
        adMsg('下架中…');
        api('/admin/courses/'+encodeURIComponent(b.dataset.off)+'/unpublish',{method:'POST'})
          .then(function(){ adMsg('已下架'); adCourses(); }).catch(function(e){ adMsg(e.message||'下架失败'); }); }; });
      pane.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){
        if(!confirm('永久删除这门草稿课程？不可恢复。')) return;
        api('/admin/courses/'+encodeURIComponent(b.dataset.del),{method:'DELETE'})
          .then(function(){ adMsg('已删除'); adCourses(); }).catch(function(e){ adMsg(e.message||'删除失败'); }); }; });
    }).catch(function(e){ adPane('<p class="pc-empty">'+esc(e.message||'加载失败')+'</p>'); });
  }
  /* v62.0 通用弹层（沿用站点 .pyq-mask/.pyq-modal 观感）：内容 + 回调接线；data-close 即关 */
  function adModal(html, wire){
    adModalClose();
    var mk=document.createElement('div'); mk.className='pyq-mask'; mk.id='ad-mask';
    mk.innerHTML='<div class="pyq-modal wide">'+html+'</div>';
    document.body.appendChild(mk);
    mk.addEventListener('click',function(e){ if(e.target===mk) adModalClose(); });
    mk.querySelectorAll('[data-close]').forEach(function(b){ b.onclick=adModalClose; });
    document.addEventListener('keydown',adModalEsc);
    if(wire) wire(mk.querySelector('.pyq-modal'));
  }
  function adModalEsc(e){ if(e.key==='Escape') adModalClose(); }
  function adModalClose(){
    var m=document.getElementById('ad-mask'); if(m) m.remove();
    document.removeEventListener('keydown',adModalEsc);
  }

  /* ===== v62.0 课程工作台（UI 专家规格）：大纲树 + 小节工作区 + 内容块卡片 + 实时预览 =====
     取代 v61.8 的「一堆 textarea 行格式」——2.0 的小节/内容块此前根本没有编辑入口。
     四层结构（课程→章→小节→三模块→内容块）：树只负责定位与体检，工作区一次只显示一节，
     编辑区滚动长度从 4000+px 降到一屏可控，重绘代价也从「整门课」降到「一节」。 */
  var CRS=null;   /* 当前工作台状态：{c, chs, sel:{ci,si}, dirty, saved} */

  function crsMintIds(chs){
    /* 小节稳定 id：学员进度键原先是「章下标.节下标」，在中间插一节会把之后所有人的
       星级/打卡/解锁整体错位一节。这里给每节铸 sid（前台 secList 读 sid||ci.si，老进度回落）。 */
    (chs||[]).forEach(function(ch){
      if(!ch.chid) ch.chid='c_'+Math.random().toString(36).slice(2,8);
      (ch.sections||[]).forEach(function(s){ if(!s.sid) s.sid='s_'+Math.random().toString(36).slice(2,8); });
    });
    return chs;
  }
  function crsCount(s){
    return { L:(((s.learn||{}).blocks)||[]).length, P:(((s.practice||{}).blocks)||[]).length,
             Q:(((s.test||{}).items)||[]).length };
  }
  function crsDirty(on){
    if(!CRS) return;
    CRS.dirty=on!==false;
    var el=document.getElementById('crs-state');
    if(el) el.innerHTML=CRS.dirty?'<b class="crs-dot"></b>未保存'
      :('已保存'+(CRS.saved?(' · '+CRS.saved):''));
    if(CRS.dirty) crsStash();
  }
  var crsStashT=null;
  function crsStash(){    /* 本机自动暂存：输入停 1.5s 落 localStorage，切页签/关窗都不丢 */
    clearTimeout(crsStashT);
    crsStashT=setTimeout(function(){
      if(!CRS) return;
      try{
        var raw=JSON.stringify({ savedAt:Date.now(), body:crsBody() });
        if(raw.length<1000000) localStorage.setItem('pyq-crs-draft:'+(CRS.c.id||'new'), raw);
      }catch(_){}
    },1500);
  }
  function crsBody(){
    var g=function(id){ var e=document.getElementById(id); return e?e.value:''; };
    return { title:g('crs-title').trim(), subtitle:g('crs-sub').trim(), instrument:g('crs-inst'),
      level:g('crs-level').trim(), weeks:+g('crs-weeks')||0, sort:+g('crs-sort')||0, intro:g('crs-intro').trim(),
      data:{ emoji:g('crs-emoji').trim()||'🎼', fam:g('crs-fam'), chapters:CRS.chs } };
  }

  /* ---------- 大纲树：定位 + 体检（每节三点＝学习/练习/测试有无内容） ---------- */
  function crsTree(){
    var out='', sel=CRS.sel;
    CRS.chs.forEach(function(ch,ci){
      var secs=ch.sections||[], bad=0;
      secs.forEach(function(s){ if(crsSecErrs(s).length) bad++; });
      out+='<div class="crs-tch'+(sel.ci===ci&&sel.si<0?' on':'')+'" data-selch="'+ci+'">'
        +'<span class="crs-tem">'+PYQ_KC.art(PYQ_KC.artFor(ch,ci))+'</span>'
        +'<span class="crs-tt">'+esc(ch.title||'（未命名章）')+'</span>'
        +'<span class="crs-tn">'+secs.length+' 节'+(bad?' <i class="crs-warn">⚠'+bad+'</i>':'')+'</span></div>';
      secs.forEach(function(s,si){
        var n=crsCount(s), errs=crsSecErrs(s);
        out+='<div class="crs-tsec'+(sel.ci===ci&&sel.si===si?' on':'')+'" data-sel="'+ci+'.'+si+'">'
          +'<span class="crs-tno">'+(ci+1)+'.'+(si+1)+'</span>'
          +'<span class="crs-tt">'+esc(s.title||'（未命名小节）')+'</span>'
          +'<span class="crs-dots" title="学习 '+n.L+' 块 · 练习 '+n.P+' 块 · 测试 '+n.Q+' 题">'
          +'<i class="'+(n.L?'on':'')+'"></i><i class="'+(n.P?'on':'')+'"></i><i class="'+(n.Q?'on':'')+'"></i></span>'
          +'<span class="crs-tcnt">'+n.L+'·'+n.P+'·'+n.Q+'</span>'
          +(errs.length?'<span class="crs-warn">⚠</span>':'')+'</div>';
      });
      out+='<button type="button" class="crs-tadd" data-addsec="'+ci+'">＋ 小节</button>';
    });
    return out+'<button type="button" class="crs-tadd crs-tadd2" data-addch>＋ 添加章</button>';
  }

  /* ---------- 校验：块与题目逐条判定（就地提示，不等保存） ---------- */
  function crsBlockErr(b){
    if(!b||!b.t) return '块类型缺失';
    if(b.t==='text') return String(b.md||'').trim()?'':'文字块内容为空';
    if(b.t==='jp'){
      var toks=String(b.line||'').trim().split(/\s+/).filter(Boolean);
      if(!toks.length) return '谱例为空';
      for(var i=0;i<toks.length;i++) if(!PYQ_KC.jpTokOk(toks[i]))
        return '第 '+(i+1)+' 个记号「'+toks[i]+'」不合法（音级只有 0-7，八度点写在时值符前）';
      return '';
    }
    if(b.t==='score') return (b.pubId||b.q)?'':'需填已发布谱 id 或搜索词';
    if(b.t==='image') return PYQ_KC.IMG_OK.test(String(b.src||''))?''
      :'图片地址不合白名单（站内 /img/x.png 或 https 链接，需 .png/.jpg/.jpeg/.webp/.svg 结尾）——不合法前台会直接消失';
    if(b.t==='video') return PYQ_KC.VID_OK.test(String(b.src||''))?''
      :'视频只支持站内自托管 mp4（/media/x.mp4 或 https://…puyouquan.com/….mp4）——不合法前台会直接消失';
    if(b.t==='code') return String(b.src||'').trim()?'':'代码内容为空';
    return '';
  }
  function crsQErr(t){
    if(!t) return '题目为空';
    if(!String(t.q||'').trim()) return '题干必填';
    var o=t.opts||[];
    if(o.length<2||o.length>4) return '选项需 2-4 个';
    for(var i=0;i<o.length;i++) if(!String(o[i]||'').trim()) return '第 '+(i+1)+' 个选项为空';
    if(!Number.isInteger(t.a)||t.a<0||t.a>=o.length) return '请标出一个正确答案';
    return '';
  }
  function crsSecErrs(s){
    var e=[];
    if(!String(s.title||'').trim()) e.push('小节标题必填');
    (((s.learn||{}).blocks)||[]).forEach(function(b,i){ var m=crsBlockErr(b); if(m) e.push('学习第 '+(i+1)+' 块：'+m); });
    (((s.practice||{}).blocks)||[]).forEach(function(b,i){ var m=crsBlockErr(b); if(m) e.push('练习第 '+(i+1)+' 块：'+m); });
    (((s.test||{}).items)||[]).forEach(function(t,i){ var m=crsQErr(t); if(m) e.push('第 '+(i+1)+' 题：'+m); });
    return e;
  }

  /* ---------- 内容块卡片 ---------- */
  var CRS_BT={ text:['文字','受限 Markdown'], jp:['谱例','整行简谱'], score:['互动谱','跳谱库/观看页'],
               image:['图片','png/jpg/webp/svg'], video:['视频','站内自托管 mp4'], code:['代码','等宽展示'] };
  function crsBlkForm(b,mod,i){
    var f='';
    if(b.t==='text') f='<textarea data-bf="md" rows="5" placeholder="支持：### 小标题 / - 列表 / > 引用 / **加粗** / [[1&#39; 2_ 3-]] 简谱记号">'+esc(b.md||'')+'</textarea>';
    else if(b.t==='jp') f='<input class="crs-mono" data-bf="line" value="'+esc(b.line||'')+'" placeholder="1 2 3 | 5 - ~ 5 ||（空格分隔；| 小节线 || 终止线 ~ 延音线）">'
      +'<div class="crs-jpk">'+['1','2','3','4','5','6','7','0',"'",',','-','_','=','.','|','||','~']
        .map(function(t){ return '<button type="button" data-jpk="'+esc(t)+'">'+esc(t)+'</button>'; }).join('')+'</div>'
      +'<input data-bf="cap" value="'+esc(b.cap||'')+'" placeholder="谱例说明（可空）">';
    else if(b.t==='score') f='<input data-bf="pubId" value="'+esc(b.pubId||'')+'" placeholder="已发布谱 id（优先）">'
      +'<input data-bf="q" value="'+esc(b.q||'')+'" placeholder="或：谱库搜索词（如 小星星）">'
      +'<input data-bf="title" value="'+esc(b.title||'')+'" placeholder="卡片标题（如《小星星》）">'
      +'<input data-bf="note" value="'+esc(b.note||'')+'" placeholder="一句话说明（可空）">';
    else if(b.t==='image') f='<input data-bf="src" value="'+esc(b.src||'')+'" placeholder="/img/x.png 或 https://…/x.jpg">'
      +'<input data-bf="cap" value="'+esc(b.cap||'')+'" placeholder="图注（可空）">';
    else if(b.t==='video') f='<input data-bf="src" value="'+esc(b.src||'')+'" placeholder="/media/x.mp4（只支持站内自托管 mp4）">'
      +'<input data-bf="poster" value="'+esc(b.poster||'')+'" placeholder="封面图地址（可空）">'
      +'<input data-bf="cap" value="'+esc(b.cap||'')+'" placeholder="视频说明（可空）">';
    else if(b.t==='code') f='<input data-bf="lang" value="'+esc(b.lang||'')+'" placeholder="语言标签（如 abc / musicxml，仅作标注）" style="max-width:220px">'
      +'<textarea class="crs-mono" data-bf="src" rows="5" spellcheck="false" placeholder="代码内容">'+esc(b.src||'')+'</textarea>';
    var err=crsBlockErr(b), meta=CRS_BT[b.t]||['未知',''];
    /* v62.1 块内预览只留谱例：文字/图片/视频/代码「写的就是看到的」，多一份渲染只是把表单挤长；
       谱例是唯一「输入记号 ≠ 屏幕字形」的类型，边写边看才有意义 */
    var showPv=b.t==='jp'&&!err;
    return '<div class="crs-blk'+(err?' is-bad':'')+'" data-mod="'+mod+'" data-bi="'+i+'">'
      +'<div class="crs-bh"><span class="crs-bt">'+esc(meta[0])+'</span>'
      +'<span class="crs-bsum">'+esc(crsBlkSum(b))+'</span>'
      +'<button type="button" data-bup title="上移">↑</button><button type="button" data-bdn title="下移">↓</button>'
      +'<button type="button" data-bdup title="复制">⧉</button><button type="button" data-bdel title="删除">✕</button></div>'
      +'<div class="crs-bbody">'+f
      +(err?'<p class="crs-err" role="alert">⚠ '+esc(err)+'</p>':'')
      +(showPv?('<div class="crs-pvin"><div class="kc-detail" data-fam="'+esc((CRS.c.data||{}).fam||'g')+'">'
        +PYQ_KC.blockHtml(b)+'</div></div>'):'')
      +'</div></div>';
  }
  function crsBlkSum(b){
    if(b.t==='text') return String(b.md||'').replace(/[#>*`-]/g,'').replace(/\s+/g,' ').slice(0,40);
    if(b.t==='jp') return b.line||'';
    if(b.t==='score') return b.title||b.pubId||b.q||'';
    if(b.t==='image'||b.t==='video') return b.src||'';
    if(b.t==='code') return (b.lang||'code')+' · '+String(b.src||'').slice(0,28);
    return '';
  }
  function crsQCard(t,i){
    var err=crsQErr(t);
    return '<div class="crs-q'+(err?' is-bad':'')+'" data-qi="'+i+'">'
      +'<div class="crs-qh"><span class="crs-qno">'+(i+1)+'</span>'
      +'<span class="crs-bsum">'+esc(String(t.q||'').slice(0,36))+'</span>'
      +'<button type="button" data-qup title="上移">↑</button><button type="button" data-qdn title="下移">↓</button>'
      +'<button type="button" data-qdup title="复制">⧉</button><button type="button" data-qdel title="删除">✕</button></div>'
      +'<div class="crs-bbody"><textarea data-qf="q" rows="2" placeholder="题干（可用 [[3]] 写简谱记号）">'+esc(t.q||'')+'</textarea>'
      +'<div class="crs-opts">'+(t.opts||[]).map(function(o,oi){
          return '<label class="crs-opt'+(t.a===oi?' on':'')+'">'
            +'<input type="radio" name="crsq'+i+'" data-qa="'+oi+'"'+(t.a===oi?' checked':'')+' aria-label="标为正确答案">'
            +'<input type="text" data-qo="'+oi+'" value="'+esc(o||'')+'" placeholder="选项 '+(oi+1)+'">'
            +'<button type="button" data-qodel="'+oi+'" title="删除选项"'+((t.opts||[]).length<=2?' disabled':'')+'>✕</button></label>';
        }).join('')+'</div>'
      +'<button type="button" class="crs-optadd" data-qoadd'+((t.opts||[]).length>=4?' disabled title="最多 4 个选项"':'')+'>＋ 添加选项</button>'
      +'<input data-qf="why" value="'+esc(t.why||'')+'" placeholder="解析：答错后展示（建议填）">'
      +(err?'<p class="crs-err" role="alert">⚠ '+esc(err)+'</p>':'')+'</div></div>';
  }

  /* ---------- 小节工作区：三模块分段（不用页签——三者互相引用，隔屏就得靠记忆） ---------- */
  function crsMain(){
    var sel=CRS.sel, ch=CRS.chs[sel.ci];
    if(!ch) return '<p class="pc-empty">先在左侧添加一章。</p>';
    if(sel.si<0){   /* 章节点：章级字段 + 1.0 升级入口 */
      var is10=!(ch.sections||[]).length && ((ch.points||[]).length||ch.task||(ch.quiz||[]).length);
      return '<div class="crs-secbar"><b>第 '+(sel.ci+1)+' 章</b><span class="crs-bc">章信息</span></div>'
        +'<div class="crs-pane"><div class="ad-search" style="margin:0 0 10px">'
        +'<input data-chf="title" value="'+esc(ch.title||'')+'" placeholder="章标题（必填）"></div>'
        +'<input data-chf="goal" value="'+esc(ch.goal||'')+'" placeholder="本章目标（一句话，前台章头显示）">'
        /* 章头插画：换图即时在右侧预览块看到（前台章头就是这张图） */
        +'<div class="crs-artrow"><span class="crs-artpv">'+PYQ_KC.art(PYQ_KC.artFor(ch,sel.ci))+'</span>'
        +'<label class="crs-artlb">章头插画<select class="ad-sel" data-chf="art">'
        +Object.keys(CRS_ART).map(function(k){
            return '<option value="'+k+'"'+(PYQ_KC.artFor(ch,sel.ci)===k?' selected':'')+'>'+CRS_ART[k]+'</option>'; }).join('')
        +'</select></label></div>'
        +(is10?('<p class="crs-live">⚠ 本章还是 1.0 结构（内容点/任务/闯关题），而课程已用小节结构——'
          +'<b>前台只渲染小节，这些内容不会显示</b>。<button type="button" class="ad-b ok" id="crs-up10">一键升级为小节</button></p>'):'')
        +'<div class="crs-chacts"><button type="button" class="ad-b" data-chup2>↑ 上移章</button>'
        +'<button type="button" class="ad-b" data-chdn2>↓ 下移章</button>'
        +'<button type="button" class="ad-b no" data-chdel2>删除本章</button></div></div>';
    }
    var s=(ch.sections||[])[sel.si]; if(!s) return '<p class="pc-empty">这一节不存在。</p>';
    var n=crsCount(s);
    /* v62.1 加块入口收敛：常用三类直接给按钮（此前统一弹一个六选一弹窗，
       加一段文字要「点添加 → 等弹窗 → 选类型 → 关弹窗」四步），其余进「更多」下拉 */
    var addBtns=function(key){
      return '<span class="crs-add"><button type="button" class="ad-b" data-addblk="'+key+'" data-bt="text">＋ 文字</button>'
        +'<button type="button" class="ad-b" data-addblk="'+key+'" data-bt="jp">＋ 谱例</button>'
        +'<button type="button" class="ad-b" data-addblk="'+key+'" data-bt="image">＋ 图片</button>'
        +'<span class="crs-more"><button type="button" class="ad-b" data-moretog aria-expanded="false">更多 ▾</button>'
        +'<span class="crs-morem" hidden>'
        +['score','video','code'].map(function(t){
            return '<button type="button" data-addblk="'+key+'" data-bt="'+t+'">'+CRS_BT[t][0]
              +'<small>'+CRS_BT[t][1]+'</small></button>'; }).join('')
        +'</span></span></span>';
    };
    var mod=function(key,ic,name,cnt,inner,extra){
      return '<div class="crs-mod" data-modsec="'+key+'"><div class="crs-modh"><span class="crs-modic">'+ic+'</span>'
        +name+'<span class="crs-modn">'+cnt+'</span><span style="flex:1"></span>'+(extra||'')
        +(key==='test'?'':addBtns(key))+'</div>'+inner+'</div>';
    };
    return '<div class="crs-secbar"><b>'+(sel.ci+1)+'.'+(sel.si+1)+'</b>'
      +'<span class="crs-bc">'+esc(ch.title||'')+'</span>'
      +'<span class="crs-chips"><i'+(n.L?'':' class="off"')+'>'+PYQ_KC.icon('learn')+n.L+'</i><i'+(n.P?'':' class="off"')+'>'+PYQ_KC.icon('prac')+n.P+'</i><i'+(n.Q?'':' class="off"')+'>'+PYQ_KC.icon('test')+n.Q+'</i></span>'
      +'<span style="flex:1"></span>'
      +'<button type="button" class="ad-b" data-secprev>‹ 上一节</button>'
      +'<button type="button" class="ad-b" data-secnext>下一节 ›</button>'
      +'<button type="button" class="ad-b no" data-secdel>删除本节</button></div>'
      +'<div class="crs-pane">'
      +'<input class="crs-sect" data-secf="title" value="'+esc(s.title||'')+'" placeholder="小节标题（前台标题行，必填）">'
      +mod('learn',PYQ_KC.icon('learn'),'学习',n.L+' 块',(((s.learn||{}).blocks)||[]).map(function(b,i){ return crsBlkForm(b,'learn',i); }).join('')
          ||'<p class="crs-none">还没有内容块，点右上「＋ 添加块」。</p>')
      +mod('prac',PYQ_KC.icon('prac'),'练习',n.P+' 块',(((s.practice||{}).blocks)||[]).map(function(b,i){ return crsBlkForm(b,'prac',i); }).join('')
          +'<input data-secf="ptip" value="'+esc((s.practice||{}).tip||'')+'" placeholder="练习提示（前台单独一行，可空）">'
          +'<label class="crs-ck"><input type="checkbox" data-secf="checkin"'+(((s.practice||{}).checkin)!==false?' checked':'')+'> 显示每日打卡按钮</label>'
          /* v62.2 录音练习：学员录一段回放对照（录音只在学员本机，不上传） */
          +'<label class="crs-ck"><input type="checkbox" data-secf="record"'+(((s.practice||{}).record)?' checked':'')+'> 显示录音练习</label>'
          +'<input data-secf="recordTip" value="'+esc((s.practice||{}).recordTip||'')+'" placeholder="录音任务说明（如：唱一遍 1-7 录下来，回放对照唱名）">')
      +mod('test',PYQ_KC.icon('test'),'测试',n.Q+' 题',
          '<p class="crs-none">'+(n.Q?('本节 '+n.Q+' 题 · 最多允许错 '+Math.max(0,Math.min(2,n.Q-Math.ceil(n.Q*0.5)))+' 题通关（满分 5 星，每错 1 题 −1 星，★★★ 通关）'):'还没有题目——没有题目的小节改为「打卡即通过」。')+'</p>'
          +(((s.test||{}).items)||[]).map(crsQCard).join(''),
          '<button type="button" class="ad-b" data-qimport>批量导入</button><button type="button" class="ad-b" data-qadd>＋ 添加题</button>')
      +'</div>';
  }
  /* v62.1 预览＝主区整节前台视图（与学习页同一套渲染器与样式，含学/练/测三页签的静态形态） */
  function crsPreview(){
    var ch=CRS.chs[CRS.sel.ci]||{}, s=(ch.sections||[])[CRS.sel.si];
    if(!s) return '<p class="crs-none">选中一个小节后可预览。</p>';
    var fam=esc((CRS.c.data||{}).fam||'g'), K=PYQ_KC;
    var items=(((s.test||{}).items)||[]);
    return '<div class="crs-pvwide">'
      +'<div class="crs-pvh">前台预览 · 第 '+(CRS.sel.ci+1)+'.'+(CRS.sel.si+1)+' 节'
      +'<span style="flex:1"></span>'
      +'<button type="button" class="ad-b" data-pvfull>在学习页打开整课草稿 ↗</button></div>'
      +'<div class="kc-detail crs-pvbody kcp" data-fam="'+fam+'">'
      +'<section class="kcs kcs--now is-open">'
      +'<div class="kcs-head"><span class="kcs-no">'+(CRS.sel.ci+1)+'.'+(CRS.sel.si+1)+'</span>'
      +'<span class="kcs-t">'+esc(s.title||'（未命名小节）')+'</span></div>'

        +((s.practice||{}).record?('<p class="kcm-note">🎙 本节显示录音练习'
          +((s.practice||{}).recordTip?('：'+K.esc(s.practice.recordTip)):'')+'</p>'):'')+'</div>'

  function crsDraw(part){
    if(part!=='main'){ var t=document.getElementById('crs-tree'); if(t) t.innerHTML=crsTree(); }
    var m=document.getElementById('crs-main');
    if(m) m.innerHTML=(CRS.mode==='pv')?crsPreview():crsMain();
    crsWire();
  }
  function crsSec(){ var ch=CRS.chs[CRS.sel.ci]||{}; return (ch.sections||[])[CRS.sel.si]; }
  function crsBlocks(mod){
    var s=crsSec(); if(!s) return [];
    if(mod==='learn'){ s.learn=s.learn||{}; s.learn.blocks=s.learn.blocks||[]; return s.learn.blocks; }
    s.practice=s.practice||{}; s.practice.blocks=s.practice.blocks||[]; return s.practice.blocks;
  }
  function crsItems(){ var s=crsSec(); if(!s) return []; s.test=s.test||{}; s.test.items=s.test.items||[]; return s.test.items; }

  function crsWire(){
    var root=document.getElementById('crs-wb'); if(!root) return;
    var mark=function(){ crsDirty(true); };
    /* 树 */
    root.querySelectorAll('[data-selch]').forEach(function(e){ e.onclick=function(){
      CRS.sel={ci:+e.getAttribute('data-selch'),si:-1}; crsDraw(); }; });
    root.querySelectorAll('[data-sel]').forEach(function(e){ e.onclick=function(){
      var p=e.getAttribute('data-sel').split('.'); CRS.sel={ci:+p[0],si:+p[1]}; crsDraw(); }; });
    root.querySelectorAll('[data-addsec]').forEach(function(e){ e.onclick=function(){
      var ci=+e.getAttribute('data-addsec'), ch=CRS.chs[ci];
      ch.sections=ch.sections||[];
      ch.sections.push({ sid:'s_'+Math.random().toString(36).slice(2,8), title:'新小节',
        learn:{blocks:[]}, practice:{blocks:[],tip:'',checkin:true}, test:{items:[]} });
      CRS.sel={ci:ci,si:ch.sections.length-1}; mark(); crsDraw(); }; });
    var addch=root.querySelector('[data-addch]');
    if(addch) addch.onclick=function(){
      CRS.chs.push({ chid:'c_'+Math.random().toString(36).slice(2,8), emoji:'📘', title:'新章', goal:'', sections:[] });
      CRS.sel={ci:CRS.chs.length-1,si:-1}; mark(); crsDraw(); };
    /* 章级字段 */
    root.querySelectorAll('[data-chf]').forEach(function(e){
      var apply=function(){
        var f=e.getAttribute('data-chf');
        CRS.chs[CRS.sel.ci][f]=e.value; mark();
        if(f==='art'){    /* 换插画：就地换掉预览那张图，不整块重绘（重绘会丢焦点） */
          var pv=root.querySelector('.crs-artpv');
          if(pv) pv.innerHTML=PYQ_KC.art(e.value);
        }
        var t=document.getElementById('crs-tree'); if(t) t.innerHTML=crsTree(); crsWire();
      };
      e.oninput=apply; e.onchange=apply;
    });
    var up10=root.querySelector('#crs-up10');
    if(up10) up10.onclick=function(){
      var ch=CRS.chs[CRS.sel.ci], bl=[];
      if((ch.points||[]).length) bl.push({t:'text',md:ch.points.map(function(p){ return '- '+p; }).join('\n')});
      (ch.links||[]).forEach(function(l){ bl.push({t:'score',q:'',title:l.t,note:'',pubId:''}); });
      ch.sections=[{ sid:'s_'+Math.random().toString(36).slice(2,8), title:ch.title||'本章内容',
        learn:{blocks:bl}, practice:{blocks:ch.task?[{t:'text',md:ch.task}]:[],tip:'',checkin:true},
        test:{items:(ch.quiz||[]).map(function(q){ return {kind:'choice',q:q.q,opts:q.opts,a:q.a,why:q.why||''}; })} }];
      delete ch.points; delete ch.task; delete ch.links; delete ch.quiz;
      CRS.sel={ci:CRS.sel.ci,si:0}; mark(); crsDraw();
      adMsg('已升级为小节结构，请核对内容');
    };
    ['chup2','chdn2','chdel2'].forEach(function(k){
      var b=root.querySelector('[data-'+k+']'); if(!b) return;
      b.onclick=function(){
        var i=CRS.sel.ci;
        if(k==='chup2'&&i>0){ var t=CRS.chs[i-1]; CRS.chs[i-1]=CRS.chs[i]; CRS.chs[i]=t; CRS.sel.ci=i-1; }
        else if(k==='chdn2'&&i<CRS.chs.length-1){ var t2=CRS.chs[i+1]; CRS.chs[i+1]=CRS.chs[i]; CRS.chs[i]=t2; CRS.sel.ci=i+1; }
        else if(k==='chdel2'){ if(!confirm('删除第 '+(i+1)+' 章及其全部小节？')) return;
          CRS.chs.splice(i,1); CRS.sel={ci:Math.max(0,i-1),si:-1}; }
        mark(); crsDraw(); };
    });
    /* 小节字段 */
    root.querySelectorAll('[data-secf]').forEach(function(e){
      var f=e.getAttribute('data-secf');
      var h=function(){
        var s=crsSec(); if(!s) return;
        if(f==='title'){ s.title=e.value; var t=document.getElementById('crs-tree'); if(t){ t.innerHTML=crsTree(); crsWire(); } }
        else if(f==='ptip'){ s.practice=s.practice||{}; s.practice.tip=e.value; }
        else if(f==='checkin'){ s.practice=s.practice||{}; s.practice.checkin=e.checked; }
        else if(f==='record'){ s.practice=s.practice||{}; s.practice.record=e.checked; }
        else if(f==='recordTip'){ s.practice=s.practice||{}; s.practice.recordTip=e.value; }
        mark();
      };
      e.oninput=h; e.onchange=h;
    });
    ['secprev','secnext','secdel'].forEach(function(k){
      var b=root.querySelector('[data-'+k+']'); if(!b) return;
      b.onclick=function(){
        var flat=[], ci, si;
        CRS.chs.forEach(function(ch,c2){ (ch.sections||[]).forEach(function(s,s2){ flat.push([c2,s2]); }); });
        var at=-1; flat.forEach(function(p,i){ if(p[0]===CRS.sel.ci&&p[1]===CRS.sel.si) at=i; });
        if(k==='secprev'&&at>0){ CRS.sel={ci:flat[at-1][0],si:flat[at-1][1]}; crsDraw(); return; }
        if(k==='secnext'&&at>=0&&at<flat.length-1){ CRS.sel={ci:flat[at+1][0],si:flat[at+1][1]}; crsDraw(); return; }
        if(k==='secdel'){
          if(!confirm('删除这一小节？已发布课程会打乱学员在此之后的进度。')) return;
          CRS.chs[CRS.sel.ci].sections.splice(CRS.sel.si,1);
          CRS.sel={ci:CRS.sel.ci,si:Math.max(-1,CRS.sel.si-1)}; mark(); crsDraw();
        }
      };
    });
    /* 内容块：类型直接写在按钮上，点一下就加（v62.1 撤销六选一弹窗） */
    root.querySelectorAll('[data-addblk]').forEach(function(e){ e.onclick=function(){
      var t=e.getAttribute('data-bt')||'text', b={t:t};
      if(t==='text') b.md=''; else if(t==='jp'){ b.line=''; b.cap=''; }
      else if(t==='score'){ b.q=''; b.title=''; b.note=''; }
      else if(t==='image'||t==='video'){ b.src=''; b.cap=''; }
      else if(t==='code'){ b.lang='text'; b.src=''; }
      crsBlocks(e.getAttribute('data-addblk')).push(b); mark(); crsDraw('main');
      var last=root.querySelectorAll('.crs-mod[data-modsec="'+e.getAttribute('data-addblk')+'"] .crs-blk');
      var el=last[last.length-1], inp=el&&el.querySelector('textarea,input');
      if(el) el.scrollIntoView({block:'nearest'});
      if(inp) inp.focus();
    }; });
    var pvf=root.querySelector('[data-pvfull]');
    if(pvf) pvf.onclick=function(){
      var idEl=document.getElementById('crs-id'), id=(idEl?idEl.value.trim():'')||'crs-preview';
      try{ localStorage.setItem('pyq-crs-preview', JSON.stringify(Object.assign({id:id}, crsBody()))); }catch(_){}
      window.open('kecheng.html?preview=1','_blank');
    };
    root.querySelectorAll('[data-moretog]').forEach(function(e){ e.onclick=function(){
      var m=e.nextElementSibling, on=m.hidden;
      root.querySelectorAll('.crs-morem').forEach(function(x){ x.hidden=true; });
      root.querySelectorAll('[data-moretog]').forEach(function(x){ x.setAttribute('aria-expanded','false'); });
      m.hidden=!on; e.setAttribute('aria-expanded', on?'true':'false');
    }; });
    root.querySelectorAll('.crs-blk').forEach(function(card){
      var mod=card.getAttribute('data-mod'), i=+card.getAttribute('data-bi'), arr=crsBlocks(mod);
      card.querySelectorAll('[data-bf]').forEach(function(e){
        e.oninput=function(){ arr[i][e.getAttribute('data-bf')]=e.value; mark();
          var pv=card.querySelector('.crs-pvin .kc-detail');
          var er=crsBlockErr(arr[i]);
          if(pv) pv.innerHTML=er?'':PYQ_KC.blockHtml(arr[i]);
          card.classList.toggle('is-bad',!!er);
          var eb=card.querySelector('.crs-err');
          if(er){ if(eb) eb.textContent='⚠ '+er; else { var p=document.createElement('p'); p.className='crs-err'; p.setAttribute('role','alert'); p.textContent='⚠ '+er; card.querySelector('.crs-bbody').insertBefore(p, card.querySelector('.crs-pvin')); } }
          else if(eb) eb.remove();
          var sm=card.querySelector('.crs-bsum'); if(sm) sm.textContent=crsBlkSum(arr[i]);
          var p2=document.getElementById('crs-pv'); if(p2) p2.innerHTML=crsPreview();
        };
      });
      card.querySelectorAll('[data-jpk]').forEach(function(k){ k.onclick=function(){
        var inp=card.querySelector('[data-bf="line"]'); if(!inp) return;
        var v=inp.value, tok=k.getAttribute('data-jpk');
        inp.value=(v&&!/\s$/.test(v)?v+' ':v)+tok; inp.dispatchEvent(new Event('input')); inp.focus();
      }; });
      var act=function(sel,fn){ var b=card.querySelector(sel); if(b) b.onclick=function(){ fn(); mark(); crsDraw('main'); }; };
      act('[data-bup]',function(){ if(i>0){ var t=arr[i-1]; arr[i-1]=arr[i]; arr[i]=t; } });
      act('[data-bdn]',function(){ if(i<arr.length-1){ var t=arr[i+1]; arr[i+1]=arr[i]; arr[i]=t; } });
      act('[data-bdup]',function(){ arr.splice(i+1,0,JSON.parse(JSON.stringify(arr[i]))); });
      act('[data-bdel]',function(){ CRS.undo={kind:'blk',mod:mod,i:i,v:arr[i]}; arr.splice(i,1); crsToast('已删除 1 个块'); });
    });
    /* 题目 */
    var qadd=root.querySelector('[data-qadd]');
    if(qadd) qadd.onclick=function(){ crsItems().push({kind:'choice',q:'',opts:['',''],a:0,why:''}); mark(); crsDraw('main'); };
    var qimp=root.querySelector('[data-qimport]');
    if(qimp) qimp.onclick=crsImport;
    root.querySelectorAll('.crs-q').forEach(function(card){
      var i=+card.getAttribute('data-qi'), items=crsItems(), t=items[i];
      var redraw=function(){ mark(); crsDraw('main'); };
      card.querySelectorAll('[data-qf]').forEach(function(e){ e.oninput=function(){ t[e.getAttribute('data-qf')]=e.value; mark();
        var sm=card.querySelector('.crs-bsum'); if(sm) sm.textContent=String(t.q||'').slice(0,36); }; });
      card.querySelectorAll('[data-qo]').forEach(function(e){ e.oninput=function(){ t.opts[+e.getAttribute('data-qo')]=e.value; mark(); }; });
      card.querySelectorAll('[data-qa]').forEach(function(e){ e.onchange=function(){ t.a=+e.getAttribute('data-qa'); redraw(); }; });
      card.querySelectorAll('[data-qodel]').forEach(function(e){ e.onclick=function(){
        var oi=+e.getAttribute('data-qodel');
        if(t.opts.length<=2) return;
        t.opts.splice(oi,1); if(t.a>=t.opts.length) t.a=0; redraw(); }; });
      var oadd=card.querySelector('[data-qoadd]');
      if(oadd) oadd.onclick=function(){ if(t.opts.length<4){ t.opts.push(''); redraw(); } };
      var qact=function(sel,fn){ var b=card.querySelector(sel); if(b) b.onclick=function(){ fn(); redraw(); }; };
      qact('[data-qup]',function(){ if(i>0){ var x=items[i-1]; items[i-1]=items[i]; items[i]=x; } });
      qact('[data-qdn]',function(){ if(i<items.length-1){ var x=items[i+1]; items[i+1]=items[i]; items[i]=x; } });
      qact('[data-qdup]',function(){ items.splice(i+1,0,JSON.parse(JSON.stringify(items[i]))); });
      qact('[data-qdel]',function(){ CRS.undo={kind:'q',i:i,v:items[i]}; items.splice(i,1); crsToast('已删除 1 道题'); });
    });
  }
  function crsToast(msg){
    var old=document.getElementById('crs-toast'); if(old) old.remove();
    var d=document.createElement('div'); d.id='crs-toast'; d.className='crs-toast'; d.setAttribute('role','status');
    d.innerHTML=esc(msg)+' <button type="button">撤销</button>';
    document.body.appendChild(d);
    d.querySelector('button').onclick=function(){
      var u=CRS.undo; if(!u) return;
      if(u.kind==='blk') crsBlocks(u.mod).splice(u.i,0,u.v);
      else crsItems().splice(u.i,0,u.v);
      CRS.undo=null; d.remove(); crsDirty(true); crsDraw('main');
    };
    setTimeout(function(){ if(d.parentNode) d.remove(); },5000);
  }
  /* v62.1 crsPickType（六选一弹窗）已撤：块类型直接写在「＋ 文字 / ＋ 谱例 / ＋ 图片 / 更多」按钮上 */
  /* 批量导入：一行一题 题干|选项…|答案序号|解析（沿用 1.0 行格式，存量题可直接粘） */
  function crsImport(){
    adModal('<h3>批量导入题目</h3>'
      +'<p class="crs-none">每行一题：<b>题干|选项1|选项2|…|答案序号|解析</b>（答案序号从 1 起，解析可空）。也可从表格直接粘贴（Tab 分隔）。</p>'
      +'<textarea id="crs-imp" rows="8" class="crs-mono" placeholder="数字 5 的唱名是？|do|mi|sol|si|3|1-7 依次是 do re mi fa sol la si"></textarea>'
      +'<div id="crs-imprep" class="crs-imprep"></div>'
      +'<div class="ad-racts"><label class="crs-ck"><input type="checkbox" id="crs-impmode"> 替换本节全部题目</label>'
      +'<span style="flex:1"></span><button class="ad-b" data-close>取消</button>'
      +'<button class="ad-b ok" id="crs-impgo">导入合法行</button></div>', function(box){
      var ta=box.querySelector('#crs-imp'), rep=box.querySelector('#crs-imprep'), parsed=[];
      var parse=function(){
        parsed=ta.value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean).map(function(line){
          var ps=line.split(/\t|\|/).map(function(s){ return s.trim(); }), ai=-1, k;
          for(k=ps.length-1;k>=1;k--) if(/^[1-9][0-9]*$/.test(ps[k])){ ai=k; break; }
          if(ai<3) return {bad:'格式不对（至少 题干+2 选项+答案序号）',raw:line};
          var opts=ps.slice(1,ai), a=(+ps[ai])-1, why=ps.slice(ai+1).join('|');
          var t={kind:'choice',q:ps[0],opts:opts,a:a,why:why};
          var e=crsQErr(t); return e?{bad:e,raw:line}:t;
        });
        rep.innerHTML=parsed.length?('<table class="crs-imptb"><tr><th>#</th><th>题干</th><th>选项</th><th>答案</th><th>状态</th></tr>'
          +parsed.map(function(p,i){
            return '<tr class="'+(p.bad?'bad':'')+'"><td>'+(i+1)+'</td><td>'+esc((p.q||p.raw||'').slice(0,20))+'</td>'
              +'<td>'+(p.opts?p.opts.length:'-')+'</td><td>'+(p.bad?'-':(p.a+1))+'</td>'
              +'<td>'+(p.bad?('✗ '+esc(p.bad)):'✓')+'</td></tr>'; }).join('')+'</table>'):'';
      };
      ta.oninput=parse;
      box.querySelector('#crs-impgo').onclick=function(){
        var ok=parsed.filter(function(p){ return !p.bad; });
        if(!ok.length) return adMsg('没有可导入的合法行');
        var items=crsItems();
        if(box.querySelector('#crs-impmode').checked) items.length=0;
        ok.forEach(function(t){ items.push(t); });
        adModalClose(); crsDirty(true); crsDraw('main'); adMsg('已导入 '+ok.length+' 道题');
      };
    });
  }
  /* 发布前校验清单：逐节齐备度 + 阻塞项 + 体量条 */
  function crsCheck(){
    var hard=[], soft=[], n=0, ok=0;
    if(!/^[a-z0-9-]{3,48}$/.test((document.getElementById('crs-id')||{}).value||'')) hard.push('课程 id 需为 3-48 位小写字母/数字/连字符');
    if(!((document.getElementById('crs-title')||{}).value||'').trim()) hard.push('课程标题必填');
    if(!CRS.chs.length) hard.push('至少需要 1 章');
    CRS.chs.forEach(function(ch,ci){
      if(!String(ch.title||'').trim()) hard.push('第 '+(ci+1)+' 章缺标题');
      var secs=ch.sections||[];
      if(!secs.length && !((ch.points||[]).length||ch.quiz)) soft.push('第 '+(ci+1)+' 章没有小节');
      if(!secs.length && ((ch.points||[]).length||ch.task||(ch.quiz||[]).length)) soft.push('第 '+(ci+1)+' 章仍是 1.0 结构，前台不会显示（建议一键升级）');
      secs.forEach(function(s,si){
        n++;
        var e=crsSecErrs(s), c=crsCount(s);
        if(e.length) hard.push('第 '+(ci+1)+'.'+(si+1)+' 节：'+e[0]); else ok++;
        if(!c.L) soft.push('第 '+(ci+1)+'.'+(si+1)+' 节没有学习内容');
        if(c.Q&&c.Q<3) soft.push('第 '+(ci+1)+'.'+(si+1)+' 节只有 '+c.Q+' 题，容易蒙过');
      });
    });
    var raw=JSON.stringify({emoji:'',fam:'',chapters:CRS.chs}).length;
    if(raw>200*1024) hard.push('课程内容超过 200KB 上限（当前 '+raw+' 字符）');
    return { hard:hard, soft:soft, n:n, ok:ok, size:raw };
  }
  function crsCheckHtml(){
    var r=crsCheck();
    return '<h3>发布前检查</h3>'
      +'<p class="crs-none"><b>'+r.ok+' / '+r.n+' 节齐备</b>'
      +(r.hard.length?(' · 🔴 '+r.hard.length+' 项必须修'):'')
      +(r.soft.length?(' · 🟡 '+r.soft.length+' 项建议'):'')+'</p>'
      +(r.hard.length?('<div class="crs-cklist hard">'+r.hard.map(function(x){ return '<div>🔴 '+esc(x)+'</div>'; }).join('')+'</div>'):'')
      +(r.soft.length?('<div class="crs-cklist">'+r.soft.map(function(x){ return '<div>🟡 '+esc(x)+'</div>'; }).join('')+'</div>'):'')
      +'<p class="crs-size">内容体量 '+r.size+' / 204800 字符（'+Math.round(r.size*100/204800)+'%）</p>'
      +'<div class="ad-racts"><span style="flex:1"></span><button class="ad-b" data-close>关闭</button>'
      +(r.hard.length?'':'<button class="ad-b ok" id="crs-pubgo">确认发布</button>')+'</div>';
  }

           data:{emoji:'🎼',fam:'g',chapters:[]} };

      +'<span class="crs-state" id="crs-state">已保存</span><span style="flex:1"></span>'
      /* v62.1 简化：右侧常驻预览栏撤掉，改成主区「编辑 / 预览」二选一——
         三栏同屏时每栏都不够宽，编辑区被挤到放不下一行谱例，反而要来回横滚 */
      +'<div class="crs-seg" role="tablist"><button type="button" class="on" id="crs-mode-edit" role="tab" aria-selected="true">编辑</button>'
      +'<button type="button" id="crs-mode-pv" role="tab" aria-selected="false">预览</button></div>'
      +'<button type="button" class="ad-b" id="crs-meta">课程信息</button>'
      +'<button type="button" class="ad-b" id="crs-save">保存</button>'
      +'<button type="button" class="ad-b ok" id="crs-savepub">'+(c.status==='published'?'保存并生效':'发布')+'</button></div>'
      +(c.status==='published'?'<p class="crs-live">⚠ 这门课<b>已发布</b>，保存即对学员生效（服务端读写同一份数据，没有中间草稿态）。大改建议先下架。</p>':'')
      +'<div class="crs-grid"><nav class="crs-tree" id="crs-tree"></nav>'
      +'<div class="crs-mainwrap" id="crs-main"></div></div>'
      +'<div class="crs-metaform" id="crs-metaform" hidden>'
      +'<div class="ad-search" style="margin:0"><input id="crs-id" value="'+esc(c.id)+'" placeholder="课程 id（小写字母/数字/-）" '+(c.id&&c.status?'readonly':'')+'>'
      +'<select id="crs-inst" class="ad-sel">'+Object.keys(CRS_INST).map(function(k){
          return '<option value="'+k+'"'+(c.instrument===k?' selected':'')+'>'+CRS_INST[k]+'</option>'; }).join('')+'</select></div>'
      +'<div class="ad-search" style="margin:0"><input id="crs-title" value="'+esc(c.title)+'" placeholder="课程标题（必填）">'
      +'<input id="crs-emoji" value="'+esc(d.emoji||'🎼')+'" placeholder="封面表情" style="max-width:90px">'
      +'<select id="crs-fam" class="ad-sel"><option value="g"'+(d.fam==='g'?' selected':'')+'>朱砂（吉他族）</option>'
      +'<option value="p"'+(d.fam==='p'?' selected':'')+'>墨蓝（钢琴族）</option>'
      +'<option value="v"'+(d.fam==='v'?' selected':'')+'>墨绿（人声/幼儿）</option>'
      +'<option value="f"'+(d.fam==='f'?' selected':'')+'>赭金（综合）</option></select></div>'
      +'<input id="crs-sub" value="'+esc(c.subtitle||'')+'" placeholder="一句话副标题">'
      +'<div class="ad-search" style="margin:0"><input id="crs-level" value="'+esc(c.level||'')+'" placeholder="难度/人群">'
      +'<input id="crs-weeks" inputmode="numeric" value="'+(c.weeks|0)+'" placeholder="周数" style="max-width:90px">'
      +'<input id="crs-sort" inputmode="numeric" value="'+(c.sort|0)+'" placeholder="排序" style="max-width:90px"></div>'
      +'<textarea id="crs-intro" rows="2" maxlength="500" placeholder="课程简介">'+esc(c.intro||'')+'</textarea></div>'
      +'</div>');
    crsDraw();
    /* 恢复本机暂存 */
    try{
      var st=JSON.parse(localStorage.getItem('pyq-crs-draft:'+(c.id||'new'))||'null');
      if(st&&st.body&&st.savedAt>((c.updated_at||0)*1000)){
        var when=new Date(st.savedAt), hh=when.getHours()+':'+String(when.getMinutes()).padStart(2,'0');
        var bar=document.createElement('div'); bar.className='crs-live';
        bar.innerHTML='本机有 '+hh+' 未保存的草稿 · <button type="button" class="ad-b ok" id="crs-rest">恢复</button>'
          +' <button type="button" class="ad-b" id="crs-drop">丢弃</button>';
        document.getElementById('crs-wb').insertBefore(bar, document.querySelector('.crs-grid'));
        bar.querySelector('#crs-rest').onclick=function(){
          CRS.chs=crsMintIds(((st.body.data||{}).chapters)||[]); CRS.sel={ci:0,si:0};
          bar.remove(); crsDirty(true); crsDraw(); };
        bar.querySelector('#crs-drop').onclick=function(){
          try{ localStorage.removeItem('pyq-crs-draft:'+(c.id||'new')); }catch(_){} bar.remove(); };
      }
    }catch(_){}
    document.querySelectorAll('#crs-metaform input,#crs-metaform textarea,#crs-metaform select')
      .forEach(function(e){ e.oninput=function(){ crsDirty(true); }; });
    document.getElementById('crs-meta').onclick=function(){
      var f=document.getElementById('crs-metaform'); f.hidden=!f.hidden;
    };
    document.getElementById('crs-back').onclick=function(){ crsLeave(adCourses); };
    /* 编辑 / 预览 二选一（同一块主区，不再左右挤成三栏） */
    var setMode=function(m){
      CRS.mode=m;
      var eb=document.getElementById('crs-mode-edit'), pb=document.getElementById('crs-mode-pv');
      eb.classList.toggle('on',m==='edit'); eb.setAttribute('aria-selected',m==='edit'?'true':'false');
      pb.classList.toggle('on',m==='pv');   pb.setAttribute('aria-selected',m==='pv'?'true':'false');
      crsDraw('main');
    };
    document.getElementById('crs-mode-edit').onclick=function(){ setMode('edit'); };
    document.getElementById('crs-mode-pv').onclick=function(){ setMode('pv'); };
    var save=function(alsoPub){
      var id=document.getElementById('crs-id').value.trim(), b=crsBody();
      if(!/^[a-z0-9-]{3,48}$/.test(id)) return adMsg('课程 id 需为 3-48 位小写字母/数字/连字符');
      if(!b.title) return adMsg('课程标题必填');
      adMsg('保存中…');
      return api('/admin/courses/'+encodeURIComponent(id),{method:'PUT',body:b}).then(function(){
        CRS.c.id=id; CRS.saved=new Date().toTimeString().slice(0,5); crsDirty(false);
        try{ localStorage.removeItem('pyq-crs-draft:'+id); }catch(_){}
        if(!alsoPub){ adMsg('已保存草稿'); return; }
        return api('/admin/courses/'+encodeURIComponent(id)+'/publish',{method:'POST'})
          .then(function(){ adMsg('已发布，学习页即时可见'); adCourses(); });
      }).catch(function(e){ adMsg(e.message||'保存失败'); });   /* 失败保留 dirty 与本机草稿 */
    };
    document.getElementById('crs-save').onclick=function(){ save(false); };
    document.getElementById('crs-savepub').onclick=function(){
      adModal(crsCheckHtml(), function(box){
        var go=box.querySelector('#crs-pubgo');
        if(go) go.onclick=function(){ adModalClose(); save(true); };
      });
    };
  }
  /* v62.1 离开＝静默暂存（撤销三选一弹窗）：
     弹窗要人当场在「继续编辑/放弃修改/保存并离开」里做决定，而暂存本来就已经发生了——
     现在直接落本机草稿并提示一行，下次打开这门课顶部给「恢复」入口，谁也不会丢稿。 */
  function crsLeave(next){
    if(!CRS||!CRS.dirty){ crsClose(); next&&next(); return; }
    var id=(CRS.c.id||'new');
    try{
      var raw=JSON.stringify({ savedAt:Date.now(), body:crsBody() });
      if(raw.length<1000000) localStorage.setItem('pyq-crs-draft:'+id, raw);
    }catch(_){}
    crsClose(); next&&next();
    adMsg('未保存的修改已暂存到本机，重新打开这门课可恢复');
  }
  function crsClose(){
    CRS=null;
    var body=document.getElementById('ad-body'); if(body) body.classList.remove('crs-open');
  }
  window.addEventListener('beforeunload', function(e){
    if(CRS&&CRS.dirty){ e.preventDefault(); e.returnValue=''; }
  });

  function adCodes(){
    api('/admin/codes').then(function(j){
      var rows=j.codes||[];
      adPane('<div class="ad-bcast">'
        +'<div class="ad-search" style="margin:0">'
        +'<select id="cd-kind" class="ad-sel"><option value="vip">vip（会员）</option><option value="pack_kaobian">pack_kaobian（考编包）</option></select>'
        +'<input id="cd-days" inputmode="numeric" placeholder="天数（0=永久）" value="30" style="max-width:130px">'
        +'<input id="cd-count" inputmode="numeric" placeholder="数量" value="5" style="max-width:90px">'
        +'<button class="ad-b ok" id="cd-go">生成</button></div>'
        +'<div id="cd-out"></div></div>'
        +'<div id="cd-list">'+(rows.length? rows.map(function(c){
          return '<div class="ad-row"><div class="ad-rmain"><b class="ad-code">'+esc(c.code)+'</b>'
            +'<small>'+esc(c.kind)+' · '+(c.days>0?(c.days+' 天'):'永久')+' · '+FMT(c.created_at)+'</small></div>'
            +'<div class="ad-racts">'+(c.used_by?'<i class="k k-no">已用 '+FMT(c.used_at)+'</i>':'<i class="k k-ok">未用</i>')+'</div></div>'; }).join('')
          : '<p class="pc-empty">还没有兑换码，用上方表单生成。</p>')+'</div>');
      document.getElementById('cd-go').onclick=function(){
        var kind=document.getElementById('cd-kind').value, days=+document.getElementById('cd-days').value||0, count=+document.getElementById('cd-count').value||1;
        if(!confirm('生成 '+count+' 个「'+kind+'」兑换码（'+(days>0?days+' 天':'永久')+'）？')) return;
        adMsg('生成中…');
        api('/admin/codes',{method:'POST',body:{kind:kind,days:days,count:count}}).then(function(j2){
          adMsg('已生成 '+(j2.codes||[]).length+' 个');
          document.getElementById('cd-out').innerHTML='<textarea rows="'+Math.min(8,(j2.codes||[]).length)+'" readonly onclick="this.select()" style="width:100%;box-sizing:border-box;font-family:ui-monospace,monospace;font-size:12.5px">'+(j2.codes||[]).join('\n')+'</textarea><p class="pc-empty" style="text-align:left">点击文本框全选复制；列表刷新见下方。</p>';
          adCodesRefresh();
        }).catch(function(e){ adMsg(e.message||'生成失败'); });
      };
      function adCodesRefresh(){ api('/admin/codes').then(function(j2){
        var rows2=j2.codes||[];
        document.getElementById('cd-list').innerHTML=rows2.map(function(c){
          return '<div class="ad-row"><div class="ad-rmain"><b class="ad-code">'+esc(c.code)+'</b>'
            +'<small>'+esc(c.kind)+' · '+(c.days>0?(c.days+' 天'):'永久')+' · '+FMT(c.created_at)+'</small></div>'
            +'<div class="ad-racts">'+(c.used_by?'<i class="k k-no">已用 '+FMT(c.used_at)+'</i>':'<i class="k k-ok">未用</i>')+'</div></div>'; }).join('');
      }).catch(function(){}); }
    }).catch(function(e){ adPane('<p class="pc-empty">'+esc(e.message||'加载失败')+'</p>'); });
  }

  /* ---- 公告（composer + 历史 + 撤回）---- */
  function adBroadcast(){
    api('/admin/broadcasts').then(function(j){
      var rows=j.broadcasts||[];
      adPane('<div class="ad-bcast">'
        +'<input id="bc-title" maxlength="80" placeholder="公告标题（必填，1-80 字）">'
        +'<textarea id="bc-body" maxlength="2000" rows="4" placeholder="公告正文（可空，最多 2000 字）"></textarea>'
        +'<input id="bc-link" placeholder="附带链接（可空，仅限站内地址，如 https://www.puyouquan.com/kecheng.html）">'
        +'<div class="ad-racts" style="justify-content:flex-end"><button class="ad-b ok" id="bc-go">发布公告</button></div>'
        +'<p class="pc-empty" style="text-align:left">发布后即出现在全站用户「个人中心 → 消息」，导航头像亮红点；公告展示 90 天，可随时撤回。</p></div>'
        +'<h3 class="me-h" style="margin-top:14px">已发布公告</h3>'
        +(rows.length? rows.map(function(x){
          return '<div class="ad-row"><div class="ad-rmain"><b>'+esc(x.title)+'</b>'
            +'<small>'+FMTS(x.created_at)+' · '+(x.reads|0)+' 人已读'+(x.body?(' · '+esc(x.body.slice(0,60))):'')+'</small></div>'
            +'<div class="ad-racts"><button class="ad-b no" data-del="'+(+x.id)+'">撤回</button></div></div>'; }).join('')
          : '<p class="pc-empty">还没有发布过公告。</p>'));
      document.getElementById('bc-go').onclick=function(){
        var t=document.getElementById('bc-title').value.trim();
        if(!t) return adMsg('公告标题必填');
        if(!confirm('确定向全站用户发布这条公告？\n\n'+t)) return;
        adMsg('发布中…');
        api('/admin/broadcast',{method:'POST',body:{title:t,
          body:document.getElementById('bc-body').value.trim(),
          link:document.getElementById('bc-link').value.trim()}})
          .then(function(){ adMsg('公告已发布'); adBroadcast(); })
          .catch(function(e){ adMsg(e.message||'发布失败'); });
      };
      document.querySelectorAll('#ad-pane [data-del]').forEach(function(b){ b.onclick=function(){
        if(!confirm('撤回这条公告？所有用户的消息列表将不再显示它。')) return;
        adMsg('撤回中…');
        api('/admin/broadcasts/'+b.dataset.del,{method:'DELETE'})
          .then(function(){ adMsg('已撤回'); adBroadcast(); })
          .catch(function(e){ adMsg(e.message||'撤回失败'); });
      }; });
    }).catch(function(e){ adPane('<p class="pc-empty">'+esc(e.message||'加载失败')+'</p>'); });
  }

  /* ---- 订单 ---- */
  function adOrders(){
    api('/admin/orders').then(function(j){
      var rows=j.orders||[];
      adPane(rows.length? rows.map(function(o){
        return '<div class="ad-row"><div class="ad-rmain"><b>'+esc(o.kind)+' · ¥'+((o.amount_fen|0)/100).toFixed(2)+'</b>'
          +'<small>'+esc(o.nickname||'谱友')+(o.phone?(' · '+esc(o.phone)):'')+' · '+esc(o.channel||'-')+' · '+FMTS(o.created_at)+'</small></div>'
          +'<div class="ad-racts"><i class="k '+(o.status==='paid'?'k-ok':'k-wait')+'">'+esc(o.status)+'</i></div></div>'; }).join('')
        : '<p class="pc-empty">还没有订单记录。</p>');
    }).catch(function(e){ adPane('<p class="pc-empty">'+esc(e.message||'加载失败')+'</p>'); });
  }

  /* ---- 审计日志 ---- */
  var AD_ACT={approve:'审核通过', reject:'驳回', unpublish:'下架', role:'改角色', grant:'发放权益', revoke:'撤销权益',
    broadcast:'发布公告', 'bcast-del':'撤回公告', codes:'生成兑换码',
    course:'编辑课程', 'course-pub':'发布课程', 'course-off':'下架课程', 'course-del':'删除课程', 'cli:set-role':'服务器改角色'};
  function adLogs(){
    api('/admin/logs').then(function(j){
      var rows=j.logs||[];
      adPane(rows.length? rows.map(function(l){
        return '<div class="ad-log"><span class="ad-t">'+FMTS(l.created_at)+'</span>'
          +'<b>'+esc(l.admin_name||l.admin_phone||'管理员')+'</b>'
          +'<i>'+esc(AD_ACT[l.action]||l.action)+'</i>'
          +'<span class="ad-d">'+esc(l.detail||l.target||'')+'</span></div>';
      }).join('') : '<p class="pc-empty">还没有管理操作记录</p>');
    }).catch(function(e){ adPane('<p class="pc-empty">'+esc(e.message||'加载失败')+'</p>'); });
  }
})();
</script>
</body>
</html>
