<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>平台管理 · 谱友圈</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="pyq.css">
</head>
<body data-page="admin">
<div id="site-nav"></div>

<!-- 门卫：未登录/非管理员都停在这里；前端隐藏只是入口收敛，/api/admin/* 服务端逐条 requireAdmin 二次鉴权 -->
<main id="ad-gate" class="me-auth" hidden>
  <div class="auth-card">
    <div class="brand"><span class="mark" style="width:40px;height:40px;border-radius:12px"></span></div>
    <h2>平台管理</h2>
    <p class="lg-sub" id="gate-msg">正在确认身份…</p>
    <a class="lg-go" id="gate-go" href="me.html" style="display:block;text-align:center;text-decoration:none" hidden>去登录 →</a>
  </div>
</main>

<!-- v60.88 管理控制台（自 me.html 内嵌卡独立成页）：
     待审核/已上架/用户(详情)/兑换码/公告(历史+撤回)/订单/审计日志 七个页签 -->
<main id="ad-body" class="me-wrap" hidden>
  <header class="me-head">
    <div class="me-id">
      <h1 class="me-nick"><span>平台管理中心</span><span class="cr-badge ad-badge" style="display:inline-block">管理员</span></h1>
      <p class="me-sub" id="ad-sum"></p>
    </div>
    <div class="me-hbtns">
      <a class="btn me-gocr" href="me.html">← 个人中心</a>
      <a class="btn me-openzp" href="//zhipu.puyouquan.com/">打开编辑器</a>
    </div>
  </header>

  <section class="me-card ad-card">
    <div class="ad-stats" id="ad-stats"></div>
    <p class="ad-funnel" id="ad-funnel"></p>
    <div class="ad-tabs" id="ad-tabs">
      <button type="button" class="ad-tab on" data-ad="review">待审核<span class="ad-dot" id="ad-dot" hidden></span></button>
      <button type="button" class="ad-tab" data-ad="done">已上架</button>
      <button type="button" class="ad-tab" data-ad="users">用户</button>
      <button type="button" class="ad-tab" data-ad="courses">课程</button>
      <button type="button" class="ad-tab" data-ad="codes">兑换码</button>
      <button type="button" class="ad-tab" data-ad="bcast">公告</button>
      <button type="button" class="ad-tab" data-ad="orders">订单</button>
      <button type="button" class="ad-tab" data-ad="logs">审计日志</button>
    </div>
    <p class="ad-msg" id="ad-msg"></p>
    <div class="ad-pane" id="ad-pane"><p class="pc-empty">加载中…</p></div>
  </section>
</main>

<div id="site-foot"></div>
<script src="pyq.js"></script>
<script>
(function(){
  var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  function api(path,opts){ opts=opts||{};
    return fetch('/api'+path,{method:opts.method||'GET',credentials:'include',
      headers:opts.body?{'Content-Type':'application/json'}:{},body:opts.body?JSON.stringify(opts.body):undefined})
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){
        if(!r.ok){ var e=new Error(j.error||('请求失败（'+r.status+'）')); e.status=r.status; throw e; } return j; }); }); }
  var FMT=function(t){ if(!t) return '—'; var d=new Date(t*1000);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  var FMTS=function(t){ if(!t) return '—'; var d=new Date(t*1000);
    return FMT(t)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
  var adTab='review';
  function adMsg(t){ document.getElementById('ad-msg').textContent=t||''; }
  function adPane(html){ document.getElementById('ad-pane').innerHTML=html; }
  function adRole(r){ return r==='admin'?'管理员':(r==='creator'?'创作者':'普通用户'); }

  /* ---- 门卫 ---- */
  function gate(msgText, canLogin){
    document.getElementById('ad-gate').hidden=false;
    document.getElementById('ad-body').hidden=true;
    document.getElementById('gate-msg').textContent=msgText;
    document.getElementById('gate-go').hidden=!canLogin;
  }
  api('/me').then(function(j){
    var u=(j&&j.user)||{};
    if(u.role!=='admin') return gate('此页面仅平台管理员可用。', false);
    document.getElementById('ad-gate').hidden=true;
    document.getElementById('ad-body').hidden=false;
    boot();
  }).catch(function(){ gate('请先登录后再访问平台管理。', true); });

  /* ---- 概览 + 页签 ---- */
  function loadOverview(){
    api('/admin/overview').then(function(j){
      var r=j.roles||{}, o=j.orders||{};
      document.getElementById('ad-sum').textContent='待审 '+(j.pending|0)+' · 已上架 '+(j.published|0)+' · 用户 '+(j.users|0);
      document.getElementById('ad-stats').innerHTML=[
        ['用户', j.users|0, (r.creator|0)+' 创作者 · '+(r.admin|0)+' 管理员'],
        ['曲谱', j.scores|0, (j.published|0)+' 已上架'],
        ['待审核', j.pending|0, (j.pending?'需要处理':'队列已清空')],
        ['已支付订单', o.paid|0, '¥'+(((o.amount_fen|0)/100).toFixed(2))]
      ].map(function(t){ return '<div class="ad-stat"><b>'+t[1]+'</b><span>'+t[0]+'</span><i>'+esc(t[2])+'</i></div>'; }).join('');
      var d=document.getElementById('ad-dot');
      d.hidden=!(j.pending|0); d.textContent=j.pending|0;
      /* v60.88 近 7 日事件漏斗上墙（接口早就返回，此前从未展示） */
      var fn=(j.funnel||[]).slice(0,6).map(function(x){ return esc(x.name)+' '+x.n; }).join(' · ');
      document.getElementById('ad-funnel').textContent = fn? ('近 7 日事件：'+fn) : '';
    }).catch(function(e){ document.getElementById('ad-stats').innerHTML='<p class="pc-empty">概览暂时无法加载（'+esc(e.message||'')+'）</p>'; });
  }
  function boot(){
    loadOverview();
    Array.prototype.forEach.call(document.querySelectorAll('#ad-tabs .ad-tab'), function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(document.querySelectorAll('#ad-tabs .ad-tab'), function(x){ x.classList.toggle('on', x===b); });
        adTab=b.dataset.ad; adMsg(''); adLoad();
      };
    });
    adLoad();
  }
  function adLoad(){
    adPane('<p class="pc-empty">加载中…</p>');
    if(adTab==='review') return adReviews('pending');
    if(adTab==='done')   return adReviews('published');
    if(adTab==='users')  return adUsers('');
    if(adTab==='courses')return adCourses();
    if(adTab==='codes')  return adCodes();
    if(adTab==='bcast')  return adBroadcast();
    if(adTab==='orders') return adOrders();
    return adLogs();
  }

  /* ---- 审核 / 已上架 ---- */
  function adReviews(status){
    api('/admin/reviews?status='+status).then(function(j){
      var rows=j.scores||[];
      if(!rows.length) return adPane('<p class="pc-empty">'+(status==='pending'?'待审核队列已清空 🎉':'还没有已上架的曲谱')+'</p>');
      adPane(rows.map(function(s){
        var acts=status==='pending'
          ? '<button class="ad-b ok" data-ok="'+esc(s.id)+'">通过</button><button class="ad-b no" data-no="'+esc(s.id)+'" data-t="'+esc(s.title||'')+'">驳回</button>'
          : '<button class="ad-b no" data-off="'+esc(s.id)+'">下架</button>';
        return '<div class="ad-row"><div class="ad-rmain">'
          +'<b>'+esc(s.title||'未命名曲谱')+'</b>'
          +'<small>'+esc(s.author||'佚名')+(s.phone?(' · '+esc(s.phone)):'')+' · '+FMTS(s.updated_at)
          +(s.review_note?(' · 上次驳回：'+esc(s.review_note)):'')+'</small></div>'
          +'<div class="ad-racts"><a class="ad-b" href="//zhipu.puyouquan.com/?review='+encodeURIComponent(s.id)+'" target="_blank" rel="noopener">预览谱面</a>'+acts+'</div></div>';
      }).join(''));
      var pane=document.getElementById('ad-pane');
      pane.querySelectorAll('[data-ok]').forEach(function(b){ b.onclick=function(){ adReview(b.dataset.ok,'approve',''); }; });
      pane.querySelectorAll('[data-no]').forEach(function(b){ b.onclick=function(){ rejectModal(b.dataset.no, b.dataset.t); }; });
      pane.querySelectorAll('[data-off]').forEach(function(b){ b.onclick=function(){
        if(!confirm('确定把这首谱从谱库下架？（回到创作者的私有状态，会站内信通知谱主）')) return;
        adReview(b.dataset.off,'unpublish',''); }; });
    }).catch(function(e){ adPane('<p class="pc-empty">'+esc(e.message||'列表加载失败')+'</p>'); });
  }
  /* v60.88 驳回弹窗替代 prompt：常用原因一键选 + 自由补充，原因会随站内信发给创作者 */
  var REJECTS=['谱面音符/节拍错误较多','歌词与旋律对位有误','曲谱信息不完整（标题/演唱者/调号）','与谱库已有曲谱重复','涉嫌侵权风险，请确认授权'];
  function rejectModal(id, title){
    var mk=document.createElement('div'); mk.className='pyq-mask'; mk.id='rj-mask';
    mk.innerHTML='<div class="pyq-modal"><h3>驳回《'+esc(title||'未命名曲谱')+'》</h3>'
      +'<p class="lg-sub">原因会通过站内信发给创作者（必填）</p>'
      +'<div class="ad-rjchips">'+REJECTS.map(function(t,i){ return '<button type="button" class="fchip" data-i="'+i+'">'+t+'</button>'; }).join('')+'</div>'
      +'<textarea id="rj-note" rows="3" maxlength="200" placeholder="驳回原因，可点上方常用原因快速填入后修改"></textarea>'
      +'<div class="btns"><button id="rj-x" class="btn ghost" style="padding:9px 16px;font-size:13px">取消</button>'
      +'<button id="rj-go" class="lg-go" style="margin:0;width:auto;padding:11px 22px">确认驳回</button></div></div>';
    document.body.appendChild(mk);
    mk.addEventListener('click',function(e){ if(e.target===mk) mk.remove(); });
    mk.querySelectorAll('.fchip').forEach(function(c){ c.onclick=function(){ document.getElementById('rj-note').value=REJECTS[+c.dataset.i]; }; });
    document.getElementById('rj-x').onclick=function(){ mk.remove(); };
    document.getElementById('rj-go').onclick=function(){
      var note=document.getElementById('rj-note').value.trim();
      if(!note) return adMsg('驳回必须填写原因');
      mk.remove(); adReview(id,'reject',note);
    };
  }
  function adReview(id, action, note){
    adMsg('处理中…');
    api('/admin/scores/'+encodeURIComponent(id)+'/review',{method:'POST',body:{action:action,note:note}})
      .then(function(){ adMsg(action==='approve'?'已通过并上架（已站内信通知谱主）':(action==='reject'?'已驳回，原因已站内信通知创作者':'已下架（已站内信通知谱主）')); loadOverview(); adLoad(); })
      .catch(function(e){ adMsg(e.message||'操作失败'); });
  }

  /* ---- 用户（v60.88 增详情展开：权益 / 订单 / 曲谱分状态计数）---- */
  function adUsers(kw){
    var head='<div class="ad-search"><input id="ad-q" placeholder="按手机号或昵称搜索" value="'+esc(kw)+'"><button class="ad-b" id="ad-qgo">搜索</button></div>';
    api('/admin/users'+(kw?('?q='+encodeURIComponent(kw)):'')).then(function(j){
      var rows=j.users||[];
      adPane(head+(rows.length? rows.map(function(x){
        return '<div class="ad-row" data-uid="'+esc(x.id)+'"><div class="ad-rmain"><b>'+esc(x.nickname||'谱友')+'</b>'
          +'<small>'+esc(x.phone||'（微信登录）')+' · 注册 '+FMT(x.created_at)+' · '+adRole(x.role)+'</small></div>'
          +'<div class="ad-racts">'
          +'<button class="ad-b" data-detail="'+esc(x.id)+'">详情</button>'
          +'<select class="ad-sel" data-role="'+esc(x.id)+'">'
          +['user','creator','admin'].map(function(r){ return '<option value="'+r+'"'+(x.role===r?' selected':'')+'>'+adRole(r)+'</option>'; }).join('')
          +'</select>'
          +'<button class="ad-b" data-grant="'+esc(x.id)+'">发权益</button>'
          +'<button class="ad-b no" data-revoke="'+esc(x.id)+'">撤权益</button></div></div>'
          +'<div class="ad-detail" id="dt-'+esc(x.id)+'" hidden></div>';
      }).join('') : '<p class="pc-empty">没有匹配的用户</p>'));
      var pane=document.getElementById('ad-pane');
      document.getElementById('ad-qgo').onclick=function(){ adUsers(document.getElementById('ad-q').value.trim()); };
      document.getElementById('ad-q').onkeydown=function(e){ if(e.key==='Enter') document.getElementById('ad-qgo').click(); };
      pane.querySelectorAll('[data-detail]').forEach(function(b){ b.onclick=function(){
        var box=document.getElementById('dt-'+b.dataset.detail);
        if(!box.hidden){ box.hidden=true; return; }
        box.hidden=false; box.innerHTML='<p class="pc-empty">加载中…</p>';
        api('/admin/users/'+encodeURIComponent(b.dataset.detail)+'/detail').then(function(d){
          var st=d.scores&&d.scores.byStatus||{};
          var ents=(d.entitlements||[]).map(function(e2){ return esc(e2.kind)+'（'+(e2.expires_at?('至 '+FMT(e2.expires_at)):'永久')+'）'; }).join('、')||'无';
          var ords=(d.orders||[]).map(function(o){ return FMT(o.created_at)+' '+esc(o.kind)+' ¥'+((o.amount_fen|0)/100).toFixed(2)+' '+esc(o.status); }).join('<br>')||'无';
          box.innerHTML='<div><b>曲谱</b> 共 '+(d.scores?d.scores.total:0)+' 首：已上架 '+(st.published|0)+' · 待审 '+(st.pending|0)+' · 驳回 '+(st.rejected|0)+' · 私有 '+(st.private|0)+'</div>'
            +'<div><b>权益</b> '+ents+'</div><div><b>订单</b> '+ords+'</div>';
        }).catch(function(e){ box.innerHTML='<p class="pc-empty">'+esc(e.message||'详情加载失败')+'</p>'; });
      }; });
      pane.querySelectorAll('[data-role]').forEach(function(s){ s.onchange=function(){
        var id=s.dataset.role, r=s.value;
        if(!confirm('确定把该用户的角色改为「'+adRole(r)+'」？')) return adUsers(kw);
        adMsg('处理中…');
        api('/admin/users/'+encodeURIComponent(id)+'/role',{method:'POST',body:{role:r}})
          .then(function(){ adMsg('角色已更新为 '+adRole(r)); adUsers(kw); })
          .catch(function(e){ adMsg(e.message||'角色修改失败'); adUsers(kw); });
      }; });
      pane.querySelectorAll('[data-grant]').forEach(function(b){ b.onclick=function(){
        var kind=prompt('权益类型（vip = 会员；pack_kaobian = 考编内容包）','vip'); if(kind==null) return;
        kind=kind.trim(); if(!kind) return;
        var days=prompt('有效天数（留空 = 永久）','365'); if(days==null) return;
        adMsg('处理中…');
        api('/admin/users/'+encodeURIComponent(b.dataset.grant)+'/grant',{method:'POST',body:{kind:kind,days:+days||0}})
          .then(function(j2){ adMsg('已发放 '+kind+'（'+(j2.expires_at?('到期 '+FMT(j2.expires_at)):'永久')+'）'); })
          .catch(function(e){ adMsg(e.message||'发放失败'); });
      }; });
      pane.querySelectorAll('[data-revoke]').forEach(function(b){ b.onclick=function(){
        var kind=prompt('要撤销的权益类型','vip'); if(kind==null) return;
        kind=kind.trim(); if(!kind) return;
        adMsg('处理中…');
        api('/admin/users/'+encodeURIComponent(b.dataset.revoke)+'/revoke',{method:'POST',body:{kind:kind}})
          .then(function(){ adMsg('已撤销 '+kind); }).catch(function(e){ adMsg(e.message||'撤销失败'); });
      }; });
    }).catch(function(e){ adPane(head+'<p class="pc-empty">'+esc(e.message||'加载失败')+'</p>'); });
  }

  /* ---- v60.90 课程发布工作台：列表 + 编辑器（章节=谱面+图文+练习任务）+ 发布/下架/删除 ----
     数据模型见 api/db.js courses 表；学习页（kecheng.html）以 /api/courses 为准即时生效。 */
  var CRS_INST={guitar:'吉他',piano:'钢琴',uku:'尤克里里',vocal:'唱歌/视唱',theory:'乐理/识谱',kids:'幼儿启蒙',other:'其他'};
  function adCourses(){
    api('/admin/courses').then(function(j){
      var rows=j.courses||[];
      adPane('<div class="ad-racts" style="justify-content:flex-end;margin-bottom:8px"><button class="ad-b ok" id="crs-new">＋ 新建课程</button></div>'
        +(rows.length? rows.map(function(c){
          /* v61.8 列表补内容体量：章节数与闯关题数一眼可见 */
          var st2={chs:0,qs:0};
          try{ var dd=JSON.parse(c.data||'{}'); st2.chs=(dd.chapters||[]).length;
            (dd.chapters||[]).forEach(function(ch){ st2.qs+=(ch.quiz||[]).length; }); }catch(_){}
          return '<div class="ad-row"><div class="ad-rmain"><b>'+esc(c.title)+'</b>'
            +'<small>'+esc(CRS_INST[c.instrument]||c.instrument||'—')+' · '+esc(c.level||'—')+' · '+(c.weeks|0)+' 周 · '
            +st2.chs+' 章'+(st2.qs?(' · '+st2.qs+' 题'):'')+' · 改于 '+FMT(c.updated_at)+'</small></div>'
            +'<div class="ad-racts">'+(c.status==='published'?'<i class="k k-ok">已发布</i>':'<i class="k k-wait">草稿</i>')
            +'<button class="ad-b" data-edit="'+esc(c.id)+'">编辑</button>'
            +(c.status==='published'
              ?'<button class="ad-b no" data-off="'+esc(c.id)+'">下架</button>'
              :'<button class="ad-b ok" data-pub="'+esc(c.id)+'">发布</button><button class="ad-b no" data-del="'+esc(c.id)+'">删除</button>')
            +'</div></div>'; }).join('')
          : '<p class="pc-empty">还没有课程，点「新建课程」开始。</p>'));
      var pane=document.getElementById('ad-pane');
      document.getElementById('crs-new').onclick=function(){ crsEdit(null); };
      pane.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick=function(){
        api('/admin/courses/'+encodeURIComponent(b.dataset.edit)).then(function(j2){ crsEdit(j2.course); })
          .catch(function(e){ adMsg(e.message||'读取失败'); }); }; });
      pane.querySelectorAll('[data-pub]').forEach(function(b){ b.onclick=function(){
        adMsg('发布中…');
        api('/admin/courses/'+encodeURIComponent(b.dataset.pub)+'/publish',{method:'POST'})
          .then(function(){ adMsg('已发布，学习页即时可见'); adCourses(); }).catch(function(e){ adMsg(e.message||'发布失败'); }); }; });
      pane.querySelectorAll('[data-off]').forEach(function(b){ b.onclick=function(){
        if(!confirm('下架这门课程？学习页将不再显示（内容保留为草稿）。')) return;
        adMsg('下架中…');
        api('/admin/courses/'+encodeURIComponent(b.dataset.off)+'/unpublish',{method:'POST'})
          .then(function(){ adMsg('已下架'); adCourses(); }).catch(function(e){ adMsg(e.message||'下架失败'); }); }; });
      pane.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){
        if(!confirm('永久删除这门草稿课程？不可恢复。')) return;
        api('/admin/courses/'+encodeURIComponent(b.dataset.del),{method:'DELETE'})
          .then(function(){ adMsg('已删除'); adCourses(); }).catch(function(e){ adMsg(e.message||'删除失败'); }); }; });
    }).catch(function(e){ adPane('<p class="pc-empty">'+esc(e.message||'加载失败')+'</p>'); });
  }
  /* 课程编辑器：章节可增删/上移；内容点与配套链接按行填写（链接格式：文字|地址） */
  function crsEdit(c){
    c=c||{ id:'', title:'', subtitle:'', instrument:'guitar', level:'', weeks:0, intro:'', sort:0, status:'draft', data:{emoji:'🎼',fam:'g',chapters:[]} };
    var d=(c.data&&typeof c.data==='object')?c.data:{};
    var chs=(d.chapters||[]).map(function(x){ return JSON.parse(JSON.stringify(x)); });
    function chBlock(ch,i){
      /* v61.8 闯关题序列化：一行一题 题干|选项…|答案序号|解析（解析可空；[[1' 2_]] 记号语法见占位提示） */
      var quizTxt=(ch.quiz||[]).map(function(t){
        return [t.q].concat(t.opts||[]).concat([(t.a|0)+1, t.why||'']).join('|'); }).join('\n');
      return '<fieldset class="crs-ch" data-ci="'+i+'"><legend>第 '+(i+1)+' 章'
        +'<button type="button" class="ad-b" data-chup="'+i+'" '+(i?'':'disabled')+'>↑</button>'
        +'<button type="button" class="ad-b" data-chdn="'+i+'">↓</button>'
        +'<button type="button" class="ad-b no" data-chdel="'+i+'">删除</button></legend>'
        +'<div class="ad-search" style="margin:0 0 8px"><input data-f="emoji" value="'+esc(ch.emoji||'')+'" placeholder="表情" style="max-width:70px">'
        +'<input data-f="title" value="'+esc(ch.title||'')+'" placeholder="章节标题（必填）"></div>'
        +'<input data-f="goal" value="'+esc(ch.goal||'')+'" placeholder="学习目标（一句话；发布要求必填）">'
        +'<textarea data-f="points" rows="3" placeholder="内容点：一行一条（发布要求至少 1 条）">'+esc((ch.points||[]).join('\n'))+'</textarea>'
        +'<input data-f="task" value="'+esc(ch.task||'')+'" placeholder="练习任务（可量化：次数/拍速/时长）">'
        +'<textarea data-f="links" rows="2" placeholder="配套谱/资源：一行一条，格式 文字|地址（如 谱库《小星星》|index.html?q=小星星）">'
        +esc((ch.links||[]).map(function(l){ return (l.t||'')+'|'+(l.href||''); }).join('\n'))+'</textarea>'
        +'<textarea data-f="quiz" rows="3" placeholder="闯关题（学习页自动变成闯关打卡）：一行一题，格式 题干|选项1|选项2|…|答案序号|解析。选项 2-4 个；题干/选项/解析里可用 [[1\' 2_ 3-]] 写简谱记号（\'=高音点 ,=低音点 -=增时线 _=减时线 .=附点）">'
        +esc(quizTxt)+'</textarea></fieldset>';
    }
    function draw(){
      adPane('<div class="ad-bcast">'
        +'<div class="ad-search" style="margin:0"><input id="crs-id" value="'+esc(c.id)+'" placeholder="课程 id（小写字母/数字/-，如 course-uku-qimeng）" '+(c.id&&c.status?'readonly':'')+'>'
        +'<select id="crs-inst" class="ad-sel">'+Object.keys(CRS_INST).map(function(k){
            return '<option value="'+k+'"'+(c.instrument===k?' selected':'')+'>'+CRS_INST[k]+'</option>'; }).join('')+'</select></div>'
        +'<div class="ad-search" style="margin:0"><input id="crs-title" value="'+esc(c.title)+'" placeholder="课程标题（必填）">'
        +'<input id="crs-emoji" value="'+esc(d.emoji||'🎼')+'" placeholder="封面表情" style="max-width:90px">'
        +'<select id="crs-fam" class="ad-sel"><option value="g"'+(d.fam==='g'?' selected':'')+'>朱砂（吉他族）</option><option value="p"'+(d.fam==='p'?' selected':'')+'>墨蓝（钢琴族）</option><option value="v"'+(d.fam==='v'?' selected':'')+'>墨绿（人声/幼儿）</option><option value="f"'+(d.fam==='f'?' selected':'')+'>赭金（综合）</option></select></div>'
        +'<input id="crs-sub" value="'+esc(c.subtitle||'')+'" placeholder="一句话副标题">'
        +'<div class="ad-search" style="margin:0"><input id="crs-level" value="'+esc(c.level||'')+'" placeholder="难度/人群（如 零基础、3-6 岁·亲子）">'
        +'<input id="crs-weeks" inputmode="numeric" value="'+(c.weeks|0)+'" placeholder="周数" style="max-width:90px">'
        +'<input id="crs-sort" inputmode="numeric" value="'+(c.sort|0)+'" placeholder="排序" style="max-width:90px"></div>'
        +'<textarea id="crs-intro" rows="2" maxlength="500" placeholder="课程简介">'+esc(c.intro||'')+'</textarea>'
        +'<div id="crs-chs">'+chs.map(chBlock).join('')+'</div>'
        +'<div class="ad-racts"><button class="ad-b" id="crs-add">＋ 添加章节</button>'
        +'<button class="ad-b" id="crs-preview">🔍 预览草稿</button>'
        +'<span style="flex:1"></span>'
        +'<button class="ad-b" id="crs-back">返回列表</button>'
        +'<button class="ad-b ok" id="crs-save">保存草稿</button>'
        +'<button class="ad-b ok" id="crs-savepub">保存并发布</button></div>'
        +'<p class="pc-empty" style="text-align:left">章节模型＝谱面（配套链接指向谱库/观看页/帮助）+ 图文（目标与内容点）+ 练习任务 + 闯关题（填了题目学习页自动变成闯关打卡：逐章解锁、答题通关得星）；「预览草稿」不落库先看效果，保存后学习页以服务端数据为准即时生效。</p></div>');
      collectWire();
    }
    function collect(){
      document.querySelectorAll('#crs-chs .crs-ch').forEach(function(f,i){
        var g=function(n){ var el=f.querySelector('[data-f="'+n+'"]'); return el? el.value:''; };
        /* v61.8 闯关题解析：最后一个纯数字字段=答案序号（1 起），其后全部并回解析——
           选项数 2-4 由此自然可变；坏行保留原文并打 _bad 标记，保存时定位报错 */
        var quiz=g('quiz').split('\n').map(function(x){ return x.trim(); }).filter(Boolean).map(function(x){
          var ps=x.split('|').map(function(s){ return s.trim(); });
          var ai=-1;
          for(var k=ps.length-1;k>=1;k--){ if(/^[1-9][0-9]*$/.test(ps[k])){ ai=k; break; } }
          if(ai<3) return { _bad:x };   /* 至少 题干+2 选项+序号 → 序号最早在下标 3 */
          var opts=ps.slice(1,ai), a=(+ps[ai])-1, why=ps.slice(ai+1).join('|');
          if(!ps[0]||opts.length<2||opts.length>4||a<0||a>=opts.length) return { _bad:x };
          var t={ q:ps[0], opts:opts, a:a }; if(why) t.why=why; return t;
        });
        chs[i]={ emoji:g('emoji').trim(), title:g('title').trim(), goal:g('goal').trim(),
          points:g('points').split('\n').map(function(x){ return x.trim(); }).filter(Boolean),
          task:g('task').trim(),
          links:g('links').split('\n').map(function(x){ var m2=x.split('|'); return { t:(m2[0]||'').trim(), href:(m2[1]||'').trim() }; })
            .filter(function(l){ return l.t&&l.href; }) };
        if(quiz.length) chs[i].quiz=quiz;
      });
    }
    function collectWire(){
      document.getElementById('crs-add').onclick=function(){ collect(); chs.push({emoji:'🎵',title:'',points:[],links:[]}); draw(); };
      document.querySelectorAll('[data-chdel]').forEach(function(b){ b.onclick=function(){
        collect(); chs.splice(+b.dataset.chdel,1); draw(); }; });
      document.querySelectorAll('[data-chup]').forEach(function(b){ b.onclick=function(){
        collect(); var i=+b.dataset.chup; if(i>0){ var t=chs[i-1]; chs[i-1]=chs[i]; chs[i]=t; } draw(); }; });
      document.querySelectorAll('[data-chdn]').forEach(function(b){ b.onclick=function(){
        collect(); var i=+b.dataset.chdn; if(i<chs.length-1){ var t=chs[i+1]; chs[i+1]=chs[i]; chs[i]=t; } draw(); }; });
      document.getElementById('crs-back').onclick=function(){ if(confirm('未保存的修改将丢失，返回列表？')) adCourses(); };
      var mkBody=function(){
        return { title:document.getElementById('crs-title').value.trim(),
          subtitle:document.getElementById('crs-sub').value.trim(),
          instrument:document.getElementById('crs-inst').value,
          level:document.getElementById('crs-level').value.trim(),
          weeks:+document.getElementById('crs-weeks').value||0,
          sort:+document.getElementById('crs-sort').value||0,
          intro:document.getElementById('crs-intro').value.trim(),
          data:{ emoji:document.getElementById('crs-emoji').value.trim()||'🎼',
                 fam:document.getElementById('crs-fam').value, chapters:chs } };
      };
      /* v61.8 预览草稿：当前编辑内容（含未保存修改）放本机 localStorage，学习页 ?preview=1 只渲染这一门 */
      document.getElementById('crs-preview').onclick=function(){
        collect();
        var id=document.getElementById('crs-id').value.trim()||'crs-preview';
        try{ localStorage.setItem('pyq-crs-preview', JSON.stringify(Object.assign({id:id}, mkBody()))); }catch(_){}
        window.open('kecheng.html?preview=1','_blank');
      };
      var save=function(alsoPub){
        collect();
        var id=document.getElementById('crs-id').value.trim();
        var body=mkBody();
        if(!/^[a-z0-9-]{3,48}$/.test(id)) return adMsg('课程 id 需为 3-48 位小写字母/数字/连字符');
        if(!body.title) return adMsg('课程标题必填');
        /* v61.8 保存前校验：闯关题坏行随时拦；目标/内容点只在「保存并发布」时强制（草稿放行） */
        for(var vi=0; vi<chs.length; vi++){
          var bad=(chs[vi].quiz||[]).find(function(t){ return t._bad; });
          if(bad) return adMsg('第 '+(vi+1)+' 章闯关题格式不对：「'+bad._bad.slice(0,40)+'…」——需 题干|选项×2-4|答案序号|解析');
          if(alsoPub && (!chs[vi].goal || !(chs[vi].points||[]).length))
            return adMsg('第 '+(vi+1)+' 章缺「学习目标」或「内容点」——发布要求每章都有');
        }
        adMsg('保存中…');
        api('/admin/courses/'+encodeURIComponent(id),{method:'PUT',body:body}).then(function(){
          if(!alsoPub){ adMsg('已保存草稿'); c.id=id; c.status=c.status||'draft'; return; }
          return api('/admin/courses/'+encodeURIComponent(id)+'/publish',{method:'POST'})
            .then(function(){ adMsg('已保存并发布，学习页即时可见'); adCourses(); });
        }).catch(function(e){ adMsg(e.message||'保存失败'); });
      };
      document.getElementById('crs-save').onclick=function(){ save(false); };
      document.getElementById('crs-savepub').onclick=function(){ save(true); };
    }
    draw();
  }

  /* ---- 兑换码（v60.88 HTTP 化：此前只有服务器 CLI）---- */
  function adCodes(){
    api('/admin/codes').then(function(j){
      var rows=j.codes||[];
      adPane('<div class="ad-bcast">'
        +'<div class="ad-search" style="margin:0">'
        +'<select id="cd-kind" class="ad-sel"><option value="vip">vip（会员）</option><option value="pack_kaobian">pack_kaobian（考编包）</option></select>'
        +'<input id="cd-days" inputmode="numeric" placeholder="天数（0=永久）" value="30" style="max-width:130px">'
        +'<input id="cd-count" inputmode="numeric" placeholder="数量" value="5" style="max-width:90px">'
        +'<button class="ad-b ok" id="cd-go">生成</button></div>'
        +'<div id="cd-out"></div></div>'
        +'<div id="cd-list">'+(rows.length? rows.map(function(c){
          return '<div class="ad-row"><div class="ad-rmain"><b class="ad-code">'+esc(c.code)+'</b>'
            +'<small>'+esc(c.kind)+' · '+(c.days>0?(c.days+' 天'):'永久')+' · '+FMT(c.created_at)+'</small></div>'
            +'<div class="ad-racts">'+(c.used_by?'<i class="k k-no">已用 '+FMT(c.used_at)+'</i>':'<i class="k k-ok">未用</i>')+'</div></div>'; }).join('')
          : '<p class="pc-empty">还没有兑换码，用上方表单生成。</p>')+'</div>');
      document.getElementById('cd-go').onclick=function(){
        var kind=document.getElementById('cd-kind').value, days=+document.getElementById('cd-days').value||0, count=+document.getElementById('cd-count').value||1;
        if(!confirm('生成 '+count+' 个「'+kind+'」兑换码（'+(days>0?days+' 天':'永久')+'）？')) return;
        adMsg('生成中…');
        api('/admin/codes',{method:'POST',body:{kind:kind,days:days,count:count}}).then(function(j2){
          adMsg('已生成 '+(j2.codes||[]).length+' 个');
          document.getElementById('cd-out').innerHTML='<textarea rows="'+Math.min(8,(j2.codes||[]).length)+'" readonly onclick="this.select()" style="width:100%;box-sizing:border-box;font-family:ui-monospace,monospace;font-size:12.5px">'+(j2.codes||[]).join('\n')+'</textarea><p class="pc-empty" style="text-align:left">点击文本框全选复制；列表刷新见下方。</p>';
          adCodesRefresh();
        }).catch(function(e){ adMsg(e.message||'生成失败'); });
      };
      function adCodesRefresh(){ api('/admin/codes').then(function(j2){
        var rows2=j2.codes||[];
        document.getElementById('cd-list').innerHTML=rows2.map(function(c){
          return '<div class="ad-row"><div class="ad-rmain"><b class="ad-code">'+esc(c.code)+'</b>'
            +'<small>'+esc(c.kind)+' · '+(c.days>0?(c.days+' 天'):'永久')+' · '+FMT(c.created_at)+'</small></div>'
            +'<div class="ad-racts">'+(c.used_by?'<i class="k k-no">已用 '+FMT(c.used_at)+'</i>':'<i class="k k-ok">未用</i>')+'</div></div>'; }).join('');
      }).catch(function(){}); }
    }).catch(function(e){ adPane('<p class="pc-empty">'+esc(e.message||'加载失败')+'</p>'); });
  }

  /* ---- 公告（composer + 历史 + 撤回）---- */
  function adBroadcast(){
    api('/admin/broadcasts').then(function(j){
      var rows=j.broadcasts||[];
      adPane('<div class="ad-bcast">'
        +'<input id="bc-title" maxlength="80" placeholder="公告标题（必填，1-80 字）">'
        +'<textarea id="bc-body" maxlength="2000" rows="4" placeholder="公告正文（可空，最多 2000 字）"></textarea>'
        +'<input id="bc-link" placeholder="附带链接（可空，仅限站内地址，如 https://www.puyouquan.com/kecheng.html）">'
        +'<div class="ad-racts" style="justify-content:flex-end"><button class="ad-b ok" id="bc-go">发布公告</button></div>'
        +'<p class="pc-empty" style="text-align:left">发布后即出现在全站用户「个人中心 → 消息」，导航头像亮红点；公告展示 90 天，可随时撤回。</p></div>'
        +'<h3 class="me-h" style="margin-top:14px">已发布公告</h3>'
        +(rows.length? rows.map(function(x){
          return '<div class="ad-row"><div class="ad-rmain"><b>'+esc(x.title)+'</b>'
            +'<small>'+FMTS(x.created_at)+' · '+(x.reads|0)+' 人已读'+(x.body?(' · '+esc(x.body.slice(0,60))):'')+'</small></div>'
            +'<div class="ad-racts"><button class="ad-b no" data-del="'+(+x.id)+'">撤回</button></div></div>'; }).join('')
          : '<p class="pc-empty">还没有发布过公告。</p>'));
      document.getElementById('bc-go').onclick=function(){
        var t=document.getElementById('bc-title').value.trim();
        if(!t) return adMsg('公告标题必填');
        if(!confirm('确定向全站用户发布这条公告？\n\n'+t)) return;
        adMsg('发布中…');
        api('/admin/broadcast',{method:'POST',body:{title:t,
          body:document.getElementById('bc-body').value.trim(),
          link:document.getElementById('bc-link').value.trim()}})
          .then(function(){ adMsg('公告已发布'); adBroadcast(); })
          .catch(function(e){ adMsg(e.message||'发布失败'); });
      };
      document.querySelectorAll('#ad-pane [data-del]').forEach(function(b){ b.onclick=function(){
        if(!confirm('撤回这条公告？所有用户的消息列表将不再显示它。')) return;
        adMsg('撤回中…');
        api('/admin/broadcasts/'+b.dataset.del,{method:'DELETE'})
          .then(function(){ adMsg('已撤回'); adBroadcast(); })
          .catch(function(e){ adMsg(e.message||'撤回失败'); });
      }; });
    }).catch(function(e){ adPane('<p class="pc-empty">'+esc(e.message||'加载失败')+'</p>'); });
  }

  /* ---- 订单 ---- */
  function adOrders(){
    api('/admin/orders').then(function(j){
      var rows=j.orders||[];
      adPane(rows.length? rows.map(function(o){
        return '<div class="ad-row"><div class="ad-rmain"><b>'+esc(o.kind)+' · ¥'+((o.amount_fen|0)/100).toFixed(2)+'</b>'
          +'<small>'+esc(o.nickname||'谱友')+(o.phone?(' · '+esc(o.phone)):'')+' · '+esc(o.channel||'-')+' · '+FMTS(o.created_at)+'</small></div>'
          +'<div class="ad-racts"><i class="k '+(o.status==='paid'?'k-ok':'k-wait')+'">'+esc(o.status)+'</i></div></div>'; }).join('')
        : '<p class="pc-empty">还没有订单记录。</p>');
    }).catch(function(e){ adPane('<p class="pc-empty">'+esc(e.message||'加载失败')+'</p>'); });
  }

  /* ---- 审计日志 ---- */
  var AD_ACT={approve:'审核通过', reject:'驳回', unpublish:'下架', role:'改角色', grant:'发放权益', revoke:'撤销权益',
    broadcast:'发布公告', 'bcast-del':'撤回公告', codes:'生成兑换码',
    course:'编辑课程', 'course-pub':'发布课程', 'course-off':'下架课程', 'course-del':'删除课程', 'cli:set-role':'服务器改角色'};
  function adLogs(){
    api('/admin/logs').then(function(j){
      var rows=j.logs||[];
      adPane(rows.length? rows.map(function(l){
        return '<div class="ad-log"><span class="ad-t">'+FMTS(l.created_at)+'</span>'
          +'<b>'+esc(l.admin_name||l.admin_phone||'管理员')+'</b>'
          +'<i>'+esc(AD_ACT[l.action]||l.action)+'</i>'
          +'<span class="ad-d">'+esc(l.detail||l.target||'')+'</span></div>';
      }).join('') : '<p class="pc-empty">还没有管理操作记录</p>');
    }).catch(function(e){ adPane('<p class="pc-empty">'+esc(e.message||'加载失败')+'</p>'); });
  }
})();
</script>
