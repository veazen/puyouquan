  function addCk(cid,k){
    var days=ckDays(cid,k).slice(), t=today();
    if(days.indexOf(t)<0) days.push(t);
    return secSet(cid,k,{days:days}).days;
  }
  function star5(n){ n=Math.max(0,Math.min(5,n|0)); return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n); }
  /* v62.1 结算星级逐颗弹出：一次全亮读不出「拿了几颗」，逐颗出场自带计数感 */
  function starSeq(n){
    n=Math.max(0,Math.min(5,n|0));
    var out='', i;
    for(i=0;i<5;i++) out+='<i style="--k:'+i+'">'+(i<n?'★':'<em>☆</em>')+'</i>';
    return out;
  }
  /* v62.1 起解锁判定统一在 chUnlockedAt / secUnlockedAt（见下方「锁章不锁节」段）；
     v61.9 的 secUnlocked（逐小节解锁）已无调用点，一并撤除，避免同义函数并存被误用。 */
  function secStats(c){
    var L=secList(c), got=0, pass=0;
    L.forEach(function(x){ var s=secStar(c.id,x.k); got+=s; if(s>=3) pass++; });
    return { n:L.length, pass:pass, stars:got, max:L.length*5 };
  }
  function bar2(c){
    var s=secStats(c), pc=s.n? Math.round(s.pass*100/s.n):0;
    return '<div class="kc-bar"><i style="width:'+pc+'%"></i></div>'
      +'<span class="kc-barnum">'+(s.pass? (s.pass+'/'+s.n+' 小节 · ★ '+s.stars+'/'+s.max):'未开始')+'</span>';
  }

  /* v61.8 草稿预览：工作台「预览草稿」把课程对象放 localStorage pyq-crs-preview，
     本页带 ?preview=1 时只渲染这一门（不覆盖打卡进度、不拉服务端列表） */
  var PREVIEW=false;
  if(/[?&]preview=1/.test(location.search)){
    try{ var pv=JSON.parse(localStorage.getItem('pyq-crs-preview'));
      if(pv&&pv.id){ courses=[pv]; PREVIEW=true; } }catch(_){}
  }

  function chData(c){ return (c.data&&typeof c.data==='object')? c.data : {}; }
  function lockedCh(c,i){ return i>0 && doneOf(c.id).indexOf(i-1)<0; }
  function bar(cid, n){
    var d=doneOf(cid).length, pc=n? Math.round(d*100/n):0;
    return '<div class="kc-bar"><i style="width:'+pc+'%"></i></div>'
      +'<span class="kc-barnum">'+(d? (d+'/'+n+' 章'):'未开始')+'</span>';
  }
  function card(c){
    var d=chData(c), n=(d.chapters||[]).length, sec=hasSecs(c), s2=sec?secStats(c):null;
    var done=sec? s2.pass : doneOf(c.id).length, tot=sec? s2.n : n;
    var stars=sec? s2.stars : (function(){ var s=starsOf(c.id), t=0, k2; for(k2 in s) t+=+s[k2]||0; return t; })();
    return '<a class="kc-card rv in" data-fam="'+esc(d.fam||'g')+'" href="kecheng.html?c='+encodeURIComponent(c.id)+'">'
      +'<span class="kc-cover"><span class="kc-emoji">'+esc(d.emoji||'🎼')+'</span></span>'
      +'<span class="kc-cbody"><b>'+esc(c.title)+'</b><small>'+esc(c.subtitle||'')+'</small>'
      +'<span class="kc-chips"><i class="k k-ok">免费</i><i class="k">'+esc(c.level||'')+'</i>'
      +'<i class="k">'+(c.weeks|0)+' 周 · '+n+' 章'+(sec?(' · '+s2.n+' 小节'):'')+'</i>'
      +(stars?('<i class="k k-star">★ '+stars+'</i>'):'')+'</span>'
      +'<span class="kc-prog">'+(sec?bar2(c):bar(c.id,n))+'</span>'
      +'<span class="kc-go">'+(done? (done>=tot?'🎉 已学完，回顾 →':'继续学习 →') : '开始学习 →')+'</span>'
      +'</span></a>';
  }
  function chapter(c,ch,i){
    var did=doneOf(c.id).indexOf(i)>=0, hasQ=(ch.quiz&&ch.quiz.length)>0, st=+starsOf(c.id)[i]||0;
    /* v61.8 闯关制：第 1 章解锁，之后逐章闯——上一章完成（打卡/通关）才解锁下一章 */
    if(lockedCh(c,i)){
      return '<div class="card kc-week kc-ch kc-lock" data-ci="'+i+'">'
        +'<div class="kc-chhead"><span class="kc-chemoji">🔒</span>'
        +'<span class="kc-no">第 '+(i+1)+' '+(hasQ?'关':'周')+'</span><b>'+esc(ch.title)+'</b>'
        +'<span class="kc-tick" aria-disabled="true">未解锁</span></div>'
        +'<p class="kc-lockmsg">完成上一'+(hasQ?'关':'章')+'即可解锁。</p></div>';
    }
    return '<div class="card kc-week kc-ch'+(did?' kc-done':'')+'" data-ci="'+i+'">'
      +'<div class="kc-chhead"><span class="kc-chemoji">'+esc(ch.emoji||'🎵')+'</span>'
      +'<span class="kc-no">第 '+(i+1)+' '+(hasQ?'关':'周')+'</span><b>'+esc(ch.title)+'</b>'
      +(hasQ
        ?'<button type="button" class="kc-tick kc-quizbtn'+(did?' pass':'')+'" data-quiz="'+i+'">'
          +(did?('<i class="kq-star">'+starTxt(st)+'</i> 已通关 · 重闯'):('🎯 闯关（'+ch.quiz.length+' 题）'))+'</button>'
        :'<button type="button" class="kc-tick" data-tick="'+i+'" title="标记本章完成">'+(did?'✓ 已完成':'完成打卡')+'</button>')
      +'</div>'
      +(ch.goal?'<p class="kc-goal">目标：'+jpq(ch.goal)+'</p>':'')
      +((ch.points&&ch.points.length)?('<ul>'+ch.points.map(function(p){ return '<li>'+jpq(p)+'</li>'; }).join('')+'</ul>'):'')
      +(ch.task?'<p class="kc-task"><b>练习任务</b>：'+jpq(ch.task)+'</p>':'')
      +((ch.links&&ch.links.length)?('<p class="kc-res">配套：'+ch.links.map(function(l){
          return '<a href="'+esc(l.href)+'">'+esc(l.t)+'</a>'; }).join(' · ')+'</p>'):'')
      +(hasQ?'<div class="kc-quiz" data-qhost="'+i+'" hidden></div>':'')
      +'</div>';
  }
  /* ---------- v61.9 小节渲染：学习 / 练习（打卡）/ 测试（5 星）三模块 ---------- */
  /* ===== v62.0 小节卡三态（UI 专家规格）=====
     锁：44px 静默行、解锁文案只在「下一个待解锁」那节留一行（原先 15 行重复文案吃掉全页 40% 高度）
     进行中：3px inset 竖条 + 「当前」文字徽章（位置+色+文字三重编码）
     已通关：序号换 ✓ 实心徽章，**不再整体压暗**（复习是学完后最高频动作） */
  var CUR_SEC='';
  /* 修解锁死链（专家审计）：没有测试题的小节永远拿不到星，其后所有小节会被永久锁死——
     这类小节改为「打卡过即算通过」。 */
  function secHasTest(x){ return (((x.s.test||{}).items)||[]).length>0; }
  function secDone(c,x){ return secHasTest(x) ? secPass(c.id,x.k) : ckDays(c.id,x.k).length>0; }
  /* v62.1 锁章不锁节（产品指示）：解锁单位从小节上移到章——
     章内 16 个小节此前必须严格顺序通关，学员想先看后面一节、或跳过某一节的测试都被挡住；
     现在一章解锁后章内小节全部可读可练可测，完成整章才解锁下一章。
     只改判定，不动任何进度键（星级/打卡仍按 sid 存，老数据照读）。 */
  function chSecs(c,ci){ return secList(c).filter(function(x){ return x.ci===ci; }); }
  function chStats(c,ci){
    var mine=chSecs(c,ci), done=0, stars=0;
    mine.forEach(function(x){ if(secDone(c,x)) done++; stars+=secStar(c.id,x.k); });
    return { n:mine.length, done:done, stars:stars, max:mine.length*5, left:mine.length-done,
             all:mine.length>0&&done>=mine.length };
  }
  function chDone(c,ci){ return chStats(c,ci).all; }
  function chUnlockedAt(c,ci){
    if(ci<=0) return true;
    if(chDone(c,ci-1)) return true;
    return doneOf(c.id).indexOf(ci-1)>=0;        /* v61.8 章级老进度 → 该章直接解锁 */
  }
  function secUnlockedAt(c,idx){
    var L=secList(c), x=L[idx];
    return x ? chUnlockedAt(c,x.ci) : false;
  }
  function secState(c,x,idx){
    if(!secUnlockedAt(c,idx)) return 'lock';
    return secDone(c,x) ? 'pass' : 'now';
  }
  /* 下一步该做哪一节：已解锁章里第一个没完成的小节 */
  function nextSec(c){
    var L=secList(c), i;
    for(i=0;i<L.length;i++) if(secUnlockedAt(c,i)&&!secDone(c,L[i])) return L[i];
    return null;
  }
  function starsHtml(n,max){
    n=Math.max(0,Math.min(5,n|0));
    return '<span class="kcs-stars" role="img" aria-label="'+n+' 星，满分 5 星">'
      +'<i>'+'★★★★★'.slice(0,n)+'<em>'+'☆☆☆☆☆'.slice(0,5-n)+'</em></i>'
      +'<b>'+n+'/'+(max||5)+'</b></span>';
  }
  function weekStrip(c,k){
    /* 本周 7 点带（替代「已打卡 N 天」一句话）：今天练没练 + 这周连续性，22px 高一眼给出 */
    var days=ckDays(c.id,k), NM=['一','二','三','四','五','六','日'];
    var now=new Date(), dow=(now.getDay()+6)%7, cells='', i, d, key, on;
    for(i=0;i<7;i++){
      d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+i);
      key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
      on=days.indexOf(key)>=0;
      cells+='<span class="kcp-wd'+(on?' on':'')+(i===dow?' today':'')+'">'+NM[i]+'</span>';
    }
    var wk=0; for(i=0;i<7;i++){ d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+i);
      if(days.indexOf(d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate())>=0) wk++; }
    return '<div class="kcp-week" data-week="'+k+'" role="img" aria-label="本周打卡 '+wk+' 天，累计 '+days.length+' 天">'
      +cells+'<span class="kcp-wtx">本周 '+wk+' 天 · 累计 '+days.length+' 天</span></div>';
  }
  function streakOf(c,k){
    var days=ckDays(c.id,k), n=0, d=new Date(), key;
    for(;;){
      key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
      if(days.indexOf(key)<0){ if(n===0){ d.setDate(d.getDate()-1);       /* 今天没打卡，从昨天起算 */
          key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
          if(days.indexOf(key)<0) return 0; } else return n; }
      n++; d.setDate(d.getDate()-1);
      if(n>999) return n;
    }
  }
  function ckBtnHtml(c,k){
    var days=ckDays(c.id,k), on=days.indexOf(today())>=0, st=streakOf(c,k);
    return '<button type="button" class="kcp-ckbtn'+(on?' is-on':'')+'" data-checkin="'+k+'">'
      +(on?'今天已打卡':'打卡今天的练习')+'</button>'
      +(st>=2?'<span class="kcp-streak">'+ic('flame')+'连续 '+st+' 天</span>':'');
  }
  /* v62.1 学/练/测改分段标签：一节展开不再是三大段纵向长流，默认停在「学习」 */
  var MOD_META=[['learn','learn','学习'],['prac','prac','练习'],['test','test','测试']];
  function modTabs(c,x,star,nq,nl,np){
    var cur=SEC_TAB[x.k]||'learn', out='<div class="kcs-tabs" role="tablist" data-tabs="'+x.k+'">';
    MOD_META.forEach(function(m){
      if(m[0]==='test'&&!nq) return;
      var on=cur===m[0], n=m[0]==='learn'?nl:(m[0]==='prac'?np:nq);
      out+='<button type="button" class="kcs-tab" role="tab" data-mtab="'+m[0]+'" data-sk="'+x.k+'"'
        +' aria-selected="'+(on?'true':'false')+'" tabindex="'+(on?'0':'-1')+'">'
        +ic(m[1])+'<span>'+m[2]+'</span>'
        +(m[0]==='test'
          ?'<span class="kcs-tabn">'+star+'/5 ★</span>'
          :(n?'<span class="kcs-tabn">'+n+'</span>':''))
        +(m[0]==='prac'&&ckDays(c.id,x.k).indexOf(today())>=0?'<i class="kcs-tabdot" aria-hidden="true"></i>':'')
        +'</button>';
    });
    return out+'<span class="kcs-tabink" aria-hidden="true"></span></div>';
  }
  function secHtml(c,x,idx){
    var no=(x.ci+1)+'.'+(x.si+1), st=secState(c,x,idx), title=esc(x.s.title||'');
    if(st==='lock'){    /* 锁章后小节只列标题，解锁文案统一收在章头一处（此前每节重复一遍） */
      return '<section class="kcs kcs--lock" data-sk="'+x.k+'" data-st="lock">'
        +'<div class="kcs-head" aria-disabled="true"><span class="kcs-no">'+no+'</span>'
        +'<span class="kcs-t">'+title+'</span>'
        +'<span class="kcs-lockmk">'+ic('lock')+'</span></div></section>';
    }
    var star=secStar(c.id,x.k), items=((x.s.test||{}).items||[]), pr=x.s.practice||{}, lb=((x.s.learn||{}).blocks)||[];
    var pb=(pr.blocks)||[], cur=SEC_TAB[x.k]||'learn';
    var pane=function(mod,inner){
      return '<div class="kcm" data-mod="'+mod+'" role="tabpanel"'+(cur===mod?'':' hidden')+'>'+inner+'</div>';
    };
    var body='<div class="kcs-wrap"><div class="kcs-body">'
      +modTabs(c,x,star,items.length,lb.length,pb.length)
      /* 面板内不再重复「学习/练习/测试」标题——页签已经写着，重复一遍纯占高度 */
      +pane('learn',(lb.length?lb.map(blockHtml).join(''):'<p class="kcm-note">本节暂无讲解内容。</p>'))
      +pane('prac',pb.map(blockHtml).join('')
        +(pr.tip?'<p class="kcp-ptip">'+mdInline(pr.tip)+'</p>':'')
        +'<div class="kcp-check">'+ckBtnHtml(c,x.k)+'</div>'
        +weekStrip(c,x.k)
        /* v62.2 录音练习：唱一段录下来回放对照（本机不上传，挂载见 wireCourse） */
        +(pr.record?('<div data-recwrap="'+x.k+'" data-rectip="'+esc(pr.recordTip||'')+'"></div>'):''))
      +(items.length
        ?pane('test','<p class="kcm-note">满分 5 星，每错 1 题扣 1 星；拿到 <b>★★★</b> 算通关，可重测冲星。'
          +'本章小节全部完成后解锁下一章。</p>'
          +'<button type="button" class="kcp-testbtn" data-sectest="'+x.k+'">'+(star>=3?'重测冲星':'开始测试')+'（'+items.length+' 题）</button>'
          +'<div class="kcq" data-thost="'+x.k+'" hidden></div>')
        :'')
      +'</div></div>';
    return '<section class="kcs kcs--'+st+(x.k===CUR_SEC?' is-open':'')+'" data-sk="'+x.k+'" data-st="'+st+'">'
      +'<button type="button" class="kcs-head" data-sectoggle="'+x.k+'" aria-expanded="'+(x.k===CUR_SEC?'true':'false')+'">'
      +'<span class="kcs-no">'+(st==='pass'?ic('check'):no)+'</span>'
      +'<span class="kcs-t">'+title+'</span>'
      +(x.k===CUR_SEC?'<span class="kcs-now-tag">当前</span>':'')
      +(items.length?starsHtml(star):'')
      +'<span class="kcs-arw">'+ic('chev')+'</span></button>'
      +body+'</section>';
  }
  function chapGroup(c,ch,ci,L){
    var mine=L.filter(function(x){ return x.ci===ci; }), s=chStats(c,ci);
    var lock=!chUnlockedAt(c,ci), pct=s.n?Math.round(s.done*100/s.n):0;
    var head='<header class="kcp-chh"><div class="kcp-chmeta">'
      +'<span class="kcp-chno">第 '+(ci+1)+' 章</span>'
      +'<h2>'+esc(ch.title||'')+'</h2>'
      +(ch.goal?'<p class="kcp-goal">'+mdInline(ch.goal)+'</p>':'')
      +'<div class="kcp-chbar" style="--p:'+pct+'" role="img" aria-label="本章完成 '+s.done+' / '+s.n+' 小节"><i></i></div>'
      +'<div class="kcp-chfoot"><span>'+s.done+' / '+s.n+' 小节</span>'
      +'<span class="kcp-chstar">★ '+s.stars+' / '+s.max+'</span></div>'
      +'</div><div class="kcp-chart">'+PYQ_KC.art(PYQ_KC.artFor(ch,ci))+'</div></header>';
    var lockPanel='';
    if(lock){
      var pv=chStats(c,ci-1), pn=nextSec(c);
      lockPanel='<div class="kcp-chlock"><span class="kcp-lockic">'+ic('lock')+'</span>'
        +'<p class="kcp-locktx">完成<b>第 '+ci+' 章</b>的全部小节即可解锁本章'
        +(pv.left>0?('（还差 <b>'+pv.left+'</b> 节）'):'')+'。</p>'
        +(pn?('<button type="button" class="kcp-lockgo" data-goto="'+pn.k+'">去做第 '+(pn.ci+1)+'.'+(pn.si+1)+' 节 →</button>'):'')
        +'</div>';
    }
    /* v62.2 一章一色（少儿科普口径）：六个色相循环，本章的小节/页签/按钮全部跟着换色 */
    return '<section class="kcp-chg" data-ci="'+ci+'" data-hue="'+(ci%6)+'" data-lock="'+(lock?1:0)+'">'
      +head+lockPanel
      +(mine.length?mine.map(function(x){ return secHtml(c,x,L.indexOf(x)); }).join('')
        :'<p class="kcm-note">本章内容整理中。</p>')
      +'</section>';
  }
  function railHtml(c,L){
    var out='', lastCi=-1;
    L.forEach(function(x,i){
      if(x.ci!==lastCi){
        lastCi=x.ci;
        out+='<div class="kcp-rch"'+(chUnlockedAt(c,x.ci)?'':' data-lock="1"')+'>第 '+(x.ci+1)+' 章</div>';
      }
      var st=secState(c,x,i), mk=st==='pass'?ic('check'):(st==='lock'?ic('lock'):ic('play'));
      out+='<button type="button" class="kcp-ritem" data-st="'+st+'" data-goto="'+x.k+'"'
        +(st==='lock'?' aria-disabled="true"':'')+'>'
        +'<span class="kcp-rno">'+(x.ci+1)+'.'+(x.si+1)+'</span>'
        +'<span class="kcp-rt">'+esc(x.s.title||'')+'</span>'
        +'<span class="kcp-rmk">'+mk+'</span></button>';
    });
    return out;
  }
  function ringHtml(c){
    var s=secStats(c), pct=s.n?Math.round(s.pass*100/s.n):0, R=38, CIRC=Math.round(2*Math.PI*R*10)/10;
    return '<div class="kcp-hstat">'
      +'<div class="kcp-ring" style="--pct:'+pct+';--circ:'+CIRC+'" role="img" aria-label="已完成 '+s.pass+' / '+s.n+' 小节">'
      +'<svg viewBox="0 0 88 88" aria-hidden="true"><circle class="kcr-bg" cx="44" cy="44" r="'+R+'"/>'
      +'<circle class="kcr-fg" cx="44" cy="44" r="'+R+'"/></svg>'
      +'<span class="kcp-ringtx"><b>'+s.pass+'/'+s.n+'</b><small>小节</small></span></div>'
      +'<div><div class="kcp-hstars" role="img" aria-label="已获得 '+s.stars+' 星，满分 '+s.max+' 星">★ '+s.stars+' / '+s.max+'</div>'
      +ctaHtml(c)+'</div></div>';
  }
  function ctaHtml(c){
    var L=secList(c), x=nextSec(c);
    /* v62.2 主行动钮取「要去的那一章」的颜色——按钮颜色＝目的地颜色，一眼对上章卡 */
    if(!x) return '<button type="button" class="kcp-cta" data-hue="0" data-goto="'+(L.length?L[0].k:'')+'">复习 →</button>';
    return '<button type="button" class="kcp-cta" data-hue="'+(x.ci%6)+'" data-goto="'+x.k+'">'
      +(secStats(c).pass?'继续第 ':'开始第 ')+(x.ci+1)+'.'+(x.si+1)+' 节 →</button>';
  }
  function courseHead(c,d){
    return '<div class="kcp-crumb"><a class="kcp-back" href="kecheng.html">← 全部课程</a>'
      +'<span class="kcp-crumbtx"><a href="index.html">首页</a> / <a href="kecheng.html">学习</a> / '+esc(c.title)+'</span></div>'

      +'<header class="kcp-hero"><div><h1 class="kcp-htitle"><span class="kcp-hemoji">'+esc(d.emoji||'🎼')+'</span>'+esc(c.title)+'</h1>'

  /* 课程页专属交互：侧导航跳转与高亮、手机吸顶条与目录抽屉 */
  function wireCoursePage(c){
    var root=document.getElementById('kcd-'+c.id); if(!root) return;
    var drawer=root.querySelector('[data-drawer]');
    function gotoSec(k){
      var el=root.querySelector('.kcs[data-sk="'+k+'"]'); if(!el) return;

      if(toc) toc.onclick=function(){ drawer.hidden=false; };

      /* v63.3 A5 ⑧（P3-28）Esc 监听只装一次、指向当前抽屉——此前每次重绘课程页都再挂一个，越刷越多 */

    var secs=[].slice.call(root.querySelectorAll('.kcs'));
    if(bar&&secs.length&&window.IntersectionObserver){
      if(KC_IO) KC_IO.disconnect();   /* v63.3 重绘前断开上一轮的观察器（旧节点已移除） */
      var io=KC_IO=new IntersectionObserver(function(es){

      var f=root.querySelector('.kcs[data-sk="'+CUR_SEC+'"]')||secs[0];
      if(f){
        var fk=f.getAttribute('data-sk'), ft=f.querySelector('.kcs-t');
        if(no) no.textContent=(SEC_PK[fk]||fk).split('.').map(function(v){ return (+v)+1; }).join('.');
        if(tx) tx.textContent=ft?ft.textContent:'';

    /* v62.1 章卡进场：滚到视口才升起来，一次性（不做来回抖动的进出场） */

  /* v62.2 侧栏收起/展开（产品指示）：状态记在本机，进课程沿用上次的宽窄 */
  var RAIL_K='pyq-kc-rail';

  /* v61.9 小节测试（5 星制，产品拍板）：每错 1 题扣 1 星，≥3 星过关并解锁下一小节；

  function startSecTest(c,k){
    var sec=document.getElementById('kcd-'+c.id); if(!sec) return;
    var host=sec.querySelector('[data-thost="'+k+'"]'); if(!host) return;
    var x=null, L=secList(c), i;
    for(i=0;i<L.length;i++) if(L[i].k===k) x=L[i];
    var items=x?(((x.s.test||{}).items)||[]):[];
    if(!items.length) return;
    var qi=0, wrong=0, miss=[], KEY='ABCD';
    var card=host.closest('.kcs');
    var wasCh=x?chUnlockedAt(c,x.ci+1):true;   /* 记下答题前下一章是否已开，用来判断这次是否刚解锁 */
    host.hidden=false;
    /* 专注态：页签已把学习/练习收起来，这里再压暗周边——答题不被上下文淹没 */
    if(card) card.classList.add('is-testing');
    setTab(sec,k,'test');   /* 从别处触发（如侧导航直达）也要把测试面板切出来 */
    function segs(){
      var s='', i;
      for(i=0;i<items.length;i++) s+='<i class="'+(i<qi?(miss.indexOf(i)>=0?'bad':'ok'):(i===qi?'cur':''))+'"></i>';
      return s;
    }

      var t=items[qi], left=Math.max(0,5-wrong), ord=shufOrd(t.opts||[]);
      host.innerHTML='<div class="kcq-top"><span class="kcq-seg">'+segs()+'</span>'
        +'<span class="kcq-cnt">第 '+(qi+1)+' / '+items.length+' 题</span>'
        +'<span class="kcq-left" title="每错 1 题扣 1 星">剩余 '+'★'.repeat(left)+'☆'.repeat(5-left)+'</span></div>'
        +'<div class="kcq-q">'+mdInline(t.q)+'</div>'
        +'<div class="kcq-opts">'+ord.map(function(oi,pos){
            return '<button type="button" class="kcq-opt" data-oi="'+oi+'">'
              +'<span class="kcq-key">'+KEY.charAt(pos)+'</span><span>'+mdInline(t.opts[oi])+'</span></button>'; }).join('')+'</div>'
        +'<p class="kcq-why" hidden></p><button type="button" class="kcq-next" data-next hidden></button>';
      host.querySelectorAll('.kcq-opt').forEach(function(ob){
        ob.onclick=function(){
          if(host.querySelector('.kcq-opt.is-ok')) return;
          var oi=+ob.getAttribute('data-oi'), good=oi===t.a;
          if(!good){ wrong++; if(miss.indexOf(qi)<0) miss.push(qi); }
          host.querySelectorAll('.kcq-opt').forEach(function(y){ y.disabled=true; });
          var okBtn=host.querySelector('.kcq-opt[data-oi="'+t.a+'"]'); if(okBtn) okBtn.classList.add('is-ok');
          if(!good) ob.classList.add('is-bad');
          var why=host.querySelector('.kcq-why');
          why.className='kcq-why'+(good?'':' bad');
          why.innerHTML='<b>'+(good?'答对了':'正确答案是 '+KEY.charAt(ord.indexOf(t.a)))+'</b>'+(t.why?('　'+mdInline(t.why)):''); why.hidden=false;
          host.querySelector('.kcq-seg').innerHTML=segs().replace(/class="cur"/, good?'class="ok"':'class="bad"');
          var nx=host.querySelector('[data-next]');
          nx.textContent=(qi<items.length-1)?'下一题 →':'查看结果';
          nx.hidden=false; nx.focus();
          nx.onclick=function(){ qi++; if(qi<items.length) draw(); else end(); };
        };

    function end(){
      var right=items.length-wrong, stars=Math.max(0,5-wrong), i;
      if(right/items.length<0.5) stars=Math.min(stars,2);
      var was=secStar(c.id,k);
      if(stars>=3) secSet(c.id,k,{stars:Math.max(was,stars)});
      if(stars>=3 && !PREVIEW && window.PYQ_EV) PYQ_EV.send('lesson_done', c.id+':'+k+':'+stars);   /* v63.4 A7 */
      if(card) card.classList.remove('is-testing');
      if(stars>=3){
        /* v62.1 通关文案随「锁章不锁节」改口径：本节过关只是本章的一格，整章做完才开下一章 */
        /* v63.3 A5 ⑧（P3-28）：最后一章没有「下一章」——此前通关最后一章会提示「第 7 章已解锁」（全课只有 6 章） */
        var nCh=(chData(c).chapters||[]).length;
        var st2=x?chStats(c,x.ci):{left:0}, opened=x&&!wasCh&&(x.ci+1<nCh)&&chUnlockedAt(c,x.ci+1);
        var nx2=nextSec(c);
        host.innerHTML='<div class="kcq-res">'+(stars===5?qBurst():'')
          +'<div class="kcq-res-stars">'+starSeq(stars)+'</div>'
          +'<h4>'+(opened?('第 '+(x.ci+2)+' 章已解锁！'):'通关！')+'</h4>'
          +'<p>答对 '+right+' / '+items.length+' 题 · 本节 ★'+stars
          +(opened?'':(st2.left>0?('　本章还剩 <b>'+st2.left+'</b> 节'):''))+'</p>'
          +'<button type="button" class="kcq-next" data-cont>'
          +(nx2?('继续第 '+(nx2.ci+1)+'.'+(nx2.si+1)+' 节 →'):'看看学习进度 →')+'</button>'
          +(stars<5?'<button type="button" class="kcq-res-alt" data-retry>重测冲满星</button>':'')+'</div>';
        host.querySelector('[data-cont]').onclick=function(){ refresh(c, opened?(x.ci+1):-1); };
      }else{
        /* 未通关不只说「再来一次」：列出错了哪几题、指回对应学习内容（测试的教学价值全在这里） */
        var list='';
        for(i=0;i<miss.length;i++){
          var t2=items[miss[i]], q=String(t2.q||'').replace(/\[\[(.*?)\]\]/g,'$1').slice(0,22);
          list+='<div class="kcq-missit"><b>第 '+(miss[i]+1)+' 题</b><span>'+esc(q)+'…</span></div>';
        }
        host.innerHTML='<div class="kcq-res">'
          +'<div class="kcq-res-stars">'+starSeq(stars)+'</div>'
          +'<h4>还差 '+Math.max(1,3-stars)+' 星就能通关</h4>'
          +'<p>答对 '+right+' / '+items.length+' 题——<b>★★★ 算本节通关</b>。这几题错了，回看对应内容：</p>'
          +'<div class="kcq-miss">'+list+'</div>'
          +'<button type="button" class="kcq-next" data-review>回看本节学习内容</button>'
          +'<button type="button" class="kcq-res-alt" data-retry>直接重测</button></div>';
        host.querySelector('[data-review]').onclick=function(){
          if(!card) return;
          card.classList.remove('is-testing');
          setTab(sec,k,'learn');
          card.scrollIntoView({block:'start',behavior:'smooth'});
        };
      }
      var rt=host.querySelector('[data-retry]');
      if(rt) rt.onclick=function(){ qi=0; wrong=0; miss=[]; if(card) card.classList.add('is-testing'); draw(); };
    }
    draw();
  }
  /* v62.0 课程卡是真实链接（?c=<id>），不再拦截点击——中键/新标签/收藏全都正常 */

  /* v61.8 闯关：逐题四选一，选后即判并给解析；答完出星级——全对 3 星、错 1 题 2 星、
     正确率 ≥60% 得 1 星（通关线），通关自动打卡并解锁下一关；未达线可无限重来 */
  function startQuiz(c,i){
    var sec=document.getElementById('kcd-'+c.id); if(!sec) return;
    var host=sec.querySelector('[data-qhost="'+i+'"]'); if(!host) return;
    var qz=((chData(c).chapters||[])[i]||{}).quiz||[]; if(!qz.length) return;
    var qi=0, wrong=0;
    host.hidden=false;
    function qDraw(){
      var t=qz[qi], ord=shufOrd(t.opts||[]);
      host.innerHTML='<div class="kq-head">第 '+(qi+1)+' / '+qz.length+' 题'+(wrong?'　·　已错 '+wrong:'')+'</div>'
        +'<div class="kq-q">'+jpq(t.q)+'</div>'
        +'<div class="kq-opts">'+ord.map(function(oi){
            return '<button type="button" class="kq-opt" data-oi="'+oi+'">'+jpq(t.opts[oi])+'</button>'; }).join('')+'</div>'
        +'<p class="kq-why" hidden></p><button type="button" class="kq-next" data-next hidden></button>';
      host.querySelectorAll('.kq-opt').forEach(function(ob){
        ob.onclick=function(){
          if(host.querySelector('.kq-opt.ok')) return;
          var oi=+ob.dataset.oi, good=oi===t.a;
          if(!good) wrong++;
          host.querySelectorAll('.kq-opt').forEach(function(x){ x.disabled=true; });
          var okBtn=host.querySelector('.kq-opt[data-oi="'+t.a+'"]'); if(okBtn) okBtn.classList.add('ok');
          if(!good) ob.classList.add('bad');
          var why=host.querySelector('.kq-why');
          why.innerHTML=(good?'✅ 答对了！':'❌ 正确答案已标绿。')+(t.why?('　'+jpq(t.why)):''); why.hidden=false;
          var nx=host.querySelector('[data-next]');
          nx.textContent=(qi<qz.length-1)?'下一题 →':'查看结果';
          nx.hidden=false;
          nx.onclick=function(){ qi++; if(qi<qz.length) qDraw(); else qEnd(); };
        };
      });
      host.scrollIntoView({block:'nearest'});
    }
    function qEnd(){
      var right=qz.length-wrong;
      var stars=wrong===0?3:(wrong===1?2:(right/qz.length>=0.6?1:0));
      if(stars>0){
        markDone(c.id,i); setStar(c.id,i,stars);
        host.innerHTML='<div class="kq-result kq-pass">'+qBurst()+'🎉 <b>通关！</b>答对 '+right+' / '+qz.length+' 题　'
          +'<span class="kq-star">'+starTxt(stars)+'</span>'
          +'<button type="button" class="kq-next" data-cont>继续 →</button></div>';
        host.querySelector('[data-cont]').onclick=function(){ refresh(c); };
      }else{
        host.innerHTML='<div class="kq-result kq-fail">差一点！答对 '+right+' / '+qz.length
          +' 题（通关需正确率 ≥60%）——回头看看上面的内容点，再来一次。'
          +'<button type="button" class="kq-next" data-retry>重新闯关</button></div>';
        host.querySelector('[data-retry]').onclick=function(){ qi=0; wrong=0; qDraw(); };
      }
    }
    qDraw();
  }
  /* v63.3 A5 ⑤（评审团 P2-65 种子题部分，从 D1 前移）：每次出题都打乱选项顺序——此前选项照原顺序排、
     70% 的答案在 B，盲选 B 就能过关。按钮的 data-oi 仍是原索引，判分与解析不变；「以上……」类选项固定在最后。 */
  function shufOrd(opts){
    var ord=[], tail=[], i, j, t;
    for(i=0;i<opts.length;i++) (/^以上/.test(String(opts[i]||''))?tail:ord).push(i);
    for(i=ord.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=ord[i]; ord[i]=ord[j]; ord[j]=t; }
    return ord.concat(tail);
  }
  function qBurst(){
    var em=['🎉','🎵','⭐','🎶','✨','🥁'], out='<span class="kq-burst" aria-hidden="true">';
    for(var k=0;k<10;k++){
      out+='<i style="--dx:'+((Math.random()*2-1)*130).toFixed(0)+'px;--dr:'+((Math.random()*2-1)*160).toFixed(0)
        +'deg;animation-delay:'+(Math.random()*.25).toFixed(2)+'s">'+em[k%em.length]+'</i>';
    }
    return out+'</span>';
  }
  render();

  /* 服务端数据优先：工作台里编辑/新增的课程即时生效；接口不可达（file:// / 离线）用内嵌兜底；
     草稿预览模式只看本机数据 */
  if(!PREVIEW) fetch('/api/courses').then(function(r){ return r.ok? r.json():null; }).then(function(j){
    if(j && j.courses && j.courses.length){ courses=j.courses; render(); }
  }).catch(function(){});
})();
</script>
