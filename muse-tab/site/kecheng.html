<script>
(function(){
  var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var courses=[];

  /* 打卡进度：localStorage 键 pyq-learn-v1（新键，不碰 musetab-* 红线）——
     { 课程id: [已完成章节下标…] }，只是本机学习便签，清了也不影响任何账号数据 */
  var LK='pyq-learn-v1';
  function prog(){ try{ return JSON.parse(localStorage.getItem(LK))||{}; }catch(_){ return {}; } }
  function progSet(p){ try{ localStorage.setItem(LK, JSON.stringify(p)); }catch(_){} }
  function doneOf(cid){ return (prog()[cid]||[]); }
  function toggleDone(cid,i){
    var p=prog(), l=(p[cid]||[]).slice(), k=l.indexOf(i);
    if(k>=0) l.splice(k,1); else l.push(i);
    p[cid]=l; progSet(p); return l;
  }
  /* v61.8 闯关星级：同一 LK 值里加 's:课程id' 兄弟键（doneOf 只读 p[cid]，互不打扰） */
  function markDone(cid,i){ var p=prog(), l=(p[cid]||[]).slice(); if(l.indexOf(i)<0) l.push(i); p[cid]=l; progSet(p); return l; }
  function starsOf(cid){ return prog()['s:'+cid]||{}; }
  function setStar(cid,i,n){ var p=prog(), s=p['s:'+cid]||{}; s[i]=Math.max(+s[i]||0,n); p['s:'+cid]=s; progSet(p); }

  /* v61.8 简谱记号迷你渲染器：文案里 [[…]] 段落按 token 渲染成简谱记号。
     token＝数字 0-7 + 修饰：' 高八度点 ／ , 低八度点 ／ - 增时线 ／ _ 减时线 ／ = 双减时线 ／ . 附点 */
  function jpTok(t){
    var m=/^([0-7])([',]*)([-_=.]*)$/.exec(t);
    if(!m) return esc(t);
    var up=(m[2].match(/'/g)||[]).length, dn=(m[2].match(/,/g)||[]).length;
    var tail=m[3]||'', ul=tail.indexOf('=')>=0?2:(tail.indexOf('_')>=0?1:0);
    var dot=function(n){ var s='';(n=n||1);for(var k=0;k<n;k++)s+='<b></b>';return s; };
    var out='<span class="jpn'+(ul?' u'+ul:'')+'">'
      +'<i class="jd'+(up?'':' off')+'">'+dot(up)+'</i>'
      +'<span class="jg">'+m[1]+'</span>'
      +'<i class="jd'+(dn?'':' off')+'">'+dot(dn)+'</i></span>';
    var da=(tail.match(/-/g)||[]).length;
    for(var k2=0;k2<da;k2++) out+='<span class="jpd">—</span>';
    if(tail.indexOf('.')>=0) out+='<span class="jpp">·</span>';

  }
  function jpq(s){
    return String(s==null?'':s).split(/\[\[(.*?)\]\]/).map(function(seg,i2){

  }

    var d=doneOf(cid).length, pc=n? Math.round(d*100/n):0;

      +(function(){ var s=starsOf(c.id), t=0, k2; for(k2 in s) t+=+s[k2]||0;
          return t?('<i class="k k-star">★ '+t+'</i>'):''; })()+'</span>'
      +'<span class="kc-prog">'+bar(c.id,n)+'</span>'
      +'<span class="kc-go">'+(done? (done>=n?'🎉 已学完，回顾 →':'继续学习 →') : '开始学习 →')+'</span>'

      +(hasQ
        ?'<button type="button" class="kc-tick kc-quizbtn'+(did?' pass':'')+'" data-quiz="'+i+'">'
          +(did?('<i class="kq-star">'+starTxt(st)+'</i> 已通关 · 重闯'):('🎯 闯关（'+ch.quiz.length+' 题）'))+'</button>'
        :'<button type="button" class="kc-tick" data-tick="'+i+'" title="标记本章完成">'+(did?'✓ 已完成':'完成打卡')+'</button>')
      +'</div>'
      +(ch.goal?'<p class="kc-goal">目标：'+jpq(ch.goal)+'</p>':'')
      +((ch.points&&ch.points.length)?('<ul>'+ch.points.map(function(p){ return '<li>'+jpq(p)+'</li>'; }).join('')+'</ul>'):'')
      +(ch.task?'<p class="kc-task"><b>练习任务</b>：'+jpq(ch.task)+'</p>':'')
      +((ch.links&&ch.links.length)?('<p class="kc-res">配套：'+ch.links.map(function(l){
          return '<a href="'+esc(l.href)+'">'+esc(l.t)+'</a>'; }).join(' · ')+'</p>'):'')
      +(hasQ?'<div class="kc-quiz" data-qhost="'+i+'" hidden></div>':'')
      +'</div>';
  }
  function detailInner(c){
    var d=chData(c), chs=d.chapters||[];
    return '<div class="kc-dhead"><a class="kc-back" href="#" data-back>← 全部课程</a>'
      +(PREVIEW?'<p class="kc-pv">🔍 草稿预览（仅本机可见，未发布）</p>':'')
      +'<h2><span class="kc-demoji">'+esc(d.emoji||'🎼')+'</span>'+esc(c.title)+'</h2>'
      +'<p class="kc-dsub">'+esc(c.subtitle||'')+'</p>'
      +(c.intro?'<p class="kc-dintro">'+esc(c.intro)+'</p>':'')
      +'<div class="kc-dprog" data-prog>'+bar(c.id,chs.length)+'</div></div>'
      +'<div class="kc-list">'+chs.map(function(ch,i){ return chapter(c,ch,i); }).join('')+'</div>'
      +'<p class="kc-fin" data-fin '+(doneOf(c.id).length>=chs.length&&chs.length?'':'hidden')+'>🎉 恭喜结课！'
      +(c.instrument==='kids'?'别忘了给小音乐家颁一张自制奖状。':'去谱库挑下一首想弹的歌吧。')
      +' <a href="index.html">去谱库 →</a></p>';
  }
  function detail(c){
    var d=chData(c);
    return '<section class="kc-detail" id="kcd-'+esc(c.id)+'" data-fam="'+esc(d.fam||'g')+'" hidden>'
      +detailInner(c)+'</section>';
  }
  function refresh(c){
    var sec=document.getElementById('kcd-'+c.id); if(!sec) return;
    sec.innerHTML=detailInner(c); wireCourse(c); wireNav(sec);
  }
  function render(){
    document.getElementById('kc-cards').innerHTML=courses.map(card).join('');
    document.getElementById('kc-details').innerHTML=courses.map(detail).join('');
    wire();
    var h=location.hash.replace('#','');
    if(h && document.getElementById('kcd-'+h)) open(h,true);
    else if(PREVIEW && courses[0]) open(courses[0].id,true);   /* 草稿预览直接进详情 */
  }
  function open(cid, silent){
    document.getElementById('kc-cards').hidden=true;
    courses.forEach(function(c){ var el=document.getElementById('kcd-'+c.id); if(el) el.hidden=(c.id!==cid); });
    if(!silent){ try{ history.replaceState(null,'','#'+cid); }catch(_){} }
    window.scrollTo({top:0});
  }
  function closeAll(){
    document.getElementById('kc-cards').hidden=false;
    courses.forEach(function(c){ var el=document.getElementById('kcd-'+c.id); if(el) el.hidden=true; });
    try{ history.replaceState(null,'',location.pathname); }catch(_){}
  }
  function wireNav(root){
    (root||document).querySelectorAll('[data-back]').forEach(function(a){
      a.addEventListener('click',function(e){ e.preventDefault(); closeAll(); });
    });
  }
  function wireCourse(c){
    var sec=document.getElementById('kcd-'+c.id); if(!sec) return;
    var chs=(chData(c).chapters||[]);
    sec.querySelectorAll('[data-tick]').forEach(function(b){
      b.onclick=function(){
        var i=+b.dataset.tick, l=toggleDone(c.id,i), did=l.indexOf(i)>=0;
        b.textContent=did?'✓ 已完成':'完成打卡';
        b.closest('.kc-ch').classList.toggle('kc-done',did);
        sec.querySelector('[data-prog]').innerHTML=bar(c.id,chs.length);
        var fin=sec.querySelector('[data-fin]'); if(fin) fin.hidden=!(l.length>=chs.length&&chs.length);
        refresh(c);   /* 解锁状态随打卡变——整段重绘一次 */
      };
    });
    sec.querySelectorAll('[data-quiz]').forEach(function(b){
      b.onclick=function(){ startQuiz(c,+b.dataset.quiz); };
    });
  }
  function wire(){
    document.querySelectorAll('[data-open]').forEach(function(a){
      a.addEventListener('click',function(e){ e.preventDefault(); open(a.dataset.open); });
    });
    wireNav(document);
    courses.forEach(wireCourse);
  }

  /* v61.8 闯关：逐题四选一，选后即判并给解析；答完出星级——全对 3 星、错 1 题 2 星、
     正确率 ≥60% 得 1 星（通关线），通关自动打卡并解锁下一关；未达线可无限重来 */
  function startQuiz(c,i){
    var sec=document.getElementById('kcd-'+c.id); if(!sec) return;
    var host=sec.querySelector('[data-qhost="'+i+'"]'); if(!host) return;
    var qz=((chData(c).chapters||[])[i]||{}).quiz||[]; if(!qz.length) return;
    var qi=0, wrong=0;
    host.hidden=false;
    function qDraw(){
      var t=qz[qi];
      host.innerHTML='<div class="kq-head">第 '+(qi+1)+' / '+qz.length+' 题'+(wrong?'　·　已错 '+wrong:'')+'</div>'
        +'<div class="kq-q">'+jpq(t.q)+'</div>'
        +'<div class="kq-opts">'+t.opts.map(function(o,oi){
            return '<button type="button" class="kq-opt" data-oi="'+oi+'">'+jpq(o)+'</button>'; }).join('')+'</div>'
        +'<p class="kq-why" hidden></p><button type="button" class="kq-next" data-next hidden></button>';
      host.querySelectorAll('.kq-opt').forEach(function(ob){
        ob.onclick=function(){
          if(host.querySelector('.kq-opt.ok')) return;
          var oi=+ob.dataset.oi, good=oi===t.a;
          if(!good) wrong++;
          host.querySelectorAll('.kq-opt').forEach(function(x){ x.disabled=true; });
          var okBtn=host.querySelector('.kq-opt[data-oi="'+t.a+'"]'); if(okBtn) okBtn.classList.add('ok');
          if(!good) ob.classList.add('bad');
          var why=host.querySelector('.kq-why');
          why.innerHTML=(good?'✅ 答对了！':'❌ 正确答案已标绿。')+(t.why?('　'+jpq(t.why)):''); why.hidden=false;
          var nx=host.querySelector('[data-next]');
          nx.textContent=(qi<qz.length-1)?'下一题 →':'查看结果';
          nx.hidden=false;
          nx.onclick=function(){ qi++; if(qi<qz.length) qDraw(); else qEnd(); };
        };
      });
      host.scrollIntoView({block:'nearest'});
    }
    function qEnd(){
      var right=qz.length-wrong;
      var stars=wrong===0?3:(wrong===1?2:(right/qz.length>=0.6?1:0));
      if(stars>0){
        markDone(c.id,i); setStar(c.id,i,stars);
        host.innerHTML='<div class="kq-result kq-pass">'+qBurst()+'🎉 <b>通关！</b>答对 '+right+' / '+qz.length+' 题　'
          +'<span class="kq-star">'+starTxt(stars)+'</span>'
          +'<button type="button" class="kq-next" data-cont>继续 →</button></div>';
        host.querySelector('[data-cont]').onclick=function(){ refresh(c); };
      }else{
        host.innerHTML='<div class="kq-result kq-fail">差一点！答对 '+right+' / '+qz.length
          +' 题（通关需正确率 ≥60%）——回头看看上面的内容点，再来一次。'
          +'<button type="button" class="kq-next" data-retry>重新闯关</button></div>';
        host.querySelector('[data-retry]').onclick=function(){ qi=0; wrong=0; qDraw(); };
      }
    }
    qDraw();
  }
  function qBurst(){
    var em=['🎉','🎵','⭐','🎶','✨','🥁'], out='<span class="kq-burst" aria-hidden="true">';
    for(var k=0;k<10;k++){
      out+='<i style="--dx:'+((Math.random()*2-1)*130).toFixed(0)+'px;--dr:'+((Math.random()*2-1)*160).toFixed(0)
        +'deg;animation-delay:'+(Math.random()*.25).toFixed(2)+'s">'+em[k%em.length]+'</i>';
    }
    return out+'</span>';
  }
  render();

  /* 服务端数据优先：工作台里编辑/新增的课程即时生效；接口不可达（file:// / 离线）用内嵌兜底；
     草稿预览模式只看本机数据 */
  if(!PREVIEW) fetch('/api/courses').then(function(r){ return r.ok? r.json():null; }).then(function(j){
    if(j && j.courses && j.courses.length){ courses=j.courses; render(); }
  }).catch(function(){});
})();
</script>
</body>
