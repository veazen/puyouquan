  function titleText(){
    if(st.favOnly) return '我的收藏';
    if(st.q.trim()) return '搜索结果';
    if(st.pz){ var t=Z.pzDef(st.pz).name; if(st.sub) t+=' › '+Z.subName(st.pz, st.sub); if(st.inst) t+=' › '+Z.INST[st.inst]; return t; }
    if(st.sub) return Z.subName('', st.sub);
    return (xActive() || st.sort!=='new')? '筛选结果' : '最新上架';
  }
  function draw(){
    var sm=srvMode(), R=sm? srvQuery() : localQuery(), list=R.list;
    title.textContent=titleText();
    var browse=!searching(), show=browse? list.slice(0, st.shown) : list;
    var pzT=sm? (R.pz||'') : st.pz, subT=sm? (R.sub||'') : st.sub, cw=convWords(pzT, subT), h='', last=-1;
    show.forEach(function(e, i){
      if(e.sec===2 && last!==2) h+='<div class="lib-sep" data-sec="2">以下是'+cw[0]+'，打开时用'+cw[1]+'看</div>';
      if(e.sec===3 && last!==3 && TAIL[R.tail]) h+='<div class="lib-sep" data-sec="3">'+TAIL[R.tail]+'</div>';
      last=e.sec;
      h+=PYQ_LIB.card(e.nota? Object.assign({}, e.c, {nota:e.nota}) : e.c, i);
    });
    /* 可转提示：原稿后面一行「还有 N 首是五线谱 · 用简谱看 ›」（没展开时） */
    var convLine='';
    if(!R.convShown && R.nConv>0 && (sm? !!pzT : convPz())) convLine='<div class="lib-conv" id="lib-conv">还有 '+R.nConv+' 首是'+cw[0]+' · <button type="button" class="lib-convgo" data-conv>用'+cw[1]+'看 ›</button></div>';
    if(!show.length){
      var mk=isMp()? '发到电脑做' : (st.pz||st.sub? '自己做一份 →' : '自己配一份谱 →');
      h='<div class="lib-empty"><b>'+(st.favOnly?'收藏夹还是空的':(st.pz||st.sub) && !st.q.trim()? '这里还没有谱':'没有找到相关曲谱')+'</b>'
        +(st.favOnly?'点 ♥ 收藏喜欢的谱，跨设备随时打开。':(st.pz||st.sub) && !st.q.trim()? '换个分类看看，或者自己做一份。':'换个关键词试试，或用智能配谱自己出一份。')
        +convLine+'<br><a class="btn" id="empty-make" href="//zhipu.puyouquan.com/">'+mk+'</a>'
        +'<br><a href="mailto:support@puyouquan.com?subject=想要的谱" style="display:inline-block;margin-top:12px;font-size:12.5px;color:var(--muted)">告诉我们你想要的谱 →</a></div>';
      convLine='';
    }else{
      /* 「还有 N 首」放在原稿之后、尾节之前 */
      if(convLine){ var k=h.indexOf('<div class="lib-sep" data-sec="3">'); h= k>=0? h.slice(0,k)+convLine+h.slice(k) : h+convLine; }
    }
    grid.innerHTML=h;
    var c=$('lib-count'); if(c) c.textContent=(R.totalN!=null? R.totalN : list.length)+' 首';
    /* v63.4 A7 零结果搜索：退路之后仍 0、接口应答过（或接口不通且没被截断）才记，同一个词只记一次 */
    var zq=normQ(st.q);
    if(!list.length && zq && !st.favOnly && zq!==zrLast && window.PYQ_EV){
      var done=sm || (srv && srv.q===zq) || srvFail[zq];
      if(done && (sm || !truncated() || srvFail[zq])){ zrLast=zq; PYQ_EV.send('zero_result', (zq+(sm && srv.parse && srv.parse.conds && srv.parse.conds.length? ' ['+srv.parse.conds.map(function(x){ return x.k+':'+x.v; }).join(',')+']' : '')).slice(0,60)); }
    }
    moreWrap.hidden = sm? !(srv.list.length<srv.total) : (!browse || list.length<=st.shown);
    mobileMakeLinks();
    if(show.length && !grid.dataset.ready) requestAnimationFrame(function(){ grid.dataset.ready='1'; });
    if(st.drawer) drawer();
  }

  /* ---- 筛选抽屉（多选，结果数随选项变化，「清空」一键；手机为底部弹层，二级行末开关也并进来） ---- */
  function drawer(){
    if(!st.drawer){ drawerEl.hidden=true; document.body.classList.remove('lib-dopen'); return; }
    var x=st.x, tab=st.pz==='jita' || st.pz==='uku', mob=isMobile();
    var base=Z.query(pool(), {f:fNow(), words:normQ(st.q), conv:false, x:Object.assign({}, x, {keys:[], meters:[], hacc:st.hacc})}).list;
    var kc={}, mc={};
    base.forEach(function(e){ var c=e.c, k=tab && c.fx && c.fx.fkey? c.fx.fkey : String(c.key||''); if(k) kc[k]=(kc[k]||0)+1; if(c.beats>0 && c.unit>0){ var m=c.beats+'/'+c.unit; mc[m]=(mc[m]||0)+1; } });
    var top=function(o, sel){ return Object.keys(o).sort(function(a,b){ return o[b]-o[a] || (a<b?-1:1); }).slice(0,10).concat(sel.filter(function(v){ return !o[v]; })); };
    var dc=function(attr, label, on){ return '<button type="button" class="fchip'+(on?' on':'')+'" '+attr+' aria-pressed="'+(on?'true':'false')+'">'+label+'</button>'; };
    var g=function(t, inner){ return inner? '<div class="ld-g"><b>'+t+'</b><div class="ld-c">'+inner+'</div></div>' : ''; };
    var h='';
    if(mob && st.pz){ var tb=tailBits().replace(/<a class="lib-ztl"[^>]*>[^<]*<\/a>/, ''); if(tb) h+=g(st.pz==='hechang'? '伴奏' : '开关', tb.replace(/<span class="lib-rl">[^<]*<\/span>/, '')); }
    h+=g('编制', [[1,'独唱 / 独奏'],[2,'二部'],[3,'三部'],[4,'四部以上']].map(function(a){ return dc('data-dx="parts:'+a[0]+'"', a[1], x.parts.indexOf(a[0])>=0); }).join(''));
    h+=g('能用来', dc('data-dx="chord"', '已配和弦', x.chord)+dc('data-dx="acc"', '带伴奏', x.acc)+dc('data-dx="verses"', '多段歌词', x.verses));
    h+=g('风格', dc('data-dx="erge"', '儿歌', x.erge));
    h+=g(tab? '调（按指法）' : '调', top(kc, x.keys).map(function(k){ return dc('data-dx="key:'+esc(k)+'"', tab? esc(k)+'调指法' : esc(k)+' 调', x.keys.indexOf(k)>=0); }).join(''));
    h+=g('拍号', top(mc, x.meters).map(function(m){ return dc('data-dx="meter:'+esc(m)+'"', esc(m), x.meters.indexOf(m)>=0); }).join(''));
    h+=g('速度', [['slow','慢（♩<72）'],['mid','中速'],['fast','快（♩>120）']].map(function(a){ return dc('data-dx="speed:'+a[0]+'"', a[1], x.speeds.indexOf(a[0])>=0); }).join(''));
    var n=srvMode()? srv.total : localQuery().list.length;
    h+='<div class="ld-ft"><span>'+n+' 首 · 调拍速都能一键移调</span><button type="button" class="btn ghost" data-dclr>清空</button><button type="button" class="btn" data-dok>完成</button></div>';
    drawerEl.innerHTML=h; drawerEl.hidden=false;
    document.body.classList.toggle('lib-dopen', mob);
  }

  /* ---- 接口：搜索解析（防抖 300ms）· 库被截断时按当前筛选补齐全库 ---- */
  function qsNow(o){
    var p=[], x=st.x;
    if(st.pz) p.push('pz='+st.pz); if(st.sub) p.push('sub='+st.sub); if(st.inst) p.push('inst='+st.inst);
    if(x.parts.length) p.push('parts='+x.parts.join(',')); if(x.chord) p.push('chord=1'); if(x.acc) p.push('acc=1'); if(x.verses) p.push('verses=1'); if(x.erge) p.push('erge=1');
    if(x.keys.length) p.push('key='+encodeURIComponent(x.keys.join(','))); if(x.meters.length) p.push('meter='+encodeURIComponent(x.meters.join(','))); if(x.speeds.length) p.push('speed='+x.speeds.join(','));
    if(st.hacc) p.push('hacc='+st.hacc); if(st.sort!=='new') p.push('sort='+st.sort);
    if(o && o.conv!=null) p.push('conv='+(o.conv?1:0)); if(o && o.more) p.push('more=1');
    if(o && o.q) p.push('q='+encodeURIComponent(o.q));
    return p.join('&');
  }
  /* 接口卡片带本次筛选的段号 sec 与可转 nota；并进本地卡池前去掉（换个筛选时它们不再成立） */
  function plain(s){ var o={}, k; for(k in s) if(k!=='sec' && k!=='nota') o[k]=s[k]; return o; }
  function remoteSearch(now){
    var q=normQ(st.q); clearTimeout(rtimer);
    if(!q){ srv=null; return; }
    rtimer=setTimeout(function(){
      var conv=convPz()? (st.conv || null) : null, qs=qsNow({q:q, more:true, conv:conv})+'&size=60';
      fetch('/api/pub/scores?'+qs, {credentials:'include'}).then(function(r){ return r.ok? r.json() : null; })
        .then(function(j){
          if(normQ(st.q)!==q) return;
          if(!j){ srvFail[q]=1; draw(); return; }
          var sc=(j.scores||[]).map(Z.norm), p=j.parse||null;
          sc.forEach(function(s){ if(!own(extra, s.id)) extra[s.id]=plain(s); });
          /* 只有谱种词（「简谱」「钢琴谱」）＝点了这个一级（T8）：清掉搜索框，亮那一格 */
          if(p && p.only && !p.words && (p.pz || p.sub)){
            st.pz=p.pz && Z.has(p.pz)? p.pz : ''; st.sub=p.sub && Z.has(st.pz, p.sub)? p.sub : ''; st.inst=''; st.q=''; qIn.value=''; srv=null;
            track(st.pz? 'pz' : 'sub', st.pz||st.sub); syncURL(); chips(); draw(); remoteFilter(); return;
          }
          var parsed=!!(p && ((p.conds||[]).length || p.hint || p.tail || j.fb || normQ(p.words)!==q));
          srv={q:q, qs:qs, parsed:parsed, parse:p, fb:j.fb||'', list:sc, total:j.total|0, n0:j.n0|0, nConv:j.nConv|0, conv:!!j.conv, tail:j.tail||'', pz:j.pz||'', sub:j.sub||'', page:0};
          if(parsed && p && p.conds) p.conds.forEach(function(c){ if(c.k==='pz'||c.k==='sub'||c.k==='inst'||c.k==='zt') track('q2f', String(c.v)); });
          chips(); draw();
        }).catch(function(){ if(normQ(st.q)===q){ srvFail[q]=1; draw(); } });
    }, now? 0 : 300);
  }
  function srvMore(){
    var page=srv.page+1, s0=srv;
    fetch('/api/pub/scores?'+s0.qs+'&page='+page, {credentials:'include'}).then(function(r){ return r.ok? r.json() : null; }).then(function(j){
      if(!j || srv!==s0) return; s0.page=page; var have={}; s0.list.forEach(function(c){ have[c.id]=1; });
      (j.scores||[]).map(Z.norm).forEach(function(c){ if(!have[c.id]){ s0.list.push(c); have[c.id]=1; } }); draw(); }).catch(function(){});
  }
  function remoteFilter(){
    if(!truncated() || st.q.trim() || !(st.pz || st.sub || st.inst || xActive() || st.hacc)) return;
    var key=qsNow({conv:true, more:true}); if(fetched[key]) return; fetched[key]=1;
    (function page(n){
      fetch('/api/pub/scores?'+key+'&size=60&page='+n, {credentials:'include'}).then(function(r){ return r.ok? r.json() : null; }).then(function(j){
        if(!j) return; (j.scores||[]).map(Z.norm).forEach(function(s){ if(!own(extra, s.id)) extra[s.id]=plain(s); });
        draw(); if((n+1)*60<(j.total|0) && n<4) page(n+1); }).catch(function(){});
    })(0);
  }
  function changed(dim, v){ if(dim) track(dim, v); syncURL(); chips(); draw(); if(srvMode() || normQ(st.q)) remoteSearch(true); else remoteFilter(); }

  /* 最近看过（智能可感知）：点击卡片瞬间在本域记录（观看页在 puku 子域，localStorage 不同源，
     必须点击时记）；回访时置顶一行，谱已下架静默过滤。新键 pyq-recent，不碰 musetab-* 红线 */
  var RK='pyq-recent';
  function recGet(){ try{ return JSON.parse(localStorage.getItem(RK))||[]; }catch(_){ return []; } }
  function recAdd(id){ try{ var l=recGet().filter(function(r){ return r.id!==id; });
    l.unshift({id:id, t:Date.now()}); localStorage.setItem(RK, JSON.stringify(l.slice(0,8))); }catch(_){} }
  document.getElementById('lib-sec').addEventListener('click', function(e){
    var a=e.target.closest('.cc-card'); if(a){ var m2=/[?&]pub=([A-Za-z0-9_-]+)/.exec(a.getAttribute('href')||''); if(m2) recAdd(m2[1]); return; }
    if(e.target.closest('[data-conv]')){ st.conv=true; try{ sessionStorage.setItem('pyq-lib-conv','1'); }catch(_){} changed('conv', '1'); return; }
    var d=e.target.closest('[data-dx]');
    if(d){ var v=d.dataset.dx.split(':'), k=v[0], val=v.slice(1).join(':'), x=st.x;
      if(k==='parts'){ var n=+val, i=x.parts.indexOf(n); if(i>=0) x.parts.splice(i,1); else x.parts.push(n); }
      else if(k==='key' || k==='meter' || k==='speed'){ var arr=x[k==='key'?'keys':k==='meter'?'meters':'speeds'], j=arr.indexOf(val); if(j>=0) arr.splice(j,1); else arr.push(val); }
      else x[k]=!x[k];
      changed(); return; }
    if(e.target.closest('[data-dclr]')){ st.x=X0(); st.hacc=''; changed(); return; }
    if(e.target.closest('[data-dok]')){ st.drawer=false; drawer(); chips(); return; }
    var tg=e.target.closest('[data-tg],[data-hacc]'); if(tg && drawerEl.contains(tg)){ hdlTg(tg); return; }
  });
  function hdlTg(b){
    if(b.dataset.tg!==undefined){ st.x[b.dataset.tg]=!st.x[b.dataset.tg]; changed(); return true; }
    if(b.dataset.hacc!==undefined){ st.hacc=b.dataset.hacc; changed('acc', st.hacc==='yes'? 'yes' : st.hacc==='no'? 'no' : 'all'); return true; }
    return false;
  }
  function renderRecent(){
    var sec=$('recent-sec'), rg=$('recent-grid');
    if(!sec||!all.length) return;
    var byId={}; all.forEach(function(s){ byId[s.id]=s; });
    var cards=recGet().map(function(r){ return byId[r.id]; }).filter(Boolean).slice(0,3);
    if(cards.length){ rg.innerHTML=cards.map(PYQ_LIB.card).join(''); rg.dataset.ready='1'; sec.hidden=false; }
  }
  /* ---- 头部点击：一级 / 二级 / 乐器 / 开关 / 专题 / 条件块 ---- */
  document.querySelector('.home-hero').addEventListener('click', function(e){
    var b=e.target.closest('button,a'); if(!b) return;
    var ds=b.dataset;
    if(ds.zt!==undefined){ track('zt', ds.zt); if(ds.zt==='ketang'){ e.preventDefault(); st.pz=''; st.sub='duizhao'; st.inst=''; st.mInst=false; changed(); } return; }
    if(ds.pz!==undefined){
      if(st.pz===ds.pz){ st.pz=''; st.sub=''; st.inst=''; }   /* 再点已选的＝回到全部 */
      else if(st.pz!==ds.pz){ st.pz=ds.pz; st.sub=''; st.inst=''; st.hacc=''; st.x.acc=false; st.x.chord=false; st.instMore=false; }
      st.favOnly=false; st.mInst=false; changed('pz', ds.pz); return; }
    if(ds.cat==='all' || ds.back!==undefined){ st.pz=''; st.sub=''; st.inst=''; st.hacc=''; st.favOnly=false; st.mInst=false; changed(); return; }
    if(ds.fav!==undefined){
      if(!Object.keys(favs).length && window.PYQ_ACCT && !PYQ_ACCT.user){ PYQ_ACCT.openLogin(); return; }
      st.favOnly=!st.favOnly; changed(); return; }
    if(ds.sub!==undefined){
      if(st.sub===ds.sub && !(ds.sub==='qiyue' && isMobile() && !st.mInst)){ st.sub=''; st.inst=''; }
      else { st.sub=ds.sub; st.inst=''; }
      if(ds.sub==='qiyue' && isMobile() && st.sub) st.mInst=true;
      changed('sub', ds.sub); return; }
    if(ds.inst!==undefined){
      if(st.inst===ds.inst){ st.inst=''; } else { st.inst=ds.inst; st.sub=''; }   /* 选乐器＝二级「器乐」（五线谱另含「重奏」里该乐器的，T20） */
      changed('inst', ds.inst); return; }
    if(ds.iback!==undefined){ st.mInst=false; chips(); return; }
    if(ds.imore!==undefined){ st.instMore=!st.instMore; chips(); return; }
    if(hdlTg(b)) return;
    if(ds.rm!==undefined){ st.q=ds.rm; qIn.value=ds.rm; srv=null; changed(); return; }
    if(ds.rmsub!==undefined){ st.sub=''; changed(); return; }
    if(ds.hmore!==undefined){ st.hintMore=true; conds(); return; }
    if(ds.hinst!==undefined){ var nm=Z.INST[ds.hinst], q2=normQ(st.q).split(' ').map(function(w){ return /^器乐谱?$/.test(w)? nm : w; }).join(' ');
      if(q2===normQ(st.q)) q2=(q2+' '+nm).trim(); st.q=q2; qIn.value=q2; track('q2f', ds.hinst); changed(); return; }
  });
  fbtn.addEventListener('click', function(){ st.drawer=!st.drawer; drawer(); chips(); if(st.drawer){ var f0=drawerEl.querySelector('button'); if(f0) try{ f0.focus({preventScroll:true}); }catch(_){} } });
  sortEl.addEventListener('change', function(){ st.sort=sortEl.value; changed(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && st.drawer){ st.drawer=false; drawer(); chips(); fbtn.focus(); } });
  document.addEventListener('click', function(e){ if(st.drawer && isMobile() && e.target===document.body){ st.drawer=false; drawer(); chips(); } });
  qIn.addEventListener('input', function(){
    st.q=qIn.value; draw(); remoteSearch(); syncURL();
  });
  $('lib-more-btn').onclick=function(){ if(srvMode()) srvMore(); else { st.shown+=PAGE; draw(); } };

  /* 手机端制谱入口统一落 make.html（编辑器手机体验有限，先进承接页）；小程序里改「发到电脑做」（点了复制制谱链接，PYQ_MP） */
  function mobileMakeLinks(){
    var a=$('empty-make'); if(!a) return;
    if(isMp()){ a.href='//zhipu.puyouquan.com/'; a.textContent='发到电脑做'; return; }
    if(isMobile()) a.href='make.html';
  }
  mobileMakeLinks();
  try{ matchMedia('(max-width:580px)').addEventListener('change', function(){ st.mInst=false; if(!isMobile()){ st.drawer=st.drawer; } chips(); draw(); }); }catch(_){}

  chips();
  /* 搜索占位轮播（未聚焦未输入时 4s 一换） */
  var PH=['搜曲名 / 歌手，如：小星星','试试：茉莉花 二胡谱','试试：考编 即兴伴奏','搜歌手名也可以'], phi=0;
  setInterval(function(){ if(document.activeElement!==qIn && !qIn.value) qIn.placeholder=PH[++phi%PH.length]; },4000);
  /* 列表缓存：分类升级 P1 换键 pyq-pub-cache2；条目缺 pz（老接口）也当没命中——旧缓存不会让一级按钮被当成 0 首（v1 R19） */
  var CK='pyq-pub-cache2';
  function useData(list, fresh, tot){ all=(list||[]).map(Z.norm); if(tot) total=tot; chips(); draw(); renderRecent(); remoteFilter(); if(normQ(st.q)) remoteSearch(true);
    /* 上新徽章：对比上次见到的谱库总数（键 pyq-seen-n） */
    if(fresh){ try{ var prev=+localStorage.getItem('pyq-seen-n')||0, d=all.length-prev;
      var bg=$('lib-newbadge');
      if(bg && prev>0 && d>0){ bg.textContent='上新 '+d+' 首'; bg.hidden=false; }
      localStorage.setItem('pyq-seen-n', String(all.length)); }catch(_){} }
  }
  var cached=null;
  try{ var raw=sessionStorage.getItem(CK); if(raw){ var o=JSON.parse(raw);
    if(o && o.t && Date.now()-o.t<300000 && o.scores && o.scores.every(function(s){ return s && typeof s.pz==='string'; })){ cached=o.scores; if(o.total) total=o.total; if(o.cats) cats=o.cats; } } }catch(_){}
  if(cached) useData(cached);
  fetch('/api/pub/scores',{credentials:'include'}).then(function(r){ return r.ok? r.json():{scores:cached||[]}; })
    .then(function(j){ useData(j.scores||[], true, j.total||0);
      try{ if((j.scores||[]).every(function(s){ return s && typeof s.pz==='string'; })) sessionStorage.setItem(CK, JSON.stringify({t:Date.now(), scores:j.scores||[], total:j.total||0, cats:cats})); }catch(_){} })
    .catch(function(){ if(!cached) grid.innerHTML='<p style="color:var(--muted)">刷新试试，谱库马上回来。</p>'; });
  /* 计数（全库，含可转数）：接口没有 / 不通时按手里的卡片现算 */
  fetch('/api/pub/cats',{credentials:'include'}).then(function(r){ return r.ok? r.json():null; })
    .then(function(j){ if(j && j.pz && j.conv){ cats=j; chips(); draw();
      try{ var raw2=sessionStorage.getItem(CK); if(raw2){ var o2=JSON.parse(raw2); o2.cats=j; sessionStorage.setItem(CK, JSON.stringify(o2)); } }catch(_){} } })
    .catch(function(){});
  fetch('/api/favorites',{credentials:'include'}).then(function(r){ return r.ok? r.json():null; })
    .then(function(j){ if(!j) return; (j.favorites||[]).forEach(function(f){ favs[f.score_id||f.id||f]=1; });
      (j.cards||[]).forEach(function(c){ extra[c.id]=Z.norm(c); }); if(st.favOnly) draw(); })
    .catch(function(){});
})();
</script>
</body>
