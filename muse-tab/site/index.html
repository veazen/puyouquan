<script src="pyq.js"></script>
<script>
/* 搜索型首页：一次拉取 /api/pub/scores（sessionStorage 5 分钟缓存），本地即时过滤 +
   谱种 chip（0 首的分类不显示）+ 收藏筛选 + 分页「加载更多」+ URL ?q= 同步（可转发搜索结果） */
(function(){
  var CATS=[['all','全部'],['guitar','弹唱'],['solo','独奏'],['uku','尤克里里'],['pianoacc','钢琴弹唱'],['piano','钢琴独奏'],
            ['vocal','歌谱'],['teach','教学对照'],['instr','器乐五线'],['func','功能谱'],['chord','和弦谱']];
  var NORM={vox:'vocal', staff:'instr'};
  var PAGE=12;
  var all=[], favs={}, st={q:'', cat:'all', favOnly:false, shown:PAGE};
  var grid=document.getElementById('lib-grid'), cats=document.getElementById('lib-cats'),
      qIn=document.getElementById('lib-q'), moreWrap=document.getElementById('lib-more'),
      title=document.getElementById('lib-title');

  try{ var q0=new URLSearchParams(location.search).get('q'); if(q0){ st.q=q0; qIn.value=q0; } }catch(_){}
  if(!('ontouchstart' in window) && !st.q) try{ qIn.focus({preventScroll:true}); }catch(_){}

  function typeOf(s){ return NORM[s.type]||s.type; }
  function chips(){
    var counts={}; all.forEach(function(s){ var t=typeOf(s); counts[t]=(counts[t]||0)+1; });
    cats.innerHTML = CATS.filter(function(c){ return c[0]==='all' || counts[c[0]]; }).map(function(c){
      return '<button class="fchip lg'+(st.cat===c[0]&&!st.favOnly?' on':'')+'" data-cat="'+c[0]+'">'+c[1]+'</button>'; }).join('')
      +'<button class="fchip lg fav'+(st.favOnly?' on':'')+'" data-fav>♥ 收藏</button>';
  }
  function filtered(){
    var q=st.q.trim().toLowerCase();
    return all.filter(function(s){
      if(st.favOnly && !favs[s.id]) return false;
      if(st.cat!=='all' && typeOf(s)!==st.cat) return false;
      if(q){ var hay=((s.title||'')+' '+(s.singer||'')+' '+(s.author||'')).toLowerCase();
        if(hay.indexOf(q)<0) return false; }
      return true;
    });
  }
  function searching(){ return !!(st.q.trim() || st.cat!=='all' || st.favOnly); }
  function draw(){
    var list=filtered();
    title.textContent = st.favOnly? '我的收藏' : (st.q.trim()? '搜索结果' : (st.cat!=='all'? '筛选结果' : '最新上架'));
    var show = searching()? list : list.slice(0, st.shown);
    grid.innerHTML = show.length? show.map(PYQ_LIB.card).join('')
      : '<div class="lib-empty"><b>'+(st.favOnly?'收藏夹还是空的':'没有找到相关曲谱')+'</b>'
        +(st.favOnly?'点 ♥ 收藏喜欢的谱，跨设备随时打开。':'换个关键词试试，或用智能配谱自己出一份。')
        +'<br><a class="btn" id="empty-make" href="//zhipu.puyouquan.com/">自己配一份谱 →</a>'
        +'<br><a href="mailto:support@puyouquan.com?subject=想要的谱" style="display:inline-block;margin-top:12px;font-size:12.5px;color:var(--muted)">告诉我们你想要的谱 →</a></div>';
    var c=document.getElementById('lib-count'); if(c) c.textContent=list.length+' 首';
    moreWrap.hidden = searching() || list.length<=st.shown;
    mobileMakeLinks();
    if(show.length && !grid.dataset.ready) requestAnimationFrame(function(){ grid.dataset.ready='1'; });
  }
  /* 最近看过（智能可感知）：点击卡片瞬间在本域记录（观看页在 puku 子域，localStorage 不同源，
     必须点击时记）；回访时置顶一行，谱已下架静默过滤。新键 pyq-recent，不碰 musetab-* 红线 */
  var RK='pyq-recent';
  function recGet(){ try{ return JSON.parse(localStorage.getItem(RK))||[]; }catch(_){ return []; } }
  function recAdd(id){ try{ var l=recGet().filter(function(r){ return r.id!==id; });
    l.unshift({id:id, t:Date.now()}); localStorage.setItem(RK, JSON.stringify(l.slice(0,8))); }catch(_){} }
  document.getElementById('lib-sec').addEventListener('click', function(e){
    var a=e.target.closest('.cc-card'); if(!a) return;
    var m2=/[?&]pub=([A-Za-z0-9_-]+)/.exec(a.getAttribute('href')||''); if(m2) recAdd(m2[1]);
  });
  function renderRecent(){
    var sec=document.getElementById('recent-sec'), rg=document.getElementById('recent-grid');
    if(!sec||!all.length) return;
    var byId={}; all.forEach(function(s){ byId[s.id]=s; });
    var cards=recGet().map(function(r){ return byId[r.id]; }).filter(Boolean).slice(0,3);
    if(cards.length){ rg.innerHTML=cards.map(PYQ_LIB.card).join(''); rg.dataset.ready='1'; sec.hidden=false; }
  }
  cats.addEventListener('click', function(e){
    var b=e.target.closest('.fchip'); if(!b) return;
    if(b.dataset.cat!==undefined){ st.cat=b.dataset.cat; st.favOnly=false; }
    else if(b.dataset.fav!==undefined){
      if(!Object.keys(favs).length && window.PYQ_ACCT && !PYQ_ACCT.user){ PYQ_ACCT.openLogin(); return; }
      st.favOnly=!st.favOnly;
    }
    chips(); draw();
  });
  qIn.addEventListener('input', function(){
    st.q=qIn.value; draw();
    try{ history.replaceState(null,'', st.q.trim()? ('?q='+encodeURIComponent(st.q.trim())) : location.pathname); }catch(_){}
  });
  document.getElementById('lib-more-btn').onclick=function(){ st.shown+=PAGE; draw(); };

  /* 手机端制谱入口统一落 make.html（编辑器手机体验有限，先进承接页） */
  function isMobile(){ return matchMedia('(max-width:580px)').matches; }
  function mobileMakeLinks(){
    if(!isMobile()) return;
    ['tool-make','strip-make','empty-make'].forEach(function(id){
      var a=document.getElementById(id); if(a) a.href='make.html'; });
  }
  mobileMakeLinks();

  chips();
  /* 搜索占位轮播（未聚焦未输入时 4s 一换） */
  var PH=['搜曲名 / 歌手，如：小星星','试试：晴天','试试：考编 即兴伴奏','搜歌手名也可以'], phi=0;
  setInterval(function(){ if(document.activeElement!==qIn && !qIn.value) qIn.placeholder=PH[++phi%PH.length]; },4000);
  var CK='pyq-pub-cache';
  function useData(list, fresh){ all=list||[]; chips(); draw(); renderRecent();
    /* 上新徽章：对比上次见到的谱库总数（键 pyq-seen-n） */
    if(fresh){ try{ var prev=+localStorage.getItem('pyq-seen-n')||0, d=all.length-prev;
      var bg=document.getElementById('lib-newbadge');
      if(bg && prev>0 && d>0){ bg.textContent='上新 '+d+' 首'; bg.hidden=false; }
      localStorage.setItem('pyq-seen-n', String(all.length)); }catch(_){} }
  }
  var cached=null;
  try{ var raw=sessionStorage.getItem(CK); if(raw){ var o=JSON.parse(raw);
    if(o && o.t && Date.now()-o.t<300000 && o.scores){ cached=o.scores; } } }catch(_){}
  if(cached) useData(cached);
  fetch('/api/pub/scores',{credentials:'include'}).then(function(r){ return r.ok? r.json():{scores:cached||[]}; })
    .then(function(j){ useData(j.scores||[], true);
      try{ sessionStorage.setItem(CK, JSON.stringify({t:Date.now(), scores:j.scores||[]})); }catch(_){} })
    .catch(function(){ if(!cached) grid.innerHTML='<p style="color:var(--muted)">刷新试试，谱库马上回来。</p>'; });
  fetch('/api/favorites',{credentials:'include'}).then(function(r){ return r.ok? r.json():null; })
    .then(function(j){ if(!j) return; (j.favorites||[]).forEach(function(f){ favs[f.score_id||f.id||f]=1; }); })
    .catch(function(){});
})();
</script>
