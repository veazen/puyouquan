<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuseTab 吉他谱编辑器</title>
<style>
:root{
  --bg:#eaedf3; --panel:#ffffff; --text:#1a222e; --muted:#697488;
  --border:#dbe0ea; --border-soft:#e9edf3; --accent:#3a5ce0; --accent-2:#5b76e8;
  --accent-soft:#e8ecfd; --accent-ink:#2540b8;
  --paper:#ffffff; --ink:#141414; --toolbar:#f2f4f9; --danger:#d63b4a; --ok:#1e9e6a;
  --shadow:0 1px 2px rgba(20,30,60,.05), 0 6px 18px rgba(20,30,60,.06);
  --radius:9px;
  --font-ui:'Noto Sans SC','Source Han Sans SC','WenQuanYi Micro Hei','DejaVu Sans',sans-serif;
  --font-num:'DejaVu Serif','Noto Serif SC','Source Han Serif SC',serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12151b; --panel:#1c2029; --text:#e7eaf0; --muted:#98a2b3;
    --border:#333a47; --border-soft:#2a2f3a; --accent:#6d8bff; --accent-2:#7e97ff;
    --accent-soft:#232d47; --accent-ink:#9fb4ff; --toolbar:#181c24; --danger:#ff6b78; --ok:#3ecb8f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35); }
}
:root[data-theme="light"]{ --bg:#eaedf3; --panel:#ffffff; --text:#1a222e; --muted:#697488;
  --border:#dbe0ea; --border-soft:#e9edf3; --accent:#3a5ce0; --accent-2:#5b76e8; --accent-soft:#e8ecfd;
  --accent-ink:#2540b8; --toolbar:#f2f4f9; --danger:#d63b4a; --ok:#1e9e6a;
  --shadow:0 1px 2px rgba(20,30,60,.05), 0 6px 18px rgba(20,30,60,.06); }
:root[data-theme="dark"]{ --bg:#12151b; --panel:#1c2029; --text:#e7eaf0; --muted:#98a2b3;
  --border:#333a47; --border-soft:#2a2f3a; --accent:#6d8bff; --accent-2:#7e97ff; --accent-soft:#232d47;
  --accent-ink:#9fb4ff; --toolbar:#181c24; --danger:#ff6b78; --ok:#3ecb8f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35); }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font-ui);
  -webkit-font-smoothing:antialiased;padding-bottom:78px;}
/* ================= 顶部工具栏 ================= */
#top{position:sticky;top:0;z-index:20;background:var(--toolbar);
  border-bottom:1px solid var(--border);backdrop-filter:saturate(1.1);}
/* 常用编辑功能栏：置于页头下方、与页头等宽，一起吸顶固定 */
#editbar{padding:5px 16px;border-top:1px solid var(--border);gap:6px;flex-wrap:nowrap;overflow-x:auto}
#editbar2{padding:4px 16px;border-top:1px solid var(--border-soft);gap:6px;flex-wrap:nowrap;overflow-x:auto}
#editbar .eb,#editbar2 .eb{font-size:12px;padding:3px 9px;white-space:nowrap}
#editbar .eb.on,#editbar2 .eb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* 图形化节奏按钮：符杠图示在上、名称在下（同原时值库样式） */
.eb.ico{display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:2px 8px 3px;line-height:1}
.eb.ico span{font-size:10px;color:var(--muted)}
.eb.ico svg{display:block;color:var(--text)}
.eb.ico .g{font-size:12px;font-style:italic;font-weight:700;line-height:1.2;min-height:14px;display:flex;align-items:center}
.eb-grp{display:flex;align-items:center;gap:4px;flex:none}
.eb-sep{width:1px;height:18px;background:var(--border);margin:0 8px;flex:none}
.eb-t{font-size:11.5px;color:var(--muted);margin-right:2px;flex:none}
#eb-zoom #zoom-lbl{min-width:44px;text-align:center;font-size:12px;color:var(--muted);cursor:pointer}
#eb-zoom button{width:26px;padding:3px 0;font-size:13px;font-weight:600}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:7px 16px;}
.main-bar{gap:7px}
.logo{font-weight:700;font-size:15px;margin-right:10px;white-space:nowrap;
  display:flex;align-items:center;gap:7px;letter-spacing:.01em}
.logo .mark{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;
  justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-size:14px;box-shadow:0 2px 6px rgba(58,92,224,.35)}
.logo small{color:var(--muted);font-weight:400;font-size:11px}
.vsep{width:1px;align-self:stretch;background:var(--border);margin:3px 4px}
.grow{flex:1}
/* 分段按钮组：同组按钮拼接为一体，视觉统一 */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;
  background:var(--panel);box-shadow:0 1px 2px rgba(20,30,60,.04)}
.seg button{border:none;border-radius:0;box-shadow:none;background:transparent;
  border-right:1px solid var(--border-soft)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--accent-soft);color:var(--accent-ink)}
.seg button.seg-accent{color:var(--accent-ink);font-weight:600}
.seg button.seg-accent:hover{background:var(--accent);color:#fff}
button{background:var(--panel);color:var(--text);border:1px solid var(--border);
  border-radius:7px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap;
  font-family:var(--font-ui);transition:border-color .12s, background .12s, color .12s, box-shadow .12s;}
button:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 1px 4px rgba(58,92,224,.12)}
button:active{transform:translateY(.5px)}
button.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));border-color:transparent;
  color:#fff;box-shadow:0 2px 8px rgba(58,92,224,.32)}
button.primary:hover{color:#fff;filter:brightness(1.06)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--accent-soft)}
input,select,textarea{background:var(--panel);color:var(--text);
  border:1px solid var(--border);border-radius:7px;padding:5px 9px;font-size:13px;
  font-family:var(--font-ui);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
input.short{width:54px} input.mid{width:150px}
/* 分页标签 */
.tab-bar{padding:0 16px;gap:4px;background:var(--toolbar);border-bottom:1px solid var(--border)}
.rtab{border:none;background:transparent;padding:9px 15px 8px;font-size:13.5px;color:var(--muted);
  border-bottom:2.5px solid transparent;border-radius:0;font-weight:500}
.rtab:hover{color:var(--text);box-shadow:none}
.rtab.on{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:700}
#mode-tip{margin-left:auto;font-size:12px;color:var(--muted);padding-right:2px;align-self:center}
/* Ribbon 内容区 */
#ribbon{display:flex;align-items:stretch;gap:6px;padding:9px 12px;background:var(--panel);
  overflow-x:auto;border-bottom:1px solid var(--border)}
.rg{display:flex;flex-direction:column;gap:5px;padding:6px 11px 5px;
  border:1px solid var(--border-soft);border-radius:11px;background:var(--toolbar);flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.rg .rg-title{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;
  text-align:center;order:2;margin-top:1px;font-weight:600}
.rg .rg-body{display:flex;align-items:center;gap:4px;flex-wrap:wrap;max-width:200px;
  justify-content:center}
.rg.wide .rg-body{max-width:280px}
/* 图标按钮 */
.ib{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 4px;
  min-width:36px;border:1px solid transparent;border-radius:8px;background:transparent;
  cursor:pointer;transition:background .12s, border-color .12s}
.ib:hover{border-color:var(--border);background:var(--panel)}
.ib.on{border-color:var(--accent);background:var(--accent-soft)}
.ib svg{display:block}
.ib span{font-size:10.5px;color:var(--text);line-height:1.1}
.ib.on span{color:var(--accent-ink)}
.chip{padding:2px 10px;border:1px solid var(--border);border-radius:20px;cursor:pointer;
  font-size:12px;background:var(--panel);user-select:none;transition:all .12s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.vchip{display:inline-flex;align-items:center;gap:2px;padding-right:6px;user-select:none}
.vchip .vdel{opacity:0;max-width:0;overflow:hidden;color:var(--muted);cursor:pointer;
  font-size:12px;line-height:1;transition:opacity .12s,max-width .12s,margin .12s;margin-left:0}
.vchip:hover .vdel{opacity:.75;max-width:14px;margin-left:2px}
.vchip .vdel:hover{color:var(--danger);opacity:1}
/* 节拍状态（位于右栏“使用帮助”下方） */
#beat-box{position:relative;font-size:12px;padding:2px}
#beat-status{cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:5px 11px;
  border-radius:20px;border:1px solid var(--border);background:var(--panel);width:100%;
  box-sizing:border-box;font-size:12px;line-height:1.3}
#beat-status::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
#beat-status.bad{color:var(--danger);font-weight:600;background:color-mix(in srgb,var(--danger) 12%,transparent);border-color:var(--danger)}
#beat-status.bad::before{background:var(--danger)}
#beat-status.good{color:var(--muted)}
/* 修复建议：现代绿色提示框，显示在“时值不符”状态提示的正下方 */
#err-drop{margin-top:6px;
  background:color-mix(in srgb,var(--ok) 6%,var(--panel));
  border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);
  border-left:4px solid var(--ok);
  border-radius:12px;box-shadow:0 4px 14px color-mix(in srgb,var(--ok) 16%,transparent);
  padding:9px;max-height:46vh;overflow:auto}
.err-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11.5px;font-weight:600;color:var(--ok);padding:2px 4px 7px;
  border-bottom:1px solid color-mix(in srgb,var(--ok) 22%,transparent);margin-bottom:6px}
#err-fixall{font-size:11.5px;padding:3px 12px;font-weight:600;border-radius:999px;
  border:1px solid var(--ok);color:#fff;background:var(--ok)}
#err-fixall:hover{filter:brightness(1.08)}
#err-drop .err{cursor:pointer;padding:7px 8px;border-radius:9px;font-size:12px;margin:4px 0;
  border:1px solid color-mix(in srgb,var(--ok) 20%,var(--border-soft));background:var(--panel)}
#err-drop .err:hover{border-color:var(--ok);box-shadow:0 1px 6px color-mix(in srgb,var(--ok) 18%,transparent)}
#err-drop .err-desc{color:var(--text);font-weight:600}
#err-drop .err-sug{color:color-mix(in srgb,var(--ok) 72%,var(--text));font-size:11.5px;margin:3px 0 6px;line-height:1.4}
#err-drop .err-fix{font-size:11.5px;padding:3px 13px;font-weight:600;border-radius:999px;
  border:1px solid var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
#err-drop .err-fix:hover{background:var(--ok);color:#fff}
#suggest,#techbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 18px;
  background:var(--accent-soft);border-bottom:1px solid var(--border);font-size:12.5px}
#suggest .ib{background:var(--panel)}
#score .mnumg:hover .mnum{fill:var(--accent);opacity:1}
#score .barzone:hover{fill-opacity:.25}
.popmenu button.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
#score .strcell:hover{fill:var(--accent);fill-opacity:.16}
#score .beatzone:hover{fill:var(--accent);fill-opacity:.13}
#score .strumcell:hover{fill:var(--accent);fill-opacity:.10}
.popmenu{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;box-shadow:var(--shadow);padding:10px;font-size:12.5px}
.popmenu .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.popmenu .t{color:var(--muted);font-size:11.5px}
/* 曲谱库 */
.lib-tabs{display:flex;gap:6px;margin:2px 0 12px;border-bottom:1px solid var(--border);padding-bottom:8px}
.lib-tab{background:transparent;border:1px solid transparent;color:var(--muted);font-weight:500}
.lib-tab.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.song-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.song-card{border:1px solid var(--border);border-radius:12px;padding:12px 13px;background:var(--toolbar);
  display:flex;flex-direction:column;gap:6px}
.song-card:hover{border-color:var(--accent)}
.sc-title{font-weight:700;font-size:14px}
.sc-cur{font-size:10.5px;color:var(--accent-ink);background:var(--accent-soft);padding:1px 7px;border-radius:10px;font-weight:600;margin-left:4px}
.sc-desc{font-size:11.5px;color:var(--muted);line-height:1.5;flex:1}
.sc-act{display:flex;gap:5px;flex-wrap:wrap}
.sc-act button{font-size:12px;padding:4px 10px}
/* ================= 通用功能行 ================= */
/* ================= 三栏舞台 ================= */
#stage{display:flex;align-items:flex-start;justify-content:center;gap:14px;
  padding:18px 16px 6px;max-width:1560px;margin:0 auto}
/* 左侧固定标签栏（贴谱面左缘），点击向左展开完整功能面板 */
#left-dock{display:flex;flex-direction:row;align-items:flex-start;position:sticky;top:92px;
  align-self:flex-start;z-index:6}
#left-rail{display:flex;flex-direction:column;gap:6px;flex:none;padding-top:2px}
.ltab{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.16em;
  border:1px solid var(--border);background:var(--panel);border-radius:9px;
  padding:12px 7px;font-size:13px;color:var(--muted);font-weight:600;min-width:32px;
  box-shadow:0 1px 3px rgba(20,30,60,.06);transition:all .12s}
.ltab:hover{color:var(--accent-ink);background:var(--accent-soft);border-color:var(--accent)}
.ltab.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(58,92,224,.3)}
#left-flyout{flex:none;width:252px;margin-right:7px;max-height:calc(100vh - 140px);overflow-y:auto;
  background:var(--panel);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow)}
#left-flyout #ribbon{display:flex;flex-direction:column;gap:8px;padding:10px;
  overflow:visible;border-bottom:none;background:transparent}
#left-flyout .rg{width:100%}
#left-flyout .rg .rg-body{max-width:none}
/* 右侧信息栏 */
#right-dock{display:flex;flex-direction:column;gap:8px;width:198px;flex:none;
  position:sticky;top:92px;align-self:flex-start;z-index:6}
.rcard{border:1px solid var(--border);border-radius:12px;background:var(--panel);
  box-shadow:0 1px 3px rgba(20,30,60,.06);overflow:hidden}
.rc-h{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;
  border:none;border-radius:0;background:var(--toolbar);font-weight:700;font-size:13px;padding:9px 12px}
.rc-h:hover{background:var(--accent-soft);color:var(--accent-ink)}
.rc-h::after{content:'▸';font-size:11px;color:var(--muted);transition:transform .15s}
.rcard.open .rc-h::after{transform:rotate(90deg)}
.rc-h.rc-btn::after{content:'…';transform:none}
.rcard .rc-b{display:none;padding:10px 12px;border-top:1px solid var(--border)}
.rcard.open .rc-b{display:block}
.rc-b .rg-body{max-width:none;justify-content:flex-start;gap:5px}
.rc-b .rg-body button{margin:1px 0}
#cursor-info{font-size:12.5px;color:var(--text);line-height:1.85}
#cursor-info .ci-row{display:flex;justify-content:space-between;gap:8px}
#cursor-info .ci-k{color:var(--muted)}
#cursor-info b{color:var(--accent-ink);font-weight:600}
/* ================= 主区（默认 A4 纸张） ================= */
#score-wrap{flex:0 1 900px;min-width:0;max-width:900px;margin:0;padding:0;}
#paper{background:transparent;border:none;box-shadow:none;padding:0;
  width:100%;max-width:820px;margin:0 auto;overflow:auto;
  filter:drop-shadow(0 4px 14px rgba(20,30,60,.10));}   /* ≈A4 纵向宽度(96dpi) */
#paper svg{max-width:none}   /* 放大时允许超出容器，容器内滚动查看 */
#paper.wide{max-width:1180px}
svg{display:block;margin:0 auto;max-width:100%;height:auto;}
svg text{user-select:none}
#score .pagebg{stroke:var(--border)}
#hint{max-width:900px;margin:8px auto 34px;padding:0 20px;color:var(--muted);font-size:12px;line-height:1.6}
/* ================= 弹窗 ================= */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;
  display:flex;align-items:center;justify-content:center;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:18px 20px;max-width:720px;width:94%;max-height:84vh;overflow:auto;}
.modal h3{margin:0 0 10px;font-size:16px}
.modal h4{margin:14px 0 6px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:3px}
.modal .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modal textarea{width:100%;height:120px;resize:vertical}
.modal p{color:var(--muted);font-size:12px;margin:6px 0}
.modal table{border-collapse:collapse;font-size:13px;width:100%}
.modal td{padding:3px 8px;border-bottom:1px solid var(--border)}
.modal td.k{color:var(--accent);white-space:nowrap;font-family:ui-monospace,monospace}
.modal label.f{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.modal label.f span{width:56px;color:var(--muted);text-align:right}
/* 使用帮助/特色功能/更新日志 弹窗排版 */
.modal .steps{display:flex;flex-direction:column;gap:7px;margin:8px 0}
.modal .step{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.55}
.modal .step .n{flex:0 0 19px;height:19px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.modal .feat{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}
.modal .feat .fc{border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:var(--paper)}
.modal .feat .fc b{display:block;font-size:13px;margin-bottom:3px}
.modal .feat .fc span{font-size:12px;color:var(--muted);line-height:1.5}
.modal .vlog{list-style:none;margin:8px 0;padding:0;font-size:12.5px}
.modal .vlog li{display:flex;gap:9px;margin:0;padding:6px 0;border-bottom:1px dashed var(--border);line-height:1.5}
.modal .vlog .v{flex:0 0 62px;color:var(--accent);font-weight:700;font-family:ui-monospace,monospace;white-space:nowrap}
.modal kbd{display:inline-block;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font-size:11.5px;font-family:ui-monospace,monospace;background:var(--paper);line-height:1.7}
/* 新建向导·类型卡片（大气现代，无图标） */
.ntgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 4px}
.ntcard{position:relative;border:1.5px solid var(--border);border-radius:14px;padding:20px 18px 17px;
  background:var(--paper);cursor:pointer;text-align:left;font:inherit;transition:border-color .15s,box-shadow .15s,transform .15s}
.ntcard:hover{border-color:var(--accent);box-shadow:0 8px 22px rgba(58,92,224,.14);transform:translateY(-2px)}
.ntcard b{display:block;font-size:16.5px;letter-spacing:2px;margin-bottom:7px;color:var(--ink)}
.ntcard span{font-size:12.5px;color:var(--muted);line-height:1.7;display:block}
.ntcard .nt-tag{position:absolute;top:18px;right:15px;font-size:10.5px;color:var(--accent);
  border:1px solid var(--accent);border-radius:20px;padding:2px 10px;opacity:.85;letter-spacing:1px}
/* 多窗口标签栏 */
#doc-tabs{display:flex;align-items:flex-end;gap:6px;padding:8px 14px 0;flex-wrap:wrap}
.dtab{display:inline-flex;align-items:center;gap:7px;padding:5px 8px 5px 11px;border:1px solid var(--border);
  border-radius:9px 9px 0 0;background:var(--panel);cursor:pointer;font-size:12.5px;color:var(--muted);max-width:230px}
.dtab.on{background:var(--paper);color:var(--ink);font-weight:600;border-bottom-color:var(--paper);box-shadow:0 -2px 8px rgba(0,0,0,.05)}

.pat-card .bt{font-size:10.5px;color:var(--muted)}
.pat-card svg{background:var(--panel);border-radius:6px}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:8px 18px;border-radius:20px;
  font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
.hidden{display:none!important}
@media print{
  #top,#hint,#toast,#suggest,#techbar,.popmenu,.modal-mask,#left-dock,#right-dock,#mixer-dock,#doc-tabs{display:none!important}

function chordDegree(name){
  const m=/^([A-G](?:#|b)?)([^/]*)(?:\/([A-G](?:#|b)?))?$/.exec((name||'').trim());

  if(m[3] && KEY_PC[m[3]]!=null) out+='/'+DEG_OF_SEMI[((KEY_PC[m[3]]-key)%12+12)%12];

}

/* 可移动把位形（E型根音在6弦、A型根音在5弦）——按品格拼字符串 */
function movableShape(rootPc, qual, form){
  const f6 = ((rootPc-4)%12+12)%12 || (rootPc===4?0:((rootPc-4)%12+12)%12);
  const f5 = ((rootPc-9)%12+12)%12;
  const F = n=> n>9? n.toString(36) : ''+n;   // 10→a...
  const barre=(base, offs)=> offs.map(o=> o==null?'x':F(base+o)).join('');
  if(form==='E'){
    const b = f6===0?12:f6;   // 避免全空弦叠罗
    const shapes={ '':[0,2,2,1,0,0], m:[0,2,2,0,0,0], '7':[0,2,0,1,0,0],
      m7:[0,2,0,0,0,0], maj7:[0,1,1,1,0,0], sus4:[0,2,2,2,0,0] };
    const o = shapes[qual]||shapes[''];
    return barre(b, [o[0],o[1],o[2],o[3],o[4],o[5]]);   // 6→1 弦
  }else{
    const b = f5===0?12:f5;
    const shapes={ '':[null,0,2,2,2,0], m:[null,0,2,2,1,0], '7':[null,0,2,0,2,0],
      m7:[null,0,2,0,1,0], maj7:[null,0,2,1,2,0], sus4:[null,0,2,2,3,0] };
    const o = shapes[qual]||shapes[''];
    return barre(b, o);
  }
}
/* 转位：把 slash 低音音放到最低弦 */
function slashShape(baseShape, bassPc){
  if(!baseShape) return baseShape;
  const arr=[...baseShape];
  // 在 6/5/4 弦里找 bassPc 能按到（0-4品）的最低弦，改成该音，其余更低弦静音
  for(const s of [6,5,4]){
    const openPc = OPEN_PC[s-1];
    let fr = ((bassPc-openPc)%12+12)%12;
    if(fr<=4){
      arr[6-s] = fr>9?fr.toString(36):''+fr;
      for(let s2=s+1;s2<=6;s2++) arr[6-s2]='x';
      return arr.join('');
    }
  }
  return baseShape;
}

      m.voxes=[m.vox]; delete m.vox;

    composer:'', maker:s.maker||'', key:s.key||'C', beats:s.beats||4,

    tabVoices:['吉他1'], voxVoices:['旋律1'], lyricLines:1, measures:[]};
  const ref = (()=>{ let r=60+(KEY_PC[out.key]||0); if(r>66)r-=12; return r; })();
  (s.measures||[]).forEach(m=>{

    (m.columns||[]).forEach(c=>{

        notes:(c.notes||[]).map(n=>({s:n.s,f:n.f})), strum:''});

      if(c.notes && c.notes.length){

function normGrace(g){
  if(g==null) return null;
  if(typeof g==='number') return {notes:[{deg:g, oct:0}], dur:8};
  if(g.deg!=null) return {notes:[{deg:g.deg, oct:g.oct||0}], dur:g.dur||8};
  return {notes:(g.notes||[]).map(n=>({deg:n.deg, oct:n.oct||0})).slice(0,3), dur:g.dur||8};

/* 连音：tup=3(或旧数据1)三连音×2/3；tup=5/6/7 → n个音占4个的时值×4/n */
function beatsOf(c){
  const t = c.tup===1? 3 : c.tup;
  return (4/c.dur)*(c.dotted?1.5:1)*(t? (t===3?2/3:4/t) :1)*(song.unit/4);

  if(!c.deg) return null;
  let m = keyRef() + DEG_SEMI[c.deg] + c.oct*12;
  if(c.acc==='#') m++; if(c.acc==='b') m--;

}

function rhythmSVG(durs, W, H, noLine){

  let cum=0; const xs=[];
  durs.forEach(([d,t])=>{ const b=evBeatsRaw(d,t); xs.push(7+(cum+b/2)/total*(W-16)); cum+=b; });
  const p=noLine? [] : [`<line x1="2" y1="${line}" x2="${W-2}" y2="${line}" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>`];
  durs.forEach(([d,t],i)=>{
    const x=xs[i];
    if(d===1){ p.push(`<circle cx="${x}" cy="${line}" r="3.2" fill="none" stroke="currentColor" stroke-width="1.2"/>`); }
    else{
      if(d===2) p.push(`<circle cx="${x}" cy="${line}" r="3" fill="none" stroke="currentColor" stroke-width="1.2"/>`);
      else p.push(`<path d="M ${x-3} ${line-3} L ${x+3} ${line+3} M ${x-3} ${line+3} L ${x+3} ${line-3}" stroke="currentColor" stroke-width="1.4" fill="none"/>`);
      p.push(`<line x1="${x}" y1="${line+3}" x2="${x}" y2="${stem}" stroke="currentColor" stroke-width="1.1"/>`);
    }
    if(t) p.push(`<circle cx="${x+6}" cy="${line-4}" r="1.4" fill="currentColor"/>`);
  });
  /* 符杠 */
  for(let i=0;i<durs.length;i++){
    const [d]=durs[i];
    if(d<8) continue;
    let j=i; let cumb=durs.slice(0,i).reduce((a,[dd,tt])=>a+evBeatsRaw(dd,tt),0);
    const beat=Math.floor(cumb+1e-4);

      const [d2]=durs[j+1];
      const c2=durs.slice(0,j+1).reduce((a,[dd,tt])=>a+evBeatsRaw(dd,tt),0);
      if(d2>=8 && Math.floor(c2+1e-4)===beat) j++; else break;
    }
    if(j>i){
      p.push(`<rect x="${xs[i]-0.5}" y="${stem-1.8}" width="${xs[j]-xs[i]+1}" height="1.8" fill="currentColor"/>`);
      for(let a=i;a<j;a++){

/* ================= 布局（按拍分配宽度，吉他谱与简谱逐拍对齐） ================= */
function measureLayout(mea){
  const pad = 11, NOTE_OFF = 10, BEAT_GAP = 7, LYR_MIN = 17;
  const beats = song.beats || 4;
  const baseBeat = 29;                       // 每拍基准宽
  const gapTotal = BEAT_GAP*Math.max(0, beats-1);
  /* 逐拍统计：每拍所需宽度 = max(基准, 该拍音符最小宽, 该拍歌词字数×字宽) —
     使"某一拍挤满 16/32 分且逐字歌词"时，该拍能独立撑开、歌词不挤压 */
  const MIN_COL = 13;                        // 吉他谱每列最低间隔
  const beatNoteW = new Array(beats).fill(0);
  const beatLyrCnt = new Array(beats).fill(0);
  const beatColCnt = new Array(beats).fill(0);
  const beatVoxCnt = new Array(beats).fill(0);
  const scan = (cols, isVox)=>{
    let cum=0; const wB=new Array(beats).fill(0), cB=new Array(beats).fill(0), nB=new Array(beats).fill(0);
    cols.forEach(c=>{
      const bi=Math.min(beats-1, Math.floor(cum+1e-4));
      wB[bi]+=(MIN_W[c.dur]||14)+(c.dotted?6:0)
             +(isVox&&c.grace? 5+6.5*normGrace(c.grace).notes.length : 0)
             +(isVox&&c.graceA? 5+6.5*normGrace(c.graceA).notes.length : 0)
             +(!isVox&&c.notes&&c.notes.some(nn=>(nn.tech==='b'||nn.tech==='bd')&&!nn.tk)?15:0);   // 旧式合成圆圈推弦预留空间
      nB[bi]++;
      if(isVox && c.lyrics && c.lyrics.some(x=>x&&x.trim())) cB[bi]++;
      cum+=beatsOf(c);
    });
    for(let i=0;i<beats;i++){
      beatNoteW[i]=Math.max(beatNoteW[i],wB[i]); beatColCnt[i]=Math.max(beatColCnt[i],nB[i]);
      if(isVox){ beatLyrCnt[i]=Math.max(beatLyrCnt[i],cB[i]); beatVoxCnt[i]=Math.max(beatVoxCnt[i],nB[i]); }
    }
  };
  mea.tabs.forEach(c=>scan(c,false));
  mea.voxes.forEach(c=>scan(c,true));
  let beatW=[], inner=0;
  for(let i=0;i<beats;i++){
    /* 简谱列统一采用歌词级最低间距 LYR_MIN（以首小节 32 分音符间隔为基准），
       32 分休止"000"等不再与歌词重贴；吉他谱列保持 MIN_COL */
    const w=Math.max(baseBeat, beatNoteW[i], beatLyrCnt[i]*LYR_MIN, beatVoxCnt[i]*LYR_MIN, beatColCnt[i]*MIN_COL);
    beatW.push(w); inner+=w;
  }
  /* 上限≈整行的 2/3：保证一行至少能并排两个小节，极密集小节也不独占整行 */
  const rowMax=(PAGE_W-2*MARGIN)*0.66-gapTotal-pad*2;
  if(inner>rowMax){ const k=rowMax/inner; beatW=beatW.map(w=>w*k); inner=rowMax; }
  const beatStart=[]; { let acc=pad; for(let i=0;i<beats;i++){ beatStart.push(acc); acc+=beatW[i]+BEAT_GAP; } }
  const fit = cols=>{
    let cum=0; const xs=[], ws=[], ls=[];
    cols.forEach(c=>{
      const b=beatsOf(c);
      const bi=Math.min(beats-1, Math.floor(cum+1e-4));
      const inBeat=Math.max(0, cum-bi);          // 该音在本拍内已过的时值(0..1)
      const left=beatStart[bi]+inBeat*beatW[bi]; // 拍内按时值比例定位（拍首严格对齐）
      const w=Math.max(14, b*beatW[bi]);
      ls.push(left); ws.push(w);
      xs.push(left+NOTE_OFF);
      cum+=b;
    });
    return {xs, ws, ls, rt:cols.reduce((a,c)=>a+beatsOf(c),0)||1};
  };
  return {w:inner+gapTotal+pad*2, weight:inner, tabs:mea.tabs.map(fit), voxes:mea.voxes.map(fit)};
}
function layoutSystems(){
  const systems=[]; let cur={measures:[],w:0};
  song.measures.forEach((mea,mi)=>{
    const L = measureLayout(mea);
    /* 一行最低两个小节：仅当本行已≥2小节且再加会超宽时才换行 */
    if(cur.measures.length >= 2 && cur.w + L.w > PAGE_W - 2*MARGIN){ systems.push(cur); cur={measures:[],w:0}; }
    cur.measures.push({mi, x:cur.w, L});
    cur.w += L.w;
  });
  if(cur.measures.length) systems.push(cur);
  /* 两端对齐：把整行的剩余空间按各小节"内容量(weight)"分配——
     密集小节（如整小节十六分）分得更多、稀疏小节分得更少，
     以行为单位自动适配，避免"一处拥挤一处空白"。 */
  const avail = PAGE_W - 2*MARGIN;
  systems.forEach((sys, si)=>{
    if(si===systems.length-1 && sys.w < avail*0.55) return;
    const free = avail - sys.w;
    if(Math.abs(free)<1e-6) return;
    const totalW = sys.measures.reduce((a,lm)=>a+Math.max(1,lm.L.weight), 0);
    let xoff = 0;
    sys.measures.forEach(lm=>{
      const add = free * (Math.max(1,lm.L.weight)/totalW);
      const newW = Math.max(20, lm.L.w + add);
      const s = newW/lm.L.w;
      lm.x = xoff;
      lm.L.w = newW;
      [...lm.L.tabs, ...lm.L.voxes].forEach(r=>{
        r.xs = r.xs.map(v=>v*s);
        r.ws = r.ws.map(v=>v*s);
        r.ls = r.ls.map(v=>v*s);
      });
      xoff += newW;
    });
    sys.w = avail;
  });
  return systems;
}
/* 逐系统扫描：仅当该系统的简谱含倍高音/倍低音/16·32分减时线时，才为其预留额外
   纵向空间；不含这些符号的系统保持默认行距 → 按需自适配、不浪费。 */
function systemExtras(sys){
  let maxUp=0, maxDown=0, maxUnder=0, tab32=false;
  sys.measures.forEach(lm=> (song.measures[lm.mi].voxes||[]).forEach(cols=> cols.forEach(c=>{
    if(c.tup) maxUp=Math.max(maxUp, 1);                          // 连音弧线需上方空间
    if(!c.deg) return;
    if(c.oct>0) maxUp=Math.max(maxUp, Math.min(3, c.oct));
    if(c.oct<0) maxDown=Math.max(maxDown, Math.min(3, -c.oct));
    if(c.orn || c.graceA || c.grace) maxUp=Math.max(maxUp, 1);   // 波音/倚音需上方空间
    if(c.chord) maxUp=Math.max(maxUp, 2);                        // 功能谱级数标注需上方空间
    {
      const gg=normGrace(c.grace), ga=normGrace(c.graceA);
      const hiOct = g2=> g2? Math.max(0, ...g2.notes.map(n2=>n2.oct||0)) : 0;
      const h2 = Math.max(hiOct(gg), hiOct(ga));
      if(h2>=1) maxUp=Math.max(maxUp, h2>=2? 3 : 2);   // 倚音高8度点按层数加高
    }
    maxUnder=Math.max(maxUnder, c.dur>=32?3 : c.dur>=16?2 : c.dur>=8?1 : 0);
  })));
  /* 六线谱含 32 分/连音括号时，符干区按需加高 */
  let tabTup=false;
  sys.measures.forEach(lm=> (song.measures[lm.mi].tabs||[]).forEach(cols=> cols.forEach(c=>{
    if(c.dur>=32) tab32=true;
    if(c.tup) tabTup=true;
  })));
  return {
    topExtra: maxUp>=3 ? 14 : maxUp>=2 ? 9 : maxUp>=1 ? 4 : 0,
    botExtra: Math.max(maxDown>=3?16 : maxDown>=2?10 : maxDown>=1?4 : 0, maxUnder>=3?5 : maxUnder>=2?2 : 0),
    tabExtra: Math.max(tab32?5:0, tabTup?4:0)

function sysMetrics(topExtra, botExtra, tabExtra){
  const nT = song.tabVoices.length, nV = song.voxVoices.length, nL = song.lyricLines;
  topExtra = topExtra||0; botExtra = botExtra||0; tabExtra = tabExtra||0;
  const diagH = diagMode==='inline' ? 56 : 12;   // 行内和弦图区加高，避免与一弦数字重叠
  let y = diagH + 6;
  const tabTops=[], voxYs=[], lyricY0=[];
  for(let i=0;i<nT;i++){ tabTops.push(y); y += staffH() + 12 + tabExtra + 6; }
  for(let i=0;i<nV;i++){
    y += 15 + topExtra; voxYs.push(y); lyricY0.push(y + 24 + botExtra);
    y += 24 + botExtra + (nL-1)*20 + 9;
  }
  return {diagH, tabTops, voxYs, lyricY0, h:y+2, gap:9, tabExtra};
}

function usedChords(){

function chordDiagramSVG(name, x, y, scale, shapeOverride, hideName){
  const k = scale||1; const shape = shapeOverride || chordShape(name); const p=[];
  if(!hideName)
    p.push(`<text x="${x+4*k+(shape?(shape.length-1):5)*7.2*k/2}" y="${y+9}" font-size="${11*k}" font-weight="bold" text-anchor="middle" fill="var(--ink)">${esc(name)}</text>`);
  if(!shape) return p.join('');
  const ns=shape.length;                       // 6=吉他 / 4=尤克里里
  const gx=x+4*k, gy=y+19, sw=7.2*k, fh=8.6*k;
  const frets=[...shape].map(ch=>ch==='x'?-1:parseInt(ch,36));
  const fpos=frets.filter(f=>f>0);
  const base = fpos.length && Math.max(...fpos)>4 ? Math.min(...fpos) : 1;
  for(let i=0;i<ns;i++) p.push(`<line x1="${gx+i*sw}" y1="${gy}" x2="${gx+i*sw}" y2="${gy+4*fh}" stroke="var(--ink)" stroke-width="0.7"/>`);
  for(let i=0;i<=4;i++) p.push(`<line x1="${gx}" y1="${gy+i*fh}" x2="${gx+(ns-1)*sw}" y2="${gy+i*fh}" stroke="var(--ink)" stroke-width="${i===0&&base===1?1.8:0.7}"/>`);
  if(base>1) p.push(`<text x="${gx-6*k}" y="${gy+fh*0.6+3}" font-size="${8*k}" text-anchor="end" fill="var(--ink)">${base}</text>`);
  frets.forEach((f,i)=>{
    const sx = gx+i*sw;   // shape[0]=6弦 画在最左；1弦在最右
    if(f===-1) p.push(`<text x="${sx}" y="${gy-2.5}" font-size="7.5" text-anchor="middle" fill="var(--ink)">×</text>`);
    else if(f===0) p.push(`<circle cx="${sx}" cy="${gy-5}" r="2.3" fill="none" stroke="var(--ink)" stroke-width="0.7"/>`);
    else{ const r=f-base+1;
      if(r>=1&&r<=4) p.push(`<circle cx="${sx}" cy="${gy+(r-0.5)*fh}" r="${2.8*k}" fill="var(--ink)"/>`); }
  });
  return p.join('');
}
function beamGroups(cols, playable){
  const groups=[]; let cur=null; let cum=0;
  cols.forEach((c,i)=>{

function strumSpan(col){
  /* 显式弦范围（弹窗多选琴弦设置）优先 */
  if(col.strumTop && col.strumBot)
    return {top:col.strumTop, bot:col.strumBot, n:col.strumBot-col.strumTop+1};
  const NS = strN();
  const ss = col.notes.map(n=>n.s);
  const bot0 = Math.min(NS, ss.length?Math.max(...ss):NS), top0 = ss.length?Math.min(...ss):1;
  const defN = ss.length? bot0-top0+1 : NS;
  const n = Math.max(2, Math.min(NS, col.strumN||defN));
  if(col.strumAnchor==='t'){           // 锚定1弦侧，向低音弦方向延伸
    const top = top0;
    const bot = Math.min(NS, top+n-1);
    return {top, bot, n:bot-top+1};
  }
  const bot = bot0;                     // 默认锚定低音弦侧，向1弦方向延伸
  const top = Math.max(1, bot-n+1);
  return {top, bot, n:bot-top+1};
}

        p.push(`<text x="${ox+8}" y="${tabTop+STAFF*0.4+3}" font-size="14" font-family="var(--font-num)" font-weight="bold" fill="var(--ink)">${song.beats}</text>`);
        p.push(`<text x="${ox+8}" y="${tabTop+STAFF*0.8+3}" font-size="14" font-family="var(--font-num)" font-weight="bold" fill="var(--ink)">${song.unit}</text>`);
      }
      p.push(`<line x1="${ox}" y1="${tabTop}" x2="${ox}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
      sys.measures.forEach((lm, lmIdx)=>{
        const mea = song.measures[lm.mi];
        const cols = mea.tabs[vi]||[];
        const lay = lm.L.tabs[vi];
        const mx = ox+lm.x;
        const isRowEnd = lmIdx===sys.measures.length-1;
        let runChord = chordPrior(lm.mi, vi);
        const isLast = lm.mi===song.measures.length-1;
        const isErr = errSet.has('tab'+vi+':'+lm.mi);
        if(vi===0){
          /* 整小节选中高亮（跨所有声部） */
          if(measureSel===lm.mi)
            p.push(`<rect x="${mx}" y="${oy+M.tabTops[0]-16}" width="${lm.L.w}" height="${M.h-M.tabTops[0]+6}" rx="6" fill="var(--accent)" opacity="0.09" stroke="var(--accent)" stroke-width="1.3" stroke-dasharray="6 3"/>`);
          const numOn = measureSel===lm.mi;
          /* 小节编号：显示在吉他谱小节线正下方，悬停变色（.mnumg:hover） */
          p.push(`<g class="mnumg"><text class="mnum" x="${mx+2.5}" y="${tabBot+11}" font-size="${numOn?11:9}" font-weight="${numOn?'700':'600'}" fill="${isErr?'var(--danger)':(numOn?'var(--accent)':'var(--muted)')}" opacity="${numOn?1:0.85}">${lm.mi+1}</text>`+
            `<rect class="measnum" x="${mx-2}" y="${tabBot+1}" width="${9+(''+(lm.mi+1)).length*6}" height="13" rx="3" fill="transparent" data-measuresel="${lm.mi}" style="cursor:pointer"><title>点击选中整小节（可复制/粘贴）</title></rect></g>`);
        }
        if(isErr)
          p.push(`<rect x="${mx}" y="${tabTop-4}" width="${lm.L.w}" height="${stemY-tabTop+8}" fill="var(--danger)" opacity="0.07"/>
            <text x="${mx+lm.L.w-8}" y="${tabTop-6}" font-size="11" font-weight="bold" fill="var(--danger)">!</text>`);
        if(inRange('tab',vi,lm.mi))
          p.push(`<rect x="${mx+1}" y="${tabTop-4}" width="${lm.L.w-2}" height="${stemY-tabTop+8}" rx="4" fill="none" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>`);
        if(mea.repeatStart){
          p.push(`<rect x="${mx+1}" y="${tabTop}" width="2.4" height="${STAFF}" fill="var(--ink)"/>`);
          p.push(`<line x1="${mx+6}" y1="${tabTop}" x2="${mx+6}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
          p.push(`<circle cx="${mx+10.5}" cy="${tabTop+STAFF/2-STR/2}" r="1.8" fill="var(--ink)"/><circle cx="${mx+10.5}" cy="${tabTop+STAFF/2+STR/2}" r="1.8" fill="var(--ink)"/>`);
        }
        const bx = mx+lm.L.w;
        const nextRep = song.measures[lm.mi+1] && song.measures[lm.mi+1].repeatStart;
        if(mea.repeatEnd){
          p.push(`<circle cx="${bx-10.5}" cy="${tabTop+STAFF/2-STR/2}" r="1.8" fill="var(--ink)"/><circle cx="${bx-10.5}" cy="${tabTop+STAFF/2+STR/2}" r="1.8" fill="var(--ink)"/>`);
          p.push(`<line x1="${bx-6}" y1="${tabTop}" x2="${bx-6}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
          p.push(`<rect x="${bx-3.5}" y="${tabTop}" width="2.4" height="${STAFF}" fill="var(--ink)"/>`);
        }else if(isLast || mea.finalBar){
          p.push(`<line x1="${bx-5}" y1="${tabTop}" x2="${bx-5}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
          p.push(`<rect x="${bx-3}" y="${tabTop}" width="2.6" height="${STAFF}" fill="var(--ink)"/>`);
        }else if(mea.sectionBar){   // 段落重复线：双细线
          p.push(`<line x1="${bx-4}" y1="${tabTop}" x2="${bx-4}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
          p.push(`<line x1="${bx}" y1="${tabTop}" x2="${bx}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
        }else if(!nextRep || isRowEnd){   // 行尾始终补小节线；否则下一小节为反复号时由反复号分隔
          p.push(`<line x1="${bx}" y1="${tabTop}" x2="${bx}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
        }
        /* 小节线热区：点击=选中小节线设置反复/终止符号；按住=选中本小节该声部 */
        {
          const selL = barSel && barSel.R===lm.mi;
          p.push(`<rect class="barzone" x="${mx-4}" y="${tabTop-3}" width="9" height="${STAFF+6}" fill="var(--accent)" fill-opacity="${selL?0.3:0}" data-bar="${lm.mi-1}:${lm.mi}:tab:${vi}" style="cursor:pointer"><title>点击：小节线设置（反复/终止）· 按住：选中本小节吉他谱</title></rect>`);
          if(isRowEnd || isLast){
            const selR = barSel && barSel.L===lm.mi;
            p.push(`<rect class="barzone" x="${bx-2}" y="${tabTop-3}" width="8" height="${STAFF+6}" fill="var(--accent)" fill-opacity="${selR?0.3:0}" data-bar="${lm.mi}:${isLast?-1:lm.mi+1}:tab:${vi}" style="cursor:pointer"><title>点击：小节线设置（反复/终止）· 按住：选中本小节吉他谱</title></rect>`);
          }
        }
        /* 符杠分组预计算：附点圆点需对齐该组由上至下的第一条时值线 */
        const bGroups = beamGroups(cols, c2=>c2.notes.length||c2.strum);
        const dotLv = new Map();
        bGroups.forEach(g=>{
          const maxD = Math.max(...g.idx.map(i2=>cols[i2].dur));
          g.idx.forEach(i2=>dotLv.set(i2, maxD));
        });
        const bendDecor=[];   // 推弦圆圈/连线：列绘制完成后再上层绘制
        cols.forEach((col,ci)=>{
          const nx = mx+lay.xs[ci], cw = lay.ws[ci], clx = mx+lay.ls[ci];
          const boxTop = oy + (vi===0 ? M.diagH : M.tabTops[vi]-14);
          colBoxes['t'+vi+':'+lm.mi+':'+ci] = {x:clx, y:boxTop, w:cw, h:stemY-boxTop+8};
          const isSel = !blurSel && sel.row==='tab'&&sel.vi===vi&&sel.mi===lm.mi&&sel.ci===ci;
          if(isSel)
            p.push(`<rect x="${clx}" y="${tabTop-16}" width="${cw}" height="${stemY-tabTop+26}" rx="4" fill="var(--accent)" opacity="0.12"/>`);
          else if(colInRange('tab',vi,lm.mi,ci))
            p.push(`<rect x="${clx}" y="${tabTop-4}" width="${cw}" height="${stemY-tabTop+8}" fill="var(--accent)" opacity="0.09"/>`);
          if(col.chord){
            runChord = col.chord;
            if(diagMode==='inline' && vi===0)
              {
                /* 仅当"该"和弦图与一弦技巧符号（含连线全程）横向重叠时才缩小，
                   其他和弦图保持原尺寸 */
                const dL=nx-14, dR=nx+38;
                const clash = cols.some((c2,ci2)=>
                  c2.notes && c2.notes.some(nn=>{
                    if(!(nn.s===1 && nn.tech)) return false;
                    const a=mx+lay.xs[ci2];
                    let b2=a;
                    if(nn.tk && nn.tk.mi===lm.mi && lay.xs[nn.tk.ci]!=null) b2=mx+lay.xs[nn.tk.ci];
                    return Math.max(a,b2)+22 > dL && Math.min(a,b2)-16 < dR;
                  }));
                p.push(chordDiagramSVG(col.chord, nx-10, oy+(clash?0:2), clash?0.75:0.95));
              }
            else
              p.push(`<text x="${nx}" y="${tabTop-8}" font-size="12.5" font-weight="bold" text-anchor="middle" fill="var(--ink)">${esc(col.chord)}</text>`);
          }
          const shape = chordShape(runChord);
          if(col.strum==='d'||col.strum==='u'){
            /* 扫弦：只画箭头（细线），落在需要扫的弦上；切音=箭头上带一个点 */
            const sp = strumSpan(col);
            const yT = tabTop+(sp.top-1)*STR-4, yB = tabTop+(sp.bot-1)*STR+4;
            const up = col.strum==='u';   // 所见即所得：扫↑箭头向上，扫↓箭头向下
            p.push(`<line x1="${nx}" y1="${yT+3}" x2="${nx}" y2="${yB-3}" stroke="var(--ink)" stroke-width="1.1"/>`);
            if(up) p.push(`<path d="M ${nx-3.2} ${yT+8} L ${nx} ${yT+1} L ${nx+3.2} ${yT+8}" fill="none" stroke="var(--ink)" stroke-width="1.1"/>`);
            else   p.push(`<path d="M ${nx-3.2} ${yB-8} L ${nx} ${yB-1} L ${nx+3.2} ${yB-8}" fill="none" stroke="var(--ink)" stroke-width="1.1"/>`);
            if(col.mute)   // 切音点：箭头正上方顶端
              p.push(`<circle cx="${nx}" cy="${yT-3}" r="1.7" fill="var(--ink)"/>`);
          }else if(col.strum==='arp' || col.strum==='arpd'){
            /* 上琶音：波浪线+顶端向上箭头；下琶音：波浪线+底端向下箭头 */
            const sp = strumSpan(col);
            const yT = tabTop+(sp.top-1)*STR-2, yB = tabTop+(sp.bot-1)*STR+2;
            let d = `M ${nx} ${yT}`;
            for(let yy=yT; yy<yB-4; yy+=8) d += ` q 3.5 4 0 8`;
            p.push(`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.2"/>`);
            if(col.strum==='arp')
              p.push(`<path d="M ${nx-2.8} ${yT+5} L ${nx} ${yT-1} L ${nx+2.8} ${yT+5}" fill="none" stroke="var(--ink)" stroke-width="1.1"/>`);
            else
              p.push(`<path d="M ${nx-2.8} ${yB-5} L ${nx} ${yB+1} L ${nx+2.8} ${yB-5}" fill="none" stroke="var(--ink)" stroke-width="1.1"/>`);
          }else{
            /* 分解/单音：和弦内音显示 ×，和弦外音显示品位数字 */
            col.notes.forEach(n=>{
              const yy = tabTop+(n.s-1)*STR;
              /* ×记谱仅对开放把位(≤4品)的和弦内音用×；高把位显示实际品位数字 */
              const isTone = tabNotation==='x' && shape && !n.x && n.f<=4 && shapeString(shape, n.s)===n.f;
              const picked = noteSel.some(q=>q.mi===lm.mi&&q.ci===ci&&q.si===n.s&&q.vi===vi);
              if(picked)
                p.push(`<circle cx="${nx}" cy="${yy}" r="8" fill="none" stroke="var(--accent)" stroke-width="1.4"/>`);
              if(n.x || isTone){
                p.push(`<rect x="${nx-5}" y="${yy-4.6}" width="10" height="9.4" fill="var(--paper)"/>`);
                p.push(`<text x="${nx}" y="${yy+3.4}" font-size="10" font-weight="600" text-anchor="middle" fill="var(--ink)">×</text>`);
              }else{
                const wide = n.f>9;
                p.push(`<rect x="${nx-(wide?8:5)}" y="${yy-4.6}" width="${wide?16:10}" height="9.4" fill="var(--paper)"/>`);
                p.push(`<text x="${nx}" y="${yy+3.6}" font-size="10.5" font-weight="600" text-anchor="middle" fill="var(--ink)">${n.f}</text>`);
              }
              /* 技法：符号显示在两音之间连音线上方（比例缩小） */
              if(n.tech==='hm'){
                /* 泛音：与功能栏 ◇ 图标同形同线宽的正菱形框住音符 */
                p.push(`<polygon points="${nx},${yy-7} ${nx+7},${yy} ${nx},${yy+7} ${nx-7},${yy}" fill="none" stroke="var(--ink)" stroke-width="1"/>`);
              }else if(n.tech==='su' || n.tech==='sd'){
                /* 无头滑音：音符左侧斜杠（上滑/下滑）+ 小 S */
                const up = n.tech==='su';
                p.push(`<line x1="${nx-12.5}" y1="${up? yy+4 : yy-4}" x2="${nx-5.5}" y2="${up? yy-3 : yy+3}" stroke="var(--ink)" stroke-width="1"/>`);
                p.push(`<text x="${nx-9}" y="${yy-6.5}" font-size="8.5" font-weight="600" font-style="italic" text-anchor="middle" fill="var(--ink)">S</text>`);
              }else if(n.tech==='ou' || n.tech==='od'){
                /* 无尾滑音：音符右侧斜杠（上滑/下滑）+ 小 S */
                const up = n.tech==='ou';
                p.push(`<line x1="${nx+5.5}" y1="${up? yy+3 : yy-3}" x2="${nx+12.5}" y2="${up? yy-4 : yy+4}" stroke="var(--ink)" stroke-width="1"/>`);
                p.push(`<text x="${nx+9}" y="${yy-6.5}" font-size="8.5" font-weight="600" font-style="italic" text-anchor="middle" fill="var(--ink)">S</text>`);
              }else if(n.tech==='b' || n.tech==='bd'){
                /* 推弦：Ctrl 选中的目标音符加圆圈 + 连音线相连，b↑/b↓ 在连线中间上方；
                   圆圈等后绘（bendDecor），避免被目标数字底色遮住 */
                const sym2 = n.tech==='b'?'b↑':'b↓';
                const tp2 = n.tk ? tabPos[vi+':'+n.tk.mi+':'+n.tk.ci] : null;
                if(tp2 && tp2.sys===sIdx){
                  const x2=tp2.x, y2=tabTop+(n.tk.si-1)*STR;
                  const yPk=Math.min(yy,y2)-12;
                  bendDecor.push(`<circle cx="${x2}" cy="${y2}" r="5.8" fill="none" stroke="var(--ink)" stroke-width="0.9"/>`);
                  bendDecor.push(`<path d="M ${nx+5} ${yy-4.5} Q ${(nx+x2)/2} ${yPk} ${x2-5} ${y2-6.5}" fill="none" stroke="var(--ink)" stroke-width="1"/>`);
                  bendDecor.push(`<text x="${(nx+x2)/2}" y="${yPk+2.4}" font-size="8.5" font-weight="600" font-style="italic" text-anchor="middle" fill="var(--ink)">${sym2}</text>`);
                }else{
                  /* 兼容旧数据（bt 目标品位）：右侧合成圆圈目标音 */
                  const bt = n.bt!=null? n.bt : n.f;
                  const gx2 = nx+15;
                  bendDecor.push(`<circle cx="${gx2}" cy="${yy}" r="5.8" fill="var(--paper)" stroke="var(--ink)" stroke-width="0.9"/>`);
                  bendDecor.push(`<text x="${gx2}" y="${yy+3.2}" font-size="9" font-weight="600" text-anchor="middle" fill="var(--ink)">${bt}</text>`);
                  bendDecor.push(`<path d="M ${nx+5} ${yy-4.5} Q ${(nx+gx2)/2} ${yy-12} ${gx2-4} ${yy-6.2}" fill="none" stroke="var(--ink)" stroke-width="1"/>`);
                  bendDecor.push(`<text x="${(nx+gx2)/2}" y="${yy-13}" font-size="8.5" font-weight="600" font-style="italic" text-anchor="middle" fill="var(--ink)">${sym2}</text>`);
                }
              }else if(n.tech){
                const SYM = {sl:'S',h:'h',p:'p',v:'~',tp:'T',pm:'P.M.'};
                const sym = SYM[n.tech]||n.tech;
                const tp = n.tk ? tabPos[vi+':'+n.tk.mi+':'+n.tk.ci] : null;
                if(tp && tp.sys===sIdx){
                  const x2 = tp.x, y2 = tabTop+(n.tk.si-1)*STR;
                  const yPk = Math.min(yy,y2)-12;
                  p.push(`<path d="M ${nx+5} ${yy-4.5} Q ${(nx+x2)/2} ${yPk} ${x2-5} ${y2-4.5}" fill="none" stroke="var(--ink)" stroke-width="1"/>`);
                  p.push(`<text x="${(nx+x2)/2}" y="${yPk+2.4}" font-size="9.5" font-weight="600" font-style="italic" text-anchor="middle" fill="var(--ink)">${sym}</text>`);
                }else if(tp){
                  p.push(`<path d="M ${nx+5} ${yy-4.5} q 9 -8 18 -6" fill="none" stroke="var(--ink)" stroke-width="1"/>`);
                  p.push(`<text x="${nx+14}" y="${yy-12}" font-size="9.5" font-weight="600" font-style="italic" text-anchor="middle" fill="var(--ink)">${sym}</text>`);
                }else{
                  p.push(`<text x="${nx}" y="${yy-10.5}" font-size="9.5" font-weight="600" font-style="italic" text-anchor="middle" fill="var(--ink)">${sym}</text>`);
                }
              }else if(n.tk){
                /* 纯连音线（无技法字母）：可跨过中间音符直接连到目标音符 */
                const tp = tabPos[vi+':'+n.tk.mi+':'+n.tk.ci];
                if(tp && tp.sys===sIdx){
                  const x2=tp.x, y2=tabTop+(n.tk.si-1)*STR;
                  const yPk=Math.min(yy,y2)-12;
                  p.push(`<path d="M ${nx+5} ${yy-4.5} Q ${(nx+x2)/2} ${yPk} ${x2-5} ${y2-4.5}" fill="none" stroke="var(--ink)" stroke-width="1"/>`);
                }else if(tp){
                  p.push(`<path d="M ${nx+5} ${yy-4.5} q 9 -8 18 -6" fill="none" stroke="var(--ink)" stroke-width="1"/>`);
                }
              }
            });
            /* 空列（无音符/无扫弦）画休止符，让时值可见 */
            if(!col.notes.length)
              p.push(`<text x="${nx}" y="${tabTop+STAFF/2+STR}" font-size="12" text-anchor="middle" fill="var(--ink)" opacity="0.45">𝄽</text>`);
          }
          /* 拍弦记号：需拍弦的音符用方框框住 */
          if(col.slap && col.notes.length){
            const ss=col.notes.map(n=>n.s);
            const y1=tabTop+(Math.min(...ss)-1)*STR-6, y2=tabTop+(Math.max(...ss)-1)*STR+6;
            p.push(`<rect x="${nx-7.5}" y="${y1}" width="15" height="${y2-y1}" rx="2" fill="none" stroke="var(--ink)" stroke-width="1.1"/>`);
          }
          const hasEvt = col.notes.length || col.strum;
          if(hasEvt && col.dur>=2){
            /* 符干自"需要演奏的音符"下方起，向下延伸到节奏横梁 */
            let sLow = 6;
            if(col.strum) sLow = strumSpan(col).bot;
            else if(col.notes.length) sLow = Math.max(...col.notes.map(n=>n.s));
            const stemTop = Math.min(tabBot+2, tabTop+(sLow-1)*STR+6);
            p.push(`<line x1="${nx}" y1="${stemTop}" x2="${nx}" y2="${stemY}" stroke="var(--ink)" stroke-width="1"/>`);
            if(col.dotted){
              /* 附点对齐该拍符杠组由上至下的第一条时值线（32分层/16分层/主梁） */
              const lv = dotLv.get(ci) || col.dur;
              const dy = lv>=32 ? stemY-9.1 : lv>=16 ? stemY-5.1 : stemY-1.1;
              p.push(`<circle cx="${nx+4.5}" cy="${dy}" r="1.6" fill="var(--ink)"/>`);
            }
          }
          p.push(`<rect x="${clx}" y="${tabTop-18}" width="${cw}" height="18" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="tab" data-vi="${vi}" data-si="0" style="cursor:pointer"/>`);
          if(vi===0 && diagMode==='inline')
            p.push(`<rect x="${clx}" y="${oy}" width="${cw}" height="${M.diagH}" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="tab" data-vi="0" data-si="0" data-zone="chord" style="cursor:pointer"/>`);
          if(col.strum)
            p.push(`<rect class="strumcell" x="${clx}" y="${tabTop-2}" width="${cw}" height="${STAFF+4}" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="tab" data-vi="${vi}" data-si="0" data-zone="strum" style="cursor:pointer"/>`);
          else for(let s2=1;s2<=SN;s2++)
            p.push(`<rect class="strcell" x="${clx}" y="${tabTop+(s2-1)*STR-STR/2}" width="${cw}" height="${STR}" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="tab" data-vi="${vi}" data-si="${s2}" style="cursor:pointer"/>`);
        });
        bendDecor.forEach(s=>p.push(s));   // 推弦圆圈/连线置于音符之上
        bGroups.forEach(g=>{
          const xs = g.idx.map(i=>mx+lay.xs[i]);
          const x1=Math.min(...xs), x2=Math.max(...xs);
          if(g.idx.length>1){
            p.push(`<rect x="${x1-0.5}" y="${stemY-2.2}" width="${x2-x1+1}" height="2.2" fill="var(--ink)"/>`);
            /* 16/32 分层：连续段画整梁；组内孤立的 16/32 分（如附点8+16）
               画一截短杠（断梁），朝向组内相邻音符 */
            [[16, stemY-6.2],[32, stemY-10.2]].forEach(([lv,yy])=>{
              for(let a=0;a<g.idx.length;a++){
                if(cols[g.idx[a]].dur<lv) continue;
                let b=a; while(b<g.idx.length-1 && cols[g.idx[b+1]].dur>=lv) b++;
                if(b>a){
                  p.push(`<rect x="${mx+lay.xs[g.idx[a]]-0.5}" y="${yy}" width="${lay.xs[g.idx[b]]-lay.xs[g.idx[a]]+1}" height="2.2" fill="var(--ink)"/>`);
                }else{
                  const x=mx+lay.xs[g.idx[a]];
                  const sx = a>0 ? x-7 : x-0.5;   // 短杠：跟在长音后→向左，居组首→向右
                  p.push(`<rect x="${sx}" y="${yy}" width="7.5" height="2.2" fill="var(--ink)"/>`);
                }
                a=b;
              }
            });
          }else{
            const x=xs[0];
            p.push(`<path d="M ${x} ${stemY} q 6 -3 8 -8" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);
            if(cols[g.idx[0]].dur>=16)
              p.push(`<path d="M ${x} ${stemY-5} q 6 -3 8 -8" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);
            if(cols[g.idx[0]].dur>=32)
              p.push(`<path d="M ${x} ${stemY-10} q 6 -3 8 -8" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);
          }
        });
        /* 连音标记（吉他谱）：时值符号下方刻度线括号，中间断开标斜体数字；
           每 n 个音为一组独立标记（同小节多组连音互不关联），
           括号两端对齐该组时值符号（符杠）的左右两端 */
        {
          const tN=c2=>c2.tup===1?3:c2.tup;
          let a2=0;
          while(a2<cols.length){
            if(cols[a2].tup){
              let b3=a2; while(b3<cols.length-1 && cols[b3+1].tup && tN(cols[b3+1])===tN(cols[a2])) b3++;
              const n=tN(cols[a2]);
              for(let s=a2; s<=b3; s+=n){
                const e=Math.min(s+n-1, b3);
                const x1=mx+lay.xs[s], x2=mx+lay.xs[e], xm=(x1+x2)/2;
                const half=Math.min(5.5, Math.max(3,(x2-x1)/2-3));
                const yl=stemY+4.5;
                p.push(`<line x1="${x1}" y1="${yl}" x2="${x1}" y2="${yl-3.2}" stroke="var(--ink)" stroke-width="1"/>`);
                p.push(`<line x1="${x2}" y1="${yl}" x2="${x2}" y2="${yl-3.2}" stroke="var(--ink)" stroke-width="1"/>`);
                p.push(`<line x1="${x1}" y1="${yl}" x2="${xm-half}" y2="${yl}" stroke="var(--ink)" stroke-width="1"/>`);
                p.push(`<line x1="${xm+half}" y1="${yl}" x2="${x2}" y2="${yl}" stroke="var(--ink)" stroke-width="1"/>`);
                p.push(`<text x="${xm}" y="${yl+2.8}" font-size="8.5" font-style="italic" font-weight="700" text-anchor="middle" fill="var(--ink)">${n}</text>`);
              }
              a2=b3+1;
            } else a2++;
          }
        }
        /* 每拍时值符号区（六线下方整段）可点击：点击时值符号即选中整拍 */
        {
          const zTop = tabBot+2, zH = stemY-tabBot+6;
          let cum=0; const byBeat={};
          cols.forEach((col,ci)=>{ const bt=Math.floor(cum+1e-4); (byBeat[bt]=byBeat[bt]||[]).push(ci); cum+=beatsOf(col); });
          Object.keys(byBeat).forEach(bt=>{
            const ids=byBeat[bt]; const a=ids[0], b=ids[ids.length-1];
            const x1=mx+lay.ls[a], x2=mx+lay.ls[b]+lay.ws[b];
            const beatSel = selRange && selRange.row==='tab' && selRange.vi===vi && selRange.m1===lm.mi && selRange.c1===a && selRange.c2===b;
            if(beatSel)
              p.push(`<rect x="${x1}" y="${zTop}" width="${x2-x1}" height="${zH}" rx="3" fill="var(--accent)" opacity="0.14"/>`);
            p.push(`<rect class="beatzone" x="${x1}" y="${zTop}" width="${x2-x1}" height="${zH}" fill="transparent" data-beatsel="${lm.mi}:${vi}:${bt}" style="cursor:pointer"><title>点击选中第${+bt+1}拍</title></rect>`);
          });
        }
      });
    });
    song.voxVoices.forEach((vname, vi)=>{
      const voxY = oy+M.voxYs[vi], lyr0 = oy+M.lyricY0[vi];
      p.push(`<line x1="${ox}" y1="${voxY-13}" x2="${ox}" y2="${voxY+4}" stroke="var(--ink)" stroke-width="1"/>`);
      if(song.voxVoices.length>1)
        p.push(`<text x="${ox-24}" y="${voxY-2}" font-size="10" text-anchor="middle" fill="var(--ink)" opacity="0.6">${esc(vname)}</text>`);
      sys.measures.forEach((lm, lmIdx)=>{
        const mea = song.measures[lm.mi];
        const cols = mea.voxes[vi]||[];
        const lay = lm.L.voxes[vi];
        const mx = ox+lm.x;
        const isRowEnd = lmIdx===sys.measures.length-1;
        const isLast = lm.mi===song.measures.length-1;
        const isErr = errSet.has('vox'+vi+':'+lm.mi);
        if(isErr)
          p.push(`<rect x="${mx}" y="${voxY-22}" width="${lm.L.w}" height="34" fill="var(--danger)" opacity="0.07"/>
            <text x="${mx+lm.L.w-8}" y="${voxY-14}" font-size="11" font-weight="bold" fill="var(--danger)">!</text>`);
        if(inRange('vox',vi,lm.mi))
          p.push(`<rect x="${mx+1}" y="${voxY-22}" width="${lm.L.w-2}" height="34" rx="4" fill="none" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>`);
        const bx = mx+lm.L.w;
        const vNextRep = song.measures[lm.mi+1] && song.measures[lm.mi+1].repeatStart;
        const yT2=voxY-13, yB2=voxY+4;
        /* 反复开始：小节左侧 粗线+细线+两点（显式绘制，不用字体字形） */
        if(mea.repeatStart){
          p.push(`<rect x="${mx+1}" y="${yT2}" width="2" height="${yB2-yT2}" fill="var(--ink)"/>`);
          p.push(`<line x1="${mx+5}" y1="${yT2}" x2="${mx+5}" y2="${yB2}" stroke="var(--ink)" stroke-width="1"/>`);
          p.push(`<circle cx="${mx+8.5}" cy="${voxY-6}" r="1.4" fill="var(--ink)"/><circle cx="${mx+8.5}" cy="${voxY-0.5}" r="1.4" fill="var(--ink)"/>`);
        }
        if(mea.repeatEnd){
          p.push(`<circle cx="${bx-9}" cy="${voxY-6}" r="1.4" fill="var(--ink)"/><circle cx="${bx-9}" cy="${voxY-0.5}" r="1.4" fill="var(--ink)"/>`);
          p.push(`<line x1="${bx-5.5}" y1="${yT2}" x2="${bx-5.5}" y2="${yB2}" stroke="var(--ink)" stroke-width="1"/>`);
          p.push(`<rect x="${bx-3}" y="${yT2}" width="2" height="${yB2-yT2}" fill="var(--ink)"/>`);
        }else if(isLast || mea.finalBar){
          p.push(`<line x1="${bx-5}" y1="${yT2}" x2="${bx-5}" y2="${yB2}" stroke="var(--ink)" stroke-width="1"/>`);
          p.push(`<rect x="${bx-3}" y="${yT2}" width="2.4" height="${yB2-yT2}" fill="var(--ink)"/>`);
        }else if(mea.sectionBar){   // 段落重复线：双细线
          p.push(`<line x1="${bx-4}" y1="${yT2}" x2="${bx-4}" y2="${yB2}" stroke="var(--ink)" stroke-width="1"/>`);
          p.push(`<line x1="${bx}" y1="${yT2}" x2="${bx}" y2="${yB2}" stroke="var(--ink)" stroke-width="1"/>`);
        }else if(!vNextRep || isRowEnd){   // 行尾始终补小节线
          p.push(`<line x1="${bx}" y1="${yT2}" x2="${bx}" y2="${yB2}" stroke="var(--ink)" stroke-width="1"/>`);
        }
        /* 小节线热区：点击=选中小节线设置符号；按住=选中本小节简谱声部 */
        {
          const selL = barSel && barSel.R===lm.mi;
          p.push(`<rect class="barzone" x="${mx-4}" y="${yT2-2}" width="9" height="${yB2-yT2+4}" fill="var(--accent)" fill-opacity="${selL?0.3:0}" data-bar="${lm.mi-1}:${lm.mi}:vox:${vi}" style="cursor:pointer"><title>点击：小节线设置（反复/终止）· 按住：选中本小节简谱</title></rect>`);
          if(isRowEnd || isLast){
            const selR = barSel && barSel.L===lm.mi;
            p.push(`<rect class="barzone" x="${bx-2}" y="${yT2-2}" width="8" height="${yB2-yT2+4}" fill="var(--accent)" fill-opacity="${selR?0.3:0}" data-bar="${lm.mi}:${isLast?-1:lm.mi+1}:vox:${vi}" style="cursor:pointer"><title>点击：小节线设置（反复/终止）· 按住：选中本小节简谱</title></rect>`);
          }
        }
        const vGroups = beamGroups(cols, null);
        const inGroup = new Set(); vGroups.forEach(g=>{ if(g.idx.length>1) g.idx.forEach(i=>inGroup.add(i)); });
        cols.forEach((col,ci)=>{
          const nx = mx+lay.xs[ci], cw = lay.ws[ci], clx = mx+lay.ls[ci];
          colBoxes['v'+vi+':'+lm.mi+':'+ci] = {x:clx, y:voxY-24, w:cw, h:26+song.lyricLines*20+8};
          const isSel = !blurSel && sel.row==='vox'&&sel.vi===vi&&sel.mi===lm.mi&&sel.ci===ci;
          if(isSel)
            p.push(`<rect x="${clx}" y="${voxY-22}" width="${cw}" height="${30+song.lyricLines*20}" rx="4" fill="var(--accent)" opacity="0.12"/>`);
          else if(colInRange('vox',vi,lm.mi,ci))
            p.push(`<rect x="${clx}" y="${voxY-22}" width="${cw}" height="34" fill="var(--accent)" opacity="0.09"/>`);
          if(noteSel.some(q=>q.row==='vox'&&q.mi===lm.mi&&q.ci===ci&&q.vi===vi))
            p.push(`<circle cx="${nx}" cy="${voxY-5}" r="8.5" fill="none" stroke="var(--accent)" stroke-width="1.4"/>`);
          const under = col.dur>=32?3 : col.dur>=16?2 : col.dur>=8?1 : 0;
          /* 功能谱：级数和弦标注在音符上方（悬停显示原和弦名） */
          if(col.chord){
            const cy2 = voxY-24-(col.oct>0? Math.min(3,col.oct)*4.2 : 0);
            p.push(`<text x="${nx}" y="${cy2}" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--ink)" data-vchord="${lm.mi}:${ci}:${vi}" style="cursor:pointer">${esc(chordDegree(col.chord))}<title>${esc(col.chord)}（点击编辑）</title></text>`);
          }
          if(col.acc)
            p.push(`<text x="${nx-9}" y="${voxY-6}" font-size="10" text-anchor="middle" fill="var(--ink)">${col.acc==='#'?'♯':col.acc==='b'?'♭':'♮'}</text>`);
          p.push(`<text x="${nx}" y="${voxY}" font-size="16.5" font-family="var(--font-ui)" text-anchor="middle" fill="var(--ink)">${col.deg}</text>`);
          /* 倚音（图式记谱）：最多3个小音符成组、共用减时线、各自八度点，
             连接线=直角折线（倚音正下方 → 主音符腰部），可点击编辑 */
          const graceZones=[];
          const drawGrace = (gRaw, kind)=>{
            const g=normGrace(gRaw);
            if(!g.notes.length) return;
            const pre = kind==='pre';
            /* 整体小比例：位于主音左上/右上角，含减时线与八度点也不超过主音大小 */
            const STEP=6.5, gW=(g.notes.length-1)*STEP;
            const gxc = pre? nx-10-gW : nx+10;      // 组首音符中心
            const gyb = voxY-12;
            const gu = g.dur>=32?3 : g.dur>=16?2 : g.dur>=8?1 : 0;
            const LSP=1.7, DSP=2.6;                 // 减时线距 / 八度点距
            const maxLow = Math.max(0, ...g.notes.map(gn=>gn.oct<0? Math.min(3,-gn.oct) : 0));
            g.notes.forEach((gn,gi)=>{
              const x=gxc+gi*STEP;
              p.push(`<text x="${x}" y="${gyb}" font-size="8.5" font-family="var(--font-ui)" text-anchor="middle" fill="var(--ink)">${gn.deg}</text>`);
              for(let d2=0; d2<Math.min(3, Math.abs(gn.oct||0)); d2++){
                if(gn.oct>0) p.push(`<circle cx="${x}" cy="${gyb-8-d2*DSP}" r="1" fill="var(--ink)"/>`);
                else p.push(`<circle cx="${x}" cy="${gyb+2.6+gu*LSP+d2*DSP}" r="1" fill="var(--ink)"/>`);
              }
            });
            /* 共用减时线：横跨整组 */
            for(let u=0;u<gu;u++)
              p.push(`<line x1="${gxc-3.6}" y1="${gyb+1.4+u*LSP}" x2="${gxc+gW+3.6}" y2="${gyb+1.4+u*LSP}" stroke="var(--ink)" stroke-width="0.8"/>`);
            /* 倚音连接线：一个直角——竖边起点在倚音正下方（自动让过减时线与低音点），
               横边终点搭在主音符腰部；减时线/低音点越多，转角自动下移 */
            const yTop = gyb+1.4+gu*LSP + (maxLow? 2.2+maxLow*DSP : 1.2);
            const yH = Math.max(voxY-4.5, yTop+2.5);      // 主音符腰部高度（必要时下移避让）
            const gx = gxc+gW/2;                          // 倚音组正下方
            const xe = pre? nx-6.5 : nx+6.5;              // 主音符腰部（左/右侧）
            p.push(`<path d="M ${gx} ${yTop} L ${gx} ${yH} L ${xe} ${yH}" fill="none" stroke="var(--ink)" stroke-width="0.9"/>`);
            graceZones.push(`<rect x="${gxc-7}" y="${gyb-17}" width="${gW+14}" height="${yH-(gyb-17)+3}" fill="transparent" data-grace="${lm.mi}:${ci}:${vi}:${kind}" style="cursor:pointer"><title>点击编辑倚音（音高/时值/八度，最多3音）</title></rect>`);
          };
          if(col.grace) drawGrace(col.grace, 'pre');
          if(col.graceA) drawGrace(col.graceA, 'post');
          /* 标识符号：上/下波音、颤音 tr、回音 */
          if(col.orn && col.deg){
            const oy2 = voxY - (col.oct>0? 22 : 15);
            if(col.orn==='up' || col.orn==='down'){
              let d=`M ${nx-6} ${oy2}`;
              for(let k2=0;k2<3;k2++) d+=` l 2 -3 l 2 3`;
              p.push(`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1"/>`);
              if(col.orn==='down')
                p.push(`<line x1="${nx}" y1="${oy2-5.5}" x2="${nx}" y2="${oy2+2.5}" stroke="var(--ink)" stroke-width="1"/>`);
            }else if(col.orn==='tr'){
              p.push(`<text x="${nx}" y="${oy2+2}" font-size="10" font-style="italic" font-weight="700" text-anchor="middle" fill="var(--ink)">tr</text>`);
            }else if(col.orn==='turn'){
              p.push(`<text x="${nx}" y="${oy2+3}" font-size="12" text-anchor="middle" fill="var(--ink)">∽</text>`);
            }
          }
          if(col.deg){
            for(let d=0; d<Math.min(3,Math.abs(col.oct)); d++){
              /* 倍高音点贴近数字上沿（避开六线谱节奏符杠）；低音点落在减时线下方 */
              if(col.oct>0) p.push(`<circle cx="${nx}" cy="${voxY-14-d*4.2}" r="1.5" fill="var(--ink)"/>`);
              else p.push(`<circle cx="${nx}" cy="${voxY+5.5+under*3.1+d*4.2}" r="1.5" fill="var(--ink)"/>`);
            }
          }
          if(under && !inGroup.has(ci))
            for(let u=0;u<under;u++)
              p.push(`<line x1="${nx-6.5}" y1="${voxY+3.4+u*3.2}" x2="${nx+6.5}" y2="${voxY+3.4+u*3.2}" stroke="var(--ink)" stroke-width="1.1"/>`);
          if(col.dotted) p.push(`<circle cx="${nx+11}" cy="${voxY-4}" r="1.7" fill="var(--ink)"/>`);
          if(col.dur===2) p.push(`<text x="${nx+cw*0.42}" y="${voxY-1}" font-size="15" font-family="var(--font-ui)" text-anchor="middle" fill="var(--ink)">–</text>`);
          if(col.dur===1) for(let d=1;d<=3;d++)
            p.push(`<text x="${nx+cw*0.22*d}" y="${voxY-1}" font-size="15" font-family="var(--font-ui)" text-anchor="middle" fill="var(--ink)">–</text>`);
          (col.lyrics||[]).forEach((ly,li)=>{
            if(ly && li<song.lyricLines)
              p.push(`<text x="${nx}" y="${lyr0+li*20}" font-size="14" font-family="var(--font-ui)" text-anchor="middle" fill="var(--ink)">${esc(ly)}</text>`);
          });
          p.push(`<rect x="${clx}" y="${voxY-24}" width="${cw}" height="34" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="vox" data-vi="${vi}" style="cursor:pointer"/>`);
          for(let li=0;li<song.lyricLines;li++)
            p.push(`<rect x="${clx}" y="${lyr0+li*20-14}" width="${cw}" height="19" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="vox" data-vi="${vi}" data-zone="lyric" data-line="${li}" style="cursor:pointer"/>`);
          graceZones.forEach(z=>p.push(z));   // 倚音热区置顶层，保证可点击
        });
        /* 连音线（简谱）：连续 tie 合并为一条弧线，跨过中间音符直达目标音
           （Ctrl 跨选两音时中间音符自动相连，整段渲染为一条线） */
        {
          let a3=0;
          while(a3<cols.length){
            if(!cols[a3].tie){ a3++; continue; }
            let b3=a3;
            while(b3+1<cols.length && cols[b3+1].tie) b3++;
            const x1 = mx+lay.xs[a3]+5;
            const x2 = (b3+1<cols.length)? mx+lay.xs[b3+1]-6 : mx+lm.L.w+10;
            const yp = voxY-22-Math.min(6,(b3-a3)*2);
            p.push(`<path d="M ${x1} ${voxY-13} Q ${(x1+x2)/2} ${yp} ${x2} ${voxY-13}" fill="none" stroke="var(--ink)" stroke-width="1"/>`);
            a3=b3+1;
          }
        }
        /* 连音标记（简谱）：音符上方连音弧线，中间断开标斜体数字；
           每 n 个音为一组独立标记（同小节多组连音互不关联） */
        {
          const tN=c2=>c2.tup===1?3:c2.tup;
          let a2=0;
          while(a2<cols.length){
            if(cols[a2].tup){
              let b3=a2; while(b3<cols.length-1 && cols[b3+1].tup && tN(cols[b3+1])===tN(cols[a2])) b3++;
              const n=tN(cols[a2]);
              for(let s=a2; s<=b3; s+=n){
                const e=Math.min(s+n-1, b3);
                const x1=mx+lay.xs[s]-3, x2=mx+lay.xs[e]+3, xm=(x1+x2)/2;
                const half=Math.min(6, Math.max(3.5,(x2-x1)/2-3));
                const y0=voxY-13, yp=voxY-19;
                p.push(`<path d="M ${x1} ${y0} Q ${(x1+xm)/2} ${yp-1} ${xm-half} ${yp+0.8}" fill="none" stroke="var(--ink)" stroke-width="1"/>`);
                p.push(`<path d="M ${xm+half} ${yp+0.8} Q ${(xm+x2)/2} ${yp-1} ${x2} ${y0}" fill="none" stroke="var(--ink)" stroke-width="1"/>`);
                p.push(`<text x="${xm}" y="${yp+3.4}" font-size="8.5" font-style="italic" font-weight="700" text-anchor="middle" fill="var(--ink)">${n}</text>`);
              }
              a2=b3+1;
            } else a2++;
          }
        }
        vGroups.forEach(g=>{
          if(g.idx.length<2) return;
          const x1 = mx+lay.xs[g.idx[0]]-6.5, x2 = mx+lay.xs[g.idx[g.idx.length-1]]+6.5;
          p.push(`<line x1="${x1}" y1="${voxY+3.4}" x2="${x2}" y2="${voxY+3.4}" stroke="var(--ink)" stroke-width="1.1"/>`);
          for(let a=0;a<g.idx.length;a++){
            if(cols[g.idx[a]].dur>=16){
              let b=a; while(b<g.idx.length-1 && cols[g.idx[b+1]].dur>=16) b++;
              const xa = mx+lay.xs[g.idx[a]]-6.5, xb = mx+lay.xs[g.idx[b]]+6.5;
              p.push(`<line x1="${xa}" y1="${voxY+6.6}" x2="${xb}" y2="${voxY+6.6}" stroke="var(--ink)" stroke-width="1.1"/>`);
              a=b;
            }
          }
          for(let a=0;a<g.idx.length;a++){
            if(cols[g.idx[a]].dur>=32){
              let b=a; while(b<g.idx.length-1 && cols[g.idx[b+1]].dur>=32) b++;
              const xa = mx+lay.xs[g.idx[a]]-6.5, xb = mx+lay.xs[g.idx[b]]+6.5;
              p.push(`<line x1="${xa}" y1="${voxY+9.8}" x2="${xb}" y2="${voxY+9.8}" stroke="var(--ink)" stroke-width="1.1"/>`);
              a=b;
            }
          }
        });
      });
    });
  });
  p.push(`<rect id="playhead" x="0" y="0" width="0" height="0" rx="4" fill="var(--accent)" opacity="0" pointer-events="none"/>`);
  const totalH = nPages*PG_H + (nPages-1)*PG_GAP + 6;
  svg.setAttribute('viewBox', `0 0 ${PAGE_W} ${totalH}`);
  svg.setAttribute('width', Math.round(PAGE_W*viewZoom));
  svg.setAttribute('height', Math.round(totalH*viewZoom));
  const zl = document.getElementById('zoom-lbl');
  if(zl) zl.textContent = Math.round(viewZoom*100)+'%';
  svg.innerHTML = p.join('');
  syncInputs();
}

/* ================= 选区/Ribbon 同步 ================= */
function curMea(){ return song.measures[sel.mi]; }
function curRowCols(){
  const m = curMea(); if(!m) return null;
  return sel.row==='tab' ? m.tabs[sel.vi] : m.voxes[sel.vi];
}
function curCol(){ const r=curRowCols(); return r && r[sel.ci]; }
function clampSel(){
  sel.mi = Math.max(0, Math.min(sel.mi, song.measures.length-1));
  if(sel.row==='tab') sel.vi = Math.max(0, Math.min(sel.vi, song.tabVoices.length-1));
  else sel.vi = Math.max(0, Math.min(sel.vi, song.voxVoices.length-1));

function comboSVG(durs, W, H){

  const x0=6, x1=W-6;
  const xs=durs.map((_,i)=> n===1? (x0+x1)/2 : x0+i*(x1-x0)/(n-1));
  const yT=3, yB=H-3;
  let g='';
  xs.forEach((x,i)=>{
    g+=`<line x1="${x}" y1="${yT}" x2="${x}" y2="${yB}" stroke="currentColor" stroke-width="1.4"/>`;
    if(durs[i][1]) g+=`<circle cx="${x+3.5}" cy="${yB-6.5}" r="1.2" fill="currentColor"/>`;
  });
  g+=`<rect x="${xs[0]-0.7}" y="${yB-1.8}" width="${xs[n-1]-xs[0]+1.4}" height="1.8" fill="currentColor"/>`;
  for(let i=0;i<n;i++){
    if(durs[i][0]<16) continue;
    let j=i; while(j<n-1 && durs[j+1][0]>=16) j++;
    if(j>i) g+=`<rect x="${xs[i]-0.7}" y="${yB-4.6}" width="${xs[j]-xs[i]+1.4}" height="1.8" fill="currentColor"/>`;
    else g+=`<rect x="${i>0? xs[i]-5 : xs[i]-0.7}" y="${yB-4.6}" width="5" height="1.8" fill="currentColor"/>`;
    i=j;
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
