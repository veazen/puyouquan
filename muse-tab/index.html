/* ================= 自动补齐/删减：保持小节时值准确 ================= */
/* 在可用时值(含附点)中选 ≤rem 的方案：精确吻合优先(含附点)，否则取最大的普通时值 */
function fitDurTo(rem, allowLong){
  const durs = allowLong? [1,2,4,8,16,32] : [4,8,16,32];
  const cand=[];
  durs.forEach(d=>{ cand.push({dur:d,dotted:true}); cand.push({dur:d,dotted:false}); });
  cand.sort((a,b)=>beatsOf(b)-beatsOf(a));
  const exact = cand.find(c=>Math.abs(beatsOf(c)-rem)<1e-4);
  if(exact) return exact;
  const plain = cand.find(c=>!c.dotted && beatsOf(c)<=rem+1e-4);
  return plain || cand.find(c=>beatsOf(c)<=rem+1e-4) || null;
}
function autoFixMeasure(mi, row, vi){
  const target = song.beats;
  const cols = row==='tab'? song.measures[mi].tabs[vi] : song.measures[mi].voxes[vi];
  if(!cols || !cols.length) return;
  let sum = cols.reduce((a,c)=>a+beatsOf(c),0);
  /* 超拍：从尾部整列删减 */
  while(cols.length>1 && sum>target+1e-4){
    const lastB = beatsOf(cols[cols.length-1]);
    if(sum-lastB >= target-1e-4){ cols.pop(); sum-=lastB; } else break;
  }
  /* 仍超拍（末列删掉会欠拍）：把末列时值缩短到剩余空间内 */
  if(sum>target+1e-4 && cols.length){
    const last=cols[cols.length-1];
    const room = target-(sum-beatsOf(last));
    const hit = fitDurTo(room, true);
    if(hit){ last.dur=hit.dur; last.dotted=hit.dotted; sum=cols.reduce((a,c)=>a+beatsOf(c),0); }
  }
  /* 欠拍：按风格自动补充（扫弦补交替箭头，分解补分解音，简谱补休止） */
  let guard=0;
  let lastDir=null;
  if(row==='tab'){
    const l=[...cols].reverse().find(c=>c.strum==='d'||c.strum==='u');
    if(l) lastDir=l.strum;
  }
  let arpIdx = row==='tab'? cols.filter(c=>c.notes.length&&!c.strum).length : 0;
  const strumStyle = row==='tab'? [...cols].reverse().find(c=>c.strum==='d'||c.strum==='u') : null;
  while(sum<target-1e-4 && guard++<64){
    const rem = target-sum;
    const hit = fitDurTo(rem, false);   // 含 32 分及附点：碎拍余量也能补齐
    if(!hit) break;
    let c;
    if(row==='vox'){ c=vcol(); }
    else{
      c=tcol();
      const shape=chordShape(chordBefore(mi,vi));
      if(strumStyle && shape){
        lastDir = lastDir==='d'?'u':'d';
        c.strum=lastDir;
        c.notes=shapeSounded(shape).map(n=>({s:n.s,f:n.f}));
        if(strumStyle.strumN) c.strumN=strumStyle.strumN;
      }else if(shape){
        const cyc=[3,2,3,1];
        const sN=cyc[arpIdx++ % cyc.length];
        const f=shapeString(shape,sN);
        if(f!=null) c.notes=[{s:sN,f}];
      }
    }
    c.dur=hit.dur; c.dotted=hit.dotted;
    cols.push(c); sum+=beatsOf(c);
  }
}
/* 智能修复建议：按曲谱风格/形式匹配补齐或删减方案，供一键采纳 */
function fmtBeats(x){ return (+x.toFixed(3)).toString(); }
function suggestFix(mi, row, vi){
  const target = song.beats;
  const cols = row==='tab'? song.measures[mi].tabs[vi] : song.measures[mi].voxes[vi];
  if(!cols) return null;
  const sum = cols.reduce((a,c)=>a+beatsOf(c),0);
  const diff = +(target - sum).toFixed(3);
  if(Math.abs(diff) < 1e-3) return null;
  if(diff < 0) return { kind:'trim', text:`超出 ${fmtBeats(-diff)} 拍 → 从末尾删减多余音` };
  /* 欠拍：依风格给出补充方案 */
  let style;
  if(row==='vox'){
    const hasNote = cols.some(c=>c.deg);
    style = hasNote ? '按旋律走向补休止/延音' : '补休止占位';
  }else{
    const hasStrum = cols.some(c=>c.strum==='d'||c.strum==='u');
    const hasArp = cols.some(c=>c.notes && c.notes.length && !c.strum);
    const hasChord = !!chordShape(chordBefore(mi,vi));
    if(hasStrum) style = '延续扫弦型补交替 ↓↑';
    else if(hasArp && hasChord) style = '按当前和弦补分解音';
    else if(hasChord) style = '按和弦补分解音';
    else style = '补 4 分音符（×）';
  }
  return { kind:'fill', text:`欠 ${fmtBeats(diff)} 拍 → ${style}` };
}
/* ================= 时值/组合/节奏型 套用 ================= */
function setDur(d){
  if(selRange){
    mutate(()=>{
      rangeCols().forEach(({mi,col})=>{ col.dur=d; });
    });
    toast('已批量替换时值（与拍号不符时会提示，可按需一键修复）');
    return;
  }
  const c=curCol(); if(c) mutate(()=>{ curCol().dur=d; });
}
/* 判断某列是否为"一拍中的最后一个音符"（其结束点恰落在整数拍上） */
function isBeatLastCol(cols, ci){
  if(!cols || !cols[ci]) return false;
  let start=0; for(let i=0;i<ci;i++) start+=beatsOf(cols[i]);
  const end = start + beatsOf(cols[ci]);
  return Math.abs(end-Math.round(end))<1e-4 && Math.round(end)>Math.floor(start+1e-4);
}
/* 附点联动：常规→下一音变当前的1/2；若当前音是拍尾且时值小于8分（16/32分），
   则改为"前一个音符"变当前的1/2（如 16,16,16,16 点末尾→16,16,32,附点16） */
function dotLink(cols, ci, wasBeatLast){
  const cur=cols[ci];
  if(cur.dur*2>32) return;
  if(wasBeatLast && cur.dur>8 && cols[ci-1]){
    cols[ci-1].dur=cur.dur*2; cols[ci-1].dotted=false;
  }else if(cols[ci+1]){
    cols[ci+1].dur=cur.dur*2; cols[ci+1].dotted=false;
  }
}
function toggleDot(){
  if(selRange){
    mutate(()=>{
      const cs=rangeCols();
      const allDot = cs.every(x=>x.col.dotted);
      /* 选中恰为一拍内两个相邻等时值音符（如两个8分）时，设附点=经典
         "附点+半时值"组合：前者加附点、后者时值减半，总时值不变 */
      if(!allDot && cs.length===2 && cs[0].mi===cs[1].mi &&
         cs[0].col.dur===cs[1].col.dur && cs[0].col.dur*2<=32){
        cs[0].col.dotted=true;
        cs[1].col.dur=cs[0].col.dur*2; cs[1].col.dotted=false;
        return;
      }
      /* 选中单个音符：与单音路径一致——联动相邻音符变为其时值的一半 */
      if(!allDot && cs.length===1){
        const {mi,col}=cs[0];
        const cols = selRange.row==='tab'? song.measures[mi].tabs[selRange.vi] : song.measures[mi].voxes[selRange.vi];
        const ci = cols? cols.indexOf(col) : -1;
        const wasBeatLast = ci>=0 && isBeatLastCol(cols, ci);
        col.dotted=true;
        if(ci>=0) dotLink(cols, ci, wasBeatLast);
        return;
      }
      cs.forEach(({mi,col})=>{ col.dotted=!allDot; });
    });
    return;
  }
  const c=curCol(); if(c) mutate(()=>{
    const cur=curCol();
    const cols=curRowCols();
    /* 拍尾判断须用加附点前的时值 */
    const wasBeatLast = !cur.dotted && isBeatLastCol(cols, sel.ci);
    cur.dotted=!cur.dotted;
    /* 设置附点时：相邻音符自动变为当前时值的一半——常规为下一个音符；
       拍尾且时值<8分（16/32分）时为前一个音符；取消附点不联动 */
    if(cur.dotted) dotLink(cols, sel.ci, wasBeatLast);
  });
}
/* 判断一段吉他列的演奏方式：扫弦 / 柱式和声 / 分解 */
function styleOfTab(oldCols){
  if(oldCols.some(c=>c.strum==='d'||c.strum==='u')) return 'strum';
  if(oldCols.some(c=>c.strum==='arp'||c.strum==='arpd')) return 'arp-wave';
  if(oldCols.some(c=>c.notes.filter(n=>!n.x).length>=3)) return 'block';
  return 'arp';
}
/* 按和弦指法 + 演奏方式生成一列 */
function genTabCol(dur, dot, style, shape, idx){
  const c=tcol(); c.dur=dur; c.dotted=!!dot;
  if(!shape) return c;
  const sd=shapeSounded(shape);
  const bass=sd.reduce((a,b)=>b.s>a.s?b:a, sd[0]);
  if(style==='strum'){ c.notes=sd.map(n=>({s:n.s,f:n.f})); c.strum=idx%2===0?'d':'u'; }
  else if(style==='block'){ c.notes=sd.map(n=>({s:n.s,f:n.f})); }
  else if(style==='arp-wave'){ c.notes=sd.map(n=>({s:n.s,f:n.f})); c.strum='arp'; }
  else{ /* 分解：按常规拨弦顺序取和弦内的弦（低音→3→2→1→2→3…） */
    const cyc=[bass.s,3,2,1,2,3,1,2];
    let sN=cyc[idx%cyc.length];
    let f = sN===bass.s? bass.f : shapeString(shape,sN);
    if(f==null){ sN=bass.s; f=bass.f; }
    c.notes=[{s:sN,f}];
  }
  return c;
}
function comboBeatsOf(combo){ return combo.durs.reduce((a,[d,t])=>a+(4/d)*(t?1.5:1)*(song.unit/4),0); }
/* 组合时值：替换选中的一拍（或当前音起 comboBeats 拍），按和弦与演奏方式自动补/删音符 */
function applyDurCombo(combo){
  const row=sel.row;
  let mi, vi, startCi;
  if(selRange && selRange.row===row){ mi=selRange.m1; vi=selRange.vi; startCi=selRange.c1||0; }
  else { mi=sel.mi; vi=sel.vi; startCi=sel.ci; }
  const span = comboBeatsOf(combo);
  mutate(()=>{
    const cols = row==='tab'? song.measures[mi].tabs[vi] : song.measures[mi].voxes[vi];
    if(!cols || !cols[startCi]) return;
    /* 找出从 startCi 起累计 = span 拍的列范围 */
    let acc=0, end=startCi;
    while(end<cols.length && acc<span-1e-3){ acc+=beatsOf(cols[end]); end++; }
    const oldSpan = cols.slice(startCi, end);
    let seg;
    if(row==='tab'){
      const chord = chordAtCol(mi,vi,startCi);
      const shape = chordShape(chord);
      const style = styleOfTab(oldSpan);
      seg = combo.durs.map(([d,t],i)=>genTabCol(d,t,style,shape,i));
      const oc=(oldSpan.find(c=>c.chord)||{}).chord;
      if(oc && seg[0]) seg[0].chord=oc;
    }else{
      const degs = oldSpan.filter(c=>c.deg>0);
      let oi=0;
      seg = combo.durs.map(([d,t])=>{ const c=vcol(); c.dur=d; c.dotted=!!t;
        if(oi<degs.length){ const o=degs[oi++]; c.deg=o.deg;c.acc=o.acc;c.oct=o.oct;c.lyrics=(o.lyrics||[]).slice();c.tie=o.tie;if(o.chord)c.chord=o.chord;else delete c.chord; }
        return c; });
    }
    cols.splice(startCi, end-startCi, ...seg);
    autoFixMeasure(mi, row, vi);
    sel.mi=mi; sel.vi=vi; sel.ci=startCi;
  });
  selRange=null;
  toast('已用组合时值替换：'+combo.name);
}
function targetMeasures(row){
  if(selRange && selRange.row===row){
    const a=[]; for(let m=selRange.m1;m<=selRange.m2;m++) a.push(m);
    return {list:a, vi:selRange.vi};
  }
  if(sel.row!==row) return null;
  return {list:[sel.mi], vi:sel.vi};
}
/* 单个事件 → 一列（按给定和弦指法生成音符） */
function evToCol([t,dur,dot], shape, fallback){
  const c = tcol(); c.dur=dur; c.dotted=!!dot;
  if(shape){
    const sounded = shapeSounded(shape);
    const bass = sounded.reduce((a,b)=>b.s>a.s?b:a, sounded[0]);
    const altC = sounded.filter(n=>n.s>=3 && n.s!==bass.s);
    const alt = altC.length ? altC.reduce((a,b)=>
      Math.abs(b.s-(bass.s-1))<Math.abs(a.s-(bass.s-1))?b:a) : bass;
    if(t==='b') c.notes=[{s:bass.s, f:bass.f}];
    else if(t==='B') c.notes=[{s:alt.s, f:alt.f}];
    else if(t[0]==='s'){ const sn=Math.min(+t[1], strN()); const f=shapeString(shape, sn); if(f!=null) c.notes=[{s:sn, f}]; }
    else if(t==='c') c.notes = sounded.map(n=>({s:n.s,f:n.f}));
    else if(t==='d'||t==='u'){ c.notes = sounded.map(n=>({s:n.s,f:n.f})); c.strum=t; }
    else if(t==='md'||t==='mu'){ c.notes = sounded.map(n=>({s:n.s,f:n.f})); c.strum=t==='md'?'d':'u'; c.mute=true; }
    else if(t==='a'){ c.notes = sounded.map(n=>({s:n.s,f:n.f})); c.strum='arp'; }
    else if(t==='x') c.notes = sounded.slice(0,3).map(n=>({s:n.s,f:0,x:true}));
  }else if(t!=='r' && fallback){
    const fn = fallback();
    if(fn){
      c.notes = fn.map(n=>({...n}));
      if(t==='d'||t==='u') c.strum=t; else if(t==='a') c.strum='arp';
    }
  }
  return c;
}
/* 某列生效的和弦（本小节内该列及之前最后一个，否则向前找） */
function chordAtCol(mi, vi, ci){
  const cols = song.measures[mi].tabs[vi]||[];
  for(let i=Math.min(ci, cols.length-1); i>=0; i--) if(cols[i].chord) return cols[i].chord;
  return chordPrior(mi, vi);
}
function applyTabPattern(pat){
  const tgt = targetMeasures('tab');
  if(!tgt) return toast('请先在吉他谱区选中一列或多选小节');
  mutate(()=>{
    if(pat.span){
      /* 半小节/一拍节奏型：从选中列起，替换覆盖 span 拍的若干列，保持小节总时值 */
      const applyAt = (mi, startCi)=>{
        const cols = song.measures[mi].tabs[tgt.vi];
        const chord = chordAtCol(mi, tgt.vi, startCi);
        const shape = chordShape(chord);
        const oldNotes = cols.slice(startCi).filter(c=>c.notes.length).map(c=>c.notes);
        let oi=0; const fb=()=> oi<oldNotes.length? oldNotes[oi++]:null;
        const seg = pat.ev.map(ev=>evToCol(ev, shape, fb));
        /* 找出从 startCi 起、累计 = span 拍的列范围 */
        let acc=0, end=startCi;
        while(end<cols.length && acc < pat.span-1e-3){ acc+=beatsOf(cols[end]); end++; }
        const removedChord = (cols.slice(startCi,end).find(c=>c.chord)||{}).chord;
        cols.splice(startCi, end-startCi, ...seg);
        if(removedChord) seg[0].chord = removedChord;   // 保留该半小节已有和弦
        autoFixMeasure(mi, 'tab', tgt.vi);
      };
      if(selRange && selRange.row==='tab'){
        tgt.list.forEach(mi=> applyAt(mi, 0));
      } else applyAt(sel.mi, sel.ci);
      setTimeout(()=>toast('已填入'+pat.span+'拍节奏型；另一半可选中后再套用（各自和弦独立）'),200);
    }else{
      tgt.list.forEach(mi=>{
        const old = song.measures[mi].tabs[tgt.vi]||[];
        const chord1 = chordBefore(mi, tgt.vi);
        const oldChord = (old.find(c=>c.chord)||{}).chord||'';
        const oldNotes = old.filter(c=>c.notes.length).map(c=>c.notes);
        let oi=0;
        const fb = ()=> oi<oldNotes.length? oldNotes[oi++] : null;
        const shape = chordShape(chord1);
        const cols = pat.ev.map(ev=>evToCol(ev, shape, fb));
        if(oldChord && cols.length) cols[0].chord = oldChord;
        song.measures[mi].tabs[tgt.vi] = cols;
      });
    }
  });
  toast('已套用节奏型：'+pat.name);
}
function applyVoxPattern(pat){
  const tgt = targetMeasures('vox');
  if(!tgt) return toast('请先在简谱区选中一列或多选小节');
  mutate(()=>{
    tgt.list.forEach(mi=>{
      const old = (song.measures[mi].voxes[tgt.vi]||[]).filter(c=>c.deg>0);
      let oi=0;
      const cols = pat.durs.map(([dur,dot])=>{
        const c = vcol(); c.dur=dur; c.dotted=!!dot;
        if(oi<old.length){
          const o = old[oi++];
          c.deg=o.deg; c.acc=o.acc; c.oct=o.oct; c.lyrics=(o.lyrics||[]).slice(); c.tie=o.tie; if(o.chord)c.chord=o.chord;else delete c.chord;
        }
        return c;
      });
      song.measures[mi].voxes[tgt.vi] = cols;
    });
  });
  toast('已套用节奏型：'+pat.name);
}

/* ---- 构建 Ribbon 时值/组合/快捷节奏型 ---- */

    [3,5,6,7].map(n=>`<button class="eb ico" data-tup="${n}" title="${n}连音：当前音拆分为${n}连音（总时值不变）；选中${n}个等时值音可整体切换">${tupSVG(n)}<span>${n}连音</span></button>`).join('');
  /* 编辑栏第一行：音符增删（位于节奏组之后同排） */

  /* 编辑栏第二行：连音线/连音 + 上下文（技巧/记号） */

  });
  /* ---- 缩放：按钮 ±、点击百分比复位；内容区 Ctrl+滚轮 ---- */
  const setZoom = z=>{
    viewZoom = Math.max(0.5, Math.min(2, Math.round(z*20)/20));
    localStorage.setItem('musetab-zoom', viewZoom);
    const svg = document.getElementById('score');
    const vb = svg.viewBox.baseVal;
    if(vb && vb.width){
      svg.setAttribute('width', Math.round(vb.width*viewZoom));
      svg.setAttribute('height', Math.round(vb.height*viewZoom));
    }
    document.getElementById('zoom-lbl').textContent = Math.round(viewZoom*100)+'%';
  };
  document.getElementById('z-in').onclick = ()=>setZoom(viewZoom+0.1);
  document.getElementById('z-out').onclick = ()=>setZoom(viewZoom-0.1);
  document.getElementById('zoom-lbl').onclick = ()=>setZoom(1);
  document.getElementById('score-wrap').addEventListener('wheel', e=>{
    if(!e.ctrlKey) return;
    e.preventDefault();
    /* 以光标位置为中心缩放：先记录光标落在谱面中的比例位置，
       缩放后调整水平（#paper 内滚动）与垂直（页面滚动）滚动量，
       使光标下方的内容点保持不动 */
    const svg = document.getElementById('score');
    const r = svg.getBoundingClientRect();
    const fx = (e.clientX - r.left) / Math.max(1, r.width);
    const fy = (e.clientY - r.top) / Math.max(1, r.height);
    setZoom(viewZoom * (e.deltaY<0 ? 1.1 : 0.9));
    const r2 = svg.getBoundingClientRect();
    document.getElementById('paper').scrollLeft += (r2.left + fx*r2.width) - e.clientX;
    const se = document.scrollingElement || document.documentElement;
    se.scrollTop += (r2.top + fy*r2.height) - e.clientY;
  }, {passive:false});
})();

/* 编辑栏技法：优先作用于 Ctrl 多选的音符（方式二）；否则作用于当前音符（方式一）。
   方式一下 S/H/P 自动用连音线连接到下一个音符，符号显示在连音线上方 */
function techFromBar(t){
  /* 推弦走统一流程（无论单选还是 Ctrl 多选）：圆圈目标音+连线+提示编辑 */
  if(t==='b'||t==='bd'){ bendFromBar(t); return; }
  if(noteSel.some(q=>q.row!=='vox')){ applyTech(t); return; }
  if(sel.row!=='tab') return toast('请先在吉他谱选中要标记的音符');
  const col=curCol();
  if(!col || !col.notes.length) return toast('当前列没有音符，先输入品位数字');
  let linked=false;
  mutate(()=>{
    const n = col.notes.find(x=>x.s===sel.si) || col.notes[0];
    if(!t || n.tech===t){ delete n.tech; delete n.tk; delete n.bt; return; }
    n.tech=t; delete n.tk; delete n.bt;
    if(t==='sl'||t==='h'||t==='p'){
      /* 自动连到下一个有音符的列（优先同弦音符） */
      const cols=curRowCols();
      for(let ci2=sel.ci+1; ci2<cols.length; ci2++){
        const c2=cols[ci2];
        if(c2.notes && c2.notes.length){
          const m2 = c2.notes.find(x=>x.s===n.s) || c2.notes[0];
          n.tk = {mi:sel.mi, ci:ci2, si:m2.s};
          linked=true;
          break;
        }
      }
    }
  });
  toast(t? (linked?'已标记并自动连线到下一个音符':'已标记技法') : '已清除技法');
}
/* ===== 便捷音符编辑：任意位置添加/拆分/合并/删除，小节自动保持与拍号一致 ===== */
function insertNote(before){
  const cols=curRowCols(); if(!cols) return toast('请先选中吉他谱或简谱中的位置');
  const cur=curCol() || cols[cols.length-1];
  const c = sel.row==='tab'? tcol() : vcol();
  if(cur){ c.dur=cur.dur; if(cur.tup) c.tup=cur.tup; }
  const at = Math.min(cols.length, sel.ci + (before?0:1));
  mutate(()=>{
    cols.splice(at, 0, c);
    sel.ci = at;
  });
  toast('已插入音符 · '+(sel.row==='tab'?'点弦格输入品位数字':'输入唱名 1–7')+'（与拍号不符时会提示，可按需一键修复）');
}
function splitNote(){
  const cols=curRowCols(); const cur=curCol();
  if(!cols || !cur) return toast('请先选中要拆分的音符');
  if(cur.dur*2>32) return toast('32分音符不能再拆分');
  mutate(()=>{
    const half=JSON.parse(JSON.stringify(cur));
    cur.dur*=2; half.dur=cur.dur;      // 附点/连音随克隆保留，总时值不变
    cols.splice(sel.ci+1, 0, half);
  });
  toast('已一分为二（总时值不变），可分别编辑两个音符');
}
function mergeNote(){
  const cols=curRowCols(); const cur=curCol();
  if(!cols || !cur) return toast('请先选中要合并的音符');
  const nxt=cols[sel.ci+1];
  if(!nxt || nxt.dur!==cur.dur || !!nxt.dotted!==!!cur.dotted || (nxt.tup||0)!==(cur.tup||0))
    return toast('合并需要下一个音符与当前时值完全相同');
  if(cur.dur<=1) return toast('已是全音符，无法再合并');
  mutate(()=>{ cur.dur=cur.dur/2; cols.splice(sel.ci+1, 1); });
  toast('已合并为时值加倍的音符');
}
function deleteNote(){
  const cols=curRowCols();
  if(!cols || cols.length<=1) return toast('小节至少保留一个音符');
  mutate(()=>{ cols.splice(sel.ci, 1); });

/* 推弦（上/下）：按住 Ctrl 依次选中两个音符（起始音+目标音），
   目标音符加圆圈、连音线相连、b↑/b↓ 显示在连线中间上方 */
function bendFromBar(t){
  const picked = noteSel.filter(q=>q.row!=='vox');   // 推弦只作用于吉他谱音符
  if(picked.length<2){
    toast('推弦：按住 Ctrl 依次选中两个音符（起始音+目标音），再点上/下推弦');
    return;
  }
  const list = picked.slice().sort((a,b)=> a.mi-b.mi || a.ci-b.ci || a.si-b.si);
  const q0=list[0], q1=list[1];
  const c0 = song.measures[q0.mi] && song.measures[q0.mi].tabs[q0.vi] && song.measures[q0.mi].tabs[q0.vi][q0.ci];
  const n0 = c0 && c0.notes.find(x=>x.s===q0.si);
  if(!n0) return toast('起始音符无效，请重新 Ctrl 选择');
  if(n0.tech===t && n0.tk && n0.tk.mi===q1.mi && n0.tk.ci===q1.ci){
    mutate(()=>{ delete n0.tech; delete n0.tk; delete n0.bt; });
    noteSel=[]; render();
    toast('已取消推弦'); return;
  }
  mutate(()=>{ n0.tech=t; delete n0.bt; n0.tk={mi:q1.mi, ci:q1.ci, si:q1.si}; });
  noteSel=[]; closeTech(); render();
  toast('已加'+(t==='b'?'上':'下')+'推弦（目标音符已加圆圈）');
}
/* 编辑栏简谱标识符号：前/后倚音、上/下波音、颤音、回音 */
function ornFromBar(k){
  if(sel.row!=='vox') return toast('请先在简谱选中一个音');
  const col=curCol(); if(!col) return;
  if(k==='grace' || k==='gracea'){
    if(!col.deg) return toast('倚音需加在有唱名的音上');
    const cur = k==='grace'? col.grace : col.graceA;
    {
      const prevG = cur? normGrace(cur) : null;
      askText((k==='grace'?'前':'后')+'倚音唱名（1–7，最多连输3个如 32；留空清除）',
        prevG? prevG.notes.map(n=>n.deg).join('') : '', v=>{
        const tv=(v||'').trim();
        mutate(()=>{
          if(tv===''){ if(k==='grace') delete col.grace; else delete col.graceA; }
          else if(/^[1-7]{1,3}$/.test(tv)){
            const g={notes:[...tv].map((ch,i2)=>({deg:+ch, oct:prevG&&prevG.notes[i2]?prevG.notes[i2].oct:0})),
                     dur:prevG?prevG.dur:8};   // 默认8分
            if(k==='grace') col.grace=g; else col.graceA=g;
          }
        });
        if(tv!=='') toast('已添加倚音（默认8分）· 点击谱面上的倚音可编辑音高/时值/八度');
      });
    }
    return;
  }
  if(k==='clr'){ mutate(()=>{ delete col.orn; delete col.grace; delete col.graceA; }); toast('已清除标识符号'); return; }
  if(!col.deg) return toast('记号需加在有唱名的音上');
  mutate(()=>{ if(col.orn===k) delete col.orn; else col.orn=k; });
}
/* n连音（3/5/6/7）：选中n个等时值音→整体切换；否则把当前音拆分为n连音（总时值不变）
   三连音=3音占2音时值（dur×2）；5/6/7连音=n音占4音时值（dur×4） */
function applyTuplet(n){
  const row=sel.row;
  const tupOf = c=> c.tup===1?3:c.tup;
  if(selRange){
    const cs=rangeCols();
    if(cs && cs.length===n && cs.every(x=>x.mi===cs[0].mi) &&
       cs.every(x=>x.col.dur===cs[0].col.dur && !x.col.dotted)){
      mutate(()=>{
        const on = !cs.every(x=>tupOf(x.col)===n);
        cs.forEach(x=>{ if(on) x.col.tup=n; else delete x.col.tup; });
      });
      toast('已切换'+n+'连音'); return;
    }
  }
  const col=curCol(); if(!col) return;
  if(col.tup){
    mutate(()=>{ delete col.tup; });
    toast('已取消连音'); return;
  }
  const mul = n===3? 2 : 4;
  if(col.dur*mul>32) return toast('当前时值过小，无法再细分为'+n+'连音');
  mutate(()=>{
    const cols=curRowCols();
    const nd=col.dur*mul;
    const c1=JSON.parse(JSON.stringify(col)); c1.dur=nd; c1.dotted=false; c1.tup=n;
    const mk=()=>{
      const c= row==='tab'? tcol() : vcol();
      c.dur=nd; c.tup=n;
      if(row==='tab') c.notes=JSON.parse(JSON.stringify(col.notes));
      else c.deg=col.deg;
      return c;
    };
    const arr=[c1]; for(let i=1;i<n;i++) arr.push(mk());
    cols.splice(sel.ci, 1, ...arr);
  });
  toast('已拆分为'+n+'连音（总时值不变）');
}

/* ================= 声部/歌词行管理 ================= */
function addVoice(kind){
  if(kind==='tab' && song.tabVoices.length>=MAX_VOICES) return toast('吉他声部最多 5 个');
  if(kind==='vox' && song.voxVoices.length>=MAX_VOICES) return toast('旋律声部最多 5 个');
  mutate(()=>{
    if(kind==='tab'){
      song.tabVoices.push('吉他'+(song.tabVoices.length+1));
      song.measures.forEach(m=>{ const a=[]; for(let i=0;i<song.beats*2;i++) a.push(tcol()); m.tabs.push(a); });
    }else{
      song.voxVoices.push('旋律'+(song.voxVoices.length+1));
      song.measures.forEach(m=>{ const a=[]; for(let i=0;i<song.beats;i++) a.push(vcol()); m.voxes.push(a); });
    }
  });
}
function delVoice(kind){
  if(kind==='tab'){
    if(song.tabVoices.length<=1) return toast('至少保留一个吉他声部');
    mutate(()=>{
      const vi = sel.row==='tab'?sel.vi:song.tabVoices.length-1;
      song.tabVoices.splice(vi,1);
      song.measures.forEach(m=>m.tabs.splice(vi,1));
      if(sel.row==='tab') sel.vi=0;
    });
  }else{
    if(song.voxVoices.length<=1) return toast('至少保留一个旋律声部');
    mutate(()=>{
      const vi = sel.row==='vox'?sel.vi:song.voxVoices.length-1;
      song.voxVoices.splice(vi,1);
      song.measures.forEach(m=>m.voxes.splice(vi,1));
      if(sel.row==='vox') sel.vi=0;
    });
  }
}
function delVoiceAt(kind, vi){
  const names = kind==='tab'?song.tabVoices:song.voxVoices;
  if(names.length<=1) return toast('至少保留一个'+(kind==='tab'?'吉他':'旋律')+'声部');
  mutate(()=>{
    names.splice(vi,1);
    song.measures.forEach(m=> (kind==='tab'?m.tabs:m.voxes).splice(vi,1));
    if(sel.row===kind && sel.vi>=names.length) sel.vi=names.length-1;
  });

}
/* 声部/歌词段 chips 交互：面板位于左侧工具栏（历史上曾在页头，
   两处都绑定以兼容），修复"＋添加声部"点击无效 */
let lastChipClick = {k:null, idx:-1, t:0};
const chipHandler = e=>{
  /* 声部删除×（hover 出现） */
  const del = e.target.closest('.vdel');
  if(del){ e.stopPropagation(); delVoiceAt(del.dataset.k==='tvdel'?'tab':'vox', +del.dataset.idx); return; }
  const chip = e.target.closest('.chip'); if(!chip) return;
  const k = chip.dataset.k;
  /* 双击改名：单击会重渲染 chips 导致原生 dblclick 失效，
     改为按"同一声部 400ms 内连击两次"判定 */
  if(k==='tv' || k==='vv'){
    const idx = +chip.dataset.idx, now = Date.now();
    if(lastChipClick.k===k && lastChipClick.idx===idx && now-lastChipClick.t<400){
      lastChipClick = {k:null, idx:-1, t:0};
      const list = k==='tv'? song.tabVoices : song.voxVoices;
      askText('声部名称', list[idx], nm=>{
        if(nm!=null && nm.trim()){ mutate(()=>{ list[idx]=nm.trim(); }); }
      });
      return;
    }
    lastChipClick = {k, idx, t:now};
  }
  if(k==='tv'){ sel.row='tab'; sel.vi=+chip.dataset.idx; selRange=null; clampSel(); render(); }
  else if(k==='vv'){ sel.row='vox'; sel.vi=+chip.dataset.idx; selRange=null; clampSel(); render(); }
  else if(k==='ll'){ activeLyr=+chip.dataset.idx; syncInputs(); }
  else if(k==='tv+') addVoice('tab');
  else if(k==='vv+') addVoice('vox');
  else if(k==='ll+'){
    if(song.lyricLines>=MAX_LYR) return toast('歌词最多 5 段');
    mutate(()=>{ song.lyricLines++; activeLyr=song.lyricLines-1; });
  }
  else if(k==='ll-'){
    if(song.lyricLines<=1) return toast('至少保留一段歌词');
    mutate(()=>{
      const li = song.lyricLines-1;
      song.measures.forEach(m=>m.voxes.forEach(cols=>cols.forEach(c=>{
        if(c.lyrics) c.lyrics.length = Math.min(c.lyrics.length, li);
      })));
      song.lyricLines--; activeLyr=Math.min(activeLyr, song.lyricLines-1);
    });
  }
};

/* ================= 键盘 ================= */
window.addEventListener('keydown', e=>{
  const tag = (document.activeElement||{}).tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'){
    if(e.key==='Escape') document.activeElement.blur();
    return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); exportSong(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='c'){ e.preventDefault(); copyMeasure(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='v'){ e.preventDefault(); pasteMeasure(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(blurSel){ blurSel=false; }   // 任意编辑按键恢复光标
  if(/^[0-9]$/.test(e.key)){
    e.preventDefault();
    if(sel.row==='tab'){
      const now=Date.now(); let d=e.key;
      if(now-pending.time<700 && pending.digits){
        const comb=parseInt(pending.digits+d,10);
        if(comb<=24) d=String(comb);
      }
      pending={digits:d,time:now};
      setFret(parseInt(d,10));
    }else{
      const n=+e.key; if(n<=7) setDeg(n);
    }
    return;
  }
  switch(e.key){
    case 'ArrowRight': e.preventDefault(); moveCol(1); break;
    case 'ArrowLeft':  e.preventDefault(); moveCol(-1); break;
    case 'ArrowDown':
      e.preventDefault();
      if(sel.row==='tab'){ if(sel.si<6) sel.si++; else switchRow(); render(); }
      break;
    case 'ArrowUp':
      e.preventDefault();
      if(sel.row==='tab'){ if(sel.si>1){ sel.si--; render(); } }
      else { switchRow(); sel.si=6; render(); }
      break;
    case 'Tab': e.preventDefault(); switchRow(); break;
    case 'Backspace':
      e.preventDefault(); pending.digits='';
      if(sel.row==='tab') setFret(null); else setDeg(0);
      break;
    case 'Delete': e.preventDefault(); delColumn(); break;
    case 'Enter':
      e.preventDefault();
      if(sel.row==='vox'){ openFlyout('lyr'); document.getElementById('i-lyric').focus(); }
      break;
    case ' ': e.preventDefault(); audio.playing?stopPlay():play(); break;
    case '.': e.preventDefault(); toggleDot(); break;
    case '#': if(sel.row==='vox') toggleAcc('#'); break;
    case 'b': if(sel.row==='vox') toggleAcc('b'); break;
    case '+': case '=': if(sel.row==='vox') bumpOct(1); break;
    case '-': if(sel.row==='vox') bumpOct(-1); break;
    case '~': if(sel.row==='vox') toggleTie(); break;
    case 'x': if(sel.row==='tab') toggleMute(); break;
    case 'q': setDur(1); break;
    case 'w': setDur(2); break;
    case 'e': setDur(4); break;
    case 'r': setDur(8); break;
    case 't': setDur(16); break;
    case 'Insert': insertNote(e.shiftKey); break;
  }
});

/* ---- 整小节复制 / 粘贴（按住小节线选中时：仅复制该声部，可独立粘贴） ---- */
function copyMeasure(){
  if(selRange && selRange.whole && selRange.m1===selRange.m2){
    const cols = selRange.row==='tab'
      ? song.measures[selRange.m1].tabs[selRange.vi]
      : song.measures[selRange.m1].voxes[selRange.vi];
    if(cols){
      clipRow = {row:selRange.row, cols:JSON.parse(JSON.stringify(cols))};
      clipMeasure = null;
      toast('已复制第'+(selRange.m1+1)+'小节'+(selRange.row==='tab'?'吉他谱':'简谱')+'声部 · Ctrl+V 粘贴到光标小节');
      return;
    }
  }
  const mi = measureSel!=null? measureSel : sel.mi;
  clipMeasure = JSON.parse(JSON.stringify(song.measures[mi]));
  clipRow = null;
  toast('已复制第'+(mi+1)+'小节');
}
function pasteMeasure(){
  if(clipRow){
    const mi = measureSel!=null? measureSel : sel.mi;
    mutate(()=>{
      const arr = clipRow.row==='tab'? song.measures[mi].tabs : song.measures[mi].voxes;
      const vi = Math.max(0, Math.min(sel.row===clipRow.row? sel.vi : 0, arr.length-1));
      arr[vi] = JSON.parse(JSON.stringify(clipRow.cols));
    });
    toast('已粘贴'+(clipRow.row==='tab'?'吉他谱':'简谱')+'声部到第'+(mi+1)+'小节');
    return;
  }
  if(!clipMeasure) return toast('剪贴板为空，先选中小节号 Ctrl+C 复制');
  const mi = measureSel!=null? measureSel : sel.mi;
  mutate(()=>{
    const src = JSON.parse(JSON.stringify(clipMeasure));
    const m = {tabs:[], voxes:[], repeatStart:src.repeatStart, repeatEnd:src.repeatEnd};
    /* 对齐当前声部数量：不足补空、超出截断 */
    song.tabVoices.forEach((_,vi)=>{
      m.tabs.push(src.tabs[vi] ? src.tabs[vi] : (()=>{const a=[];for(let i=0;i<song.beats*2;i++)a.push(tcol());return a;})());
    });
    song.voxVoices.forEach((_,vi)=>{
      m.voxes.push(src.voxes[vi] ? src.voxes[vi] : (()=>{const a=[];for(let i=0;i<song.beats;i++)a.push(vcol());return a;})());
    });
    song.measures[mi] = m;
  });
  toast('已粘贴到第'+(mi+1)+'小节');
}

     点击=选中小节线，弹出反复/终止符号设置 */
  if(t.dataset.bar!==undefined){
    const seg = t.dataset.bar.split(':');
    const L=+seg[0], R=+seg[1], row=seg[2], vi=+seg[3];
    const sx=e.clientX, sy=e.clientY;
    let held=false;
    const tm=setTimeout(()=>{
      held=true; off();
      const mi = (R>=0 && song.measures[R]) ? R : L;
      if(mi<0 || !song.measures[mi]) return;
      const cols = row==='tab'? song.measures[mi].tabs[vi] : song.measures[mi].voxes[vi];
      if(!cols || !cols.length) return;
      sel.row=row; sel.vi=vi; sel.mi=mi; sel.ci=0;
      selRange={row, vi, m1:mi, c1:0, m2:mi, c2:cols.length-1, whole:true};

      toast('已选中第'+(mi+1)+'小节'+(row==='tab'?'吉他谱':'简谱')+'声部 · Ctrl+C 复制 / Ctrl+V 粘贴');
    }, 450);
    const off=()=>{ document.removeEventListener('pointerup',up); document.removeEventListener('pointermove',mv); };
    const up=()=>{ clearTimeout(tm); off(); if(!held) showBarMenu(sx, sy, L, R); };
    const mv=ev=>{ if(Math.hypot(ev.clientX-sx, ev.clientY-sy)>7){ clearTimeout(tm); off(); } };
    document.addEventListener('pointerup', up);
    document.addEventListener('pointermove', mv);
    return;
  }
  /* 点击功能谱级数标注 → 弹出智能和弦选择 */
  if(t.dataset.vchord!==undefined){
    const seg=t.dataset.vchord.split(':').map(Number);
    sel.mi=seg[0]; sel.ci=seg[1]; sel.row='vox'; sel.vi=seg[2];
    selRange=null; render();

  /* 点击倚音 → 弹出编辑（音高/时值/八度） */
  if(t.dataset.grace!==undefined){
    const seg=t.dataset.grace.split(':');
    showGraceMenu(+seg[0], +seg[1], +seg[2], seg[3], e.clientX, e.clientY);
    return;
  }

    return;

/* 完整和弦编辑器：根音·和弦性质·转位·把位·自定义 */
let ceState = null;
function showChordEditor(mi, ci, vi){
  modalPos=null;
  const existing = song.measures[mi].tabs[vi][ci].chord || chordBefore(mi,vi) || 'C';
  const m = existing.match(/^([A-G][#b]?)(.*?)(?:\/([A-G][#b]?))?$/);
  ceState = { mi, ci, vi,
    root: (m&&NOTE_PC[m[1]]!=null)? m[1]:'C',
    qual: (m&&m[2])||'', bass: (m&&m[3])||'', shape:null, custom:null };
  renderChordEditor();
}
function ceName(){
  return ceState.root + ceState.qual + (ceState.bass?('/'+ceState.bass):'');
}
function ceShape(){
  if(ceState.custom) return ceState.custom;
  let base = chordShape(ceState.root+ceState.qual);
  if(!base){
    // 库中没有 → 生成可移动把位（默认 E 型）
    base = movableShape(NOTE_PC[ceState.root], ceState.qual, 'E');
  }
  if(ceState.bass && NOTE_PC[ceState.bass]!=null)
    base = slashShape(base, NOTE_PC[ceState.bass]);
  return base;
}
function positionVariants(){
  const r = NOTE_PC[ceState.root], q = ceState.qual;
  const vs=[];
  const open = chordShape(ceState.root+q);
  if(open) vs.push({label:'开放', shape:open});
  vs.push({label:'6弦根音(E型)', shape:movableShape(r,q,'E')});
  vs.push({label:'5弦根音(A型)', shape:movableShape(r,q,'A')});
  return vs;
}
function renderChordEditor(){
  const rootBtns = CHORD_ROOTS.map(r=>
    `<button class="chip ${r===ceState.root?'on':''}" data-cr="${r}">${r}</button>`).join('');
  const qualBtns = CHORD_QUALS.map(q=>
    `<button class="chip ${q.suf===ceState.qual?'on':''}" data-cq="${q.suf}" title="${q.label}">${q.suf||'大'}</button>`).join('');
  const bassOpts = ['<option value="">（原位）</option>']
    .concat(CHORD_ROOTS.map(b=>`<option value="${b}" ${b===ceState.bass?'selected':''}>/${b}</option>`)).join('');
  const shape = ceShape();
  const posVars = positionVariants().map((v,i)=>
    `<div class="pat-card" data-cpos="${i}" data-shape="${v.shape}">
      <svg width="56" height="66" viewBox="0 0 56 66">${chordDiagramSVG('',6,2,1.05,v.shape,true)}</svg>
      <div class="bt">${esc(v.label)}</div></div>`).join('');
  const custom = (ceState.custom||shape||'xxxxxx');
  const fretInputs = [6,5,4,3,2,1].map(s=>{
    const ch = custom[6-s]; const val = ch==='x'?'x':ch;
    return `<label style="display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted)">${s}弦
      <input class="ce-fret" data-s="${s}" value="${val}" style="width:34px;text-align:center"></label>`;
  }).join('');
  showModal(`<h3>编辑和弦</h3>
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <div style="flex:1;min-width:280px">
        <h4>根音</h4><div class="row" style="display:flex;flex-wrap:wrap;gap:4px">${rootBtns}</div>
        <h4>和弦性质</h4><div class="row" style="display:flex;flex-wrap:wrap;gap:4px">${qualBtns}</div>
        <h4>转位 / 低音（Slash）</h4><select id="ce-bass">${bassOpts}</select>
        <h4>把位</h4><div class="pat-grid" id="ce-pos">${posVars}</div>

        <div class="row" style="margin-top:6px"><button id="ce-savecustom">保存为自定义和弦</button></div>
      </div>
      <div style="width:150px;text-align:center">
        <h4>预览</h4>
        <svg width="120" height="150" viewBox="0 0 120 150">${chordDiagramSVG(ceName(),20,10,1.7,shape)}</svg>
        <div style="font-size:13px;margin-top:4px"><b>${esc(ceName())}</b></div>
      </div>
    </div>
    <div class="btns"><button id="ce-cancel">取消</button><button id="ce-ok" class="primary">应用到小节</button></div>`, true);
  const rerender = ()=>{ closeModal(); renderChordEditor(); };
  document.querySelector('.modal').addEventListener('click', ev=>{
    const cr=ev.target.closest('[data-cr]'); if(cr){ ceState.root=cr.dataset.cr; ceState.custom=null; rerender(); return; }
    const cq=ev.target.closest('[data-cq]'); if(cq){ ceState.qual=cq.dataset.cq; ceState.custom=null; rerender(); return; }

  });
  document.getElementById('ce-bass').addEventListener('change', e=>{ ceState.bass=e.target.value; ceState.custom=null; rerender(); });

    const arr=[]; for(const s of [6,5,4,3,2,1]){

  }));
  document.getElementById('ce-savecustom').onclick = ()=>{

    const nm = ceName(), sh = ceShape();
    const {mi,ci,vi}=ceState;

      if(!CHORD_SHAPES[nm]) song.customChords[nm]=sh;   // 非标准/转位/自定义 → 存入
      const cols = song.measures[mi].tabs[vi];
      cols[ci].chord = nm;
      if(nm!==oldEff){
        let end=cols.length;
        for(let i=ci+1;i<cols.length;i++) if(cols[i].chord){ end=i; break; }
        remapCols(cols, ci, end, chordShape(oldEff), sh);
      }
    });
    closeModal();
    toast('已应用和弦：'+nm);
  };
}

function applyTech(tech){
  const picked = noteSel.filter(q=>q.row!=='vox');   // 技法只作用于吉他谱音符
  if(!picked.length) return;
  const list = picked.slice().sort((a,b)=> a.mi-b.mi || a.ci-b.ci || a.si-b.si);
  mutate(()=>{
    const noteAt = q=>{
      const cols = song.measures[q.mi].tabs[q.vi];
      return cols && cols[q.ci] && cols[q.ci].notes.find(n=>n.s===q.si);
    };
    if(!tech){
      list.forEach(q=>{ const n=noteAt(q); if(n){ delete n.tech; delete n.tk; delete n.bt; } });
      return;
    }
    /* 技法连线：连接相邻两个被选中的音符（头对头） */
    for(let i=0;i<list.length-1;i++){
      const n = noteAt(list[i]);
      if(!n) continue;
      n.tech = tech;
      n.tk = {mi:list[i+1].mi, ci:list[i+1].ci, si:list[i+1].si};
    }
    if(list.length===1){ const n=noteAt(list[0]); if(n){ n.tech=tech; delete n.tk; } }
  });
  toast(tech?('已标记技法：'+({sl:'滑弦',h:'击弦',p:'勾弦',b:'上推弦',bd:'下推弦',v:'揉弦',hm:'泛音',tp:'点弦',pm:'闷音',su:'上滑音',sd:'下滑音'}[tech]||tech)):'已清除技法');
}

  if(mi===dragSel.mi && ci===dragSel.ci){
    if(selRange){ selRange=null; render(); }
    return;
  }
  const old = JSON.stringify(selRange);
  setRange(dragSel.row, dragSel.vi, {mi:dragSel.mi, ci:dragSel.ci}, {mi, ci});
  if(JSON.stringify(selRange)!==old) render();

function toggleTie(){
  /* Ctrl 选中两个音符：跨过中间音符直接相连（中间音符自动包含在连线内），简谱/吉他谱通用 */
  if(noteSel.length>=2){
    const list = noteSel.slice().sort((a,b)=> a.mi-b.mi || a.ci-b.ci || (a.si||0)-(b.si||0));
    const q0=list[0], q1=list[list.length-1];
    if(q0.row==='vox'){
      const vcols = mi=>song.measures[mi] && song.measures[mi].voxes[q0.vi] || [];
      const allOn = (()=>{                       // 已全部相连 → 再点一次取消
        let mi=q0.mi, ci=q0.ci;
        while(mi<q1.mi || (mi===q1.mi && ci<q1.ci)){
          const c=vcols(mi)[ci];
          if(!c || !c.tie) return false;
          if(++ci>=vcols(mi).length){ mi++; ci=0; }
        }
        return true;
      })();
      mutate(()=>{
        let mi=q0.mi, ci=q0.ci;
        while(mi<q1.mi || (mi===q1.mi && ci<q1.ci)){
          const c=vcols(mi)[ci];
          if(c) c.tie=!allOn;
          if(++ci>=vcols(mi).length){ mi++; ci=0; }
        }
      });
      noteSel=[]; render();
      toast(allOn?'已取消连音线':'已跨音符添加连音线（中间音符自动相连）');
    }else{
      const c0 = song.measures[q0.mi] && song.measures[q0.mi].tabs[q0.vi] && song.measures[q0.mi].tabs[q0.vi][q0.ci];
      const n0 = c0 && c0.notes.find(x=>x.s===q0.si);
      if(!n0) return toast('起始音符无效，请重新 Ctrl 选择');
      if(!n0.tech && n0.tk && n0.tk.mi===q1.mi && n0.tk.ci===q1.ci){
        mutate(()=>{ delete n0.tk; });
        noteSel=[]; render(); toast('已取消连音线'); return;
      }
      mutate(()=>{ delete n0.tech; delete n0.bt; n0.tk={mi:q1.mi, ci:q1.ci, si:q1.si}; });
      noteSel=[]; render();
      toast('已跨音符添加连音线');
    }
    return;
  }
  if(selRange && selRange.row==='vox'){
    mutate(()=>{
      const cs = rangeCols();
      const allTied = cs.slice(0,-1).every(x=>x.col.tie);
      cs.forEach((x,i)=>{ if(i<cs.length-1) x.col.tie=!allTied; });
    });
    toast('已为多选音符添加/取消连音线');
    return;
  }
  /* 单选：自动连到相邻的下一个音符 */
  if(sel.row==='vox'){
    mutate(()=>{ const c=curCol(); c.tie=!c.tie; });
    return;
  }
  if(sel.row==='tab'){
    const col=curCol();
    if(!col || !col.notes.length) return toast('当前列没有音符，先输入品位数字');
    const n = col.notes.find(x=>x.s===sel.si) || col.notes[0];
    if(!n.tech && n.tk){ mutate(()=>{ delete n.tk; }); toast('已取消连音线'); return; }
    const cols=curRowCols();
    let done=false;
    mutate(()=>{
      for(let ci2=sel.ci+1; ci2<cols.length; ci2++){
        const c2=cols[ci2];
        if(c2.notes && c2.notes.length){
          const m2 = c2.notes.find(x=>x.s===n.s) || c2.notes[0];
          delete n.tech; delete n.bt;
          n.tk={mi:sel.mi, ci:ci2, si:m2.s};
          done=true; break;
        }
      }
    });
    toast(done?'已连音线连接到下一个音符':'本小节后面没有音符可连接');
  }
}
function bumpStrumN(d){
  if(sel.row!=='tab') return;
  const c=curCol();
  if(!c || !c.strum) return toast('请先选中一个扫弦/琶音列');
  mutate(()=>{
    const col=curCol();
    const sp=strumSpan(col);
    delete col.strumTop; delete col.strumBot;   // 显式弦范围让位于快捷伸缩
    col.strumN = Math.max(2, Math.min(sp.bot, sp.n+d));
  });
}
/* 和弦变换：按新和弦指法重排该和弦区间内的分解/扫弦音 */
function remapCols(cols, from, to, oldShape, newShape){
  const newBass = bassOf(newShape);
  const oldBass = oldShape? bassOf(oldShape) : null;
  for(let i=from;i<to;i++){
    const c=cols[i];
    if(!c.notes.length) continue;
    if(c.strum || c.notes.length>=3){
      const wasMute = c.notes.every(n=>n.x);
      const keep = c.strum;
      c.notes = shapeSounded(newShape).map(n=>({s:n.s, f:n.f, x:wasMute}));
      c.strum = keep;
    }else{
      c.notes = c.notes.map(n=>{
        if(n.x) return n;
        if(oldBass && n.s===oldBass.s && n.f===oldBass.f) return {s:newBass.s, f:newBass.f};
        if(!oldShape && n.s>=5) return {s:newBass.s, f:newBass.f};
        const f = shapeString(newShape, n.s);
        if(f!=null) return {s:n.s, f};
        return {s:newBass.s, f:newBass.f};
      });
    }
  }
}

/* 从拍数拼出 [dur,dotted]，凑不出返回 null */
function durForBeats(b){
  const u = song.unit/4;
  for(const [d,dot] of [[1,0],[1,1],[2,0],[2,1],[4,0],[4,1],[8,0],[8,1],[16,0],[16,1]]){
    if(Math.abs((4/d)*(dot?1.5:1)*u - b) < 1e-3) return {dur:d, dotted:!!dot};
  }
  return null;
}
function insColumn(row){
  if(sel.row!==row){ sel.row=row; clampSel(); }
  mutate(()=>{
    const r=curRowCols();
    const cur = r[sel.ci];
    const c = row==='tab'?tcol():vcol();
    /* 拆分当前音的时值，保持小节总时值不变（8分→两16分等）；已是16分则直接插入 */
    if(cur && cur.dur<16){
      const half = durForBeats(beatsOf(cur)/2);
      if(half){ cur.dur=half.dur; cur.dotted=half.dotted; c.dur=half.dur; c.dotted=half.dotted; }
      else c.dur=cur.dur;
    } else if(cur) c.dur=cur.dur;
    r.splice(sel.ci+1,0,c); sel.ci++;
  });
}
function delColumn(){
  mutate(()=>{
    const r=curRowCols();
    if(r.length>1){
      const removed = beatsOf(r[sel.ci]);
      r.splice(sel.ci,1);
      if(sel.ci>=r.length) sel.ci=r.length-1;
      /* 把删掉的时值并回相邻音，保持小节总时值不变 */
      const nb = r[sel.ci] || r[sel.ci-1];
      if(nb){
        const merged = durForBeats(beatsOf(nb)+removed);
        if(merged){ nb.dur=merged.dur; nb.dotted=merged.dotted; }
      }
    } else {
      r[0] = sel.row==='tab'?tcol():vcol();
      r[0].dur=song.beats>=4?4:song.beats; // 单列填满一拍级别，随后 autofix
      autoFixMeasure(sel.mi, sel.row, sel.vi);
    }
  });
}

/* ---- 乐器音色库（可选音色） ---- */
const INSTRUMENTS = {
  steel:   {name:'钢弦吉他', grp:'弹拨', type:'ks',   amp:0.30, damp:0.9965, tone:4200, hp:80},
  nylon:   {name:'尼龙吉他', grp:'弹拨', type:'ks',   amp:0.33, damp:0.9945, tone:2400, hp:70},
  electric:{name:'电吉他',   grp:'弹拨', type:'ks',   amp:0.25, damp:0.9976, tone:3400, hp:90, drive:2.4},
  bass:    {name:'贝斯',     grp:'弹拨', type:'ks',   amp:0.36, damp:0.9962, tone:1000, hp:40, oct:-12},
  piano:   {name:'钢琴',     grp:'键盘', type:'fm',   amp:0.34, mod:1,   idx:2.4, decay:2.6, atk:0.004},
  epiano:  {name:'电钢琴',   grp:'键盘', type:'fm',   amp:0.32, mod:1,   idx:1.4, decay:1.9, atk:0.003, tone:3800},
  musicbox:{name:'八音盒',   grp:'键盘', type:'fm',   amp:0.30, mod:3.0, idx:5,   decay:1.5, atk:0.001, tone:6500},
  strings: {name:'弦乐',     grp:'持续', type:'saw',  amp:0.15, detune:9, atk:0.16, rel:0.35, tone:2600, vib:5},
  flute:   {name:'长笛',     grp:'持续', type:'flute',amp:0.20, atk:0.07, rel:0.14, vib:5,  breath:0.06},
  ah:      {name:'人声“啊”', grp:'持续', type:'voice',amp:0.22, atk:0.06, rel:0.14, vib:5.5},
};
function midiFreq(m){ return 440*Math.pow(2,(m-69)/12); }
/* ---- 母线：混音 + 压缩 + 混响（提升真实感） ---- */
function makeImpulse(ctx,dur,decay){
  const sr=ctx.sampleRate, len=Math.max(1,Math.floor(sr*dur));
  const buf=ctx.createBuffer(2,len,sr);
  for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); }
  return buf;
}
function buildBus(ctx){
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-16; comp.knee.value=26; comp.ratio.value=3.2;
  comp.attack.value=0.003; comp.release.value=0.25;
  const master=ctx.createGain(); master.gain.value=0.92;
  master.connect(comp); comp.connect(ctx.destination);
  const conv=ctx.createConvolver(); conv.buffer=makeImpulse(ctx,1.8,2.4);
  const wet=ctx.createGain(); wet.gain.value=0.16;
  conv.connect(wet); wet.connect(comp);
  return {dry:master, wet:conv};
}
function shaperCurve(ctx,k){
  const n=1024, c=new Float32Array(n);
  for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; c[i]=(1+k)*x/(1+k*Math.abs(x)); }
  const ws=ctx.createWaveShaper(); ws.curve=c; ws.oversample='2x'; return ws;
}
/* ---- 弹拨（Karplus-Strong，可调阻尼/音色/激励，尼龙/钢弦/电吉他/贝斯） ---- */
function ksPluck(ctx,bus,freq,when,dur,gain,sp,mute){
  const sr=ctx.sampleRate;
  const N=Math.max(2, Math.round(sr/freq));
  const ring = mute?0.18: Math.min(dur+1.6, 4.2);
  const len=Math.max(N+2, Math.floor(sr*ring));
  const buf=ctx.createBuffer(1,len,sr); const d=buf.getChannelData(0);
  for(let i=0;i<N;i++) d[i]=(Math.random()*2-1);
  const damp = mute?0.965: sp.damp;
  for(let i=N;i<len;i++) d[i]=damp*0.5*(d[i-N]+d[i-N+1]);
  const src=ctx.createBufferSource(); src.buffer=buf;
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=sp.hp||70;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=sp.tone||3800; lp.Q.value=0.6;
  const g=ctx.createGain(); g.gain.value=gain;
  src.connect(hp); hp.connect(lp);
  let out=lp;
  if(sp.drive){ const ws=shaperCurve(ctx, sp.drive); lp.connect(ws); out=ws; }
  out.connect(g); g.connect(bus.dry); g.connect(bus.wet);
  src.start(when); src.stop(when+ring);
  audio.sources.push(src);
}
/* ---- FM 合成（钢琴/电钢/八音盒） ---- */
function fmTone(ctx,bus,freq,when,dur,gain,sp){
  const car=ctx.createOscillator(); car.type='sine'; car.frequency.value=freq;
  const mod=ctx.createOscillator(); mod.type='sine'; mod.frequency.value=freq*(sp.mod||1);
  const decay=Math.max(0.25,(sp.decay||1.8)*Math.min(1.5,1.6-freq/2200));
  const idx=freq*(sp.idx||2);
  const mg=ctx.createGain();
  mg.gain.setValueAtTime(idx,when);
  mg.gain.exponentialRampToValueAtTime(Math.max(1,idx*0.04), when+decay*0.6);
  mod.connect(mg); mg.connect(car.frequency);
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,when);
  g.gain.exponentialRampToValueAtTime(gain, when+(sp.atk||0.004));
  g.gain.exponentialRampToValueAtTime(gain*0.0008, when+decay);
  let out=car;
  if(sp.tone){ const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=sp.tone; car.connect(lp); out=lp; }
  out.connect(g); g.connect(bus.dry); g.connect(bus.wet);
  const end=when+decay+0.1;
  car.start(when); mod.start(when); car.stop(end); mod.stop(end);
  audio.sources.push(car,mod);
}
/* ---- 锯齿弦乐群（弦乐/弦垫） ---- */
function sawStrings(ctx,bus,freq,when,dur,gain,sp){
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=sp.tone||2600; lp.Q.value=0.5;
  const g=ctx.createGain();
  const a=sp.atk||0.14, r=sp.rel||0.3;
  g.gain.setValueAtTime(0,when);
  g.gain.linearRampToValueAtTime(gain,when+a);
  g.gain.setValueAtTime(gain,when+Math.max(a,dur-r));
  g.gain.linearRampToValueAtTime(0,when+dur+r);
  lp.connect(g); g.connect(bus.dry); g.connect(bus.wet);
  const lfo=ctx.createOscillator(); lfo.frequency.value=sp.vib||5;
  const la=ctx.createGain(); la.gain.value=freq*0.006; lfo.connect(la);
  const oscs=[];
  [-(sp.detune||8),0,(sp.detune||8)].forEach(dt=>{
    const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=freq; o.detune.value=dt;
    la.connect(o.frequency); o.connect(lp); oscs.push(o);
  });
  const end=when+dur+r+0.05;
  oscs.forEach(o=>{o.start(when);o.stop(end);}); lfo.start(when); lfo.stop(end);
  audio.sources.push(lfo,...oscs);
}
/* ---- 长笛（正弦+泛音+气声+颤音） ---- */
function fluteTone(ctx,bus,freq,when,dur,gain,sp){
  const g=ctx.createGain();
  const a=sp.atk||0.07, r=sp.rel||0.14;
  g.gain.setValueAtTime(0,when);
  g.gain.linearRampToValueAtTime(gain,when+a);
  g.gain.setValueAtTime(gain,when+Math.max(a,dur-r));
  g.gain.linearRampToValueAtTime(0,when+dur+r);
  g.connect(bus.dry); g.connect(bus.wet);
  const osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.value=freq; osc.connect(g);
  const h=ctx.createOscillator(); h.type='sine'; h.frequency.value=freq*2;
  const hg=ctx.createGain(); hg.gain.value=0.12; h.connect(hg); hg.connect(g);
  const lfo=ctx.createOscillator(); lfo.frequency.value=sp.vib||5;
  const la=ctx.createGain(); la.gain.value=freq*0.008; lfo.connect(la); la.connect(osc.frequency); la.connect(h.frequency);
  const sr=ctx.sampleRate, nl=Math.max(1,Math.floor(sr*Math.min(dur+r,3)));
  const nbuf=ctx.createBuffer(1,nl,sr); const nd=nbuf.getChannelData(0);
  for(let i=0;i<nl;i++) nd[i]=(Math.random()*2-1);
  const nsrc=ctx.createBufferSource(); nsrc.buffer=nbuf;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq*2; bp.Q.value=0.8;
  const ng=ctx.createGain(); ng.gain.value=(sp.breath||0.06)*gain;
  nsrc.connect(bp); bp.connect(ng); ng.connect(g);
  const end=when+dur+r+0.05;
  osc.start(when);osc.stop(end); h.start(when);h.stop(end);
  lfo.start(when);lfo.stop(end); nsrc.start(when);nsrc.stop(end);
  audio.sources.push(osc,h,lfo,nsrc);
}
/* ---- 人声“啊”（共振峰滤波，元音 /a/） ---- */
function voiceAh(ctx,bus,freq,when,dur,gain,sp){
  const src=ctx.createOscillator(); src.type='sawtooth'; src.frequency.value=freq;
  const lfo=ctx.createOscillator(); lfo.frequency.value=sp.vib||5.5;
  const la=ctx.createGain(); la.gain.value=freq*0.008; lfo.connect(la); la.connect(src.frequency);
  const g=ctx.createGain();
  const a=sp.atk||0.06, r=sp.rel||0.14;
  g.gain.setValueAtTime(0,when);
  g.gain.linearRampToValueAtTime(gain,when+a);
  g.gain.setValueAtTime(gain,when+Math.max(a,dur-r));
  g.gain.linearRampToValueAtTime(0,when+dur+r);
  [[730,0.9,9],[1090,0.6,11],[2600,0.32,13]].forEach(([f,amp,q])=>{
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=q;
    const fg=ctx.createGain(); fg.gain.value=amp;
    src.connect(bp); bp.connect(fg); fg.connect(g);
  });
  g.connect(bus.dry); g.connect(bus.wet);
  const end=when+dur+r+0.05;
  src.start(when);src.stop(end); lfo.start(when);lfo.stop(end);
  audio.sources.push(src,lfo);
}
/* ---- 闷音/打板噪声 ---- */
function chick(ctx,bus,when,gain){
  const sr=ctx.sampleRate, len=Math.floor(sr*0.06);
  const buf=ctx.createBuffer(1,len,sr); const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=ctx.createBufferSource(); src.buffer=buf;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2000; bp.Q.value=0.7;
  const g=ctx.createGain(); g.gain.value=gain;
  src.connect(bp); bp.connect(g); g.connect(bus.dry); g.connect(bus.wet);
  src.start(when); audio.sources.push(src);
}
/* ---- 音色分派 ---- */
function playInst(instKey,ctx,bus,freq,when,dur,gain,mute){
  const sp=INSTRUMENTS[instKey]||INSTRUMENTS.steel;
  const f = sp.oct? freq*Math.pow(2,sp.oct/12) : freq;
  const gg = gain*(sp.amp||0.28);
  switch(sp.type){
    case 'ks':    ksPluck(ctx,bus,f,when,dur,gg,sp,mute); break;
    case 'fm':    fmTone(ctx,bus,f,when,dur,gg,sp); break;
    case 'saw':   sawStrings(ctx,bus,f,when,dur,gg,sp); break;
    case 'flute': fluteTone(ctx,bus,f,when,dur,gg,sp); break;
    case 'voice': voiceAh(ctx,bus,f,when,dur,gg,sp); break;
    default:      ksPluck(ctx,bus,f,when,dur,gg,sp,mute);
  }
}
function activeTrackCount(){
  let n=0;
  song.tabVoices.forEach((_,vi)=>{ if(trackAudible('tab',vi)) n++; });
  song.voxVoices.forEach((_,vi)=>{ if(trackAudible('vox',vi)) n++; });
  return Math.max(1,n);
}
/* 一小节的时长（秒）：取该小节首个有内容声部的时值之和，空小节按拍号 */
function measureSeconds(mi, spb){
  const m = song.measures[mi]; if(!m) return song.beats*spb;
  const cols = (m.tabs&&m.tabs[0]&&m.tabs[0].length?m.tabs[0]:null)
    || (m.voxes&&m.voxes[0]&&m.voxes[0].length?m.voxes[0]:null);
  let b = 0; if(cols) cols.forEach(c=>b+=beatsOf(c));
  if(!b) b = song.beats;
  return b*spb;
}
/* 小节进度条：随播放平滑推进，显示当前小节 */
function startProgress(t, spb, startMi){
  const bounds=[]; let el=0;
  for(let mi=startMi; mi<song.measures.length; mi++){ bounds.push({mi, start:el}); el+=measureSeconds(mi,spb); }
  audio.prog = {t, dur:el||1, bounds};
  cancelAnimationFrame(audio.raf);
  const fill=document.getElementById('mx-fill'), lbl=document.getElementById('mx-lbl');
  const tick=()=>{
    if(!audio.playing || !audio.prog){ return; }
    const e = Math.max(0, audio.ctx.currentTime - audio.prog.t);
    const frac = Math.min(1, e/audio.prog.dur);
    if(fill) fill.style.width = (frac*100)+'%';
    let cur = audio.prog.bounds.length?audio.prog.bounds[0].mi:0;
    for(const b of audio.prog.bounds){ if(e>=b.start) cur=b.mi; else break; }
    if(lbl) lbl.textContent = `第 ${cur+1} / ${song.measures.length} 小节`;
    audio.raf = requestAnimationFrame(tick);
  };
  audio.raf = requestAnimationFrame(tick);
}
function previewInst(instKey){
  if(!audio.ctx) audio.ctx=new (window.AudioContext||window.webkitAudioContext)();
  const ctx=audio.ctx; if(ctx.state==='suspended') ctx.resume();
  const bus=buildBus(ctx);
  const t=ctx.currentTime+0.05;
  [0,4,7,12].forEach((s,i)=>playInst(instKey,ctx,bus,midiFreq(60+s), t+i*0.17, 0.55, 0.9, false));
}
function play(){
  stopPlay();
  if(!audio.ctx) audio.ctx = new (window.AudioContext||window.webkitAudioContext)();
  const ctx = audio.ctx;
  if(ctx.state==='suspended') ctx.resume();
  audio.bus = buildBus(ctx);
  const bus = audio.bus;
  audio.playing = true;
  document.getElementById('b-play').textContent='▶ 播放中…';
  const spb = 60/song.tempo;
  const t = ctx.currentTime+0.15;
  const t0 = performance.now()+150;
  const startMi = sel.mi||0;
  const norm = 0.85/Math.sqrt(activeTrackCount());
  let total=0;
  /* 吉他谱声部：逐声部一条音轨，按各自音色发声 */
  song.tabVoices.forEach((_,vi)=>{
    const cfg = trackCfg('tab',vi);
    if(!trackAudible('tab',vi)) return;
    const vol = (cfg.vol||1)*norm;
    let el=0;
    for(let mi=startMi; mi<song.measures.length; mi++){
      (song.measures[mi].tabs[vi]||[]).forEach((col,ci)=>{
        const durSec = beatsOf(col)*spb;
        let picked = col.notes;
        if(col.strum){
          const sp = strumSpan(col);
          picked = col.notes.filter(n=>n.s>=sp.top && n.s<=sp.bot);
        }
        const ns = picked.slice().sort((a,b)=>b.s-a.s);
        const stagger = col.strum ? ((col.strum==='arp'||col.strum==='arpd')?0.05:0.024) : 0.012;
        const order = col.strum==='u' ? ns.slice().reverse() : ns;
        const chordDiv = Math.sqrt(Math.max(1, order.length));
        order.forEach((n,k)=>{
          const when = t+el+k*stagger;
          if(n.x) chick(ctx, bus, when, 0.3*vol);
          else{
            const freq = midiFreq(tuningOf()[n.s-1]+n.f+song.capo-12);
            playInst(cfg.inst, ctx, bus, freq, when, col.mute?0.14:durSec, vol/chordDiv, col.mute);
            if(col.mute) chick(ctx, bus, when, 0.12*vol);
          }
        });
        if(vi===0)
          audio.timers.push(setTimeout(()=>highlight('t0',mi,ci), t0-performance.now()+el*1000));
        el += durSec;
      });
    }
    total=Math.max(total,el);
  });
  /* 简谱（旋律）声部：连音线合并同音，按各自音色发声 */
  song.voxVoices.forEach((_,vi)=>{
    const cfg = trackCfg('vox',vi);
    if(!trackAudible('vox',vi)) return;
    const vol = (cfg.vol||1)*norm;
    let el=0, hold=null;
    const flush=()=>{ if(hold){ playInst(cfg.inst, ctx, bus, hold.freq, t+hold.start, hold.dur, vol*0.9, false); hold=null; } };
    for(let mi=startMi; mi<song.measures.length; mi++){
      (song.measures[mi].voxes[vi]||[]).forEach(col=>{
        const durSec = beatsOf(col)*spb;
        const m = voxMidi(col);
        /* 前倚音：主音前的短促小音符序列（最多3音，时值越小越短促） */
        if(col.grace && m!=null){
          const g = normGrace(col.grace);
          const per = Math.min(0.12, durSec*0.35/g.notes.length) * (g.dur>=16? 0.6 : 1);
          flush();
          g.notes.forEach((gn,gi)=>{
            const gm = keyRef() + DEG_SEMI[gn.deg] + (col.oct + (gn.oct||0))*12;
            playInst(cfg.inst, ctx, bus, midiFreq(gm), t+el+gi*per, per, vol*0.7, false);
          });
        }
        /* 后倚音：主音末尾的短促小音符序列 */
        if(col.graceA && m!=null){
          const g = normGrace(col.graceA);
          const per = Math.min(0.1, durSec*0.3/g.notes.length) * (g.dur>=16? 0.6 : 1);
          g.notes.forEach((gn,gi)=>{
            const gm2 = keyRef() + DEG_SEMI[gn.deg] + (col.oct + (gn.oct||0))*12;
            playInst(cfg.inst, ctx, bus, midiFreq(gm2), t+el+durSec-per*(g.notes.length-gi), per, vol*0.65, false);
          });
        }
        if(m!=null){
          const f=midiFreq(m);
          if(hold && Math.abs(hold.freq-f)<0.01) hold.dur += durSec;
          else{ flush(); hold={freq:f,start:el,dur:durSec}; }
          if(!col.tie) flush();
        }else flush();
        el += durSec;
      });
    }
    flush();
    total=Math.max(total,el);
  });
  audio.timers.push(setTimeout(stopPlay, t0-performance.now()+total*1000+800));
  startProgress(t, spb, startMi);
}

function resetDocState(){

}
function switchDoc(i){
  if(i===curDocI || !docs[i]) return;
  docs[curDocI].sel = sel; docs[curDocI].song = song;
  curDocI = i;

  resetDocState();
  clampSel(); setRibbon(sel.row==='vox'?'vox':'tab');

function addDoc(s){

}
function closeDoc(i){
  const d=docs[i]; if(!d) return;
  const st=saveStatusText(d.song);
  showModal(`<h3>关闭窗口 · ${esc(d.song.title||'未命名曲谱')}</h3>
  <p style="font-size:13px;color:var(--ink)">${st.saved?'✅':'⚠️'} 保存情况：${st.text}。</p>
  ${st.saved?'':'<p>关闭后此窗口不再显示；未存入「我的曲谱」的内容将无法从曲谱库找回。</p>'}
  <div class="btns">
    <button id="dc-cancel">取消</button>
    ${st.saved?'':'<button id="dc-save" class="primary">存入我的曲谱并关闭</button>'}
    <button id="dc-close" ${st.saved?'class="primary"':''}>直接关闭</button>
  </div>`);
  document.getElementById('dc-cancel').onclick = closeModal;
  const doClose=()=>{
    docs.splice(i,1);
    if(!docs.length) docs.push({song:blankSong(), sel:null});
    if(i<curDocI) curDocI--;
    if(curDocI>=docs.length) curDocI=docs.length-1;
    song = docs[curDocI].song;
    sel = docs[curDocI].sel || {mi:0, row:song.tabVoices.length?'tab':'vox', vi:0, ci:0, si:1};
    resetDocState();
    clampSel(); closeModal(); persist(); render();
    toast('已关闭窗口');

function persist(){
  try{ renderDocTabs(); }catch(_){}
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(song));
    if(docs.length){
      docs[curDocI] && (docs[curDocI].song = song);
      localStorage.setItem(LS_DOCS, JSON.stringify({cur:curDocI, docs:docs.map(d=>d.song)}));
    }
    /* 实时自动保存：若当前曲谱已存入"我的曲谱"，同步更新该条 */
    if(song && song.id){
      const lib = libLoad();
      const i = lib.findIndex(e=>e.id===song.id);
      if(i>=0){ lib[i].data=JSON.parse(JSON.stringify(song)); lib[i].title=song.title; lib[i].updatedAt=nowStamp(); libSave(lib); }
    }
  }catch(_){}
}
function nowStamp(){ try{ return new Date().toLocaleString('zh-CN',{hour12:false}); }catch(_){ return ''; } }
function libLoad(){ try{ return JSON.parse(localStorage.getItem(LS_LIB))||[]; }catch(_){ return []; } }

function setPrintPage(size){
  let s = document.getElementById('print-page');
  if(!s){ s=document.createElement('style'); s.id='print-page'; document.head.appendChild(s); }
  const rule = { A4:'A4 portrait', A4L:'A4 landscape', Letter:'letter portrait',
    LetterL:'letter landscape', fit:'auto' }[size] || 'A4 portrait';
  const wide = (size==='A4L'||size==='LetterL'||size==='fit');
  document.getElementById('paper').classList.toggle('wide', wide);
  s.textContent = `@page{ size:${rule}; margin:${size==='fit'?'8mm':'12mm'}; }`;
  render();   // 重排以适配新纸张宽度
}
function exportPNG(scale){
  const svg = document.getElementById('score');
  const vb = svg.viewBox.baseVal;
  let xml = new XMLSerializer().serializeToString(svg);
  /* 解析 CSS 变量为具体色（脱离页面后 var() 不生效） */
  const cs = getComputedStyle(document.documentElement);
  const ink = (cs.getPropertyValue('--ink')||'#141414').trim();
  xml = xml.replace(/var\(--ink\)/g, ink).replace(/var\(--paper\)/g,'#ffffff')
           .replace(/var\(--accent\)/g,'#3a5ce0').replace(/var\(--font-num\)/g,'serif');
  const k = scale||2;
  const img = new Image();
  const svg64 = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
  img.onload = ()=>{
    const cv = document.createElement('canvas');
    cv.width = vb.width*k; cv.height = vb.height*k;
    const g = cv.getContext('2d');
    g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height);
    g.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b); a.download=(song.title||'曲谱')+'.png'; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      toast('已导出 PNG 图片');
    },'image/png');
  };
  img.onerror = ()=>toast('图片导出失败，请改用打印');
  img.src = svg64;
}

let modalPos=null;
function showModal(html, keepPos){
  closeModal();
  if(!keepPos) modalPos=null;
  const mask=document.createElement('div');
  mask.className='modal-mask'; mask.id='modal-mask';
  mask.innerHTML=`<div class="modal">${html}</div>`;
  mask.addEventListener('pointerdown', e=>{ if(e.target===mask) closeModal(); });
  document.body.appendChild(mask);
  const modal = mask.querySelector('.modal');
  const applyPos=(l,t)=>{
    mask.style.alignItems='flex-start'; mask.style.justifyContent='flex-start';
    modal.style.margin='0'; modal.style.marginLeft=l+'px'; modal.style.marginTop=t+'px';
  };
  if(modalPos) applyPos(modalPos.l, modalPos.t);
  const handle = modal.querySelector('h3');
  if(handle){
    handle.style.cursor='move';
    handle.title='拖动标题可移动窗口';
    let drag=null;
    handle.addEventListener('pointerdown', e=>{
      const r=modal.getBoundingClientRect();
      applyPos(r.left, r.top);
      drag={x:e.clientX, y:e.clientY, l:r.left, t:r.top};
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    handle.addEventListener('pointermove', e=>{
      if(!drag) return;
      const nl=Math.max(0,Math.min(innerWidth-80, drag.l+e.clientX-drag.x));
      const nt=Math.max(0,Math.min(innerHeight-40, drag.t+e.clientY-drag.y));
      modal.style.marginLeft=nl+'px'; modal.style.marginTop=nt+'px';
      modalPos={l:nl, t:nt};
    });
    handle.addEventListener('pointerup', ()=>{ drag=null; });
  }
}
function closeModal(){ const m=document.getElementById('modal-mask'); if(m) m.remove(); }
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity=1;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.style.opacity=0,2200);
}

    <li><span class="v">v34.42</span><div>倚音改直角连接线（自动避让减时线/低音点）；连音线单选自动连相邻音、Ctrl 跨选直达目标音（简谱/吉他谱通用）；使用帮助细化，新增特色功能与更新日志。</div></li>
    <li><span class="v">v34.40</span><div>自由编辑优先：音符增删拆合不再强制适配拍号，节拍错误改为提示+一键修复；节奏图示精简重绘。</div></li>
    <li><span class="v">v34.39</span><div>音符编辑功能组：任意位置前插/后插（Insert 键）、拆分、合并、删除。</div></li>
    <li><span class="v">v34.37</span><div>倚音支持最多 3 音、独立八度点与时值编辑；简谱八度点扩展到 ±3；新增还原号 ♮。</div></li>

    <li><span class="v">v34.30</span><div>3/5/6/7 连音：吉他谱刻度线标记、简谱断弧数字标记，同小节多组互相独立、端点对齐时值线。</div></li>

  document.getElementById('log-ok').onclick = closeModal;
};

/* 页头对齐：LOGO栏与常用工具栏左缘对齐左侧工具面板（弹出框）左缘，
   页头右侧信息对齐右侧"曲谱信息"面板右缘——随窗口/面板尺寸变化实时校准 */
function alignHeader(){
  const L=document.getElementById('left-dock'), R=document.getElementById('right-dock');
  if(!L || !R) return;
  const lr=L.getBoundingClientRect(), rr=R.getBoundingClientRect();
  const padL = Math.max(10, Math.round(lr.left));
  const padR = Math.max(10, Math.round(innerWidth - rr.right));
  const dt=document.getElementById('doc-tabs');
  if(dt) dt.style.paddingLeft = padL+'px';
  document.querySelectorAll('#top .bar').forEach(b=>{
    b.style.paddingLeft = padL+'px';
    b.style.paddingRight = padR+'px';
  });
  /* 左右侧栏吸顶位置跟随页头实际高度（编辑栏行数变化时自动校准） */
  const th = document.getElementById('top').offsetHeight;
  L.style.top = (th+10)+'px';
  R.style.top = (th+10)+'px';
}
/* ================= 启动 ================= */
(function init(){
  try{
    const dd = JSON.parse(localStorage.getItem(LS_DOCS));
    if(dd && dd.docs && dd.docs.length){
      docs = dd.docs.map(x=>({song:migrate(x), sel:null}));
      curDocI = Math.max(0, Math.min(dd.cur||0, docs.length-1));
      song = docs[curDocI].song;
    }
  }catch(_){}
  if(!docs.length){
    try{
      const saved = localStorage.getItem(LS_KEY);
      if(saved){ song = migrate(JSON.parse(saved)); }
    }catch(_){ song=null; }
    if(!song || !song.measures || !song.measures.length) song = demoSong();
    docs=[{song, sel:null}]; curDocI=0;
  }
  if(song.tabVoices && !song.tabVoices.length) sel.row='vox';
  clampSel();
  setRibbon('tab');
  document.getElementById('b-notation').title = '记谱风格切换 · 当前：'+(tabNotation==='x'?'和弦内音记×（教材式）':'全数字');
  persist();
  render();
  alignHeader();
  /* 响应式：窗口尺寸变化时重排谱面（自适配宽度）并校准页头对齐 */
  let rzTimer=null;
  window.addEventListener('resize', ()=>{ clearTimeout(rzTimer); rzTimer=setTimeout(()=>{ render(); alignHeader(); }, 120); });
  if(window.ResizeObserver){
    const ro = new ResizeObserver(()=>alignHeader());
    ro.observe(document.getElementById('left-dock'));
    ro.observe(document.getElementById('stage'));
  }
})();
</script>
