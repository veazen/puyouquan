<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuseTab 吉他谱编辑器</title>
<style>
:root{
  --bg:#eef0f3; --panel:#ffffff; --text:#1c2430; --muted:#6b7686;
  --border:#d5dae2; --accent:#1a6fd4; --accent-soft:#e3efff;
  --paper:#ffffff; --ink:#111111; --toolbar:#f7f8fa;
  --font-ui:'Noto Sans SC','Source Han Sans SC','WenQuanYi Micro Hei','DejaVu Sans',sans-serif;
  --font-num:'DejaVu Serif','Noto Serif SC','Source Han Serif SC',serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#171a20; --panel:#20242c; --text:#e6e9ee; --muted:#98a2b3;
    --border:#39404c; --accent:#5aa2f0; --accent-soft:#243a55; --toolbar:#262b34; }
}
:root[data-theme="light"]{ --bg:#eef0f3; --panel:#ffffff; --text:#1c2430; --muted:#6b7686;
  --border:#d5dae2; --accent:#1a6fd4; --accent-soft:#e3efff; --toolbar:#f7f8fa; }
:root[data-theme="dark"]{ --bg:#171a20; --panel:#20242c; --text:#e6e9ee; --muted:#98a2b3;
  --border:#39404c; --accent:#5aa2f0; --accent-soft:#243a55; --toolbar:#262b34; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font-ui);}
#topbar{position:sticky;top:0;z-index:20;background:var(--toolbar);
  border-bottom:1px solid var(--border);padding:5px 12px;}
.bar-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:3px 0;}
.grp{display:flex;align-items:center;gap:4px;padding:0 8px;border-right:1px solid var(--border);}
.grp:last-child{border-right:none}
.grp label{color:var(--muted);font-size:12px;white-space:nowrap}
button{background:var(--panel);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:4px 9px;font-size:13px;cursor:pointer;white-space:nowrap;
  font-family:var(--font-ui);}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{color:#fff;filter:brightness(1.08)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input,select,textarea{background:var(--panel);color:var(--text);
  border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:13px;
  font-family:var(--font-ui);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input.short{width:56px} input.mid{width:110px}
#mode-tip{font-size:12px;color:var(--accent);font-weight:600;min-width:120px}
#score-wrap{max-width:1100px;margin:18px auto;padding:0 10px;}
#paper{background:var(--paper);border:1px solid var(--border);border-radius:10px;
  box-shadow:0 4px 18px rgba(0,0,0,.10);padding:14px 8px;}
svg{display:block;margin:0 auto;max-width:100%;height:auto;}
svg text{user-select:none}
#hint{max-width:1100px;margin:0 auto 30px;padding:0 14px;color:var(--muted);font-size:12px;}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;
  display:flex;align-items:center;justify-content:center;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:18px 20px;max-width:600px;width:92%;max-height:82vh;overflow:auto;}
.modal h3{margin:0 0 10px;font-size:16px}
.modal .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modal textarea{width:100%;height:130px;resize:vertical}
.modal p{color:var(--muted);font-size:12px;margin:6px 0}
.modal table{border-collapse:collapse;font-size:13px;width:100%}
.modal td{padding:3px 8px;border-bottom:1px solid var(--border)}
.modal td.k{color:var(--accent);white-space:nowrap;font-family:ui-monospace,monospace}
.modal h4{margin:12px 0 4px;font-size:13px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:8px 18px;border-radius:20px;
  font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
#meta-panel{display:none;background:var(--toolbar);border-bottom:1px solid var(--border);padding:8px 14px;}
#meta-panel.show{display:block}
.hidden{display:none!important}
@media print{
  #topbar,#hint,#meta-panel,#toast{display:none!important}
  body{background:#fff}
  #score-wrap{margin:0;max-width:none;padding:0}
  #paper{border:none;box-shadow:none;border-radius:0;padding:0}
  :root{--paper:#fff;--ink:#000}
}
</style>
</head>
<body>
<div id="topbar">
  <div class="bar-row">
    <div class="grp">
      <button id="b-new">新建</button>
      <button id="b-open">打开</button>
      <button id="b-save">保存</button>
      <button id="b-print">打印/PDF</button>
      <input type="file" id="file-in" accept=".json,.mtab,.mtab.json" class="hidden">
    </div>
    <div class="grp">
      <button id="b-undo" title="Ctrl+Z">撤销</button>
      <button id="b-redo" title="Ctrl+Y">重做</button>
    </div>
    <div class="grp">
      <button id="b-play" class="primary">▶ 播放</button>
      <button id="b-stop">■</button>
      <button id="b-mix-tab" class="on" title="播放吉他伴奏声部">弹</button>
      <button id="b-mix-vox" class="on" title="播放人声旋律声部">唱</button>
      <label>速度</label><input id="i-tempo" class="short" type="number" min="30" max="240">
    </div>
    <div class="grp">
      <button id="b-diag">和弦图:随行</button>
      <button id="b-meta">曲谱信息</button>
      <button id="b-help">帮助</button>
      <button id="b-theme" title="切换明暗">◐</button>
    </div>
  </div>
  <div class="bar-row">
    <div class="grp"><span id="mode-tip">伴奏区（六线谱）</span></div>
    <div class="grp">
      <label>时值</label>
      <button class="b-dur" data-dur="1">全</button>
      <button class="b-dur" data-dur="2">2分</button>
      <button class="b-dur" data-dur="4">4分</button>
      <button class="b-dur" data-dur="8">8分</button>
      <button class="b-dur" data-dur="16">16分</button>
      <button id="b-dot">附点</button>
    </div>
    <div class="grp">
      <button id="b-inscol">插入列</button>
      <button id="b-delcol">删除列</button>
      <button id="b-insmea">插入小节</button>
      <button id="b-delmea">删除小节</button>
    </div>
    <div class="grp" id="grp-tab">
      <button id="b-mute" title="在当前弦位标 ×（切音/闷音）">× 切音</button>
      <button id="b-strum-d" title="扫弦（六弦向一弦）">扫↓</button>
      <button id="b-strum-u" title="扫弦（一弦向六弦）">扫↑</button>
      <button id="b-arp" title="琶音">琶音</button>
      <label>和弦</label>
      <input id="i-chord" class="short" list="chord-list" placeholder="C">
      <datalist id="chord-list"></datalist>
    </div>
    <div class="grp" id="grp-vox">
      <button id="b-sharp">♯</button>
      <button id="b-flat">♭</button>
      <button id="b-octup" title="高八度点">8度+</button>
      <button id="b-octdn" title="低八度点">8度−</button>
      <button id="b-tie" title="与下一音连音线">连音线</button>
      <label>歌词</label>
      <input id="i-lyric" class="short" placeholder="字">
      <button id="b-fill">批量填词</button>
    </div>
    <div class="grp">
      <button id="b-rep-s" title="反复记号开始 |:">|:</button>
      <button id="b-rep-e" title="反复记号结束 :|">:|</button>
    </div>
  </div>
</div>
<div id="meta-panel">
  <div class="bar-row">
    <div class="grp"><label>标题</label><input id="m-title" class="mid"></div>
    <div class="grp"><label>演唱</label><input id="m-singer" class="mid"></div>
    <div class="grp"><label>作词</label><input id="m-lyricist" class="mid"></div>
    <div class="grp"><label>作曲</label><input id="m-composer" class="mid"></div>
    <div class="grp"><label>制谱</label><input id="m-maker" class="mid"></div>
  </div>
  <div class="bar-row">
    <div class="grp"><label>1=</label><select id="m-key"></select></div>
    <div class="grp"><label>拍号</label>
      <input id="m-beats" class="short" type="number" min="1" max="12"> /
      <select id="m-unit"><option>4</option><option>8</option></select></div>
    <div class="grp"><label>变调夹</label><input id="m-capo" class="short" type="number" min="0" max="12"></div>
  </div>
</div>
<div id="score-wrap"><div id="paper"><svg id="score"></svg></div></div>
<div id="hint">上区六线谱=吉他伴奏（点弦位输数字，×/扫弦/琶音见工具栏）；下区简谱=人声旋律（点数字位置输 0–7，0 为休止），歌词跟随简谱。两声部按小节自动对齐。详见"帮助"。</div>
<div id="toast"></div>
<script>
'use strict';
/* ================= 基础数据 ================= */
const TUNING = [64,59,55,50,45,40];
const KEY_LIST = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const KEY_PC = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const DEG_SEMI = [null,0,2,4,5,7,9,11];   // 1..7 -> 半音
const SEMI_DEG = [[1,''],[1,'#'],[2,''],[2,'#'],[3,''],[4,''],[4,'#'],[5,''],[5,'#'],[6,''],[6,'#'],[7,'']];
const CHORD_SHAPES = {
  'C':'x32010','C7':'x32310','Cmaj7':'x32000','Cadd9':'x32030',
  'Dm':'xx0231','Dm7':'xx0211','D':'xx0232','D7':'xx0212','Dsus4':'xx0233','Dadd11':'xx0032',
  'Em':'022000','Em7':'022030','E':'022100','E7':'020100','Esus4':'022200','Em/D':'xx0000',
  'F':'133211','Fmaj7':'x33210','G':'320003','G7':'320001','Gsus4':'320013',
  'Am':'x02210','Am7':'x02010','A':'x02220','A7':'x02020','Asus4':'x02230','Am/#F':'2x2210',
  'Bm':'x24432','Bm7':'x20202','B7':'x21202','Bb':'x13331','Bdim':'x2323x'
};
const MIN_W = {1:80, 2:52, 4:34, 8:24, 16:19};
const PAGE_W = 1060, MARGIN = 34;

/* ================= 状态 ================= */
let song = null;
let sel = {mi:0, row:'tab', ci:0, si:1};
let undoStack = [], redoStack = [];
let pending = {digits:'', time:0};
let colBoxes = {};
let audio = {ctx:null, sources:[], timers:[], playing:false};
let mix = {tab:true, vox:true};
let diagMode = 'inline';   // inline | top | off

function tcol(){ return {dur:8, dotted:false, chord:'', notes:[], strum:''}; }
function vcol(){ return {dur:4, dotted:false, deg:0, acc:'', oct:0, lyric:'', tie:false}; }
function blankMeasure(){
  const tab=[], vox=[];
  for(let i=0;i<song.beats*2;i++) tab.push(tcol());
  for(let i=0;i<song.beats;i++) vox.push(vcol());
  return {tab, vox, repeatStart:false, repeatEnd:false};
}
function blankSong(){
  const s = {v:2, title:'未命名曲谱', singer:'', lyricist:'', composer:'', maker:'',
    key:'C', beats:4, unit:4, tempo:90, capo:0, measures:[]};
  const old = song; song = s;
  for(let i=0;i<8;i++) s.measures.push(blankMeasure());
  song = old;
  return s;
}

/* ---------- 示例曲 ---------- */
function demoSong(){
  // 伴奏列: T(弦,品,和弦名,时值) ；旋律列: V(唱名,歌词,时值,八度,连音)
  const T=(s,f,ch,dur)=>({dur:dur||8,dotted:false,chord:ch||'',notes:s?[{s,f}]:[],strum:''});
  const Tm=(pairs,ch,dur,strum)=>({dur:dur||8,dotted:false,chord:ch||'',
    notes:pairs.map(p=>({s:p[0],f:p[1],x:p[2]||false})),strum:strum||''});
  const V=(deg,ly,dur,oct)=>({dur:dur||4,dotted:false,deg,acc:'',oct:oct||0,lyric:ly||'',tie:false});
  // C 分解: 5-3-2-3 1-3-2-3 ；Am: 5弦0 ；F: 4弦3根音简化 x33211→低音用4弦3品 ；G: 6弦3
  const arpC = ch=>[T(5,3,ch),T(3,0),T(2,1),T(3,0),T(1,0),T(3,0),T(2,1),T(3,0)];
  const arpAm= ch=>[T(5,0,ch),T(3,2),T(2,1),T(3,2),T(1,0),T(3,2),T(2,1),T(3,2)];
  const arpF = ch=>[T(4,3,ch),T(3,2),T(2,1),T(3,2),T(1,1),T(3,2),T(2,1),T(3,2)];
  const arpG = ch=>[T(6,3,ch),T(3,0),T(2,0),T(3,0),T(1,3),T(3,0),T(2,0),T(3,0)];
  const arpG7= ch=>[T(6,3,ch),T(3,0),T(2,0),T(3,0),T(1,1),T(3,0),T(2,0),T(3,0)];
  const rest4 = ()=>[V(0,'',4),V(0,'',4),V(0,'',4),V(0,'',4)];
  const strumC = [Tm([[5,3],[4,2],[3,0],[2,1],[1,0]],'C',4,'d'),
                  Tm([[5,3],[4,2],[3,0],[2,1],[1,0]],'',4,'u'),
                  Tm([[5,0,true],[4,0,true],[3,0,true],[2,0,true],[1,0,true]],'',4),
                  Tm([[5,3],[4,2],[3,0],[2,1],[1,0]],'',4,'arp')];
  const M=(tab,vox,ext)=>Object.assign({tab,vox,repeatStart:false,repeatEnd:false},ext||{});
  return {v:2, title:'小星星（弹唱示例）', singer:'儿歌', lyricist:'', composer:'法国民谣',
    maker:'MuseTab', key:'C', beats:4, unit:4, tempo:92, capo:0,
    measures:[
      M(arpC('C'),  rest4(), {repeatStart:false}),                    // 前奏
      M(arpG7('G7'),rest4()),
      M(arpC('C'),  [V(1,'一'),V(1,'闪'),V(5,'一'),V(5,'闪')], {repeatStart:true}),
      M(arpF('F'),  [V(6,'亮'),V(6,'晶'),V(5,'晶',2)]),
      M(arpF('F'),  [V(4,'满'),V(4,'天'),V(3,'都'),V(3,'是')]),
      M(arpG7('G7'),[V(2,'小'),V(2,'星'),V(1,'星',2)]),
      M(arpC('C'),  [V(5,'挂'),V(5,'在'),V(4,'天'),V(4,'空')]),
      M(arpG('G'),  [V(3,'放'),V(3,'光'),V(2,'明',2)]),
      M(arpC('C'),  [V(5,'好'),V(5,'像'),V(4,'许'),V(4,'多')]),
      M(arpG('G'),  [V(3,'小'),V(3,'眼'),V(2,'睛',2)]),
      M(arpC('C'),  [V(1,'一'),V(1,'闪'),V(5,'一'),V(5,'闪')]),
      M(arpF('F'),  [V(6,'亮'),V(6,'晶'),V(5,'晶',2)]),
      M(arpF('F'),  [V(4,'满'),V(4,'天'),V(3,'都'),V(3,'是')]),
      M(arpG7('G7'),[V(2,'小'),V(2,'星'),V(1,'星',2)], {repeatEnd:true}),
      M(strumC,     [V(1,'星',1)])                                    // 尾声扫弦
    ]};
}

/* ---------- 旧格式迁移 (v1: measure.columns) ---------- */
function migrate(s){
  if(s.v===2) return s;
  const out = {v:2, title:s.title||'未命名曲谱', singer:s.singer||'', lyricist:'',
    composer:'', maker:s.maker||'', key:s.key||'C', beats:s.beats||4,
    unit:s.unit||4, tempo:s.tempo||90, capo:s.capo||0, measures:[]};
  const ref = (()=>{ let r=60+(KEY_PC[out.key]||0); if(r>66)r-=12; return r; })();
  (s.measures||[]).forEach(m=>{
    const tab=[], vox=[];
    (m.columns||[]).forEach(c=>{
      tab.push({dur:c.dur||4, dotted:!!c.dotted, chord:c.chord||'',
        notes:(c.notes||[]).map(n=>({s:n.s,f:n.f})), strum:''});
      let deg=0, acc='', oct=0;
      if(c.notes && c.notes.length){
        const midi = Math.max(...c.notes.map(n=>TUNING[n.s-1]+n.f));
        const rel = midi-ref; oct = Math.floor(rel/12);
        const pc = ((rel%12)+12)%12;
        deg = SEMI_DEG[pc][0]; acc = SEMI_DEG[pc][1];
      }
      vox.push({dur:c.dur||4, dotted:!!c.dotted, deg, acc, oct, lyric:c.lyric||'', tie:false});
    });
    out.measures.push({tab, vox, repeatStart:false, repeatEnd:false});
  });
  if(!out.measures.length){ const t=song; song=out; out.measures.push(blankMeasure()); song=t; }
  return out;
}

/* ================= 乐理 ================= */
function keyRef(){ let r = 60 + (KEY_PC[song.key]||0); if(r>66) r-=12; return r; }
function beatsOf(c){ return (4/c.dur)*(c.dotted?1.5:1)*(song.unit/4); }
function voxMidi(c){
  if(!c.deg) return null;
  let m = keyRef() + DEG_SEMI[c.deg] + c.oct*12;
  if(c.acc==='#') m++; if(c.acc==='b') m--;
  return m;
}

/* ================= 布局 ================= */
function rowMinLayout(cols){       // 独立排一行列，返回 {w, xs(中心), ws}
  let x = 0; const xs=[], ws=[];
  cols.forEach(c=>{ const w = MIN_W[c.dur]+(c.dotted?6:0); xs.push(x+w/2); ws.push(w); x+=w; });
  return {w:x, xs, ws};
}
function measureLayout(mea){
  const t = rowMinLayout(mea.tab), v = rowMinLayout(mea.vox);
  const pad = 15;
  const inner = Math.max(t.w, v.w, 46);
  const w = inner + pad*2;
  const scaleT = t.w? inner/t.w : 1, scaleV = v.w? inner/v.w : 1;
  return { w,
    tabX: t.xs.map(x=>pad+x*scaleT), tabW: t.ws.map(x=>x*scaleT),
    voxX: v.xs.map(x=>pad+x*scaleV), voxW: v.ws.map(x=>x*scaleV) };
}
function layoutSystems(){
  const systems=[]; let cur={measures:[],w:0};
  song.measures.forEach((mea,mi)=>{
    const L = measureLayout(mea);
    if(cur.measures.length && cur.w + L.w > PAGE_W - 2*MARGIN){ systems.push(cur); cur={measures:[],w:0}; }
    cur.measures.push({mi, x:cur.w, L});
    cur.w += L.w;
  });
  if(cur.measures.length) systems.push(cur);
  return systems;
}
/* 系统内纵向尺寸 */
function sysMetrics(){
  const diagH = diagMode==='inline' ? 66 : (diagMode==='top'?18:18);
  const tabTop = diagH + 10;
  const tabBot = tabTop + 5*13;
  const stemY  = tabBot + 15;
  const voxY   = stemY + 40;
  const lyricY = voxY + 26;
  return {diagH, tabTop, tabBot, stemY, voxY, lyricY, h:lyricY+14, gap:26};
}

/* ================= 渲染 ================= */
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function usedChords(){
  const seen=[], have=new Set();
  song.measures.forEach(m=>m.tab.forEach(c=>{
    if(c.chord && !have.has(c.chord)){ have.add(c.chord); seen.push(c.chord); }}));
  return seen;
}
function chordDiagramSVG(name, x, y, scale){
  const k = scale||1; const shape = CHORD_SHAPES[name]; const p=[];
  p.push(`<text x="${x+22*k}" y="${y+9}" font-size="${11*k}" font-weight="bold" text-anchor="middle" fill="var(--ink)">${esc(name)}</text>`);
  if(!shape) return p.join('');
  const gx=x+4*k, gy=y+19, sw=7.2*k, fh=8.6*k;
  const frets=[...shape].map(ch=>ch==='x'?-1:parseInt(ch,36));
  const fpos=frets.filter(f=>f>0);
  const base = fpos.length && Math.max(...fpos)>4 ? Math.min(...fpos) : 1;
  for(let i=0;i<6;i++) p.push(`<line x1="${gx+i*sw}" y1="${gy}" x2="${gx+i*sw}" y2="${gy+4*fh}" stroke="var(--ink)" stroke-width="0.7"/>`);
  for(let i=0;i<=4;i++) p.push(`<line x1="${gx}" y1="${gy+i*fh}" x2="${gx+5*sw}" y2="${gy+i*fh}" stroke="var(--ink)" stroke-width="${i===0&&base===1?1.8:0.7}"/>`);
  if(base>1) p.push(`<text x="${gx-2}" y="${gy+fh-1}" font-size="8" text-anchor="end" fill="var(--ink)">${base}</text>`);
  frets.forEach((f,i)=>{
    const sx = gx+(5-i)*sw;
    if(f===-1) p.push(`<text x="${sx}" y="${gy-2.5}" font-size="7.5" text-anchor="middle" fill="var(--ink)">×</text>`);
    else if(f===0) p.push(`<circle cx="${sx}" cy="${gy-5}" r="2.3" fill="none" stroke="var(--ink)" stroke-width="0.7"/>`);
    else{ const r=f-base+1;
      if(r>=1&&r<=4) p.push(`<circle cx="${sx}" cy="${gy+(r-0.5)*fh}" r="${2.8*k}" fill="var(--ink)"/>`); }
  });
  return p.join('');
}
/* 减时线/符杠分组：同一整拍内连续的 8/16 分列 */
function beamGroups(cols, playable){
  const groups=[]; let cur=null; let cum=0;
  cols.forEach((c,i)=>{
    const b = beatsOf(c);
    const ok = c.dur>=8 && (!playable || playable(c));
    const beat = Math.floor(cum+1e-4);
    if(ok){
      if(cur && cur.beat===beat) cur.idx.push(i);
      else { cur={beat, idx:[i]}; groups.push(cur); }
    } else cur=null;
    cum += b;
  });
  return groups;
}

function render(){
  const svg = document.getElementById('score');
  const systems = layoutSystems();
  const M = sysMetrics();
  colBoxes = {};
  const p = [];
  /* ---- 头部：标题居中，左 1=X 拍号，右 词曲制谱 ---- */
  let headY = 40;
  p.push(`<text x="${PAGE_W/2}" y="${headY}" font-size="26" font-weight="bold" text-anchor="middle" fill="var(--ink)">${esc(song.title)}</text>`);
  headY += 24;
  if(song.singer){
    p.push(`<text x="${PAGE_W/2}" y="${headY}" font-size="14" text-anchor="middle" fill="var(--ink)">${esc(song.singer)}</text>`);
    headY += 6;
  }
  const credits = [];
  if(song.lyricist) credits.push('作词：'+song.lyricist);
  if(song.composer) credits.push('作曲：'+song.composer);
  if(song.maker) credits.push('制谱：'+song.maker);
  credits.forEach((t,i)=>
    p.push(`<text x="${PAGE_W-MARGIN}" y="${44+i*17}" font-size="12.5" text-anchor="end" fill="var(--ink)">${esc(t)}</text>`));
  // 左侧 1=G 4/4
  p.push(`<text x="${MARGIN}" y="${headY+22}" font-size="16" font-family="var(--font-num)" fill="var(--ink)">1=${esc(song.key)}</text>`);
  p.push(`<text x="${MARGIN+52}" y="${headY+15}" font-size="11" font-family="var(--font-num)" fill="var(--ink)">${song.beats}</text>`);
  p.push(`<line x1="${MARGIN+48}" y1="${headY+18}" x2="${MARGIN+62}" y2="${headY+18}" stroke="var(--ink)" stroke-width="0.9"/>`);
  p.push(`<text x="${MARGIN+52}" y="${headY+28}" font-size="11" font-family="var(--font-num)" fill="var(--ink)">${song.unit}</text>`);
  const capoBits=[];
  if(song.capo>0) capoBits.push(`变调夹 ${song.capo} 品`);
  capoBits.push(`♩=${song.tempo}`);
  p.push(`<text x="${MARGIN+78}" y="${headY+22}" font-size="12.5" fill="var(--ink)">${esc(capoBits.join('　'))}</text>`);
  let top = headY + 40;
  /* ---- 曲首和弦一览（top 模式） ---- */
  if(diagMode==='top'){
    const chords = usedChords();
    if(chords.length){
      const perRow = Math.min(chords.length, 14);
      chords.forEach((name,i)=>{
        const cx = PAGE_W/2 - perRow*50/2 + (i%14)*50;
        p.push(chordDiagramSVG(name, cx, top + Math.floor(i/14)*64));
      });
      top += Math.ceil(chords.length/14)*64 + 12;
    }
  }
  /* ---- 各系统 ---- */
  systems.forEach((sys, sIdx)=>{
    const oy = top + sIdx*(M.h+M.gap);
    const ox = MARGIN;
    const tabTop=oy+M.tabTop, tabBot=oy+M.tabBot, stemY=oy+M.stemY, voxY=oy+M.voxY, lyricY=oy+M.lyricY;
    // TAB 六线 + TAB 字样
    for(let i=0;i<6;i++)
      p.push(`<line x1="${ox}" y1="${tabTop+i*13}" x2="${ox+sys.w}" y2="${tabTop+i*13}" stroke="var(--ink)" stroke-width="0.7"/>`);
    ['T','A','B'].forEach((ch,i)=>
      p.push(`<text x="${ox-11}" y="${tabTop+13+i*19.5+4}" font-size="12" font-weight="bold" text-anchor="middle" fill="var(--ink)">${ch}</text>`));
    if(sIdx===0){
      p.push(`<text x="${ox+8}" y="${tabTop+26}" font-size="15" font-family="var(--font-num)" font-weight="bold" fill="var(--ink)">${song.beats}</text>`);
      p.push(`<text x="${ox+8}" y="${tabTop+52}" font-size="15" font-family="var(--font-num)" font-weight="bold" fill="var(--ink)">${song.unit}</text>`);
    }
    p.push(`<line x1="${ox}" y1="${tabTop}" x2="${ox}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
    p.push(`<line x1="${ox}" y1="${voxY-13}" x2="${ox}" y2="${voxY+4}" stroke="var(--ink)" stroke-width="1"/>`);

    sys.measures.forEach(lm=>{
      const mea = song.measures[lm.mi];
      const mx = ox + lm.x;
      const isLast = lm.mi === song.measures.length-1;
      p.push(`<text x="${mx+3}" y="${tabTop-6}" font-size="9" fill="var(--ink)" opacity="0.45">${lm.mi+1}</text>`);
      /* 反复记号 */
      if(mea.repeatStart){
        p.push(`<rect x="${mx+1}" y="${tabTop}" width="2.4" height="65" fill="var(--ink)"/>`);
        p.push(`<line x1="${mx+6}" y1="${tabTop}" x2="${mx+6}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
        p.push(`<circle cx="${mx+10.5}" cy="${tabTop+26}" r="1.8" fill="var(--ink)"/><circle cx="${mx+10.5}" cy="${tabTop+39}" r="1.8" fill="var(--ink)"/>`);
        p.push(`<text x="${mx+2}" y="${voxY}" font-size="13" font-family="var(--font-num)" fill="var(--ink)">𝄆</text>`);
      }
      /* 小节线（右） */
      const bx = mx+lm.L.w;
      if(mea.repeatEnd){
        p.push(`<circle cx="${bx-10.5}" cy="${tabTop+26}" r="1.8" fill="var(--ink)"/><circle cx="${bx-10.5}" cy="${tabTop+39}" r="1.8" fill="var(--ink)"/>`);
        p.push(`<line x1="${bx-6}" y1="${tabTop}" x2="${bx-6}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
        p.push(`<rect x="${bx-3.5}" y="${tabTop}" width="2.4" height="65" fill="var(--ink)"/>`);
        p.push(`<text x="${bx-14}" y="${voxY}" font-size="13" font-family="var(--font-num)" fill="var(--ink)">𝄇</text>`);
      }else if(isLast){
        p.push(`<line x1="${bx-5}" y1="${tabTop}" x2="${bx-5}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
        p.push(`<rect x="${bx-3}" y="${tabTop}" width="2.6" height="65" fill="var(--ink)"/>`);
        p.push(`<line x1="${bx-5}" y1="${voxY-13}" x2="${bx-5}" y2="${voxY+4}" stroke="var(--ink)" stroke-width="1"/>`);
        p.push(`<rect x="${bx-3}" y="${voxY-13}" width="2.4" height="17" fill="var(--ink)"/>`);
      }else{
        p.push(`<line x1="${bx}" y1="${tabTop}" x2="${bx}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
        p.push(`<line x1="${bx}" y1="${voxY-13}" x2="${bx}" y2="${voxY+4}" stroke="var(--ink)" stroke-width="1"/>`);
      }

      /* ======== 伴奏声部（TAB） ======== */
      mea.tab.forEach((col,ci)=>{
        const nx = mx + lm.L.tabX[ci];
        const cw = lm.L.tabW[ci];
        colBoxes['t'+lm.mi+':'+ci] = {x:nx-cw/2, y:oy+M.diagH, w:cw, h:M.stemY-M.diagH+8};
        const isSel = sel.row==='tab' && sel.mi===lm.mi && sel.ci===ci;
        if(isSel)
          p.push(`<rect x="${nx-cw/2}" y="${oy+M.diagH-2}" width="${cw}" height="${M.stemY-M.diagH+12}" rx="4" fill="var(--accent)" opacity="0.12"/>`);
        /* 和弦名 / 随行和弦图 */
        if(col.chord){
          if(diagMode==='inline')
            p.push(chordDiagramSVG(col.chord, nx-20, oy+2, 0.95));
          else
            p.push(`<text x="${nx}" y="${oy+M.diagH-2}" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--ink)">${esc(col.chord)}</text>`);
        }
        /* 音符 */
        col.notes.forEach(n=>{
          const yy = tabTop + (n.s-1)*13;
          if(n.x){
            p.push(`<rect x="${nx-5.5}" y="${yy-5.5}" width="11" height="11" fill="var(--paper)"/>`);
            p.push(`<text x="${nx}" y="${yy+4}" font-size="11" text-anchor="middle" fill="var(--ink)">×</text>`);
          }else{
            const wide = n.f>9;
            p.push(`<rect x="${nx-(wide?8.5:5.5)}" y="${yy-5.5}" width="${wide?17:11}" height="11" fill="var(--paper)"/>`);
            p.push(`<text x="${nx}" y="${yy+4}" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--ink)">${n.f}</text>`);
          }
        });
        /* 扫弦 / 琶音 */
        if(col.strum==='d'||col.strum==='u'){
          const x0 = nx - (col.notes.length?11:0);
          const y1 = tabTop-4, y2 = tabBot+4;
          const up = col.strum==='d';   // 扫向1弦 => 图上箭头向上
          p.push(`<line x1="${x0}" y1="${y1+4}" x2="${x0}" y2="${y2-4}" stroke="var(--ink)" stroke-width="1.4"/>`);
          if(up) p.push(`<path d="M ${x0-3.5} ${y1+9} L ${x0} ${y1+2} L ${x0+3.5} ${y1+9}" fill="none" stroke="var(--ink)" stroke-width="1.4"/>`);
          else   p.push(`<path d="M ${x0-3.5} ${y2-9} L ${x0} ${y2-2} L ${x0+3.5} ${y2-9}" fill="none" stroke="var(--ink)" stroke-width="1.4"/>`);
        }else if(col.strum==='arp'){
          const x0 = nx - (col.notes.length?11:0);
          let d = `M ${x0} ${tabTop-2}`;
          for(let yy=tabTop-2; yy<tabBot; yy+=8) d += ` q 3.5 4 0 8`;
          p.push(`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.1"/>`);
        }
        /* 符干 */
        const hasEvt = col.notes.length || col.strum;
        if(hasEvt && col.dur>=2){
          p.push(`<line x1="${nx}" y1="${tabBot+3}" x2="${nx}" y2="${stemY}" stroke="var(--ink)" stroke-width="1"/>`);
          if(col.dotted) p.push(`<circle cx="${nx+4}" cy="${stemY-4}" r="1.6" fill="var(--ink)"/>`);
        }
        /* 热区（含和弦图区域） */
        p.push(`<rect x="${nx-cw/2}" y="${oy}" width="${cw}" height="${M.stemY-0+10}" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="tab" data-si="0" style="cursor:pointer"/>`);
        for(let s2=1;s2<=6;s2++)
          p.push(`<rect x="${nx-cw/2}" y="${tabTop+(s2-1)*13-6.5}" width="${cw}" height="13" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="tab" data-si="${s2}" style="cursor:pointer"/>`);
      });
      /* TAB 符杠：同拍 8/16 分组 */
      beamGroups(mea.tab, c=>c.notes.length||c.strum).forEach(g=>{
        const xs = g.idx.map(i=>mx+lm.L.tabX[i]);
        const x1 = Math.min(...xs), x2 = Math.max(...xs);
        if(g.idx.length>1){
          p.push(`<rect x="${x1-0.5}" y="${stemY-2.2}" width="${x2-x1+1}" height="2.2" fill="var(--ink)"/>`);
          // 16分第二杠（仅覆盖相邻的16分对）
          for(let a=0;a<g.idx.length-1;a++){
            const i1=g.idx[a], i2=g.idx[a+1];
            if(mea.tab[i1].dur>=16 && mea.tab[i2].dur>=16)
              p.push(`<rect x="${mx+lm.L.tabX[i1]-0.5}" y="${stemY-5.8}" width="${mx+lm.L.tabX[i2]-(mx+lm.L.tabX[i1])+1}" height="2.2" fill="var(--ink)"/>`);
          }
        }else{
          const x=xs[0];
          p.push(`<path d="M ${x} ${stemY} q 6 -3 8 -8" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);
          if(mea.tab[g.idx[0]].dur>=16)
            p.push(`<path d="M ${x} ${stemY-4.5} q 6 -3 8 -8" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);
        }
      });

      /* ======== 人声声部（简谱+歌词） ======== */
      const vGroups = beamGroups(mea.vox, null);
      const inGroup = new Set(); vGroups.forEach(g=>{ if(g.idx.length>1) g.idx.forEach(i=>inGroup.add(i)); });
      mea.vox.forEach((col,ci)=>{
        const nx = mx + lm.L.voxX[ci];
        const cw = lm.L.voxW[ci];
        colBoxes['v'+lm.mi+':'+ci] = {x:nx-cw/2, y:voxY-24, w:cw, h:lyricY-voxY+34};
        const isSel = sel.row==='vox' && sel.mi===lm.mi && sel.ci===ci;
        if(isSel)
          p.push(`<rect x="${nx-cw/2}" y="${voxY-22}" width="${cw}" height="${lyricY-voxY+30}" rx="4" fill="var(--accent)" opacity="0.12"/>`);
        const under = col.dur>=8 ? (col.dur===8?1:2) : 0;
        if(col.acc)
          p.push(`<text x="${nx-9}" y="${voxY-6}" font-size="10" text-anchor="middle" fill="var(--ink)">${col.acc==='#'?'♯':'♭'}</text>`);
        p.push(`<text x="${nx}" y="${voxY}" font-size="17" font-family="var(--font-num)" text-anchor="middle" fill="var(--ink)">${col.deg}</text>`);
        if(col.deg){
          for(let d=0; d<Math.min(2,Math.abs(col.oct)); d++){
            if(col.oct>0) p.push(`<circle cx="${nx}" cy="${voxY-16-d*4.6}" r="1.6" fill="var(--ink)"/>`);
            else p.push(`<circle cx="${nx}" cy="${voxY+6.5+under*3.4+d*4.6}" r="1.6" fill="var(--ink)"/>`);
          }
        }
        if(under && !inGroup.has(ci))
          for(let u=0;u<under;u++)
            p.push(`<line x1="${nx-6.5}" y1="${voxY+3.4+u*3.2}" x2="${nx+6.5}" y2="${voxY+3.4+u*3.2}" stroke="var(--ink)" stroke-width="1.1"/>`);
        if(col.dotted) p.push(`<circle cx="${nx+11}" cy="${voxY-4}" r="1.7" fill="var(--ink)"/>`);
        if(col.dur===2) p.push(`<text x="${nx+cw*0.42}" y="${voxY-1}" font-size="15" text-anchor="middle" fill="var(--ink)">–</text>`);
        if(col.dur===1) for(let d=1;d<=3;d++)
          p.push(`<text x="${nx+cw*0.22*d}" y="${voxY-1}" font-size="15" text-anchor="middle" fill="var(--ink)">–</text>`);
        /* 连音线 */
        if(col.tie){
          let x2;
          if(ci<mea.vox.length-1) x2 = mx+lm.L.voxX[ci+1]-6;
          else x2 = mx+lm.L.w+10;
          p.push(`<path d="M ${nx+5} ${voxY-13} Q ${(nx+5+x2)/2} ${voxY-22} ${x2} ${voxY-13}" fill="none" stroke="var(--ink)" stroke-width="1"/>`);
        }
        /* 歌词 */
        if(col.lyric)
          p.push(`<text x="${nx}" y="${lyricY}" font-size="14" text-anchor="middle" fill="var(--ink)">${esc(col.lyric)}</text>`);
        /* 热区 */
        p.push(`<rect x="${nx-cw/2}" y="${voxY-24}" width="${cw}" height="34" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="vox" style="cursor:pointer"/>`);
        p.push(`<rect x="${nx-cw/2}" y="${lyricY-16}" width="${cw}" height="24" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="vox" data-zone="lyric" style="cursor:pointer"/>`);
      });
      /* 简谱连体减时线 */
      vGroups.forEach(g=>{
        if(g.idx.length<2) return;
        const x1 = mx+lm.L.voxX[g.idx[0]]-6.5, x2 = mx+lm.L.voxX[g.idx[g.idx.length-1]]+6.5;
        p.push(`<line x1="${x1}" y1="${voxY+3.4}" x2="${x2}" y2="${voxY+3.4}" stroke="var(--ink)" stroke-width="1.1"/>`);
        for(let a=0;a<g.idx.length;a++){
          const i1=g.idx[a];
          if(mea.vox[i1].dur>=16){
            let b=a; while(b<g.idx.length-1 && mea.vox[g.idx[b+1]].dur>=16) b++;
            const xa = mx+lm.L.voxX[g.idx[a]]-6.5, xb = mx+lm.L.voxX[g.idx[b]]+6.5;
            p.push(`<line x1="${xa}" y1="${voxY+6.6}" x2="${xb}" y2="${voxY+6.6}" stroke="var(--ink)" stroke-width="1.1"/>`);
            a=b;
          }
        }
      });
    });
  });
  p.push(`<rect id="playhead" x="0" y="0" width="0" height="0" rx="4" fill="var(--accent)" opacity="0" pointer-events="none"/>`);
  const totalH = top + systems.length*(M.h+M.gap) + 10;
  svg.setAttribute('viewBox', `0 0 ${PAGE_W} ${totalH}`);
  svg.setAttribute('width', PAGE_W);
  svg.setAttribute('height', totalH);
  svg.innerHTML = p.join('');
  syncInputs();
}

/* ================= 选区 / 输入同步 ================= */
function curMea(){ return song.measures[sel.mi]; }
function curRow(){ const m=curMea(); return m ? m[sel.row] : null; }
function curCol(){ const r=curRow(); return r && r[sel.ci]; }
function clampSel(){
  sel.mi = Math.max(0, Math.min(sel.mi, song.measures.length-1));
  const r = curRow();
  if(!r || !r.length){ sel.row = sel.row==='tab'?'vox':'tab'; }
  sel.ci = Math.max(0, Math.min(sel.ci, Math.max(0,(curRow()||[]).length-1)));
  sel.si = Math.max(1, Math.min(sel.si, 6));
}
function syncInputs(){
  const col = curCol();
  document.getElementById('mode-tip').textContent =
    sel.row==='tab' ? '伴奏区（六线谱）' : '旋律区（简谱/歌词）';
  document.getElementById('grp-tab').style.opacity = sel.row==='tab'?'1':'0.45';
  document.getElementById('grp-vox').style.opacity = sel.row==='vox'?'1':'0.45';
  document.getElementById('i-chord').value = (sel.row==='tab' && col) ? (col.chord||'') : '';
  const lyr = document.getElementById('i-lyric');
  if(document.activeElement!==lyr) lyr.value = (sel.row==='vox'&&col)?(col.lyric||''):'';
  document.getElementById('i-tempo').value = song.tempo;
  document.querySelectorAll('.b-dur').forEach(b=>
    b.classList.toggle('on', col && +b.dataset.dur===col.dur));
  document.getElementById('b-dot').classList.toggle('on', !!(col&&col.dotted));
  const mea = curMea();
  document.getElementById('b-rep-s').classList.toggle('on', !!(mea&&mea.repeatStart));
  document.getElementById('b-rep-e').classList.toggle('on', !!(mea&&mea.repeatEnd));
  if(col && sel.row==='tab'){
    document.getElementById('b-strum-d').classList.toggle('on', col.strum==='d');
    document.getElementById('b-strum-u').classList.toggle('on', col.strum==='u');
    document.getElementById('b-arp').classList.toggle('on', col.strum==='arp');
  }
  if(col && sel.row==='vox'){
    document.getElementById('b-sharp').classList.toggle('on', col.acc==='#');
    document.getElementById('b-flat').classList.toggle('on', col.acc==='b');
    document.getElementById('b-tie').classList.toggle('on', !!col.tie);
  }
  document.getElementById('m-title').value = song.title;
  document.getElementById('m-singer').value = song.singer;
  document.getElementById('m-lyricist').value = song.lyricist||'';
  document.getElementById('m-composer').value = song.composer||'';
  document.getElementById('m-maker').value = song.maker;
  document.getElementById('m-key').value = song.key;
  document.getElementById('m-beats').value = song.beats;
  document.getElementById('m-unit').value = song.unit;
  document.getElementById('m-capo').value = song.capo;
}

/* ================= 编辑 ================= */
function pushUndo(){
  undoStack.push(JSON.stringify(song));
  if(undoStack.length>200) undoStack.shift();
  redoStack=[];
}
function mutate(fn){ pushUndo(); fn(); clampSel(); persist(); render(); }
function undo(){
  if(!undoStack.length) return toast('没有可撤销的操作');
  redoStack.push(JSON.stringify(song));
  song = JSON.parse(undoStack.pop());
  clampSel(); persist(); render();
}
function redo(){
  if(!redoStack.length) return toast('没有可重做的操作');
  undoStack.push(JSON.stringify(song));
  song = JSON.parse(redoStack.pop());
  clampSel(); persist(); render();
}
function setFret(f){
  if(sel.row!=='tab') return;
  mutate(()=>{
    const col = curCol();
    const i = col.notes.findIndex(n=>n.s===sel.si);
    if(f==null){ if(i>=0) col.notes.splice(i,1); }
    else if(i>=0){ col.notes[i].f=f; col.notes[i].x=false; }
    else col.notes.push({s:sel.si, f});
  });
}
function setDeg(d){
  if(sel.row!=='vox') return;
  mutate(()=>{ const c=curCol(); c.deg=d; if(!d){ c.acc=''; c.oct=0; } });
}
function moveCol(dir){
  const r = curRow();
  if(dir>0){
    if(sel.ci < r.length-1) sel.ci++;
    else if(sel.mi < song.measures.length-1){ sel.mi++; sel.ci=0; }
  }else{
    if(sel.ci>0) sel.ci--;
    else if(sel.mi>0){ sel.mi--; sel.ci = curMea()[sel.row].length-1; }
  }
  pending.digits=''; render();
}
function switchRow(){
  sel.row = sel.row==='tab' ? 'vox' : 'tab';
  clampSel(); pending.digits=''; render();
}

/* ================= 键盘 ================= */
window.addEventListener('keydown', e=>{
  const tag = (document.activeElement||{}).tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'){
    if(e.key==='Escape') document.activeElement.blur();
    return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); exportSong(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(/^[0-9]$/.test(e.key)){
    e.preventDefault();
    if(sel.row==='tab'){
      const now = Date.now();
      let d = e.key;
      if(now-pending.time<700 && pending.digits){
        const comb = parseInt(pending.digits+d,10);
        if(comb<=24) d = String(comb);
      }
      pending = {digits:d, time:now};
      setFret(parseInt(d,10));
    }else{
      const n = +e.key;
      if(n<=7) setDeg(n);
    }
    return;
  }
  switch(e.key){
    case 'ArrowRight': e.preventDefault(); moveCol(1); break;
    case 'ArrowLeft':  e.preventDefault(); moveCol(-1); break;
    case 'ArrowDown':
      e.preventDefault();
      if(sel.row==='tab'){ if(sel.si<6) sel.si++; else switchRow(); render(); }
      break;
    case 'ArrowUp':
      e.preventDefault();
      if(sel.row==='tab'){ if(sel.si>1){ sel.si--; render(); } }
      else { switchRow(); sel.si=6; render(); }
      break;
    case 'Tab': e.preventDefault(); switchRow(); break;
    case 'Backspace':
      e.preventDefault(); pending.digits='';
      if(sel.row==='tab') setFret(null); else setDeg(0);
      break;
    case 'Delete': e.preventDefault(); delColumn(); break;
    case 'Enter':
      e.preventDefault();
      if(sel.row==='vox') document.getElementById('i-lyric').focus();
      break;
    case ' ': e.preventDefault(); audio.playing?stopPlay():play(); break;
    case '.': e.preventDefault(); toggleDot(); break;
    case '#': if(sel.row==='vox') toggleAcc('#'); break;
    case 'b': if(sel.row==='vox') toggleAcc('b'); break;
    case '+': case '=': if(sel.row==='vox') bumpOct(1); break;
    case '-': if(sel.row==='vox') bumpOct(-1); break;
    case '~': if(sel.row==='vox') toggleTie(); break;
    case 'x': if(sel.row==='tab') toggleMute(); break;
    case 'q': setDur(1); break;
    case 'w': setDur(2); break;
    case 'e': setDur(4); break;
    case 'r': setDur(8); break;
    case 't': setDur(16); break;
  }
});

function setDur(d){ const c=curCol(); if(c) mutate(()=>{ curCol().dur=d; }); }
function toggleDot(){ const c=curCol(); if(c) mutate(()=>{ curCol().dotted=!curCol().dotted; }); }
function toggleAcc(a){ mutate(()=>{ const c=curCol(); c.acc = c.acc===a?'':a; }); }
function bumpOct(d){ mutate(()=>{ const c=curCol(); c.oct=Math.max(-2,Math.min(2,(c.oct||0)+d)); }); }
function toggleTie(){ mutate(()=>{ const c=curCol(); c.tie=!c.tie; }); }
function toggleMute(){
  mutate(()=>{
    const col=curCol();
    const i = col.notes.findIndex(n=>n.s===sel.si);
    if(i>=0){ col.notes[i].x = !col.notes[i].x; if(col.notes[i].x) col.notes[i].f=0; }
    else col.notes.push({s:sel.si, f:0, x:true});
  });
}
function setStrum(v){ mutate(()=>{ const c=curCol(); c.strum = c.strum===v?'':v; }); }
function insColumn(){
  mutate(()=>{
    const r = curRow();
    const c = sel.row==='tab'?tcol():vcol();
    c.dur = curCol()?curCol().dur:c.dur;
    r.splice(sel.ci+1,0,c); sel.ci++;
  });
}
function delColumn(){
  mutate(()=>{
    const r = curRow();
    if(r.length>1) r.splice(sel.ci,1);
    else r[0] = sel.row==='tab'?tcol():vcol();
  });
}
function insMeasure(){ mutate(()=>{ song.measures.splice(sel.mi+1,0,blankMeasure()); sel.mi++; sel.ci=0; }); }
function delMeasure(){
  mutate(()=>{
    if(song.measures.length>1) song.measures.splice(sel.mi,1);
    else song.measures[0]=blankMeasure();
  });
}

document.getElementById('b-fill').onclick = ()=>{
  showModal(`<h3>批量填词</h3>
    <p>把整段歌词粘贴进来，将按顺序逐字分配到简谱声部每个有唱名的音上；标点自动跟随前一个字；用短横线 - 表示跳过一个音；换行与空格忽略。</p>
    <textarea id="fill-text" placeholder="一闪一闪亮晶晶，满天都是小星星"></textarea>
    <div class="btns"><button id="fill-cancel">取消</button><button id="fill-ok" class="primary">填入</button></div>`);
  document.getElementById('fill-cancel').onclick = closeModal;
  document.getElementById('fill-ok').onclick = ()=>{
    const text = document.getElementById('fill-text').value;
    closeModal();
    if(!text.trim()) return;
    const PUNCT = '，。！？、；：…—（）()!?,.\'"“”‘’';
    const chars = [...text.replace(/\s+/g,'')];
    mutate(()=>{
      let i=0;
      outer:
      for(const mea of song.measures){
        for(const col of mea.vox){
          if(!col.deg) continue;
          if(i>=chars.length) break outer;
          if(chars[i]==='-'){ col.lyric=''; i++; continue; }
          let ly = chars[i++];
          while(i<chars.length && PUNCT.includes(chars[i])) ly += chars[i++];
          col.lyric = ly;
        }
      }
    });
    toast('歌词已填入');
  };
};

/* ================= 播放 ================= */
function pluck(ctx, freq, when, dur, gain){
  const sr = ctx.sampleRate;
  const N = Math.max(2, Math.round(sr/freq));
  const len = Math.floor(sr*Math.min(dur+0.6, 3.5));
  const buf = ctx.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  for(let i=0;i<N;i++) d[i]=(Math.random()*2-1)*0.85;
  for(let i=N;i<len;i++) d[i]=0.9955*0.5*(d[i-N]+d[i-N+1]);
  const src=ctx.createBufferSource(); src.buffer=buf;
  const g=ctx.createGain(); g.gain.value=gain;
  src.connect(g); g.connect(ctx.destination);
  src.start(when); src.stop(when+len/sr);
  audio.sources.push(src);
}
function chick(ctx, when, gain){        // 切音噪声
  const sr=ctx.sampleRate, len=Math.floor(sr*0.06);
  const buf=ctx.createBuffer(1,len,sr); const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=ctx.createBufferSource(); src.buffer=buf;
  const g=ctx.createGain(); g.gain.value=gain;
  src.connect(g); g.connect(ctx.destination);
  src.start(when); audio.sources.push(src);
}
function voice(ctx, freq, when, dur, gain){
  const osc=ctx.createOscillator(); osc.type='triangle'; osc.frequency.value=freq;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(gain, when+0.03);
  g.gain.setValueAtTime(gain, when+Math.max(0.05,dur-0.08));
  g.gain.linearRampToValueAtTime(0, when+dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(when); osc.stop(when+dur+0.05);
  audio.sources.push(osc);
}
function midiFreq(m){ return 440*Math.pow(2,(m-69)/12); }
function play(){
  stopPlay();
  if(!audio.ctx) audio.ctx = new (window.AudioContext||window.webkitAudioContext)();
  const ctx = audio.ctx;
  if(ctx.state==='suspended') ctx.resume();
  audio.playing = true;
  document.getElementById('b-play').textContent='▶ 播放中…';
  const spb = 60/song.tempo;
  const t = ctx.currentTime + 0.15;
  const t0 = performance.now() + 150;
  const startMi = sel.mi||0;
  let total = 0;
  /* 伴奏 */
  if(mix.tab){
    let el = 0;
    for(let mi=startMi; mi<song.measures.length; mi++){
      song.measures[mi].tab.forEach((col,ci)=>{
        const durSec = beatsOf(col)*spb;
        const ns = col.notes.slice().sort((a,b)=>b.s-a.s);
        const stagger = col.strum ? (col.strum==='arp'?0.045:0.022) : 0.012;
        const order = col.strum==='u' ? ns.slice().reverse() : ns;
        order.forEach((n,k)=>{
          if(n.x) chick(ctx, t+el+k*stagger, 0.18);
          else pluck(ctx, midiFreq(TUNING[n.s-1]+n.f+song.capo-12), t+el+k*stagger, durSec, 0.26);
        });
        audio.timers.push(setTimeout(()=>highlight('t',mi,ci), t0-performance.now()+el*1000));
        el += durSec;
      });
    }
    total = Math.max(total, el);
  }
  /* 旋律（含连音线延长） */
  if(mix.vox){
    let el = 0;
    let hold = null;   // {freq, start, dur}
    for(let mi=startMi; mi<song.measures.length; mi++){
      song.measures[mi].vox.forEach(col=>{
        const durSec = beatsOf(col)*spb;
        const m = voxMidi(col);
        if(m!=null){
          const f = midiFreq(m);
          if(hold && Math.abs(hold.freq-f)<0.01){ hold.dur += durSec; }
          else{
            if(hold) voice(ctx, hold.freq, t+hold.start, hold.dur, 0.16);
            hold = {freq:f, start:el, dur:durSec};
          }
          if(!col.tie){ voice(ctx, hold.freq, t+hold.start, hold.dur, 0.16); hold=null; }
        }else{
          if(hold){ voice(ctx, hold.freq, t+hold.start, hold.dur, 0.16); hold=null; }
        }
        el += durSec;
      });
    }
    if(hold) voice(ctx, hold.freq, t+hold.start, hold.dur, 0.16);
    total = Math.max(total, el);
  }
  audio.timers.push(setTimeout(stopPlay, t0-performance.now()+total*1000+400));
}
function highlight(kind,mi,ci){
  const b = colBoxes[kind+mi+':'+ci];
  const ph = document.getElementById('playhead');
  if(!b||!ph) return;
  ph.setAttribute('x',b.x); ph.setAttribute('y',b.y);
  ph.setAttribute('width',b.w); ph.setAttribute('height',b.h);
  ph.setAttribute('opacity','0.16');
  if(ci===0){
    const svg = document.getElementById('score');
    const scale = svg.getBoundingClientRect().height / svg.viewBox.baseVal.height;
    const y = svg.getBoundingClientRect().top + window.scrollY + b.y*scale;
    if(y > window.scrollY+window.innerHeight-280 || y < window.scrollY+90)
      window.scrollTo({top:y-170, behavior:'smooth'});
  }
}
function stopPlay(){
  audio.timers.forEach(clearTimeout); audio.timers=[];
  audio.sources.forEach(s=>{try{s.stop()}catch(_){}}); audio.sources=[];
  audio.playing=false;
  document.getElementById('b-play').textContent='▶ 播放';
  const ph=document.getElementById('playhead');
  if(ph) ph.setAttribute('opacity','0');
}

  const blob = new Blob([JSON.stringify(song,null,1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (song.title||'曲谱')+'.mtab.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('已导出曲谱文件');
}

  const r = new FileReader();
  r.onload = ()=>{
    try{

      if(!s.measures) throw 0;
      s = migrate(s);
      pushUndo(); song = s; sel={mi:0,row:'tab',ci:0,si:1};
      persist(); render(); toast('已打开：'+(s.title||f.name));

  e.target.value='';
});

}
