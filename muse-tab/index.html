function midiFreq(m){ return 440*Math.pow(2,(m-69)/12); }
/* ---- 母线：混音 + 压缩 + 混响（提升真实感） ---- */
function makeImpulse(ctx,dur,decay){
  const sr=ctx.sampleRate, len=Math.max(1,Math.floor(sr*dur));
  const buf=ctx.createBuffer(2,len,sr);
  for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); }
  return buf;
}
function buildBus(ctx){
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-16; comp.knee.value=26; comp.ratio.value=3.2;
  comp.attack.value=0.003; comp.release.value=0.25;
  const master=ctx.createGain(); master.gain.value=0.92;
  master.connect(comp); comp.connect(ctx.destination);
  const conv=ctx.createConvolver(); conv.buffer=makeImpulse(ctx,1.8,2.4);
  const wet=ctx.createGain(); wet.gain.value=0.16;
  conv.connect(wet); wet.connect(comp);
  return {dry:master, wet:conv};
}
function shaperCurve(ctx,k){
  const n=1024, c=new Float32Array(n);
  for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; c[i]=(1+k)*x/(1+k*Math.abs(x)); }
  const ws=ctx.createWaveShaper(); ws.curve=c; ws.oversample='2x'; return ws;
}
/* ---- 弹拨（Karplus-Strong，可调阻尼/音色/激励，尼龙/钢弦/电吉他/贝斯） ---- */
function ksPluck(ctx,bus,freq,when,dur,gain,sp,mute){
  const sr=ctx.sampleRate;
  const N=Math.max(2, Math.round(sr/freq));
  const ring = mute?0.18: Math.min(dur+1.6, 4.2);
  const len=Math.max(N+2, Math.floor(sr*ring));
  const buf=ctx.createBuffer(1,len,sr); const d=buf.getChannelData(0);
  for(let i=0;i<N;i++) d[i]=(Math.random()*2-1);
  const damp = mute?0.965: sp.damp;
  for(let i=N;i<len;i++) d[i]=damp*0.5*(d[i-N]+d[i-N+1]);
  const src=ctx.createBufferSource(); src.buffer=buf;
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=sp.hp||70;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=sp.tone||3800; lp.Q.value=0.6;
  const g=ctx.createGain(); g.gain.value=gain;
  src.connect(hp); hp.connect(lp);
  let out=lp;
  if(sp.drive){ const ws=shaperCurve(ctx, sp.drive); lp.connect(ws); out=ws; }
  out.connect(g); g.connect(bus.dry); g.connect(bus.wet);
  src.start(when); src.stop(when+ring);
  audio.sources.push(src);
}
/* ---- FM 合成（钢琴/电钢/八音盒） ---- */
function fmTone(ctx,bus,freq,when,dur,gain,sp){
  const car=ctx.createOscillator(); car.type='sine'; car.frequency.value=freq;
  const mod=ctx.createOscillator(); mod.type='sine'; mod.frequency.value=freq*(sp.mod||1);
  const decay=Math.max(0.25,(sp.decay||1.8)*Math.min(1.5,1.6-freq/2200));
  const idx=freq*(sp.idx||2);
  const mg=ctx.createGain();
  mg.gain.setValueAtTime(idx,when);
  mg.gain.exponentialRampToValueAtTime(Math.max(1,idx*0.04), when+decay*0.6);
  mod.connect(mg); mg.connect(car.frequency);
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,when);
  g.gain.exponentialRampToValueAtTime(gain, when+(sp.atk||0.004));
  g.gain.exponentialRampToValueAtTime(gain*0.0008, when+decay);
  let out=car;
  if(sp.tone){ const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=sp.tone; car.connect(lp); out=lp; }
  out.connect(g); g.connect(bus.dry); g.connect(bus.wet);
  const end=when+decay+0.1;
  car.start(when); mod.start(when); car.stop(end); mod.stop(end);
  audio.sources.push(car,mod);
}
/* ---- 锯齿弦乐群（弦乐/弦垫） ---- */
function sawStrings(ctx,bus,freq,when,dur,gain,sp){
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=sp.tone||2600; lp.Q.value=0.5;
  const g=ctx.createGain();
  const a=sp.atk||0.14, r=sp.rel||0.3;
  g.gain.setValueAtTime(0,when);
  g.gain.linearRampToValueAtTime(gain,when+a);
  g.gain.setValueAtTime(gain,when+Math.max(a,dur-r));
  g.gain.linearRampToValueAtTime(0,when+dur+r);
  lp.connect(g); g.connect(bus.dry); g.connect(bus.wet);
  const lfo=ctx.createOscillator(); lfo.frequency.value=sp.vib||5;
  const la=ctx.createGain(); la.gain.value=freq*0.006; lfo.connect(la);
  const oscs=[];
  [-(sp.detune||8),0,(sp.detune||8)].forEach(dt=>{
    const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=freq; o.detune.value=dt;
    la.connect(o.frequency); o.connect(lp); oscs.push(o);
  });
  const end=when+dur+r+0.05;
  oscs.forEach(o=>{o.start(when);o.stop(end);}); lfo.start(when); lfo.stop(end);
  audio.sources.push(lfo,...oscs);
}
/* ---- 长笛（正弦+泛音+气声+颤音） ---- */
function fluteTone(ctx,bus,freq,when,dur,gain,sp){
  const g=ctx.createGain();
  const a=sp.atk||0.07, r=sp.rel||0.14;
  g.gain.setValueAtTime(0,when);
  g.gain.linearRampToValueAtTime(gain,when+a);
  g.gain.setValueAtTime(gain,when+Math.max(a,dur-r));
  g.gain.linearRampToValueAtTime(0,when+dur+r);
  g.connect(bus.dry); g.connect(bus.wet);
  const osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.value=freq; osc.connect(g);
  const h=ctx.createOscillator(); h.type='sine'; h.frequency.value=freq*2;
  const hg=ctx.createGain(); hg.gain.value=0.12; h.connect(hg); hg.connect(g);
  const lfo=ctx.createOscillator(); lfo.frequency.value=sp.vib||5;
  const la=ctx.createGain(); la.gain.value=freq*0.008; lfo.connect(la); la.connect(osc.frequency); la.connect(h.frequency);
  const sr=ctx.sampleRate, nl=Math.max(1,Math.floor(sr*Math.min(dur+r,3)));
  const nbuf=ctx.createBuffer(1,nl,sr); const nd=nbuf.getChannelData(0);
  for(let i=0;i<nl;i++) nd[i]=(Math.random()*2-1);
  const nsrc=ctx.createBufferSource(); nsrc.buffer=nbuf;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq*2; bp.Q.value=0.8;
  const ng=ctx.createGain(); ng.gain.value=(sp.breath||0.06)*gain;
  nsrc.connect(bp); bp.connect(ng); ng.connect(g);
  const end=when+dur+r+0.05;
  osc.start(when);osc.stop(end); h.start(when);h.stop(end);
  lfo.start(when);lfo.stop(end); nsrc.start(when);nsrc.stop(end);
  audio.sources.push(osc,h,lfo,nsrc);
}
/* ---- 人声“啊”（共振峰滤波，元音 /a/） ---- */
function voiceAh(ctx,bus,freq,when,dur,gain,sp){
  const src=ctx.createOscillator(); src.type='sawtooth'; src.frequency.value=freq;
  const lfo=ctx.createOscillator(); lfo.frequency.value=sp.vib||5.5;
  const la=ctx.createGain(); la.gain.value=freq*0.008; lfo.connect(la); la.connect(src.frequency);
  const g=ctx.createGain();
  const a=sp.atk||0.06, r=sp.rel||0.14;
  g.gain.setValueAtTime(0,when);
  g.gain.linearRampToValueAtTime(gain,when+a);
  g.gain.setValueAtTime(gain,when+Math.max(a,dur-r));
  g.gain.linearRampToValueAtTime(0,when+dur+r);
  [[730,0.9,9],[1090,0.6,11],[2600,0.32,13]].forEach(([f,amp,q])=>{
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=q;
    const fg=ctx.createGain(); fg.gain.value=amp;
    src.connect(bp); bp.connect(fg); fg.connect(g);
  });
  g.connect(bus.dry); g.connect(bus.wet);
  const end=when+dur+r+0.05;
  src.start(when);src.stop(end); lfo.start(when);lfo.stop(end);
  audio.sources.push(src,lfo);
}
/* ---- 闷音/打板噪声 ---- */
function chick(ctx,bus,when,gain){
  const sr=ctx.sampleRate, len=Math.floor(sr*0.06);
  const buf=ctx.createBuffer(1,len,sr); const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=ctx.createBufferSource(); src.buffer=buf;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2000; bp.Q.value=0.7;
  const g=ctx.createGain(); g.gain.value=gain;
  src.connect(bp); bp.connect(g); g.connect(bus.dry); g.connect(bus.wet);
  src.start(when); audio.sources.push(src);
}
/* ---- 音色分派 ---- */
function playInst(instKey,ctx,bus,freq,when,dur,gain,mute){
  const sp=INSTRUMENTS[instKey]||INSTRUMENTS.steel;
  const f = sp.oct? freq*Math.pow(2,sp.oct/12) : freq;
  const gg = gain*(sp.amp||0.28);
  switch(sp.type){
    case 'ks':    ksPluck(ctx,bus,f,when,dur,gg,sp,mute); break;
    case 'fm':    fmTone(ctx,bus,f,when,dur,gg,sp); break;
    case 'saw':   sawStrings(ctx,bus,f,when,dur,gg,sp); break;
    case 'flute': fluteTone(ctx,bus,f,when,dur,gg,sp); break;
    case 'voice': voiceAh(ctx,bus,f,when,dur,gg,sp); break;
    default:      ksPluck(ctx,bus,f,when,dur,gg,sp,mute);
  }
}
function activeTrackCount(){
  let n=0;
  song.tabVoices.forEach((_,vi)=>{ if(trackAudible('tab',vi)) n++; });
  song.voxVoices.forEach((_,vi)=>{ if(trackAudible('vox',vi)) n++; });
  return Math.max(1,n);
}
/* 一小节的时长（秒）：取该小节首个有内容声部的时值之和，空小节按拍号 */
function measureSeconds(mi, spb){
  const m = song.measures[mi]; if(!m) return song.beats*spb;
  const cols = (m.tabs&&m.tabs[0]&&m.tabs[0].length?m.tabs[0]:null)
    || (m.voxes&&m.voxes[0]&&m.voxes[0].length?m.voxes[0]:null);
  let b = 0; if(cols) cols.forEach(c=>b+=beatsOf(c));
  if(!b) b = song.beats;
  return b*spb;
}
/* 小节进度条：随播放平滑推进，显示当前小节 */
function startProgress(t, spb, startMi){
  const bounds=[]; let el=0;
  for(let mi=startMi; mi<song.measures.length; mi++){ bounds.push({mi, start:el}); el+=measureSeconds(mi,spb); }
  audio.prog = {t, dur:el||1, bounds};
  cancelAnimationFrame(audio.raf);
  const fill=document.getElementById('mx-fill'), lbl=document.getElementById('mx-lbl');
  const tick=()=>{
    if(!audio.playing || !audio.prog){ return; }
    const e = Math.max(0, audio.ctx.currentTime - audio.prog.t);
    const frac = Math.min(1, e/audio.prog.dur);
    if(fill) fill.style.width = (frac*100)+'%';
    let cur = audio.prog.bounds.length?audio.prog.bounds[0].mi:0;
    for(const b of audio.prog.bounds){ if(e>=b.start) cur=b.mi; else break; }
    if(lbl) lbl.textContent = `第 ${cur+1} / ${song.measures.length} 小节`;
    audio.raf = requestAnimationFrame(tick);
  };
  audio.raf = requestAnimationFrame(tick);
}
function previewInst(instKey){
  if(!audio.ctx) audio.ctx=new (window.AudioContext||window.webkitAudioContext)();
  const ctx=audio.ctx; if(ctx.state==='suspended') ctx.resume();
  const bus=buildBus(ctx);
  const t=ctx.currentTime+0.05;
  [0,4,7,12].forEach((s,i)=>playInst(instKey,ctx,bus,midiFreq(60+s), t+i*0.17, 0.55, 0.9, false));
}
function play(){
  stopPlay();
  if(!audio.ctx) audio.ctx = new (window.AudioContext||window.webkitAudioContext)();
  const ctx = audio.ctx;
  if(ctx.state==='suspended') ctx.resume();
  audio.bus = buildBus(ctx);
  const bus = audio.bus;
  audio.playing = true;
  document.getElementById('b-play').textContent='▶ 播放中…';
  const spb = 60/song.tempo;
  const t = ctx.currentTime+0.15;
  const t0 = performance.now()+150;
  const startMi = sel.mi||0;
  const norm = 0.85/Math.sqrt(activeTrackCount());
  let total=0;
  /* 吉他谱声部：逐声部一条音轨，按各自音色发声 */
  song.tabVoices.forEach((_,vi)=>{
    const cfg = trackCfg('tab',vi);
    if(!trackAudible('tab',vi)) return;
    const vol = (cfg.vol||1)*norm;
    let el=0;
    for(let mi=startMi; mi<song.measures.length; mi++){
      (song.measures[mi].tabs[vi]||[]).forEach((col,ci)=>{
        const durSec = beatsOf(col)*spb;
        let picked = col.notes;
        if(col.strum){
          const sp = strumSpan(col);
          picked = col.notes.filter(n=>n.s>=sp.top && n.s<=sp.bot);
        }
        const ns = picked.slice().sort((a,b)=>b.s-a.s);
        const stagger = col.strum ? (col.strum==='arp'?0.05:0.024) : 0.012;
        const order = col.strum==='u' ? ns.slice().reverse() : ns;
        const chordDiv = Math.sqrt(Math.max(1, order.length));
        order.forEach((n,k)=>{
          const when = t+el+k*stagger;
          if(n.x) chick(ctx, bus, when, 0.3*vol);
          else{
            const freq = midiFreq(TUNING[n.s-1]+n.f+song.capo-12);
            playInst(cfg.inst, ctx, bus, freq, when, col.mute?0.14:durSec, vol/chordDiv, col.mute);
            if(col.mute) chick(ctx, bus, when, 0.12*vol);
          }
        });
        if(vi===0)
          audio.timers.push(setTimeout(()=>highlight('t0',mi,ci), t0-performance.now()+el*1000));
        el += durSec;
      });
    }
    total=Math.max(total,el);
  });
  /* 简谱（旋律）声部：连音线合并同音，按各自音色发声 */
  song.voxVoices.forEach((_,vi)=>{
    const cfg = trackCfg('vox',vi);
    if(!trackAudible('vox',vi)) return;
    const vol = (cfg.vol||1)*norm;
    let el=0, hold=null;
    const flush=()=>{ if(hold){ playInst(cfg.inst, ctx, bus, hold.freq, t+hold.start, hold.dur, vol*0.9, false); hold=null; } };
    for(let mi=startMi; mi<song.measures.length; mi++){
      (song.measures[mi].voxes[vi]||[]).forEach(col=>{
        const durSec = beatsOf(col)*spb;
        const m = voxMidi(col);
        if(m!=null){
          const f=midiFreq(m);
          if(hold && Math.abs(hold.freq-f)<0.01) hold.dur += durSec;
          else{ flush(); hold={freq:f,start:el,dur:durSec}; }
          if(!col.tie) flush();
        }else flush();
        el += durSec;
      });
    }
    flush();
    total=Math.max(total,el);
  });
  audio.timers.push(setTimeout(stopPlay, t0-performance.now()+total*1000+800));
  startProgress(t, spb, startMi);
}
function highlight(prefix,mi,ci){
  const b = colBoxes[prefix+':'+mi+':'+ci];
  const ph = document.getElementById('playhead');
  if(!b||!ph) return;
  ph.setAttribute('x',b.x); ph.setAttribute('y',b.y);
  ph.setAttribute('width',b.w); ph.setAttribute('height',b.h);
  ph.setAttribute('opacity','0.16');
  if(ci===0){
    const svg=document.getElementById('score');
    const scale = svg.getBoundingClientRect().height/svg.viewBox.baseVal.height;
    const y = svg.getBoundingClientRect().top+window.scrollY+b.y*scale;
    if(y > window.scrollY+window.innerHeight-280 || y < window.scrollY+150)
      window.scrollTo({top:y-220, behavior:'smooth'});
  }
}
function stopPlay(){
  audio.timers.forEach(clearTimeout); audio.timers=[];
  audio.sources.forEach(s=>{try{s.stop()}catch(_){}}); audio.sources=[];
  audio.playing=false; audio.prog=null;
  cancelAnimationFrame(audio.raf);
  document.getElementById('b-play').textContent='▶ 播放';
  const ph=document.getElementById('playhead');
  if(ph) ph.setAttribute('opacity','0');
  const fill=document.getElementById('mx-fill'), lbl=document.getElementById('mx-lbl');
  if(fill) fill.style.width='0';
  if(lbl) lbl.textContent = `第 ${(sel.mi||0)+1} / ${song.measures.length} 小节`;
}
document.getElementById('b-play').onclick = play;
document.getElementById('b-stop').onclick = stopPlay;

/* ================= 存取 ================= */
const LS_KEY = 'musetab-song-v1';
const LS_LIB = 'musetab-library-v1';
function persist(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(song));
    /* 实时自动保存：若当前曲谱已存入"我的曲谱"，同步更新该条 */
    if(song && song.id){
      const lib = libLoad();
      const i = lib.findIndex(e=>e.id===song.id);
      if(i>=0){ lib[i].data=JSON.parse(JSON.stringify(song)); lib[i].title=song.title; lib[i].updatedAt=nowStamp(); libSave(lib); }
    }
  }catch(_){}
}
function nowStamp(){ try{ return new Date().toLocaleString('zh-CN',{hour12:false}); }catch(_){ return ''; } }
function libLoad(){ try{ return JSON.parse(localStorage.getItem(LS_LIB))||[]; }catch(_){ return []; } }
function libSave(list){ try{ localStorage.setItem(LS_LIB, JSON.stringify(list)); }catch(_){} }
function newId(){ return 's'+Math.random().toString(36).slice(2,9)+(libLoad().length); }
function saveToLibrary(){
  const lib = libLoad();
  if(song.id){
    const i=lib.findIndex(e=>e.id===song.id);
    if(i>=0){ lib[i].data=JSON.parse(JSON.stringify(song)); lib[i].title=song.title; lib[i].updatedAt=nowStamp(); libSave(lib);
      return toast('已更新到我的曲谱：'+song.title); }
  }
  song.id = newId();
  lib.unshift({id:song.id, title:song.title||'未命名曲谱', updatedAt:nowStamp(), data:JSON.parse(JSON.stringify(song))});
  libSave(lib); persist();
  toast('已保存到我的曲谱：'+(song.title||'未命名曲谱'));
}
function loadSong(s){
  s = migrate(s);

}

  const mineCards = lib.length ? lib.map(e=>
    `<div class="song-card" data-mine="${e.id}">
       <div class="sc-title">${esc(e.title||'未命名曲谱')} ${song.id===e.id?'<span class="sc-cur">编辑中</span>':''}</div>
       <div class="sc-desc">更新于 ${esc(e.updatedAt||'')}</div>
       <div class="sc-act"><button class="primary" data-load-mine="${e.id}">打开</button>
         <button data-rename-mine="${e.id}">重命名</button>
         <button data-del-mine="${e.id}">删除</button></div>
     </div>`).join('')
    : `<p style="grid-column:1/-1">还没有保存的曲谱。制作时点顶部"存入我的曲谱"即可保存，之后编辑会实时自动保存。</p>`;
  showModal(`<h3>曲谱库</h3>
    <div class="lib-tabs">
      <button class="lib-tab ${libTab==='preset'?'on':''}" data-lt="preset">预设曲谱 · 功能展示</button>
      <button class="lib-tab ${libTab==='mine'?'on':''}" data-lt="mine">我的曲谱（${lib.length}）</button>
    </div>
    <div class="song-grid">${libTab==='preset'?presetCards:mineCards}</div>
    <div class="btns"><button id="lib-close">关闭</button></div>`);
  const modal=document.querySelector('.modal');
  modal.querySelectorAll('.lib-tab').forEach(b=>b.onclick=()=>{ libTab=b.dataset.lt; closeModal(); showLibrary(); });
  modal.addEventListener('click', e=>{
    const lp=e.target.closest('[data-load-preset]');
    if(lp){ const s=PRESETS[+lp.dataset.loadPreset].make(); s.id=undefined; closeModal(); loadSong(s); toast('已打开预设：'+s.title); return; }
    const lm=e.target.closest('[data-load-mine]');
    if(lm){ const e0=libLoad().find(x=>x.id===lm.dataset.loadMine); if(e0){ closeModal(); loadSong(JSON.parse(JSON.stringify(e0.data))); toast('已打开：'+e0.title); } return; }
    const rn=e.target.closest('[data-rename-mine]');
    if(rn){ const id=rn.dataset.renameMine; const lib=libLoad(); const en=lib.find(x=>x.id===id);
      const nm=prompt('重命名曲谱', en.title||''); if(nm!=null){ en.title=nm; en.data.title=nm; if(song.id===id) song.title=nm; libSave(lib); persist(); render(); closeModal(); showLibrary(); } return; }
    const dl=e.target.closest('[data-del-mine]');
    if(dl){ const id=dl.dataset.delMine; if(confirm('确定删除这首曲谱？')){ libSave(libLoad().filter(x=>x.id!==id)); if(song.id===id) song.id=undefined; closeModal(); showLibrary(); } return; }
  });
  document.getElementById('lib-close').onclick = closeModal;
}
document.getElementById('b-library').onclick = showLibrary;

document.getElementById('file-in').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload = ()=>{
    try{
      let s = JSON.parse(r.result);
      if(!s.measures) throw 0;
      s = migrate(s);
      pushUndo(); song=s; sel={mi:0,row:'tab',vi:0,ci:0,si:1}; selRange=null;
      persist(); render(); toast('已打开：'+(s.title||f.name));

/* ---- 打印 / 导出（纸张尺寸可选 + PNG） ---- */
function setPrintPage(size){
  let s = document.getElementById('print-page');
  if(!s){ s=document.createElement('style'); s.id='print-page'; document.head.appendChild(s); }
  const rule = { A4:'A4 portrait', A4L:'A4 landscape', Letter:'letter portrait',
    LetterL:'letter landscape', fit:'auto' }[size] || 'A4 portrait';
  const wide = (size==='A4L'||size==='LetterL'||size==='fit');
  document.getElementById('paper').classList.toggle('wide', wide);
  s.textContent = `@page{ size:${rule}; margin:${size==='fit'?'8mm':'12mm'}; }`;
  render();   // 重排以适配新纸张宽度
}
function exportPNG(scale){
  const svg = document.getElementById('score');
  const vb = svg.viewBox.baseVal;
  let xml = new XMLSerializer().serializeToString(svg);
  /* 解析 CSS 变量为具体色（脱离页面后 var() 不生效） */
  const cs = getComputedStyle(document.documentElement);
  const ink = (cs.getPropertyValue('--ink')||'#141414').trim();
  xml = xml.replace(/var\(--ink\)/g, ink).replace(/var\(--paper\)/g,'#ffffff')
           .replace(/var\(--accent\)/g,'#3a5ce0').replace(/var\(--font-num\)/g,'serif');
  const k = scale||2;
  const img = new Image();
  const svg64 = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
  img.onload = ()=>{
    const cv = document.createElement('canvas');
    cv.width = vb.width*k; cv.height = vb.height*k;
    const g = cv.getContext('2d');
    g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height);
    g.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b); a.download=(song.title||'曲谱')+'.png'; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      toast('已导出 PNG 图片');
    },'image/png');
  };
  img.onerror = ()=>toast('图片导出失败，请改用打印');
  img.src = svg64;
}
document.getElementById('b-print').onclick = ()=>{

    <p>选择纸张尺寸后打印；在打印对话框里选择"目标：另存为 PDF"即可导出 PDF。
    也可直接导出为高清 PNG 图片。</p>
    <label class="f"><span>纸张</span>
      <select id="ex-size">
        <option value="A4">A4 纵向 (210×297mm)</option>
        <option value="A4L">A4 横向 (297×210mm)</option>

document.getElementById('b-theme').onclick = ()=>{

/* ================= 弹窗/提示 ================= */
let modalPos=null;
function showModal(html, keepPos){
  closeModal();
  if(!keepPos) modalPos=null;
  const mask=document.createElement('div');
  mask.className='modal-mask'; mask.id='modal-mask';
  mask.innerHTML=`<div class="modal">${html}</div>`;
  mask.addEventListener('pointerdown', e=>{ if(e.target===mask) closeModal(); });
  document.body.appendChild(mask);
  const modal = mask.querySelector('.modal');
  const applyPos=(l,t)=>{
    mask.style.alignItems='flex-start'; mask.style.justifyContent='flex-start';
    modal.style.margin='0'; modal.style.marginLeft=l+'px'; modal.style.marginTop=t+'px';
  };
  if(modalPos) applyPos(modalPos.l, modalPos.t);
  const handle = modal.querySelector('h3');
  if(handle){
    handle.style.cursor='move';
    handle.title='拖动标题可移动窗口';
    let drag=null;
    handle.addEventListener('pointerdown', e=>{
      const r=modal.getBoundingClientRect();
      applyPos(r.left, r.top);
      drag={x:e.clientX, y:e.clientY, l:r.left, t:r.top};
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    handle.addEventListener('pointermove', e=>{
      if(!drag) return;
      const nl=Math.max(0,Math.min(innerWidth-80, drag.l+e.clientX-drag.x));
      const nt=Math.max(0,Math.min(innerHeight-40, drag.t+e.clientY-drag.y));
      modal.style.marginLeft=nl+'px'; modal.style.marginTop=nt+'px';
      modalPos={l:nl, t:nt};
    });
    handle.addEventListener('pointerup', ()=>{ drag=null; });
  }
}
function closeModal(){ const m=document.getElementById('modal-mask'); if(m) m.remove(); }
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity=1;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.style.opacity=0,2200);
}

  </table>
  <h4>通用</h4>
  <table>

  </table>
  <div class="btns"><button id="help-ok" class="primary">知道了</button></div>`);
  document.getElementById('help-ok').onclick = closeModal;

(function init(){
  try{
    const saved = localStorage.getItem(LS_KEY);
    if(saved){ song = migrate(JSON.parse(saved)); }
  }catch(_){ song=null; }
  if(!song || !song.measures || !song.measures.length) song = demoSong();
  clampSel();
  setRibbon('tab');
  document.getElementById('b-notation').textContent = '记谱:'+(tabNotation==='x'?'×':'数字');
  persist();
  render();
  /* 响应式：窗口尺寸变化时重排谱面（自适配宽度） */
  let rzTimer=null;
  window.addEventListener('resize', ()=>{ clearTimeout(rzTimer); rzTimer=setTimeout(render, 120); });
})();
