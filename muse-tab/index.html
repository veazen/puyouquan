<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuseTab 吉他谱编辑器</title>
<style>
:root{
  --bg:#eaedf3; --panel:#ffffff; --text:#1a222e; --muted:#697488;
  --border:#dbe0ea; --border-soft:#e9edf3; --accent:#3a5ce0; --accent-2:#5b76e8;
  --accent-soft:#e8ecfd; --accent-ink:#2540b8;
  --paper:#ffffff; --ink:#141414; --toolbar:#f2f4f9; --danger:#d63b4a; --ok:#1e9e6a;
  --shadow:0 1px 2px rgba(20,30,60,.05), 0 6px 18px rgba(20,30,60,.06);
  --radius:9px;
  --font-ui:'Noto Sans SC','Source Han Sans SC','WenQuanYi Micro Hei','DejaVu Sans',sans-serif;
  --font-num:'DejaVu Serif','Noto Serif SC','Source Han Serif SC',serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12151b; --panel:#1c2029; --text:#e7eaf0; --muted:#98a2b3;
    --border:#333a47; --border-soft:#2a2f3a; --accent:#6d8bff; --accent-2:#7e97ff;
    --accent-soft:#232d47; --accent-ink:#9fb4ff; --toolbar:#181c24; --danger:#ff6b78; --ok:#3ecb8f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35); }
}
:root[data-theme="light"]{ --bg:#eaedf3; --panel:#ffffff; --text:#1a222e; --muted:#697488;
  --border:#dbe0ea; --border-soft:#e9edf3; --accent:#3a5ce0; --accent-2:#5b76e8; --accent-soft:#e8ecfd;
  --accent-ink:#2540b8; --toolbar:#f2f4f9; --danger:#d63b4a; --ok:#1e9e6a;
  --shadow:0 1px 2px rgba(20,30,60,.05), 0 6px 18px rgba(20,30,60,.06); }
:root[data-theme="dark"]{ --bg:#12151b; --panel:#1c2029; --text:#e7eaf0; --muted:#98a2b3;
  --border:#333a47; --border-soft:#2a2f3a; --accent:#6d8bff; --accent-2:#7e97ff; --accent-soft:#232d47;
  --accent-ink:#9fb4ff; --toolbar:#181c24; --danger:#ff6b78; --ok:#3ecb8f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35); }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font-ui);
  -webkit-font-smoothing:antialiased;}
/* ================= 顶部工具栏 ================= */
#top{position:sticky;top:0;z-index:20;background:var(--toolbar);
  border-bottom:1px solid var(--border);backdrop-filter:saturate(1.1);}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:7px 16px;}
.main-bar{gap:7px}
.logo{font-weight:700;font-size:15px;margin-right:10px;white-space:nowrap;
  display:flex;align-items:center;gap:7px;letter-spacing:.01em}
.logo .mark{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;
  justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-size:14px;box-shadow:0 2px 6px rgba(58,92,224,.35)}
.logo small{color:var(--muted);font-weight:400;font-size:11px}
.vsep{width:1px;align-self:stretch;background:var(--border);margin:3px 4px}
.grow{flex:1}
/* 分段按钮组：同组按钮拼接为一体，视觉统一 */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;
  background:var(--panel);box-shadow:0 1px 2px rgba(20,30,60,.04)}
.seg button{border:none;border-radius:0;box-shadow:none;background:transparent;
  border-right:1px solid var(--border-soft)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--accent-soft);color:var(--accent-ink)}
.seg button.seg-accent{color:var(--accent-ink);font-weight:600}
.seg button.seg-accent:hover{background:var(--accent);color:#fff}
button{background:var(--panel);color:var(--text);border:1px solid var(--border);
  border-radius:7px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap;
  font-family:var(--font-ui);transition:border-color .12s, background .12s, color .12s, box-shadow .12s;}
button:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 1px 4px rgba(58,92,224,.12)}
button:active{transform:translateY(.5px)}
button.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));border-color:transparent;
  color:#fff;box-shadow:0 2px 8px rgba(58,92,224,.32)}
button.primary:hover{color:#fff;filter:brightness(1.06)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--accent-soft)}
input,select,textarea{background:var(--panel);color:var(--text);
  border:1px solid var(--border);border-radius:7px;padding:5px 9px;font-size:13px;
  font-family:var(--font-ui);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
input.short{width:54px} input.mid{width:150px}
/* 分页标签 */
.tab-bar{padding:0 16px;gap:4px;background:var(--toolbar);border-bottom:1px solid var(--border)}
.rtab{border:none;background:transparent;padding:9px 15px 8px;font-size:13.5px;color:var(--muted);
  border-bottom:2.5px solid transparent;border-radius:0;font-weight:500}
.rtab:hover{color:var(--text);box-shadow:none}
.rtab.on{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:700}
#mode-tip{margin-left:auto;font-size:12px;color:var(--muted);padding-right:2px;align-self:center}
/* Ribbon 内容区 */
#ribbon{display:flex;align-items:stretch;gap:6px;padding:9px 12px;background:var(--panel);
  overflow-x:auto;border-bottom:1px solid var(--border)}
.rg{display:flex;flex-direction:column;gap:5px;padding:6px 11px 5px;
  border:1px solid var(--border-soft);border-radius:11px;background:var(--toolbar);flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.rg .rg-title{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;
  text-align:center;order:2;margin-top:1px;font-weight:600}
.rg .rg-body{display:flex;align-items:center;gap:4px;flex-wrap:wrap;max-width:200px;
  justify-content:center}
.rg.wide .rg-body{max-width:280px}
/* 图标按钮 */
.ib{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 4px;
  min-width:36px;border:1px solid transparent;border-radius:8px;background:transparent;
  cursor:pointer;transition:background .12s, border-color .12s}
.ib:hover{border-color:var(--border);background:var(--panel)}
.ib.on{border-color:var(--accent);background:var(--accent-soft)}
.ib svg{display:block}
.ib span{font-size:10.5px;color:var(--text);line-height:1.1}
.ib.on span{color:var(--accent-ink)}
.chip{padding:2px 10px;border:1px solid var(--border);border-radius:20px;cursor:pointer;
  font-size:12px;background:var(--panel);user-select:none;transition:all .12s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.vchip{display:inline-flex;align-items:center;gap:2px;padding-right:6px;user-select:none}
.vchip .vdel{opacity:0;max-width:0;overflow:hidden;color:var(--muted);cursor:pointer;
  font-size:12px;line-height:1;transition:opacity .12s,max-width .12s,margin .12s;margin-left:0}
.vchip:hover .vdel{opacity:.75;max-width:14px;margin-left:2px}
.vchip .vdel:hover{color:var(--danger);opacity:1}
/* 状态栏 */
#statusbar{display:flex;align-items:center;gap:12px;padding:5px 18px;font-size:12px;
  background:var(--toolbar);position:relative;border-bottom:1px solid var(--border)}
#beat-status{cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:2px 10px;
  border-radius:20px}
#beat-status::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ok)}
#beat-status.bad{color:var(--danger);font-weight:600;background:color-mix(in srgb,var(--danger) 12%,transparent)}
#beat-status.bad::before{background:var(--danger)}
#beat-status.good{color:var(--muted)}
#err-drop{position:absolute;left:14px;top:100%;z-index:30;background:var(--panel);
  border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);
  padding:8px;max-height:40vh;overflow:auto;min-width:280px}
#err-drop .err{color:var(--danger);cursor:pointer;padding:4px 7px;border-radius:6px;font-size:12.5px}
#err-drop .err:hover{background:var(--accent-soft)}
#suggest,#techbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 18px;
  background:var(--accent-soft);border-bottom:1px solid var(--border);font-size:12.5px}
#suggest .ib{background:var(--panel)}
#score .strcell:hover{fill:var(--accent);fill-opacity:.16}
#score .beatzone:hover{fill:var(--accent);fill-opacity:.13}
#score .strumcell:hover{fill:var(--accent);fill-opacity:.10}
.popmenu{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;box-shadow:var(--shadow);padding:10px;font-size:12.5px}
.popmenu .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.popmenu .t{color:var(--muted);font-size:11.5px}
/* 曲谱库 */
.lib-tabs{display:flex;gap:6px;margin:2px 0 12px;border-bottom:1px solid var(--border);padding-bottom:8px}
.lib-tab{background:transparent;border:1px solid transparent;color:var(--muted);font-weight:500}
.lib-tab.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.song-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.song-card{border:1px solid var(--border);border-radius:12px;padding:12px 13px;background:var(--toolbar);
  display:flex;flex-direction:column;gap:6px}
.song-card:hover{border-color:var(--accent)}
.sc-title{font-weight:700;font-size:14px}
.sc-cur{font-size:10.5px;color:var(--accent-ink);background:var(--accent-soft);padding:1px 7px;border-radius:10px;font-weight:600;margin-left:4px}
.sc-desc{font-size:11.5px;color:var(--muted);line-height:1.5;flex:1}
.sc-act{display:flex;gap:5px;flex-wrap:wrap}
.sc-act button{font-size:12px;padding:4px 10px}
/* ================= 通用功能行 ================= */
.util-bar{gap:7px;background:var(--toolbar);border-bottom:1px solid var(--border)}
.ut-label{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-right:2px;font-weight:600}
/* ================= 三栏舞台 ================= */
#stage{display:flex;align-items:flex-start;justify-content:center;gap:14px;
  padding:18px 16px 6px;max-width:1560px;margin:0 auto}
/* 左侧固定标签栏（贴谱面左缘），点击向左展开完整功能面板 */
#left-dock{display:flex;flex-direction:row;align-items:flex-start;position:sticky;top:118px;
  align-self:flex-start;z-index:6}
#left-rail{display:flex;flex-direction:column;gap:6px;flex:none;padding-top:2px}
.ltab{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.16em;
  border:1px solid var(--border);background:var(--panel);border-radius:9px;
  padding:12px 7px;font-size:13px;color:var(--muted);font-weight:600;min-width:32px;
  box-shadow:0 1px 3px rgba(20,30,60,.06);transition:all .12s}
.ltab:hover{color:var(--accent-ink);background:var(--accent-soft);border-color:var(--accent)}
.ltab.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(58,92,224,.3)}
#left-flyout{flex:none;width:252px;margin-right:7px;max-height:calc(100vh - 140px);overflow-y:auto;
  background:var(--panel);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow)}
#left-flyout #ribbon{display:flex;flex-direction:column;gap:8px;padding:10px;
  overflow:visible;border-bottom:none;background:transparent}
#left-flyout .rg{width:100%}
#left-flyout .rg .rg-body{max-width:none}
/* 右侧信息栏 */
#right-dock{display:flex;flex-direction:column;gap:8px;width:198px;flex:none;
  position:sticky;top:118px;align-self:flex-start;z-index:6}
.rcard{border:1px solid var(--border);border-radius:12px;background:var(--panel);
  box-shadow:0 1px 3px rgba(20,30,60,.06);overflow:hidden}
.rc-h{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;
  border:none;border-radius:0;background:var(--toolbar);font-weight:700;font-size:13px;padding:9px 12px}
.rc-h:hover{background:var(--accent-soft);color:var(--accent-ink)}
.rc-h::after{content:'▸';font-size:11px;color:var(--muted);transition:transform .15s}
.rcard.open .rc-h::after{transform:rotate(90deg)}
.rc-h.rc-btn::after{content:'…';transform:none}
.rcard .rc-b{display:none;padding:10px 12px;border-top:1px solid var(--border)}
.rcard.open .rc-b{display:block}
.rc-b .rg-body{max-width:none;justify-content:flex-start;gap:5px}
.rc-b .rg-body button{margin:1px 0}
#cursor-info{font-size:12.5px;color:var(--text);line-height:1.85}
#cursor-info .ci-row{display:flex;justify-content:space-between;gap:8px}
#cursor-info .ci-k{color:var(--muted)}
#cursor-info b{color:var(--accent-ink);font-weight:600}
/* ================= 主区（默认 A4 纸张） ================= */
#score-wrap{flex:0 1 900px;min-width:0;max-width:900px;margin:0;padding:0;}
#paper{background:transparent;border:none;box-shadow:none;padding:0;
  width:100%;max-width:820px;margin:0 auto;
  filter:drop-shadow(0 4px 14px rgba(20,30,60,.10));}   /* ≈A4 纵向宽度(96dpi) */
#paper.wide{max-width:1180px}
svg{display:block;margin:0 auto;max-width:100%;height:auto;}
svg text{user-select:none}
#score .pagebg{stroke:var(--border)}
#hint{max-width:900px;margin:8px auto 34px;padding:0 20px;color:var(--muted);font-size:12px;line-height:1.6}
/* ================= 弹窗 ================= */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;
  display:flex;align-items:center;justify-content:center;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:18px 20px;max-width:720px;width:94%;max-height:84vh;overflow:auto;}
.modal h3{margin:0 0 10px;font-size:16px}
.modal h4{margin:14px 0 6px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:3px}
.modal .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modal textarea{width:100%;height:120px;resize:vertical}
.modal p{color:var(--muted);font-size:12px;margin:6px 0}
.modal table{border-collapse:collapse;font-size:13px;width:100%}
.modal td{padding:3px 8px;border-bottom:1px solid var(--border)}
.modal td.k{color:var(--accent);white-space:nowrap;font-family:ui-monospace,monospace}
.modal label.f{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.modal label.f span{width:56px;color:var(--muted);text-align:right}
/* 底部悬浮音轨面板（紧凑） */
#mixer-dock{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(102%);
  transition:transform .22s ease;background:var(--panel);border-top:1px solid var(--border);
  box-shadow:0 -6px 24px rgba(20,30,60,.16);padding:7px 14px 9px}
#mixer-dock.open{transform:translateY(0)}
.mx-top{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.mx-title{font-weight:700;font-size:12.5px;white-space:nowrap;display:flex;align-items:center;gap:6px}
#mx-prog{flex:1;height:15px;border-radius:8px;background:var(--toolbar);border:1px solid var(--border);
  position:relative;overflow:hidden;cursor:pointer;min-width:120px}
#mx-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent-soft);
  border-right:2px solid var(--accent);pointer-events:none}
#mx-lbl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10.5px;
  color:var(--muted);white-space:nowrap;pointer-events:none}
#mx-close2{padding:2px 9px;font-size:12px}
.mx-tracks{display:flex;flex-direction:column;gap:3px;max-height:30vh;overflow-y:auto}
.mx-grp{font-size:10px;color:var(--muted);letter-spacing:.09em;margin:3px 2px 0;font-weight:600}
.mx-row{display:grid;grid-template-columns:88px 112px 28px 28px minmax(120px,1fr);align-items:center;
  gap:8px;padding:2px 4px;border-radius:7px}
.mx-row:hover{background:var(--toolbar)}
.mx-row .mx-nm{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-row select{padding:3px 5px;font-size:12px}
.mx-btn{padding:3px 0;font-size:10.5px;font-weight:700;border-radius:6px}
.mx-btn.solo.on{background:#f5b301;border-color:#f5b301;color:#3a2c00}
.mx-btn.mute.on{background:var(--danger);border-color:var(--danger);color:#fff}
.mx-vol{display:flex;align-items:center;gap:6px}
.mx-vol input{flex:1;min-width:60px}
.mx-vol .vv{font-size:10px;color:var(--muted);width:32px;text-align:right}
/* 节奏型库卡片 */
.pat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pat-card{border:1px solid var(--border);border-radius:10px;padding:6px;cursor:pointer;
  background:var(--toolbar);display:flex;flex-direction:column;align-items:center;gap:3px}
.pat-card:hover{border-color:var(--accent);background:var(--accent-soft)}
.pat-card .nm{font-size:12px;text-align:center;line-height:1.25}
.pat-card .bt{font-size:10.5px;color:var(--muted)}
.pat-card svg{background:var(--panel);border-radius:6px}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:8px 18px;border-radius:20px;
  font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
.hidden{display:none!important}
@media print{
  #top,#hint,#toast,#suggest,#techbar,.popmenu,.modal-mask,#left-dock,#right-dock,#mixer-dock{display:none!important}
  body{background:#fff}
  #stage{display:block;padding:0;margin:0;max-width:none}
  #score-wrap{margin:0;max-width:none;padding:0;flex:none}
  #paper{border:none;box-shadow:none;border-radius:0;padding:0;max-width:none;width:auto;filter:none}
  #paper svg{width:100%!important;height:auto!important}
  #score .pagebg{stroke:none!important} #score .pageno{display:none!important}
  :root{--paper:#fff;--ink:#000}
}
</style>
</head>
<body>
<header id="top">
  <div class="bar main-bar">
    <span class="logo"><span class="mark">🎸</span>MuseTab <small>吉他谱编辑器</small></span>
    <span class="seg">
      <button id="b-library" class="seg-accent" title="预设曲谱与我的曲谱">曲谱库</button>
      <button id="b-savemine" title="保存到我的曲谱">存入</button>
      <button id="b-new" title="新建空白曲谱">新建</button>
    </span>
    <span class="seg">
      <button id="b-open" title="从文件导入 .mtab.json">导入</button>
      <button id="b-save" title="导出为 .mtab.json 文件">导出</button>
      <button id="b-print" title="打印或导出 PDF/图片">打印…</button>
    </span>
    <input type="file" id="file-in" accept=".json,.mtab,.mtab.json" class="hidden">
    <span class="grow"></span>
    <button id="b-theme" class="ghost" title="切换明暗">◐</button>
  </div>
  <div class="bar util-bar">
    <span class="ut-label">通用功能</span>
    <span class="seg">
      <button id="b-undo" title="Ctrl+Z">撤销</button>
      <button id="b-redo" title="Ctrl+Y">重做</button>
    </span>
    <span class="vsep"></span>
    <button id="b-play" class="primary">▶ 播放</button>
    <button id="b-stop" title="停止">■</button>
    <button id="b-tracks" title="音轨与音色：每条声部可单独开关、选择乐器音色、调音量">🎚 音轨</button>
    <label style="color:var(--muted);font-size:12px">速度</label>
    <input id="i-tempo" class="short" type="number" min="30" max="240">
  </div>
  <div id="statusbar">
    <span id="beat-status" class="good">✓ 所有小节时值正确</span>
    <div id="err-drop" class="hidden"></div>
  </div>
</header>

<div id="stage">
  <aside id="left-dock">
    <div id="left-flyout">
      <div id="ribbon">
    <!-- 共用时值组（吉他谱/简谱页显示） -->
    <div class="rg" id="g-dur">
      <div class="rg-title">时值 · 共用</div>
      <div class="rg-body" id="dur-body"></div>
    </div>
    <div class="rg" id="g-combo">

function movableShape(rootPc, qual, form){
  const f6 = ((rootPc-4)%12+12)%12 || (rootPc===4?0:((rootPc-4)%12+12)%12);
  const f5 = ((rootPc-9)%12+12)%12;
  const F = n=> n>9? n.toString(36) : ''+n;   // 10→a...
  const barre=(base, offs)=> offs.map(o=> o==null?'x':F(base+o)).join('');
  if(form==='E'){

    const shapes={ '':[0,2,2,1,0,0], m:[0,2,2,0,0,0], '7':[0,2,0,1,0,0],

    const o = shapes[qual]||shapes[''];
    return barre(b, [o[0],o[1],o[2],o[3],o[4],o[5]]);   // 6→1 弦
  }else{
    const b = f5===0?12:f5;

  }

  for(const s of [6,5,4]){
    const openPc = OPEN_PC[s-1];
    let fr = ((bassPc-openPc)%12+12)%12;
    if(fr<=4){
      arr[6-s] = fr>9?fr.toString(36):''+fr;
      for(let s2=s+1;s2<=6;s2++) arr[6-s2]='x';
      return arr.join('');
    }
  }
  return baseShape;
}

function trackCfg(kind, vi){
  if(!song.mixer) song.mixer = {};
  const id = kind+':'+vi;
  if(!song.mixer[id]) song.mixer[id] = {on:true, solo:false, inst: kind==='tab'?'steel':'ah', vol:1};

  if(typeof INSTRUMENTS!=='undefined' && !INSTRUMENTS[c.inst]) c.inst = kind==='tab'?'steel':'ah';

function migrate(s){
  if(s.v===3){ if(!s.customChords) s.customChords={}; return s; }
  if(s.v===2){
    s.v=3; s.tabVoices=['吉他1']; s.voxVoices=['旋律1']; s.lyricLines=1;
    s.lyricist=s.lyricist||''; s.composer=s.composer||'';
    s.measures.forEach(m=>{
      m.tabs=[m.tab]; delete m.tab;
      (m.vox||[]).forEach(c=>{ c.lyrics = c.lyric?[c.lyric]:[]; delete c.lyric; });
      m.voxes=[m.vox]; delete m.vox;
    });
    return s;
  }
  const out = {v:3, title:s.title||'未命名曲谱', singer:s.singer||'', lyricist:'',
    composer:'', maker:s.maker||'', key:s.key||'C', beats:s.beats||4,
    unit:s.unit||4, tempo:s.tempo||90, capo:s.capo||0,
    tabVoices:['吉他1'], voxVoices:['旋律1'], lyricLines:1, measures:[]};
  const ref = (()=>{ let r=60+(KEY_PC[out.key]||0); if(r>66)r-=12; return r; })();
  (s.measures||[]).forEach(m=>{
    const tab=[], vox=[];
    (m.columns||[]).forEach(c=>{
      tab.push({dur:c.dur||4, dotted:!!c.dotted, chord:c.chord||'',
        notes:(c.notes||[]).map(n=>({s:n.s,f:n.f})), strum:''});
      let deg=0, acc='', oct=0;
      if(c.notes && c.notes.length){
        const midi = Math.max(...c.notes.map(n=>TUNING[n.s-1]+n.f));
        const rel = midi-ref; oct = Math.floor(rel/12);
        const pc = ((rel%12)+12)%12;
        deg = SEMI_DEG[pc][0]; acc = SEMI_DEG[pc][1];
      }
      vox.push({dur:c.dur||4, dotted:!!c.dotted, deg, acc, oct,
        lyrics:c.lyric?[c.lyric]:[], tie:false});
    });
    out.measures.push({tabs:[tab], voxes:[vox], repeatStart:false, repeatEnd:false});
  });
  if(!out.measures.length){ const t=song; song=out; out.measures.push(blankMeasure()); song=t; }
  return out;
}

function keyRef(){ let r = 60 + (KEY_PC[song.key]||0); if(r>66) r-=12; return r; }
function beatsOf(c){ return (4/c.dur)*(c.dotted?1.5:1)*(song.unit/4); }
function voxMidi(c){
  if(!c.deg) return null;
  let m = keyRef() + DEG_SEMI[c.deg] + c.oct*12;
  if(c.acc==='#') m++; if(c.acc==='b') m--;
  return m;
}
function shapeSounded(shape){
  const res=[];
  [...shape].forEach((ch,i)=>{ if(ch!=='x') res.push({s:6-i, f:parseInt(ch,36)}); });
  return res;
}
function shapeString(shape, s){ const ch = shape[6-s]; return ch==='x'?null:parseInt(ch,36); }
function chordBefore(mi, vi){
  const cols = song.measures[mi].tabs[vi]||[];
  for(const c of cols) if(c.chord) return c.chord;
  return chordPrior(mi, vi);
}
function chordPrior(mi, vi){
  for(let m=mi-1;m>=0;m--){
    const cs = song.measures[m].tabs[vi]||[];
    for(let i=cs.length-1;i>=0;i--) if(cs[i].chord) return cs[i].chord;
  }
  return '';
}
function bassOf(shape){
  const sd = shapeSounded(shape);
  return sd.reduce((a,b)=>b.s>a.s?b:a, sd[0]);
}
function beatErrors(){
  const errs=[]; const target = song.beats;
  song.measures.forEach((m,mi)=>{
    m.tabs.forEach((cols,vi)=>{
      const b = cols.reduce((a,c)=>a+beatsOf(c),0);
      if(Math.abs(b-target)>1e-3) errs.push({mi,row:'tab',vi,b,target});
    });
    m.voxes.forEach((cols,vi)=>{
      const b = cols.reduce((a,c)=>a+beatsOf(c),0);
      if(Math.abs(b-target)>1e-3) errs.push({mi,row:'vox',vi,b,target});
    });
  });
  return errs;
}

/* ================= 图示生成（时值/节奏型预览） ================= */
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function evBeatsRaw(dur, dot){ return (4/dur)*(dot?1.5:1); }
/* 单行节奏图（时值按钮 / 简谱节奏型）：×符头+符干+符杠 */
function rhythmSVG(durs, W, H){
  W=W||Math.max(30, durs.length*14+10); H=H||30;
  const line=9, stem=H-7;
  const total = durs.reduce((a,[d,t])=>a+evBeatsRaw(d,t),0);
  let cum=0; const xs=[];
  durs.forEach(([d,t])=>{ const b=evBeatsRaw(d,t); xs.push(7+(cum+b/2)/total*(W-16)); cum+=b; });
  const p=[`<line x1="2" y1="${line}" x2="${W-2}" y2="${line}" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>`];
  durs.forEach(([d,t],i)=>{
    const x=xs[i];
    if(d===1){ p.push(`<circle cx="${x}" cy="${line}" r="3.2" fill="none" stroke="currentColor" stroke-width="1.2"/>`); }
    else{
      if(d===2) p.push(`<circle cx="${x}" cy="${line}" r="3" fill="none" stroke="currentColor" stroke-width="1.2"/>`);
      else p.push(`<path d="M ${x-3} ${line-3} L ${x+3} ${line+3} M ${x-3} ${line+3} L ${x+3} ${line-3}" stroke="currentColor" stroke-width="1.4" fill="none"/>`);
      p.push(`<line x1="${x}" y1="${line+3}" x2="${x}" y2="${stem}" stroke="currentColor" stroke-width="1.1"/>`);
    }
    if(t) p.push(`<circle cx="${x+6}" cy="${line-4}" r="1.4" fill="currentColor"/>`);
  });
  /* 符杠 */
  for(let i=0;i<durs.length;i++){
    const [d]=durs[i];
    if(d<8) continue;
    let j=i; let cumb=durs.slice(0,i).reduce((a,[dd,tt])=>a+evBeatsRaw(dd,tt),0);
    const beat=Math.floor(cumb+1e-4);
    while(j<durs.length-1){
      const [d2]=durs[j+1];
      const c2=durs.slice(0,j+1).reduce((a,[dd,tt])=>a+evBeatsRaw(dd,tt),0);
      if(d2>=8 && Math.floor(c2+1e-4)===beat) j++; else break;
    }
    if(j>i){
      p.push(`<rect x="${xs[i]-0.5}" y="${stem-1.8}" width="${xs[j]-xs[i]+1}" height="1.8" fill="currentColor"/>`);
      for(let a=i;a<j;a++)
        if(durs[a][0]>=16 && durs[a+1][0]>=16)

      if(d>=16) p.push(`<path d="M ${xs[i]} ${stem-3.4} q 4 -2 5.5 -6" fill="none" stroke="currentColor" stroke-width="1.2"/>`);

function patEvs(pat){ return pat.ev || (pat.halves? pat.halves.flat() : []); }
/* 六线节奏型图（吉他节奏型库，教材风格：×在弦上+符干符杠+∧∨方向） */
function tabPatSVG(pat, W, H){
  W=W||140; H=H||64;
  const top=12, gap=5.6, bot=top+5*gap, stemY=H-8;
  const evs = patEvs(pat);
  const total = evs.reduce((a,e)=>a+evBeatsRaw(e[1],e[2]),0);
  let cum=0; const xs=[];
  evs.forEach(e=>{ const b=evBeatsRaw(e[1],e[2]); xs.push(10+(cum+b/2)/total*(W-20)); cum+=b; });
  /* 两和弦分隔虚线 */
  let divX=null;
  if(pat.halves){ const h1=pat.halves[0].reduce((a,e)=>a+evBeatsRaw(e[1],e[2]),0); divX=10+h1/total*(W-20); }
  const p=[];

    p.push(`<line x1="4" y1="${top+i*gap}" x2="${W-4}" y2="${top+i*gap}" stroke="currentColor" stroke-width="0.6" opacity="0.65"/>`);
  if(divX!=null) p.push(`<line x1="${divX}" y1="${top-3}" x2="${divX}" y2="${bot+3}" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.7"/>`);
  const head=(x,row)=>p.push(`<path d="M ${x-2.4} ${top+row*gap-2.4} L ${x+2.4} ${top+row*gap+2.4} M ${x-2.4} ${top+row*gap+2.4} L ${x+2.4} ${top+row*gap-2.4}" stroke="currentColor" stroke-width="1.2" fill="none"/>`);
  evs.forEach((e,i)=>{
    const [t,d,dot]=e; const x=xs[i];
    if(t==='r'){
      p.push(`<path d="M ${x-2} ${top+gap*1.6} q 3 2 0 4 q -3 2 0 4" fill="none" stroke="currentColor" stroke-width="1.1"/>`);
      return;
    }
    if(t==='b') head(x,4);
    else if(t==='B') head(x,3);
    else if(t[0]==='s' && t!=='u') head(x,+t[1]-1);
    else if(t==='d'||t==='u'||t==='md'||t==='mu'){
      /* 教材式扫弦：向下扫=∧(箭头朝上)、向上扫=∨(箭头朝下)；切音(md/mu)箭头带一个点，细线 */
      const down = (t==='d'||t==='md');
      const yT=top-1, yB=top+5*gap+1;
      p.push(`<line x1="${x}" y1="${yT+3}" x2="${x}" y2="${yB-1}" stroke="currentColor" stroke-width="1.05"/>`);
      if(down) p.push(`<path d="M ${x-2.4} ${yT+7} L ${x} ${yT+2} L ${x+2.4} ${yT+7}" fill="none" stroke="currentColor" stroke-width="1.05"/>`);
      else p.push(`<path d="M ${x-2.4} ${yB-6} L ${x} ${yB-1} L ${x+2.4} ${yB-6}" fill="none" stroke="currentColor" stroke-width="1.05"/>`);
      if(t==='md'||t==='mu') p.push(`<circle cx="${x}" cy="${yT-1.5}" r="1.5" fill="currentColor"/>`);
    }
    else if(t==='a'){
      let dd=`M ${x} ${top}`;
      for(let yy=top; yy<top+5*gap-4; yy+=7) dd+=` q 3 3.5 0 7`;
      p.push(`<path d="${dd}" fill="none" stroke="currentColor" stroke-width="1.1"/>`);
    }
    else{ head(x,1); head(x,2); head(x,3);
      if(t==='x') p.push(`<text x="${x}" y="${top-3}" font-size="7.5" text-anchor="middle" fill="currentColor">切</text>`);
    }
    p.push(`<line x1="${x}" y1="${bot+2}" x2="${x}" y2="${stemY}" stroke="currentColor" stroke-width="1"/>`);
    if(dot) p.push(`<circle cx="${x+4}" cy="${stemY-3}" r="1.3" fill="currentColor"/>`);
  });
  /* 符杠 */
  for(let i=0;i<evs.length;i++){
    const d=evs[i][1];
    if(d<8 || evs[i][0]==='r') continue;
    let j=i;
    const cumAt=k=>evs.slice(0,k).reduce((a,e)=>a+evBeatsRaw(e[1],e[2]),0);
    const beat=Math.floor(cumAt(i)+1e-4);
    while(j<evs.length-1 && evs[j+1][1]>=8 && evs[j+1][0]!=='r' &&
          Math.floor(cumAt(j+1)+1e-4)===beat) j++;
    if(j>i){
      p.push(`<rect x="${xs[i]-0.5}" y="${stemY-1.8}" width="${xs[j]-xs[i]+1}" height="1.8" fill="currentColor"/>`);
      for(let a=i;a<j;a++)

          p.push(`<rect x="${xs[a]-0.5}" y="${stemY-4.6}" width="${xs[a+1]-xs[a]+1}" height="1.8" fill="currentColor"/>`);
    }else{
      p.push(`<path d="M ${xs[i]} ${stemY} q 4 -2 5.5 -6" fill="none" stroke="currentColor" stroke-width="1.2"/>`);
      if(d>=16) p.push(`<path d="M ${xs[i]} ${stemY-3.4} q 4 -2 5.5 -6" fill="none" stroke="currentColor" stroke-width="1.2"/>`);
    }

  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${p.join('')}</svg>`;
}
function patBeats(pat){

}

/* ================= 布局（按时间网格，吉他谱与简谱逐拍对齐） ================= */
function measureLayout(mea){
  const pad = 15;
  const rows = [...mea.tabs, ...mea.voxes];
  /* 基准宽度按拍数（同拍号小节等宽）；密集小节仅小幅加宽，限制在 1.5× 以内 */
  const beats = song.beats || 4;
  const base = beats * 36;   // 更紧凑
  let need = 46;
  rows.forEach(cols=>{
    const rt = cols.reduce((a,c)=>a+beatsOf(c),0);
    if(!rt) return;
    const w = cols.reduce((a,c)=>a+MIN_W[c.dur]+(c.dotted?6:0), 0);
    need = Math.max(need, w);
  });
  const inner = Math.max(base, Math.min(need, base*1.5));
  const NOTE_OFF = 10;   // 音符相对拍点的固定偏移，保证同拍数在各声部对齐
  const fit = cols=>{
    const rt = cols.reduce((a,c)=>a+beatsOf(c),0)||1;
    let cum=0; const xs=[], ws=[], ls=[];
    cols.forEach(c=>{
      const b=beatsOf(c);
      const left = pad+(cum/rt)*inner;
      const w = Math.max(16, b/rt*inner);
      ls.push(left); ws.push(w);
      xs.push(left + NOTE_OFF);   // 每拍/每音靠拍点左对齐 → 吉他谱与简谱逐拍对齐
      cum+=b;
    });
    return {xs, ws, ls, rt};
  };
  return {w:inner+pad*2, tabs:mea.tabs.map(fit), voxes:mea.voxes.map(fit)};
}
function layoutSystems(){
  const systems=[]; let cur={measures:[],w:0};
  song.measures.forEach((mea,mi)=>{
    const L = measureLayout(mea);
    if(cur.measures.length && cur.w + L.w > PAGE_W - 2*MARGIN){ systems.push(cur); cur={measures:[],w:0}; }
    cur.measures.push({mi, x:cur.w, L});
    cur.w += L.w;
  });
  if(cur.measures.length) systems.push(cur);
  /* 两端对齐：每行拉伸至同一总宽（最后一行不足 55% 时保持自然宽度） */
  const avail = PAGE_W - 2*MARGIN;
  systems.forEach((sys, si)=>{
    if(si===systems.length-1 && sys.w < avail*0.55) return;
    const k = avail/sys.w;
    if(Math.abs(k-1)<1e-6) return;
    sys.measures.forEach(lm=>{
      lm.x *= k; lm.L.w *= k;
      [...lm.L.tabs, ...lm.L.voxes].forEach(r=>{
        r.xs = r.xs.map(v=>v*k);
        r.ws = r.ws.map(v=>v*k);
        r.ls = r.ls.map(v=>v*k);
      });
    });
    sys.w = avail;
  });
  return systems;
}
function sysMetrics(){
  const nT = song.tabVoices.length, nV = song.voxVoices.length, nL = song.lyricLines;
  const diagH = diagMode==='inline' ? 66 : 16;
  let y = diagH + 10;
  const tabTops=[], voxYs=[], lyricY0=[];
  for(let i=0;i<nT;i++){ tabTops.push(y); y += 65 + 15 + 20; }
  for(let i=0;i<nV;i++){
    y += 24; voxYs.push(y); lyricY0.push(y+26);
    y += 26 + nL*20 + 10;
  }
  return {diagH, tabTops, voxYs, lyricY0, h:y+4, gap:26};
}

/* ================= 渲染 ================= */
function usedChords(){
  const seen=[], have=new Set();
  song.measures.forEach(m=>m.tabs.forEach(cols=>cols.forEach(c=>{
    if(c.chord && !have.has(c.chord)){ have.add(c.chord); seen.push(c.chord); }})));
  return seen;
}
function chordDiagramSVG(name, x, y, scale, shapeOverride, hideName){
  const k = scale||1; const shape = shapeOverride || chordShape(name); const p=[];
  if(!hideName)
    p.push(`<text x="${x+22*k}" y="${y+9}" font-size="${11*k}" font-weight="bold" text-anchor="middle" fill="var(--ink)">${esc(name)}</text>`);
  if(!shape) return p.join('');
  const gx=x+4*k, gy=y+19, sw=7.2*k, fh=8.6*k;
  const frets=[...shape].map(ch=>ch==='x'?-1:parseInt(ch,36));
  const fpos=frets.filter(f=>f>0);
  const base = fpos.length && Math.max(...fpos)>4 ? Math.min(...fpos) : 1;
  for(let i=0;i<6;i++) p.push(`<line x1="${gx+i*sw}" y1="${gy}" x2="${gx+i*sw}" y2="${gy+4*fh}" stroke="var(--ink)" stroke-width="0.7"/>`);
  for(let i=0;i<=4;i++) p.push(`<line x1="${gx}" y1="${gy+i*fh}" x2="${gx+5*sw}" y2="${gy+i*fh}" stroke="var(--ink)" stroke-width="${i===0&&base===1?1.8:0.7}"/>`);
  if(base>1) p.push(`<text x="${gx-6*k}" y="${gy+fh*0.6+3}" font-size="${8*k}" text-anchor="end" fill="var(--ink)">${base}</text>`);
  frets.forEach((f,i)=>{
    const sx = gx+i*sw;   // shape[0]=6弦 画在最左；1弦在最右
    if(f===-1) p.push(`<text x="${sx}" y="${gy-2.5}" font-size="7.5" text-anchor="middle" fill="var(--ink)">×</text>`);
    else if(f===0) p.push(`<circle cx="${sx}" cy="${gy-5}" r="2.3" fill="none" stroke="var(--ink)" stroke-width="0.7"/>`);
    else{ const r=f-base+1;
      if(r>=1&&r<=4) p.push(`<circle cx="${sx}" cy="${gy+(r-0.5)*fh}" r="${2.8*k}" fill="var(--ink)"/>`); }
  });
  return p.join('');
}
function beamGroups(cols, playable){
  const groups=[]; let cur=null; let cum=0;
  cols.forEach((c,i)=>{
    const b=beatsOf(c);
    const ok = c.dur>=8 && (!playable || playable(c));
    const beat = Math.floor(cum+1e-4);
    if(ok){
      if(cur && cur.beat===beat) cur.idx.push(i);
      else{ cur={beat, idx:[i]}; groups.push(cur); }
    } else cur=null;
    cum += b;
  });
  return groups;
}
function inRange(row, vi, mi){
  return selRange && selRange.row===row && selRange.vi===vi &&
    mi>=selRange.m1 && mi<=selRange.m2;
}
function setRange(row, vi, a, b){
  if(a.mi>b.mi || (a.mi===b.mi && a.ci>b.ci)){ const t=a; a=b; b=t; }
  selRange = {row, vi, m1:a.mi, c1:a.ci, m2:b.mi, c2:b.ci};
}
function colInRange(row, vi, mi, ci){
  if(!selRange || selRange.row!==row || selRange.vi!==vi) return false;
  if(mi<selRange.m1 || mi>selRange.m2) return false;
  if(mi===selRange.m1 && ci<(selRange.c1||0)) return false;
  if(mi===selRange.m2 && selRange.c2!==undefined && ci>selRange.c2) return false;
  return true;
}
function rangeCols(){
  if(!selRange) return null;
  const out=[]; const {row,vi}=selRange;
  for(let m=selRange.m1;m<=selRange.m2;m++){
    const cols = row==='tab'? song.measures[m].tabs[vi] : song.measures[m].voxes[vi];
    if(!cols) continue;
    const a = m===selRange.m1? (selRange.c1||0) : 0;
    const b = m===selRange.m2 && selRange.c2!==undefined? Math.min(selRange.c2, cols.length-1) : cols.length-1;
    for(let c=a;c<=b;c++) out.push({mi:m, col:cols[c]});
  }
  return out;
}
/* 扫弦箭头跨度（长短可编辑；锚点可选从6弦向上或从1弦向下） */
function strumSpan(col){
  const ss = col.notes.map(n=>n.s);
  const bot0 = ss.length?Math.max(...ss):6, top0 = ss.length?Math.min(...ss):1;
  const defN = ss.length? bot0-top0+1 : 6;
  const n = Math.max(2, Math.min(6, col.strumN||defN));
  if(col.strumAnchor==='t'){           // 锚定1弦侧，向6弦方向延伸
    const top = top0;
    const bot = Math.min(6, top+n-1);
    return {top, bot, n:bot-top+1};
  }
  const bot = bot0;                     // 默认锚定6弦侧（低音），向1弦方向延伸
  const top = Math.max(1, bot-n+1);
  return {top, bot, n:bot-top+1};
}

        if(inRange('tab',vi,lm.mi))
          p.push(`<rect x="${mx+1}" y="${tabTop-4}" width="${lm.L.w-2}" height="${stemY-tabTop+8}" rx="4" fill="none" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>`);
        if(mea.repeatStart){
          p.push(`<rect x="${mx+1}" y="${tabTop}" width="2.4" height="65" fill="var(--ink)"/>`);
          p.push(`<line x1="${mx+6}" y1="${tabTop}" x2="${mx+6}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
          p.push(`<circle cx="${mx+10.5}" cy="${tabTop+26}" r="1.8" fill="var(--ink)"/><circle cx="${mx+10.5}" cy="${tabTop+39}" r="1.8" fill="var(--ink)"/>`);
        }
        const bx = mx+lm.L.w;
        const nextRep = song.measures[lm.mi+1] && song.measures[lm.mi+1].repeatStart;
        if(mea.repeatEnd){
          p.push(`<circle cx="${bx-10.5}" cy="${tabTop+26}" r="1.8" fill="var(--ink)"/><circle cx="${bx-10.5}" cy="${tabTop+39}" r="1.8" fill="var(--ink)"/>`);
          p.push(`<line x1="${bx-6}" y1="${tabTop}" x2="${bx-6}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
          p.push(`<rect x="${bx-3.5}" y="${tabTop}" width="2.4" height="65" fill="var(--ink)"/>`);
        }else if(isLast){
          p.push(`<line x1="${bx-5}" y1="${tabTop}" x2="${bx-5}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
          p.push(`<rect x="${bx-3}" y="${tabTop}" width="2.6" height="65" fill="var(--ink)"/>`);
        }else if(!nextRep){   // 下一小节有反复号时，改由反复号作分隔，不再画普通小节线
          p.push(`<line x1="${bx}" y1="${tabTop}" x2="${bx}" y2="${tabBot}" stroke="var(--ink)" stroke-width="1"/>`);
        }
        cols.forEach((col,ci)=>{
          const nx = mx+lay.xs[ci], cw = lay.ws[ci], clx = mx+lay.ls[ci];
          const boxTop = oy + (vi===0 ? M.diagH : M.tabTops[vi]-14);
          colBoxes['t'+vi+':'+lm.mi+':'+ci] = {x:clx, y:boxTop, w:cw, h:stemY-boxTop+8};
          const isSel = !blurSel && sel.row==='tab'&&sel.vi===vi&&sel.mi===lm.mi&&sel.ci===ci;
          if(isSel)
            p.push(`<rect x="${clx}" y="${tabTop-16}" width="${cw}" height="${stemY-tabTop+26}" rx="4" fill="var(--accent)" opacity="0.12"/>`);
          else if(colInRange('tab',vi,lm.mi,ci))
            p.push(`<rect x="${clx}" y="${tabTop-4}" width="${cw}" height="${stemY-tabTop+8}" fill="var(--accent)" opacity="0.09"/>`);
          if(col.chord){
            runChord = col.chord;
            if(diagMode==='inline' && vi===0)
              p.push(chordDiagramSVG(col.chord, nx-20, oy+2, 0.95));
            else
              p.push(`<text x="${nx}" y="${tabTop-8}" font-size="12.5" font-weight="bold" text-anchor="middle" fill="var(--ink)">${esc(col.chord)}</text>`);
          }
          const shape = chordShape(runChord);
          if(col.strum==='d'||col.strum==='u'){
            /* 扫弦：只画箭头（细线），落在需要扫的弦上；切音=箭头上带一个点 */
            const sp = strumSpan(col);
            const yT = tabTop+(sp.top-1)*13-4, yB = tabTop+(sp.bot-1)*13+4;
            const up = col.strum==='u';   // 所见即所得：扫↑箭头向上，扫↓箭头向下
            p.push(`<line x1="${nx}" y1="${yT+3}" x2="${nx}" y2="${yB-3}" stroke="var(--ink)" stroke-width="1.1"/>`);
            if(up) p.push(`<path d="M ${nx-3.2} ${yT+8} L ${nx} ${yT+1} L ${nx+3.2} ${yT+8}" fill="none" stroke="var(--ink)" stroke-width="1.1"/>`);
            else   p.push(`<path d="M ${nx-3.2} ${yB-8} L ${nx} ${yB-1} L ${nx+3.2} ${yB-8}" fill="none" stroke="var(--ink)" stroke-width="1.1"/>`);
            if(col.mute)   // 切音点：箭头正上方顶端
              p.push(`<circle cx="${nx}" cy="${yT-3}" r="1.7" fill="var(--ink)"/>`);
          }else if(col.strum==='arp'){
            const sp = strumSpan(col);
            const yT = tabTop+(sp.top-1)*13-2, yB = tabTop+(sp.bot-1)*13+2;
            let d = `M ${nx} ${yT}`;
            for(let yy=yT; yy<yB-4; yy+=8) d += ` q 3.5 4 0 8`;
            p.push(`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.2"/>`);
          }else{
            /* 分解/单音：和弦内音显示 ×，和弦外音显示品位数字 */
            col.notes.forEach(n=>{
              const yy = tabTop+(n.s-1)*13;
              /* ×记谱仅对开放把位(≤4品)的和弦内音用×；高把位显示实际品位数字 */
              const isTone = tabNotation==='x' && shape && !n.x && n.f<=4 && shapeString(shape, n.s)===n.f;
              const picked = noteSel.some(q=>q.mi===lm.mi&&q.ci===ci&&q.si===n.s&&q.vi===vi);
              if(picked)
                p.push(`<circle cx="${nx}" cy="${yy}" r="8" fill="none" stroke="var(--accent)" stroke-width="1.4"/>`);
              if(n.x || isTone){
                p.push(`<rect x="${nx-5.5}" y="${yy-5.5}" width="11" height="11" fill="var(--paper)"/>`);
                p.push(`<text x="${nx}" y="${yy+4}" font-size="11" font-weight="600" text-anchor="middle" fill="var(--ink)">×</text>`);
              }else{
                const wide = n.f>9;
                p.push(`<rect x="${nx-(wide?8.5:5.5)}" y="${yy-5.5}" width="${wide?17:11}" height="11" fill="var(--paper)"/>`);
                p.push(`<text x="${nx}" y="${yy+4}" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--ink)">${n.f}</text>`);
              }
              /* 技法连线：从本音符头连到所选的下一个音符头（放大标记） */
              if(n.tech){
                const SYM = {sl:'sl',h:'h',p:'p',b:'b',v:'~'};
                const sym = SYM[n.tech]||n.tech;
                const tp = n.tk ? tabPos[vi+':'+n.tk.mi+':'+n.tk.ci] : null;
                if(tp && tp.sys===sIdx){
                  const x2 = tp.x, y2 = tabTop+(n.tk.si-1)*13;
                  const yPk = Math.min(yy,y2)-17;
                  p.push(`<path d="M ${nx+6} ${yy-5} Q ${(nx+x2)/2} ${yPk} ${x2-6} ${y2-5}" fill="none" stroke="var(--ink)" stroke-width="1.4"/>`);
                  p.push(`<text x="${(nx+x2)/2}" y="${yPk+4}" font-size="13" font-weight="600" font-style="italic" text-anchor="middle" fill="var(--ink)">${sym}</text>`);
                }else if(tp){
                  p.push(`<path d="M ${nx+6} ${yy-5} q 13 -12 26 -9" fill="none" stroke="var(--ink)" stroke-width="1.4"/>`);
                  p.push(`<text x="${nx+19}" y="${yy-16}" font-size="13" font-weight="600" font-style="italic" text-anchor="middle" fill="var(--ink)">${sym}</text>`);
                }else{
                  p.push(`<text x="${nx}" y="${yy-14}" font-size="13" font-weight="600" font-style="italic" text-anchor="middle" fill="var(--ink)">${sym}</text>`);
                }
              }
            });
            /* 空列（无音符/无扫弦）画休止符，让时值可见 */
            if(!col.notes.length)
              p.push(`<text x="${nx}" y="${tabTop+34}" font-size="13" text-anchor="middle" fill="var(--ink)" opacity="0.45">𝄽</text>`);
          }
          const hasEvt = col.notes.length || col.strum;
          if(hasEvt && col.dur>=2){
            p.push(`<line x1="${nx}" y1="${tabBot+3}" x2="${nx}" y2="${stemY}" stroke="var(--ink)" stroke-width="1"/>`);
            if(col.dotted) p.push(`<circle cx="${nx+4}" cy="${stemY-4}" r="1.6" fill="var(--ink)"/>`);
          }
          p.push(`<rect x="${clx}" y="${tabTop-18}" width="${cw}" height="18" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="tab" data-vi="${vi}" data-si="0" style="cursor:pointer"/>`);
          if(vi===0 && diagMode==='inline')
            p.push(`<rect x="${clx}" y="${oy}" width="${cw}" height="${M.diagH}" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="tab" data-vi="0" data-si="0" data-zone="chord" style="cursor:pointer"/>`);
          if(col.strum)
            p.push(`<rect class="strumcell" x="${clx}" y="${tabTop-2}" width="${cw}" height="${5*13+4}" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="tab" data-vi="${vi}" data-si="0" data-zone="strum" style="cursor:pointer"/>`);
          else for(let s2=1;s2<=6;s2++)
            p.push(`<rect class="strcell" x="${clx}" y="${tabTop+(s2-1)*13-6.5}" width="${cw}" height="13" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="tab" data-vi="${vi}" data-si="${s2}" style="cursor:pointer"/>`);
        });
        beamGroups(cols, c=>c.notes.length||c.strum).forEach(g=>{
          const xs = g.idx.map(i=>mx+lay.xs[i]);
          const x1=Math.min(...xs), x2=Math.max(...xs);
          if(g.idx.length>1){
            p.push(`<rect x="${x1-0.5}" y="${stemY-2.2}" width="${x2-x1+1}" height="2.2" fill="var(--ink)"/>`);
            for(let a=0;a<g.idx.length-1;a++){
              const i1=g.idx[a], i2=g.idx[a+1];
              if(cols[i1].dur>=16 && cols[i2].dur>=16)
                p.push(`<rect x="${mx+lay.xs[i1]-0.5}" y="${stemY-5.8}" width="${lay.xs[i2]-lay.xs[i1]+1}" height="2.2" fill="var(--ink)"/>`);
            }
          }else{
            const x=xs[0];
            p.push(`<path d="M ${x} ${stemY} q 6 -3 8 -8" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);
            if(cols[g.idx[0]].dur>=16)
              p.push(`<path d="M ${x} ${stemY-4.5} q 6 -3 8 -8" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);
          }
        });
        /* 每拍时值符号下方的可点击区：点击选中整拍 */
        {
          let cum=0; const byBeat={};
          cols.forEach((col,ci)=>{ const bt=Math.floor(cum+1e-4); (byBeat[bt]=byBeat[bt]||[]).push(ci); cum+=beatsOf(col); });
          Object.keys(byBeat).forEach(bt=>{
            const ids=byBeat[bt]; const a=ids[0], b=ids[ids.length-1];
            const x1=mx+lay.ls[a], x2=mx+lay.ls[b]+lay.ws[b];
            const beatSel = selRange && selRange.row==='tab' && selRange.vi===vi && selRange.m1===lm.mi && selRange.c1===a && selRange.c2===b;
            if(beatSel)
              p.push(`<rect x="${x1}" y="${stemY-1}" width="${x2-x1}" height="12" rx="3" fill="var(--accent)" opacity="0.14"/>`);
            p.push(`<rect class="beatzone" x="${x1}" y="${stemY-1}" width="${x2-x1}" height="13" fill="transparent" data-beatsel="${lm.mi}:${vi}:${bt}" style="cursor:pointer"><title>点击选中第${+bt+1}拍</title></rect>`);
          });
        }
      });
    });
    song.voxVoices.forEach((vname, vi)=>{
      const voxY = oy+M.voxYs[vi], lyr0 = oy+M.lyricY0[vi];
      p.push(`<line x1="${ox}" y1="${voxY-13}" x2="${ox}" y2="${voxY+4}" stroke="var(--ink)" stroke-width="1"/>`);
      if(song.voxVoices.length>1)
        p.push(`<text x="${ox-24}" y="${voxY-2}" font-size="10" text-anchor="middle" fill="var(--ink)" opacity="0.6">${esc(vname)}</text>`);
      sys.measures.forEach(lm=>{
        const mea = song.measures[lm.mi];
        const cols = mea.voxes[vi]||[];
        const lay = lm.L.voxes[vi];
        const mx = ox+lm.x;
        const isLast = lm.mi===song.measures.length-1;
        const isErr = errSet.has('vox'+vi+':'+lm.mi);
        if(isErr)
          p.push(`<rect x="${mx}" y="${voxY-22}" width="${lm.L.w}" height="34" fill="var(--danger)" opacity="0.07"/>
            <text x="${mx+lm.L.w-8}" y="${voxY-14}" font-size="11" font-weight="bold" fill="var(--danger)">!</text>`);
        if(inRange('vox',vi,lm.mi))
          p.push(`<rect x="${mx+1}" y="${voxY-22}" width="${lm.L.w-2}" height="34" rx="4" fill="none" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>`);
        const bx = mx+lm.L.w;
        const vNextRep = song.measures[lm.mi+1] && song.measures[lm.mi+1].repeatStart;
        const yT2=voxY-13, yB2=voxY+4;
        /* 反复开始：小节左侧 粗线+细线+两点（显式绘制，不用字体字形） */
        if(mea.repeatStart){
          p.push(`<rect x="${mx+1}" y="${yT2}" width="2" height="${yB2-yT2}" fill="var(--ink)"/>`);
          p.push(`<line x1="${mx+5}" y1="${yT2}" x2="${mx+5}" y2="${yB2}" stroke="var(--ink)" stroke-width="1"/>`);
          p.push(`<circle cx="${mx+8.5}" cy="${voxY-6}" r="1.4" fill="var(--ink)"/><circle cx="${mx+8.5}" cy="${voxY-0.5}" r="1.4" fill="var(--ink)"/>`);
        }
        if(mea.repeatEnd){
          p.push(`<circle cx="${bx-9}" cy="${voxY-6}" r="1.4" fill="var(--ink)"/><circle cx="${bx-9}" cy="${voxY-0.5}" r="1.4" fill="var(--ink)"/>`);
          p.push(`<line x1="${bx-5.5}" y1="${yT2}" x2="${bx-5.5}" y2="${yB2}" stroke="var(--ink)" stroke-width="1"/>`);
          p.push(`<rect x="${bx-3}" y="${yT2}" width="2" height="${yB2-yT2}" fill="var(--ink)"/>`);
        }else if(isLast){
          p.push(`<line x1="${bx-5}" y1="${yT2}" x2="${bx-5}" y2="${yB2}" stroke="var(--ink)" stroke-width="1"/>`);
          p.push(`<rect x="${bx-3}" y="${yT2}" width="2.4" height="${yB2-yT2}" fill="var(--ink)"/>`);
        }else if(!vNextRep){   // 下一小节有反复号则不画普通小节线
          p.push(`<line x1="${bx}" y1="${yT2}" x2="${bx}" y2="${yB2}" stroke="var(--ink)" stroke-width="1"/>`);
        }
        const vGroups = beamGroups(cols, null);
        const inGroup = new Set(); vGroups.forEach(g=>{ if(g.idx.length>1) g.idx.forEach(i=>inGroup.add(i)); });
        cols.forEach((col,ci)=>{
          const nx = mx+lay.xs[ci], cw = lay.ws[ci], clx = mx+lay.ls[ci];
          colBoxes['v'+vi+':'+lm.mi+':'+ci] = {x:clx, y:voxY-24, w:cw, h:26+song.lyricLines*20+8};
          const isSel = !blurSel && sel.row==='vox'&&sel.vi===vi&&sel.mi===lm.mi&&sel.ci===ci;
          if(isSel)
            p.push(`<rect x="${clx}" y="${voxY-22}" width="${cw}" height="${30+song.lyricLines*20}" rx="4" fill="var(--accent)" opacity="0.12"/>`);
          else if(colInRange('vox',vi,lm.mi,ci))
            p.push(`<rect x="${clx}" y="${voxY-22}" width="${cw}" height="34" fill="var(--accent)" opacity="0.09"/>`);
          const under = col.dur>=8 ? (col.dur===8?1:2) : 0;
          if(col.acc)
            p.push(`<text x="${nx-9}" y="${voxY-6}" font-size="10" text-anchor="middle" fill="var(--ink)">${col.acc==='#'?'♯':'♭'}</text>`);
          p.push(`<text x="${nx}" y="${voxY}" font-size="17" font-family="var(--font-num)" text-anchor="middle" fill="var(--ink)">${col.deg}</text>`);
          if(col.deg){
            for(let d=0; d<Math.min(2,Math.abs(col.oct)); d++){
              if(col.oct>0) p.push(`<circle cx="${nx}" cy="${voxY-16-d*4.6}" r="1.6" fill="var(--ink)"/>`);
              else p.push(`<circle cx="${nx}" cy="${voxY+6.5+under*3.4+d*4.6}" r="1.6" fill="var(--ink)"/>`);
            }
          }
          if(under && !inGroup.has(ci))
            for(let u=0;u<under;u++)
              p.push(`<line x1="${nx-6.5}" y1="${voxY+3.4+u*3.2}" x2="${nx+6.5}" y2="${voxY+3.4+u*3.2}" stroke="var(--ink)" stroke-width="1.1"/>`);
          if(col.dotted) p.push(`<circle cx="${nx+11}" cy="${voxY-4}" r="1.7" fill="var(--ink)"/>`);
          if(col.dur===2) p.push(`<text x="${nx+cw*0.42}" y="${voxY-1}" font-size="15" text-anchor="middle" fill="var(--ink)">–</text>`);
          if(col.dur===1) for(let d=1;d<=3;d++)
            p.push(`<text x="${nx+cw*0.22*d}" y="${voxY-1}" font-size="15" text-anchor="middle" fill="var(--ink)">–</text>`);
          if(col.tie){
            let x2;
            if(ci<cols.length-1) x2 = mx+lay.xs[ci+1]-6;
            else x2 = mx+lm.L.w+10;
            p.push(`<path d="M ${nx+5} ${voxY-13} Q ${(nx+5+x2)/2} ${voxY-22} ${x2} ${voxY-13}" fill="none" stroke="var(--ink)" stroke-width="1"/>`);
          }
          (col.lyrics||[]).forEach((ly,li)=>{
            if(ly && li<song.lyricLines)
              p.push(`<text x="${nx}" y="${lyr0+li*20}" font-size="14" text-anchor="middle" fill="var(--ink)">${esc(ly)}</text>`);
          });
          p.push(`<rect x="${clx}" y="${voxY-24}" width="${cw}" height="34" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="vox" data-vi="${vi}" style="cursor:pointer"/>`);
          for(let li=0;li<song.lyricLines;li++)
            p.push(`<rect x="${clx}" y="${lyr0+li*20-14}" width="${cw}" height="19" fill="transparent" data-mi="${lm.mi}" data-ci="${ci}" data-row="vox" data-vi="${vi}" data-zone="lyric" data-line="${li}" style="cursor:pointer"/>`);
        });
        vGroups.forEach(g=>{
          if(g.idx.length<2) return;
          const x1 = mx+lay.xs[g.idx[0]]-6.5, x2 = mx+lay.xs[g.idx[g.idx.length-1]]+6.5;
          p.push(`<line x1="${x1}" y1="${voxY+3.4}" x2="${x2}" y2="${voxY+3.4}" stroke="var(--ink)" stroke-width="1.1"/>`);
          for(let a=0;a<g.idx.length;a++){
            if(cols[g.idx[a]].dur>=16){
              let b=a; while(b<g.idx.length-1 && cols[g.idx[b+1]].dur>=16) b++;
              const xa = mx+lay.xs[g.idx[a]]-6.5, xb = mx+lay.xs[g.idx[b]]+6.5;
              p.push(`<line x1="${xa}" y1="${voxY+6.6}" x2="${xb}" y2="${voxY+6.6}" stroke="var(--ink)" stroke-width="1.1"/>`);
              a=b;
            }
          }
        });
      });
    });
  });
  p.push(`<rect id="playhead" x="0" y="0" width="0" height="0" rx="4" fill="var(--accent)" opacity="0" pointer-events="none"/>`);
  const totalH = nPages*PG_H + (nPages-1)*PG_GAP + 6;
  svg.setAttribute('viewBox', `0 0 ${PAGE_W} ${totalH}`);
  svg.setAttribute('width', PAGE_W);
  svg.setAttribute('height', totalH);
  svg.innerHTML = p.join('');
  syncInputs();
}

/* ================= 选区/Ribbon 同步 ================= */
function curMea(){ return song.measures[sel.mi]; }
function curRowCols(){
  const m = curMea(); if(!m) return null;
  return sel.row==='tab' ? m.tabs[sel.vi] : m.voxes[sel.vi];
}
function curCol(){ const r=curRowCols(); return r && r[sel.ci]; }
function clampSel(){
  sel.mi = Math.max(0, Math.min(sel.mi, song.measures.length-1));
  if(sel.row==='tab') sel.vi = Math.max(0, Math.min(sel.vi, song.tabVoices.length-1));
  else sel.vi = Math.max(0, Math.min(sel.vi, song.voxVoices.length-1));
  const r = curRowCols();
  sel.ci = Math.max(0, Math.min(sel.ci, Math.max(0,(r||[]).length-1)));
  sel.si = Math.max(1, Math.min(sel.si, 6));
  activeLyr = Math.max(0, Math.min(activeLyr, song.lyricLines-1));
}
function chipHtml(list, activeIdx, cls){
  return list.map((n,i)=>
    `<span class="chip ${i===activeIdx?'on':''}" data-idx="${i}" data-k="${cls}">${esc(n)}</span>`).join('')
}
/* 声部 chip：可双击改名、hover 出现删除× */
function voiceChips(list, activeIdx, cls){
  return list.map((n,i)=>
    `<span class="chip vchip ${i===activeIdx?'on':''}" data-idx="${i}" data-k="${cls}" title="单击选中，双击改名">`+
      `<span class="vname">${esc(n)}</span>`+
      (list.length>1?`<span class="vdel" data-idx="${i}" data-k="${cls}del" title="删除该声部">×</span>`:'')+
    `</span>`).join('');
}
let comboMore = false;
const COMBO_COMMON = 3;   // 组合时值默认展示的常用个数
function setRibbon(t){
  activeTab = t;
  document.querySelectorAll('.ltab').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  const showDur = (t==='tab'||t==='vox');
  /* 共用时值模块：完整固定显示（全/2/4/8/16/附点） */
  document.getElementById('g-dur').style.display = showDur?'':'none';
  [...document.querySelectorAll('#dur-body .ib')].forEach(b=>{ b.style.display=''; });
  /* 组合时值模块：独立显示，默认几个常用，其余折叠在"更多▾" */
  document.getElementById('g-combo').style.display = showDur?'':'none';
  [...document.querySelectorAll('#combo-body .ib')].forEach((b,i)=>{
    b.style.display = (i<COMBO_COMMON||comboMore)?'':'none';
  });
  const moreBtn = document.getElementById('b-combo-more');
  if(moreBtn) moreBtn.textContent = comboMore?'收起 ▴':'更多 ▾';

/* ================= 编辑核心 ================= */
function pushUndo(){
  undoStack.push(JSON.stringify(song));
  if(undoStack.length>200) undoStack.shift();
  redoStack=[];
}
function mutate(fn){ pushUndo(); fn(); clampSel(); persist(); render(); }
function undo(){
  if(!undoStack.length) return toast('没有可撤销的操作');
  redoStack.push(JSON.stringify(song));
  song = JSON.parse(undoStack.pop());
  selRange=null; clampSel(); persist(); render();
}
function redo(){
  if(!redoStack.length) return toast('没有可重做的操作');
  undoStack.push(JSON.stringify(song));
  song = JSON.parse(redoStack.pop());
  selRange=null; clampSel(); persist(); render();
}
function setFret(f){
  if(sel.row!=='tab') return;
  mutate(()=>{
    const col=curCol();
    const i = col.notes.findIndex(n=>n.s===sel.si);
    if(f==null){ if(i>=0) col.notes.splice(i,1); }
    else if(i>=0){ col.notes[i].f=f; col.notes[i].x=false; }
    else col.notes.push({s:sel.si, f});
  });
}
function setDeg(d){
  if(sel.row!=='vox') return;
  mutate(()=>{ const c=curCol(); c.deg=d; if(!d){ c.acc=''; c.oct=0; } });
}
function moveCol(dir){
  const r = curRowCols();
  if(dir>0){
    if(sel.ci<r.length-1) sel.ci++;
    else if(sel.mi<song.measures.length-1){ sel.mi++; sel.ci=0; }
  }else{
    if(sel.ci>0) sel.ci--;
    else if(sel.mi>0){ sel.mi--; sel.ci=curRowCols().length-1; }
  }
  pending.digits=''; render();
}
function switchRow(){
  sel.row = sel.row==='tab'?'vox':'tab';
  clampSel(); pending.digits='';
  setRibbon(sel.row);
  render();
}

/* ================= 自动补齐/删减：保持小节时值准确 ================= */
function autoFixMeasure(mi, row, vi){
  const target = song.beats;
  const cols = row==='tab'? song.measures[mi].tabs[vi] : song.measures[mi].voxes[vi];
  if(!cols || !cols.length) return;
  let sum = cols.reduce((a,c)=>a+beatsOf(c),0);
  /* 超拍：从尾部整列删减 */
  while(cols.length>1 && sum>target+1e-4){
    const lastB = beatsOf(cols[cols.length-1]);
    if(sum-lastB >= target-1e-4){ cols.pop(); sum-=lastB; } else break;
  }
  /* 欠拍：按风格自动补充（扫弦补交替箭头，分解补分解音，简谱补休止） */
  let guard=0;
  let lastDir=null;
  if(row==='tab'){
    const l=[...cols].reverse().find(c=>c.strum==='d'||c.strum==='u');
    if(l) lastDir=l.strum;
  }
  let arpIdx = row==='tab'? cols.filter(c=>c.notes.length&&!c.strum).length : 0;
  const strumStyle = row==='tab'? [...cols].reverse().find(c=>c.strum==='d'||c.strum==='u') : null;
  while(sum<target-1e-4 && guard++<64){
    const rem = target-sum;
    let dur=null;
    for(const d of [4,8,16]){
      if(beatsOf({dur:d,dotted:false})<=rem+1e-4){ dur=d; break; }
    }
    if(!dur) break;
    let c;
    if(row==='vox'){ c=vcol(); }
    else{
      c=tcol();
      const shape=chordShape(chordBefore(mi,vi));
      if(strumStyle && shape){
        lastDir = lastDir==='d'?'u':'d';
        c.strum=lastDir;
        c.notes=shapeSounded(shape).map(n=>({s:n.s,f:n.f}));
        if(strumStyle.strumN) c.strumN=strumStyle.strumN;
      }else if(shape){
        const cyc=[3,2,3,1];
        const sN=cyc[arpIdx++ % cyc.length];
        const f=shapeString(shape,sN);
        if(f!=null) c.notes=[{s:sN,f}];
      }
    }
    c.dur=dur;
    cols.push(c); sum+=beatsOf(c);
  }
}
/* ================= 时值/组合/节奏型 套用 ================= */
function setDur(d){
  if(selRange){
    mutate(()=>{
      const seen=new Set();
      rangeCols().forEach(({mi,col})=>{ col.dur=d; seen.add(mi); });
      seen.forEach(mi=>autoFixMeasure(mi, selRange.row, selRange.vi));
    });
    toast('已批量替换时值并自动补齐小节');
    return;
  }
  const c=curCol(); if(c) mutate(()=>{ curCol().dur=d; });
}
function toggleDot(){
  if(selRange){
    mutate(()=>{
      const cs=rangeCols();
      const allDot = cs.every(x=>x.col.dotted);
      const seen=new Set();
      cs.forEach(({mi,col})=>{ col.dotted=!allDot; seen.add(mi); });
      seen.forEach(mi=>autoFixMeasure(mi, selRange.row, selRange.vi));
    });
    return;
  }
  const c=curCol(); if(c) mutate(()=>{ curCol().dotted=!curCol().dotted; });
}
/* 判断一段吉他列的演奏方式：扫弦 / 柱式和声 / 分解 */
function styleOfTab(oldCols){
  if(oldCols.some(c=>c.strum==='d'||c.strum==='u')) return 'strum';
  if(oldCols.some(c=>c.strum==='arp')) return 'arp-wave';
  if(oldCols.some(c=>c.notes.filter(n=>!n.x).length>=3)) return 'block';
  return 'arp';
}
/* 按和弦指法 + 演奏方式生成一列 */
function genTabCol(dur, dot, style, shape, idx){
  const c=tcol(); c.dur=dur; c.dotted=!!dot;
  if(!shape) return c;
  const sd=shapeSounded(shape);
  const bass=sd.reduce((a,b)=>b.s>a.s?b:a, sd[0]);
  if(style==='strum'){ c.notes=sd.map(n=>({s:n.s,f:n.f})); c.strum=idx%2===0?'d':'u'; }
  else if(style==='block'){ c.notes=sd.map(n=>({s:n.s,f:n.f})); }
  else if(style==='arp-wave'){ c.notes=sd.map(n=>({s:n.s,f:n.f})); c.strum='arp'; }
  else{ /* 分解：按常规拨弦顺序取和弦内的弦（低音→3→2→1→2→3…） */
    const cyc=[bass.s,3,2,1,2,3,1,2];
    let sN=cyc[idx%cyc.length];
    let f = sN===bass.s? bass.f : shapeString(shape,sN);
    if(f==null){ sN=bass.s; f=bass.f; }
    c.notes=[{s:sN,f}];
  }
  return c;
}
function comboBeatsOf(combo){ return combo.durs.reduce((a,[d,t])=>a+(4/d)*(t?1.5:1)*(song.unit/4),0); }
/* 组合时值：替换选中的一拍（或当前音起 comboBeats 拍），按和弦与演奏方式自动补/删音符 */
function applyDurCombo(combo){
  const row=sel.row;
  let mi, vi, startCi;
  if(selRange && selRange.row===row){ mi=selRange.m1; vi=selRange.vi; startCi=selRange.c1||0; }
  else { mi=sel.mi; vi=sel.vi; startCi=sel.ci; }
  const span = comboBeatsOf(combo);
  mutate(()=>{
    const cols = row==='tab'? song.measures[mi].tabs[vi] : song.measures[mi].voxes[vi];
    if(!cols || !cols[startCi]) return;
    /* 找出从 startCi 起累计 = span 拍的列范围 */
    let acc=0, end=startCi;
    while(end<cols.length && acc<span-1e-3){ acc+=beatsOf(cols[end]); end++; }
    const oldSpan = cols.slice(startCi, end);
    let seg;
    if(row==='tab'){
      const chord = chordAtCol(mi,vi,startCi);
      const shape = chordShape(chord);
      const style = styleOfTab(oldSpan);
      seg = combo.durs.map(([d,t],i)=>genTabCol(d,t,style,shape,i));
      const oc=(oldSpan.find(c=>c.chord)||{}).chord;
      if(oc && seg[0]) seg[0].chord=oc;
    }else{
      const degs = oldSpan.filter(c=>c.deg>0);
      let oi=0;
      seg = combo.durs.map(([d,t])=>{ const c=vcol(); c.dur=d; c.dotted=!!t;
        if(oi<degs.length){ const o=degs[oi++]; c.deg=o.deg;c.acc=o.acc;c.oct=o.oct;c.lyrics=(o.lyrics||[]).slice();c.tie=o.tie; }
        return c; });
    }
    cols.splice(startCi, end-startCi, ...seg);
    autoFixMeasure(mi, row, vi);
    sel.mi=mi; sel.vi=vi; sel.ci=startCi;
  });
  selRange=null;
  toast('已用组合时值替换：'+combo.name);
}
function targetMeasures(row){
  if(selRange && selRange.row===row){
    const a=[]; for(let m=selRange.m1;m<=selRange.m2;m++) a.push(m);
    return {list:a, vi:selRange.vi};
  }
  if(sel.row!==row) return null;
  return {list:[sel.mi], vi:sel.vi};
}
/* 单个事件 → 一列（按给定和弦指法生成音符） */
function evToCol([t,dur,dot], shape, fallback){
  const c = tcol(); c.dur=dur; c.dotted=!!dot;
  if(shape){
    const sounded = shapeSounded(shape);
    const bass = sounded.reduce((a,b)=>b.s>a.s?b:a, sounded[0]);
    const altC = sounded.filter(n=>n.s>=3 && n.s!==bass.s);
    const alt = altC.length ? altC.reduce((a,b)=>
      Math.abs(b.s-(bass.s-1))<Math.abs(a.s-(bass.s-1))?b:a) : bass;
    if(t==='b') c.notes=[{s:bass.s, f:bass.f}];
    else if(t==='B') c.notes=[{s:alt.s, f:alt.f}];
    else if(t[0]==='s'){ const sn=+t[1]; const f=shapeString(shape, sn); if(f!=null) c.notes=[{s:sn, f}]; }
    else if(t==='c') c.notes = sounded.map(n=>({s:n.s,f:n.f}));
    else if(t==='d'||t==='u'){ c.notes = sounded.map(n=>({s:n.s,f:n.f})); c.strum=t; }
    else if(t==='md'||t==='mu'){ c.notes = sounded.map(n=>({s:n.s,f:n.f})); c.strum=t==='md'?'d':'u'; c.mute=true; }
    else if(t==='a'){ c.notes = sounded.map(n=>({s:n.s,f:n.f})); c.strum='arp'; }
    else if(t==='x') c.notes = sounded.slice(0,3).map(n=>({s:n.s,f:0,x:true}));
  }else if(t!=='r' && fallback){
    const fn = fallback();
    if(fn){
      c.notes = fn.map(n=>({...n}));
      if(t==='d'||t==='u') c.strum=t; else if(t==='a') c.strum='arp';
    }
  }
  return c;
}
/* 某列生效的和弦（本小节内该列及之前最后一个，否则向前找） */
function chordAtCol(mi, vi, ci){
  const cols = song.measures[mi].tabs[vi]||[];
  for(let i=Math.min(ci, cols.length-1); i>=0; i--) if(cols[i].chord) return cols[i].chord;
  return chordPrior(mi, vi);
}
function applyTabPattern(pat){
  const tgt = targetMeasures('tab');
  if(!tgt) return toast('请先在吉他谱区选中一列或多选小节');
  mutate(()=>{
    if(pat.span){
      /* 半小节/一拍节奏型：从选中列起，替换覆盖 span 拍的若干列，保持小节总时值 */
      const applyAt = (mi, startCi)=>{
        const cols = song.measures[mi].tabs[tgt.vi];
        const chord = chordAtCol(mi, tgt.vi, startCi);
        const shape = chordShape(chord);
        const oldNotes = cols.slice(startCi).filter(c=>c.notes.length).map(c=>c.notes);
        let oi=0; const fb=()=> oi<oldNotes.length? oldNotes[oi++]:null;
        const seg = pat.ev.map(ev=>evToCol(ev, shape, fb));
        /* 找出从 startCi 起、累计 = span 拍的列范围 */
        let acc=0, end=startCi;
        while(end<cols.length && acc < pat.span-1e-3){ acc+=beatsOf(cols[end]); end++; }
        const removedChord = (cols.slice(startCi,end).find(c=>c.chord)||{}).chord;
        cols.splice(startCi, end-startCi, ...seg);
        if(removedChord) seg[0].chord = removedChord;   // 保留该半小节已有和弦
        autoFixMeasure(mi, 'tab', tgt.vi);
      };
      if(selRange && selRange.row==='tab'){
        tgt.list.forEach(mi=> applyAt(mi, 0));
      } else applyAt(sel.mi, sel.ci);
      setTimeout(()=>toast('已填入'+pat.span+'拍节奏型；另一半可选中后再套用（各自和弦独立）'),200);
    }else{
      tgt.list.forEach(mi=>{
        const old = song.measures[mi].tabs[tgt.vi]||[];
        const chord1 = chordBefore(mi, tgt.vi);
        const oldChord = (old.find(c=>c.chord)||{}).chord||'';
        const oldNotes = old.filter(c=>c.notes.length).map(c=>c.notes);
        let oi=0;
        const fb = ()=> oi<oldNotes.length? oldNotes[oi++] : null;
        const shape = chordShape(chord1);
        const cols = pat.ev.map(ev=>evToCol(ev, shape, fb));
        if(oldChord && cols.length) cols[0].chord = oldChord;
        song.measures[mi].tabs[tgt.vi] = cols;
      });
    }
  });
  toast('已套用节奏型：'+pat.name);
}
function applyVoxPattern(pat){
  const tgt = targetMeasures('vox');
  if(!tgt) return toast('请先在简谱区选中一列或多选小节');
  mutate(()=>{
    tgt.list.forEach(mi=>{
      const old = (song.measures[mi].voxes[tgt.vi]||[]).filter(c=>c.deg>0);
      let oi=0;
      const cols = pat.durs.map(([dur,dot])=>{
        const c = vcol(); c.dur=dur; c.dotted=!!dot;
        if(oi<old.length){
          const o = old[oi++];
          c.deg=o.deg; c.acc=o.acc; c.oct=o.oct; c.lyrics=(o.lyrics||[]).slice(); c.tie=o.tie;
        }
        return c;
      });
      song.measures[mi].voxes[tgt.vi] = cols;
    });
  });
  toast('已套用节奏型：'+pat.name);
}

function addVoice(kind){
  if(kind==='tab' && song.tabVoices.length>=MAX_VOICES) return toast('吉他声部最多 5 个');
  if(kind==='vox' && song.voxVoices.length>=MAX_VOICES) return toast('旋律声部最多 5 个');
  mutate(()=>{
    if(kind==='tab'){
      song.tabVoices.push('吉他'+(song.tabVoices.length+1));
      song.measures.forEach(m=>{ const a=[]; for(let i=0;i<song.beats*2;i++) a.push(tcol()); m.tabs.push(a); });
    }else{
      song.voxVoices.push('旋律'+(song.voxVoices.length+1));
      song.measures.forEach(m=>{ const a=[]; for(let i=0;i<song.beats;i++) a.push(vcol()); m.voxes.push(a); });
    }
  });
}
function delVoice(kind){
  if(kind==='tab'){
    if(song.tabVoices.length<=1) return toast('至少保留一个吉他声部');
    mutate(()=>{
      const vi = sel.row==='tab'?sel.vi:song.tabVoices.length-1;
      song.tabVoices.splice(vi,1);
      song.measures.forEach(m=>m.tabs.splice(vi,1));
      if(sel.row==='tab') sel.vi=0;
    });
  }else{
    if(song.voxVoices.length<=1) return toast('至少保留一个旋律声部');
    mutate(()=>{
      const vi = sel.row==='vox'?sel.vi:song.voxVoices.length-1;
      song.voxVoices.splice(vi,1);
      song.measures.forEach(m=>m.voxes.splice(vi,1));
      if(sel.row==='vox') sel.vi=0;
    });
  }
}
function delVoiceAt(kind, vi){
  const names = kind==='tab'?song.tabVoices:song.voxVoices;
  if(names.length<=1) return toast('至少保留一个'+(kind==='tab'?'吉他':'旋律')+'声部');
  mutate(()=>{
    names.splice(vi,1);
    song.measures.forEach(m=> (kind==='tab'?m.tabs:m.voxes).splice(vi,1));
    if(sel.row===kind && sel.vi>=names.length) sel.vi=names.length-1;

/* ================= 键盘 ================= */
window.addEventListener('keydown', e=>{
  const tag = (document.activeElement||{}).tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'){
    if(e.key==='Escape') document.activeElement.blur();
    return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); exportSong(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='c'){ e.preventDefault(); copyMeasure(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='v'){ e.preventDefault(); pasteMeasure(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(blurSel){ blurSel=false; }   // 任意编辑按键恢复光标
  if(/^[0-9]$/.test(e.key)){
    e.preventDefault();
    if(sel.row==='tab'){
      const now=Date.now(); let d=e.key;
      if(now-pending.time<700 && pending.digits){
        const comb=parseInt(pending.digits+d,10);
        if(comb<=24) d=String(comb);
      }
      pending={digits:d,time:now};
      setFret(parseInt(d,10));
    }else{
      const n=+e.key; if(n<=7) setDeg(n);
    }
    return;
  }
  switch(e.key){
    case 'ArrowRight': e.preventDefault(); moveCol(1); break;
    case 'ArrowLeft':  e.preventDefault(); moveCol(-1); break;
    case 'ArrowDown':
      e.preventDefault();
      if(sel.row==='tab'){ if(sel.si<6) sel.si++; else switchRow(); render(); }
      break;
    case 'ArrowUp':
      e.preventDefault();
      if(sel.row==='tab'){ if(sel.si>1){ sel.si--; render(); } }
      else { switchRow(); sel.si=6; render(); }
      break;
    case 'Tab': e.preventDefault(); switchRow(); break;
    case 'Backspace':
      e.preventDefault(); pending.digits='';
      if(sel.row==='tab') setFret(null); else setDeg(0);
      break;
    case 'Delete': e.preventDefault(); delColumn(); break;
    case 'Enter':
      e.preventDefault();
      if(sel.row==='vox'){ openFlyout('lyr'); document.getElementById('i-lyric').focus(); }
      break;
    case ' ': e.preventDefault(); audio.playing?stopPlay():play(); break;
    case '.': e.preventDefault(); toggleDot(); break;
    case '#': if(sel.row==='vox') toggleAcc('#'); break;
    case 'b': if(sel.row==='vox') toggleAcc('b'); break;
    case '+': case '=': if(sel.row==='vox') bumpOct(1); break;
    case '-': if(sel.row==='vox') bumpOct(-1); break;
    case '~': if(sel.row==='vox') toggleTie(); break;
    case 'x': if(sel.row==='tab') toggleMute(); break;
    case 'q': setDur(1); break;
    case 'w': setDur(2); break;
    case 'e': setDur(4); break;
    case 'r': setDur(8); break;
    case 't': setDur(16); break;
  }
});

function copyMeasure(){

function pasteMeasure(){
  if(!clipMeasure) return toast('剪贴板为空，先选中小节号 Ctrl+C 复制');
  const mi = measureSel!=null? measureSel : sel.mi;
  mutate(()=>{
    const src = JSON.parse(JSON.stringify(clipMeasure));
    const m = {tabs:[], voxes:[], repeatStart:src.repeatStart, repeatEnd:src.repeatEnd};
    /* 对齐当前声部数量：不足补空、超出截断 */
    song.tabVoices.forEach((_,vi)=>{
      m.tabs.push(src.tabs[vi] ? src.tabs[vi] : (()=>{const a=[];for(let i=0;i<song.beats*2;i++)a.push(tcol());return a;})());
    });
    song.voxVoices.forEach((_,vi)=>{
      m.voxes.push(src.voxes[vi] ? src.voxes[vi] : (()=>{const a=[];for(let i=0;i<song.beats;i++)a.push(vcol());return a;})());
    });
    song.measures[mi] = m;
  });

document.getElementById('score').addEventListener('pointerdown', e=>{

  }

    const [bmi,bvi,bt]=t.dataset.beatsel.split(':').map(Number);
    const cols=song.measures[bmi].tabs[bvi]; let cum=0, ids=[];
    cols.forEach((c,ci2)=>{ if(Math.floor(cum+1e-4)===bt) ids.push(ci2); cum+=beatsOf(c); });
    if(ids.length){
      sel.row='tab'; sel.vi=bvi; sel.mi=bmi; sel.ci=ids[0];
      selRange={row:'tab', vi:bvi, m1:bmi, c1:ids[0], m2:bmi, c2:ids[ids.length-1]};
      noteSel=[]; closeTech(); setRibbon('tab'); render();
      toast('已选中第'+(bt+1)+'拍 · 点"组合时值"即可替换本拍节奏');

  if(t.dataset.mi===undefined) return;

    if(idx>=0) noteSel.splice(idx,1); else noteSel.push({mi,ci,si,vi});
    sel.mi=mi; sel.ci=ci; sel.row='tab'; sel.vi=vi; sel.si=si;
    render();
    if(noteSel.length>=1) showTechSuggest();

  noteSel=[]; closeTech();
  if(e.shiftKey && sel.row===row && sel.vi===vi){
    setRange(row, vi, {mi:sel.mi, ci:sel.ci}, {mi, ci});
    render(); return;
  }
  selRange = null;
  dragSel = {row, vi, mi, ci};
  sel.mi=mi; sel.ci=ci; sel.row=row; sel.vi=vi;
  if(t.dataset.si && +t.dataset.si>0) sel.si=+t.dataset.si;
  if(t.dataset.line!==undefined) activeLyr=+t.dataset.line;
  pending.digits='';
  if(t.dataset.zone==='lyric') setRibbon('lyr');
  else setRibbon(row);
  render();
  if(t.dataset.zone==='lyric') document.getElementById('i-lyric').focus();
  if(t.dataset.zone==='chord'){
    showChordPopup(e.clientX, e.clientY, mi, ci, vi);
  }
});

/* 完整和弦编辑器：根音·和弦性质·转位·把位·自定义 */
let ceState = null;
function showChordEditor(mi, ci, vi){
  modalPos=null;
  const existing = song.measures[mi].tabs[vi][ci].chord || chordBefore(mi,vi) || 'C';
  const m = existing.match(/^([A-G][#b]?)(.*?)(?:\/([A-G][#b]?))?$/);
  ceState = { mi, ci, vi,
    root: (m&&NOTE_PC[m[1]]!=null)? m[1]:'C',
    qual: (m&&m[2])||'', bass: (m&&m[3])||'', shape:null, custom:null };
  renderChordEditor();
}
function ceName(){
  return ceState.root + ceState.qual + (ceState.bass?('/'+ceState.bass):'');
}
function ceShape(){
  if(ceState.custom) return ceState.custom;
  let base = chordShape(ceState.root+ceState.qual);
  if(!base){
    // 库中没有 → 生成可移动把位（默认 E 型）
    base = movableShape(NOTE_PC[ceState.root], ceState.qual, 'E');
  }
  if(ceState.bass && NOTE_PC[ceState.bass]!=null)
    base = slashShape(base, NOTE_PC[ceState.bass]);
  return base;
}
function positionVariants(){
  const r = NOTE_PC[ceState.root], q = ceState.qual;
  const vs=[];
  const open = chordShape(ceState.root+q);
  if(open) vs.push({label:'开放', shape:open});
  vs.push({label:'6弦根音(E型)', shape:movableShape(r,q,'E')});
  vs.push({label:'5弦根音(A型)', shape:movableShape(r,q,'A')});
  return vs;
}

    .concat(CHORD_ROOTS.map(b=>`<option value="${b}" ${b===ceState.bass?'selected':''}>/${b}</option>`)).join('');
  const shape = ceShape();
  const posVars = positionVariants().map((v,i)=>

      <div class="bt">${esc(v.label)}</div></div>`).join('');
  const custom = (ceState.custom||shape||'xxxxxx');

      </div>
      <div style="width:150px;text-align:center">

        <div style="font-size:13px;margin-top:4px"><b>${esc(ceName())}</b></div>
      </div>
    </div>

  const rerender = ()=>{ closeModal(); renderChordEditor(); };

function applyTech(tech){
  if(!noteSel.length) return;
  const list = noteSel.slice().sort((a,b)=> a.mi-b.mi || a.ci-b.ci || a.si-b.si);
  mutate(()=>{
    const noteAt = q=>{
      const cols = song.measures[q.mi].tabs[q.vi];
      return cols && cols[q.ci] && cols[q.ci].notes.find(n=>n.s===q.si);
    };
    if(!tech){
      list.forEach(q=>{ const n=noteAt(q); if(n){ delete n.tech; delete n.tk; } });
      return;
    }
    /* 技法连线：连接相邻两个被选中的音符（头对头） */
    for(let i=0;i<list.length-1;i++){
      const n = noteAt(list[i]);
      if(!n) continue;
      n.tech = tech;
      n.tk = {mi:list[i+1].mi, ci:list[i+1].ci, si:list[i+1].si};
    }
    if(list.length===1){ const n=noteAt(list[0]); if(n){ n.tech=tech; delete n.tk; } }
  });
  toast(tech?('已标记技法：'+({sl:'滑弦',h:'击弦',p:'勾弦',b:'推弦',v:'揉弦'}[tech])):'已清除技法');
}

/* 和弦变换：按新和弦指法重排该和弦区间内的分解/扫弦音 */
function remapCols(cols, from, to, oldShape, newShape){
  const newBass = bassOf(newShape);
  const oldBass = oldShape? bassOf(oldShape) : null;
  for(let i=from;i<to;i++){
    const c=cols[i];
    if(!c.notes.length) continue;
    if(c.strum || c.notes.length>=3){
      const wasMute = c.notes.every(n=>n.x);
      const keep = c.strum;
      c.notes = shapeSounded(newShape).map(n=>({s:n.s, f:n.f, x:wasMute}));
      c.strum = keep;
    }else{
      c.notes = c.notes.map(n=>{
        if(n.x) return n;
        if(oldBass && n.s===oldBass.s && n.f===oldBass.f) return {s:newBass.s, f:newBass.f};
        if(!oldShape && n.s>=5) return {s:newBass.s, f:newBass.f};
        const f = shapeString(newShape, n.s);
        if(f!=null) return {s:n.s, f};
        return {s:newBass.s, f:newBass.f};
      });
    }
  }
}

/* 从拍数拼出 [dur,dotted]，凑不出返回 null */
function durForBeats(b){
  const u = song.unit/4;
  for(const [d,dot] of [[1,0],[1,1],[2,0],[2,1],[4,0],[4,1],[8,0],[8,1],[16,0],[16,1]]){
    if(Math.abs((4/d)*(dot?1.5:1)*u - b) < 1e-3) return {dur:d, dotted:!!dot};
  }
  return null;
}
function insColumn(row){
  if(sel.row!==row){ sel.row=row; clampSel(); }
  mutate(()=>{
    const r=curRowCols();
    const cur = r[sel.ci];
    const c = row==='tab'?tcol():vcol();
    /* 拆分当前音的时值，保持小节总时值不变（8分→两16分等）；已是16分则直接插入 */
    if(cur && cur.dur<16){
      const half = durForBeats(beatsOf(cur)/2);
      if(half){ cur.dur=half.dur; cur.dotted=half.dotted; c.dur=half.dur; c.dotted=half.dotted; }
      else c.dur=cur.dur;
    } else if(cur) c.dur=cur.dur;
    r.splice(sel.ci+1,0,c); sel.ci++;
  });
}
function delColumn(){
  mutate(()=>{
    const r=curRowCols();
    if(r.length>1){
      const removed = beatsOf(r[sel.ci]);
      r.splice(sel.ci,1);
      if(sel.ci>=r.length) sel.ci=r.length-1;
      /* 把删掉的时值并回相邻音，保持小节总时值不变 */
      const nb = r[sel.ci] || r[sel.ci-1];
      if(nb){
        const merged = durForBeats(beatsOf(nb)+removed);
        if(merged){ nb.dur=merged.dur; nb.dotted=merged.dotted; }
      }
    } else {
      r[0] = sel.row==='tab'?tcol():vcol();
      r[0].dur=song.beats>=4?4:song.beats; // 单列填满一拍级别，随后 autofix
      autoFixMeasure(sel.mi, sel.row, sel.vi);
    }
  });
}
