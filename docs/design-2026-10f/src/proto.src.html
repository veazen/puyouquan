<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>编辑器外壳最终方案</title>
<style>
/*@TOKENS@*/
/*@SHELLCSS@*/
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--font-ui)}
#app.desk{display:flex;flex-direction:column;height:100vh}
#app.desk .ws{flex:1 1 auto;min-height:0;display:flex}
#app.desk #main{height:100%}
.paper{width:870px;margin:16px auto 48px;background:var(--paper);border-radius:3px;box-shadow:0 0 0 1px var(--border),0 8px 28px -18px rgba(20,18,60,.35);position:relative;overflow:hidden}
.paper img{width:100%;display:block}
.paper .band{position:absolute;left:14.5%;top:13.8%;width:21.5%;height:13.6%;background:var(--play-band);opacity:.12;border-radius:3px}
.pvwrap{display:flex;flex-direction:column;align-items:center;gap:22px;padding:20px 0 60px}
.pvp{width:620px;position:relative;background:#fff;box-shadow:0 0 0 1px var(--border),0 10px 30px -16px rgba(20,18,60,.4)}
.pvp img{width:100%;display:block}
.pvp .vx{position:absolute;left:5.5%;right:5.5%;top:4.2%;bottom:3.6%;border:1px dashed rgba(91,76,240,.45);pointer-events:none}
.pvp .rowtag{position:absolute;left:-112px;width:100px;text-align:right;font-size:11px;color:var(--accent-ink);white-space:nowrap}
.pvp .rowtag::after{content:"";position:absolute;right:-12px;top:7px;width:8px;height:1px;background:var(--accent)}
.pvp .pgl{position:absolute;right:0;bottom:-18px;font-size:11px;color:var(--faint)}
.pvwrap.out .pvp{width:640px}
</style>
</head>
<body>
<div id="app" class="fx"></div>
<script>/*@DATA@*/</script>
<script>/*@SHELLJS@*/</script>
<script>/*@APPJS@*/</script>
</body>
</html>
