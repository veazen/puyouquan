<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1440"><title>推荐 · 书写 · 吉他弹唱</title><style>
:root{--bg:#f4f4f9;--toolbar:#f8f8fc;--panel:#fff;--paper:#fdfdff;--text:#1b1a2e;--muted:#5c5b73;--faint:#6a6981;--border:#e1e0ec;--border-soft:#eae9f3;
--accent:#5b4cf0;--accent-soft:rgba(91,76,240,.10);--accent-ink:#4a3ad6;--ok:#157a43;--danger:#b45309;
--chrome:#161433;--chrome-2:rgba(236,234,255,.11);--chrome-text:#eeedf8;--chrome-muted:#aeacca;
--font-ui:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC','WenQuanYi Zen Hei',system-ui,sans-serif;--font-num:'DejaVu Serif','Noto Serif SC',serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.35 var(--font-ui)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
svg.pqi{flex:none;display:block} svg.up{transform:rotate(180deg)} .lk{color:var(--faint)}
.sp{flex:1}
kbd{font:11px var(--font-ui);padding:1px 5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;background:var(--panel);color:var(--muted)}
/* 行 1 */
#flw-r1{position:absolute;left:0;top:0;width:1440px;height:44px;background:var(--chrome);color:var(--chrome-text);display:flex;align-items:center;padding:0 12px;gap:6px}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#5b4cf0,#3366ee 60%,#0891b2);display:grid;place-items:center;color:#fff}
.r1b{height:30px;padding:0 10px;border-radius:8px;color:var(--chrome-text);font-weight:600}
.tab{height:34px;margin-top:10px;align-self:flex-end;padding:0 8px 0 12px;border-radius:9px 9px 0 0;background:var(--bg);color:var(--text);font-weight:600;display:flex;align-items:center;gap:8px;min-width:190px}
.tab .x{margin-left:auto;color:var(--faint);width:24px;height:24px;justify-content:center}
.save{height:28px;border-radius:14px;background:var(--chrome-2);color:var(--chrome-text);font-size:12.5px;display:flex;align-items:center;overflow:hidden}
.save .st{padding:0 8px 0 10px;gap:6px;color:var(--chrome-muted);height:28px} .save .st i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--chrome-muted)}
.save .go{height:28px;padding:0 11px;border-left:1px solid rgba(236,234,255,.16);font-weight:700;color:#fff;gap:5px}
.pub{height:30px;padding:0 13px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700}
.av{width:30px;height:30px;border-radius:50%;background:var(--chrome-2);display:grid;place-items:center}
/* 行 2 */
#editbar{position:absolute;left:0;top:44px;width:1440px;height:40px;background:var(--toolbar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px;gap:3px}
.modes{display:flex;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:2px;height:32px}
.modes button{height:26px;padding:0 10px;border-radius:7px;color:var(--muted);font-weight:600}
.modes button.on{background:var(--chrome);color:#fff} .modes .ch{color:var(--faint);font-size:11px;padding:0 1px}
.vd{width:1px;height:22px;background:var(--border);margin:0 5px;flex:none}
.tb{height:30px;padding:0 7px;border-radius:7px;color:var(--text)} .tb.lab{font-size:12.5px}
.kc{min-width:27px;height:28px;padding:0 6px;border-radius:6px;background:var(--panel);border:1px solid var(--border);border-bottom-width:2px;font:600 15px var(--font-num);justify-content:center;color:var(--text)}
.kc.on{background:var(--accent-soft);border-color:#b9b2f7;color:var(--accent-ink)}
.gl{font:600 14px var(--font-num);min-width:26px;justify-content:center}
.oct{font:600 13px var(--font-num);min-width:30px;justify-content:center;gap:1px}
.srch{margin-left:auto;height:28px;padding:0 8px;border-radius:7px;color:var(--muted)}
/* 左栏 */
#flw-left{position:absolute;left:0;top:84px;width:248px;height:784px;background:var(--toolbar);border-right:1px solid var(--border);overflow:hidden}
.lh{height:36px;display:flex;align-items:center;padding:0 10px 0 12px;gap:6px;font-weight:700}
.lh .n{color:var(--faint);font-weight:500;font-family:var(--font-num);font-size:12px}
.ib{width:28px;height:28px;border-radius:7px;justify-content:center;color:var(--muted);flex:none}
.trow{height:36px;margin:0 6px;border-radius:9px;display:flex;align-items:center;gap:8px;padding:0 4px 0 8px;font-weight:600}
.trow.cur{background:var(--accent-soft);color:var(--accent-ink)}
.badge{font-size:10px;font-weight:700;border-radius:4px;padding:0 3px;line-height:14px;background:var(--panel);border:1px solid var(--border);color:var(--muted)}
.sub{height:28px;margin:0 6px 0 34px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;padding-right:2px}
.sub .r{margin-left:auto;display:flex;gap:2px;align-items:center}
.circ{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font:600 11px var(--font-num);display:grid;place-items:center}
.gh{height:28px;display:flex;align-items:center;gap:6px;padding:0 12px;color:var(--muted);font-weight:700;font-size:12.5px}
.brace{font:300 26px/1 var(--font-num);color:var(--faint);margin:-4px 2px 0 -2px}
.sep{height:1px;background:var(--border);margin:6px 0}
.chip{height:22px;padding:0 8px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.inp{margin:2px 12px 6px;height:30px;border:1px solid var(--border);border-radius:8px;background:var(--panel);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--faint);font-size:12.5px}
.inp kbd{margin-left:auto}
.cells{display:grid;grid-template-columns:repeat(4,52px);gap:5px;padding:2px 12px 6px}
.cells.c6{grid-template-columns:repeat(6,34px);gap:4px}
.cell{height:46px;border:1px solid var(--border);border-radius:8px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--text);font-size:11px}
.cell.g{height:38px} .c6 .cell{height:34px}
.cell span{color:var(--muted);font-size:11px;line-height:12px}
.grp{height:26px;display:flex;align-items:center;gap:4px;padding:0 12px;font-weight:700;font-size:12.5px;color:var(--text)}
/* 中区 */
#score-wrap{position:absolute;left:248px;top:84px;width:928px;height:784px;overflow:hidden;background:var(--bg)}
#paper{position:absolute;box-shadow:0 1px 2px rgba(20,20,60,.08),0 0 0 1px var(--border-soft);background:var(--paper)}
#paper img{display:block}
/* 悬浮条（v68.3 + 推荐） */
#flw-sbar{position:absolute;left:10px;top:8px;width:908px;height:40px;z-index:5}
.sbar{height:40px;border-radius:10px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--border),0 1px 2px rgba(18,16,52,.06);display:flex;align-items:center;padding:0 4px;gap:2px;font-size:13px}
.sbar button{height:32px;padding:0 8px;border-radius:8px;gap:5px}
.sbar .kind{font-weight:700}
.sbar .ssep{width:1px;height:20px;background:var(--border);margin:0 4px;flex:none}
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:9px;background:var(--bg)}
.seg button{height:28px!important;font-size:12px;color:var(--muted);padding:0 8px}
.seg button.on{background:var(--panel);color:var(--accent-ink);font-weight:600;box-shadow:0 0 0 1px rgba(91,76,240,.45)}
.steps{display:flex;align-items:center;margin-left:2px}
.st{height:28px;padding:0 8px 0 4px;border-radius:14px;display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--faint)}
.st .d{width:18px;height:18px;border-radius:50%;border:1.5px solid #c9c7da;display:grid;place-items:center;font:600 10.5px var(--font-num)}
.st.ok{color:var(--ok)} .st.ok .d{border:0;background:#e3f3ea;color:var(--ok)}
.st.now{color:var(--accent-ink);background:var(--accent-soft)} .st.now .d{border:0;background:var(--accent);color:#fff}
.ln{width:14px;height:2px;background:#d9d7e8;border-radius:1px} .ln.ok{background:#9fd3b4}
.main{display:flex;height:32px;border-radius:8px;overflow:hidden;background:var(--accent);color:#fff;font-weight:700;margin-left:6px}
.main .m{color:#fff;padding:0 10px 0 9px;border-radius:0!important} .main .dd{width:26px;padding:0!important;justify-content:center;border-left:1px solid rgba(255,255,255,.3);color:#fff;border-radius:0!important}
.main.hov .m{background:#4b3cdc} .main.open .dd{background:#4b3cdc}
.tool{font-size:12.5px} .tool.on{background:var(--accent-soft);color:var(--accent-ink)}
.hint{height:24px;padding:0 9px;border-radius:12px;background:var(--bg);color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:5px;margin-left:6px}
.smart{font-weight:600;color:var(--text)} .smart.open{background:var(--accent-soft);color:var(--accent-ink)}
.pv-tag{position:absolute;z-index:6;height:24px;padding:0 9px;border-radius:12px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;box-shadow:0 2px 8px rgba(91,76,240,.35)}
/* 右栏 */
#right-dock{position:absolute;left:1176px;top:84px;width:264px;height:784px;background:var(--toolbar);border-left:1px solid var(--border);overflow:hidden}
.rtabs{height:44px;display:flex;align-items:center;gap:4px;padding:0 10px;border-bottom:1px solid var(--border-soft)}
.rtabs button{height:30px;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:600}
.rtabs button.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.rsec{padding:10px 14px 4px}
.rh{font-size:12px;font-weight:700;color:var(--faint);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.kv{display:flex;align-items:center;height:26px;font-size:12.5px} .kv .k{color:var(--muted);width:56px} .kv .v{margin-left:auto;font-weight:600;font-family:var(--font-num)} .kv .v.t{font-family:var(--font-ui)}
.rrow{display:flex;align-items:center;height:36px;gap:9px;padding:0 6px;margin:0 -6px;border-radius:8px;font-weight:600} .rrow kbd{margin-left:auto}
.rseg{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:2px;margin:4px 0 8px}
.rseg button{flex:1;height:26px;border-radius:6px;justify-content:center;font-size:12px;color:var(--muted)} .rseg button.on{background:var(--panel);color:var(--accent-ink);font-weight:600;box-shadow:0 0 0 1px rgba(91,76,240,.4)}
/* 右栏收起：带字竖条 */
#flw-rstrip{position:absolute;left:1388px;top:84px;width:52px;height:784px;background:var(--toolbar);border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:4px}
#flw-rstrip button{width:44px;height:48px;border-radius:9px;flex-direction:column;justify-content:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
/* 状态栏 */
#mixer-dock{position:absolute;left:0;top:868px;width:1440px;height:32px;background:var(--chrome);color:var(--chrome-text);display:flex;align-items:center;padding:0 8px;gap:4px;font-size:12.5px}
.playb{height:24px;padding:0 10px 0 8px;border-radius:12px;background:var(--chrome-2);color:#fff;font-weight:700;gap:5px}
.sbb{height:26px;padding:0 6px;border-radius:6px;color:var(--chrome-text);justify-content:center}
.mg{display:flex;gap:2px;margin:0 6px}
.mg i{font-style:normal;width:22px;height:20px;border-radius:4px;background:var(--chrome-2);font:11px var(--font-num);color:var(--chrome-muted);display:grid;place-items:center;position:relative}
.mg i.w::after{content:'';position:absolute;left:5px;right:5px;bottom:2px;height:2px;border-radius:1px;background:#8b7dff}
.mg i.c{background:#eeedf8;color:var(--chrome)}
.num{font-family:var(--font-num)} .okic{color:#5fd38d}
.toast{position:absolute;left:50%;transform:translateX(-50%);height:38px;border-radius:19px;background:#22203f;color:#fff;display:flex;align-items:center;gap:12px;padding:0 6px 0 16px;box-shadow:0 6px 20px rgba(20,16,60,.35);z-index:20;font-weight:600}
.toast button{height:28px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.12);color:#c9c2ff;font-weight:700}
.cursor{position:absolute;z-index:40;pointer-events:none}
/* 弹出层 */
.pop{position:absolute;z-index:8;border-radius:12px;background:#fff;box-shadow:0 10px 30px rgba(30,25,90,.18),0 0 0 1px var(--border)}
.gc{flex-direction:column;align-items:stretch;gap:6px;padding:6px;border-radius:10px;border:1px solid var(--border);background:#fff}
  .gc .gt{height:64px;border-radius:6px;background:var(--paper);display:grid;place-items:center;overflow:hidden} .gc .gt img{max-width:120px;max-height:60px}
  .gc .gn{display:flex;align-items:center;gap:5px;font-weight:600;font-size:12.5px;padding:0 2px} .gc .gn .lk{margin-left:auto}
  .gc.off{opacity:.5} .gc:first-child{border:2px solid var(--accent);padding:5px}</style></head><body><div id="flw-r1">
